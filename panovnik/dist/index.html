<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panovník</title>
<style>
:root {
  --bg: #f3ecdc; --panel: #fbf7ee; --ink: #2b2118; --muted: #7a6a58; --line: #d9ccb4; --accent: #7a2e1d; --accent2: #2f5d50;
  --good: #2f6b2f; --bad: #a3271b; --warn: #a86b12; --head: #e8dcc2; --btn: #efe4cc; --btnh: #e2d3b2;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1d1915; --panel: #26211b; --ink: #ece2d0; --muted: #a8977f; --line: #3d342a; --accent: #d9774f; --accent2: #6fb39f;
  --good: #7fc37f; --bad: #ef7b6c; --warn: #e3ac55; --head: #312a22; --btn: #342c23; --btnh: #43392d; } }
:root[data-theme="dark"] { --bg: #1d1915; --panel: #26211b; --ink: #ece2d0; --muted: #a8977f; --line: #3d342a; --accent: #d9774f; --accent2: #6fb39f;
  --good: #7fc37f; --bad: #ef7b6c; --warn: #e3ac55; --head: #312a22; --btn: #342c23; --btnh: #43392d; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 Georgia, "Times New Roman", serif; }
header { position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 2px solid var(--accent); padding: 6px 12px; display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; }
header .realm { font-size: 17px; font-weight: bold; color: var(--accent); margin-right: 8px; }
header .st { white-space: nowrap; } header .st b { font-variant-numeric: tabular-nums; }
header .sp { flex: 1; }
nav { display: flex; flex-wrap: wrap; gap: 2px; padding: 6px 12px 0; border-bottom: 1px solid var(--line); background: var(--bg); }
nav button { border: 1px solid var(--line); border-bottom: none; background: var(--btn); color: var(--ink); padding: 5px 10px; border-radius: 6px 6px 0 0; cursor: pointer; font: inherit; }
nav button.on { background: var(--panel); font-weight: bold; color: var(--accent); }
main { padding: 12px; max-width: 1400px; margin: 0 auto; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); align-items: start; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; overflow-x: auto; }
.card h3 { margin: 0 0 8px; font-size: 15px; color: var(--accent); border-bottom: 1px solid var(--line); padding-bottom: 4px; }
.card h4 { margin: 10px 0 4px; font-size: 14px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { border-bottom: 1px solid var(--line); padding: 3px 6px; text-align: left; vertical-align: top; }
th { background: var(--head); font-weight: bold; position: sticky; top: 0; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.sel td { background: var(--head); }
.good { color: var(--good); } .bad { color: var(--bad); } .warn { color: var(--warn); } .muted { color: var(--muted); } .small { font-size: 12px; }
button.b, select, input { font: inherit; font-size: 13px; }
button.b { background: var(--btn); color: var(--ink); border: 1px solid var(--line); border-radius: 5px; padding: 2px 8px; cursor: pointer; margin: 1px; }
button.b:hover:not(:disabled) { background: var(--btnh); } button.b:disabled { opacity: .45; cursor: default; }
button.main { background: var(--accent); color: #fff; border: none; border-radius: 6px; padding: 6px 14px; font-weight: bold; cursor: pointer; font: inherit; }
button.main:disabled { opacity: .5; }
select, input { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 2px 4px; }
input[type=number] { width: 62px; }
.bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; min-width: 60px; }
.bar > i { display: block; height: 100%; background: var(--accent2); }
.bar.red > i { background: var(--bad); } .bar.yel > i { background: var(--warn); }
.log { max-height: 70vh; overflow-y: auto; }
.log div { border-bottom: 1px dotted var(--line); padding: 2px 0; }
.tag { display: inline-block; font-size: 11px; padding: 0 5px; border-radius: 8px; background: var(--head); color: var(--muted); margin-right: 4px; }
#modal { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 20; display: flex; align-items: center; justify-content: center; padding: 16px; }
#modal.hidden { display: none; }
#modal .box { background: var(--panel); border: 2px solid var(--accent); border-radius: 10px; max-width: 560px; width: 100%; padding: 16px 18px; max-height: 90vh; overflow-y: auto; }
#modal h2 { margin: 0 0 8px; color: var(--accent); }
#modal .ch { display: block; width: 100%; text-align: left; margin: 6px 0; padding: 7px 10px; }
#toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 6px; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 30; max-width: 90vw; }
#toast.on { opacity: .95; }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 4px 0; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; }
.kv > :nth-child(odd) { color: var(--muted); }
details summary { cursor: pointer; color: var(--accent2); }
.help p { margin: 4px 0 8px; } .help h4 { color: var(--accent); }
@media (max-width: 600px) { main { padding: 8px 16px; } .grid { grid-template-columns: 1fr; } header { font-size: 13px; } }
</style>
</head>
<body>
<header id="top"></header>
<nav id="tabs"></nav>
<main id="main"></main>
<div id="modal" class="hidden"></div>
<div id="toast"></div>
<script>
"use strict";
// Herní data: zboží, terén, budovy, jednotky, objevy, zákony, mapa a jména.
const SEASONS = ["Jaro", "Léto", "Podzim", "Zima"];
const START_YEAR = 1250, END_YEAR = 1350;

const GOODS = {

const TERRAIN = {

// podíl roční sklizně v jednotlivých ročních dobách
const SEASON_GRAIN = [0.15, 1.1, 2.1, 0];

// Budovy v provinciích. cost = [zlaté, dřevo, kámen] za úroveň (násobí se úrovní), time = počet ročních období
const PBUILD = {

  dul: { n: "Železný důl", max: 3, cost: [120, 25, 10], time: 2, need: p => p.res.includes("zelezo"), d: "+3 železa (jen s ložiskem)", prod: { zelezo: 3 } },

  vinice: { n: "Vinice", max: 3, cost: [70, 10, 0], time: 2, need: p => p.res.includes("vino"), d: "+3 víno (jen s vinohradskou polohou)", prod: { vino: 3 } },
  solivar: { n: "Solivar", max: 3, cost: [110, 20, 10], time: 2, need: p => p.res.includes("sul"), d: "+3 soli (jen se solným pramenem)", prod: { sul: 3 } },
  hrebcin: { n: "Hřebčín", max: 2, cost: [130, 20, 5], time: 2, need: p => p.terrain !== "hory", d: "+1 kůň za úroveň", prod: { kone: 1 } },
  kovarna: { n: "Kovárna", max: 3, cost: [90, 10, 15], time: 1, d: "2 železo → 2 zbraně za úroveň", prod: { zbrane: 2 }, use: { zelezo: 2 } },

  rytiri: { n: "Rytíři", atk: 10, def: 7, mor: 1.2, cost: 120, up: 6, grain: 2, goods: { kone: 2, zbrane: 2 }, cav: true },
  zoldneri: { n: "Žoldnéři", atk: 6, def: 5, mor: 0.95, cost: 90, up: 7, grain: 1, merc: true, d: "naverbují se ihned bez zboží, drahý žold" },
  stroje: { n: "Obléhací stroje", atk: 1, def: 1, mor: 0.8, cost: 100, up: 3, grain: 1, goods: { drevo: 6, zelezo: 1 }, tech: "trebuchet", siege: 25 },
  bombardy: { n: "Bombardy", atk: 5, def: 1, mor: 0.8, cost: 180, up: 4, grain: 1, goods: { zelezo: 4 }, tech: "strelny", siege: 50 },

// Objevy (výzkum). cat = obor, cost = body učenosti

  trojpole: { n: "Trojpolní hospodaření", cat: "Zemědělství", cost: 30, d: "+15 % obilí" },
  pluh: { n: "Těžký kolečkový pluh", cat: "Zemědělství", cost: 50, req: ["trojpole"], d: "+10 % obilí, nížiny ještě o 10 % víc" },

  kuse: { n: "Kuše", cat: "Válečnictví", cost: 40, d: "jednotka Kušiníci" },

// Výpravy do neznámých krajů
const EXPEDITIONS = {
  hory: { n: "Neprobádané hřebeny", cost: 120, time: 2, chance: 0.6, d: "hledání ložisek – může najít železo nebo stříbro v provincii" },
  sever: { n: "Severní moře", cost: 180, time: 3, chance: 0.5, req: ["kompas"], d: "obchod se severskými kupci: kožešiny, jantar" },

// Zákony: každý má volby, efekty se počítají v enginu

const TAX_LEVELS = ["Žádná", "Nízká", "Střední", "Vysoká", "Krutá"];
const TAX_MULT = [0, 0.5, 1, 1.5, 2.2];
const TAX_LOY = [12, 5, 0, -10, -25];

const COUNCIL = {

};
const COUNCIL_IDS = Object.keys(COUNCIL);

const TRAITS = {
  stateny: { n: "Statečný", mil: 3 }, zbabely: { n: "Zbabělý", mil: -3 },
  moudry: { n: "Moudrý", uce: 3, spr: 1 }, prostomyslny: { n: "Prostomyslný", uce: -3 },
  lstivy: { n: "Lstivý", int: 3 }, poctivy: { n: "Poctivý", int: -2, dip: 2 },

function rnd(s) { let t = (s.seed = (s.seed + 0x6D2B79F5) | 0); t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }

function newChar(s, o = {}) {

    dip: rint(s, 2, 12), mil: rint(s, 2, 12), spr: rint(s, 2, 12), uce: rint(s, 2, 12), int: rint(s, 2, 12),
    traits: [], estate: o.estate || "slechta", loyalty: rint(s, 40, 80), focus: null,
  };
  const n = o.traits ? 0 : rint(s, 1, 2);
  for (let i = 0; i < n; i++) { const t = pick(s, TRAIT_IDS); if (!c.traits.includes(t)) c.traits.push(t); }
  if (o.traits) c.traits = o.traits.slice();
  if (c.traits.includes("nemocny")) c.health -= 20;
  if (c.traits.includes("silny")) c.health += 10;
  c.health = clamp(c.health, 10, 100);
  s.chars[c.id] = c; return c;
}

const ch = (s, id) => (id ? s.chars[id] : null);

const myProvs = s => Object.values(s.provinces).filter(p => p.owner === "hrac");
const rivalProvs = (s, id) => Object.values(s.provinces).filter(p => p.owner === id).map(p => p.id);

// ---------- trh ----------
function price(s, g) {
  const G = GOODS[g]; const scale = 0.5 + myProvs(s).length / 6;
  const f = clamp(1.6 - 0.6 * s.stock[g] / (G.ref * scale), 0.6, 1.8);
  return G.base * s.inflation * s.market[g] * f;
}
const buyPrice = (s, g) => price(s, g) * 1.12;
const sellPrice = (s, g) => price(s, g) * 0.85 * (s.laws.tolerance === 1 ? 1.05 : 1);
function tradeCost(s, g, n, buy) {
  // průměr ceny před a po obchodu (cena se hýbe se zásobou)
  const p0 = buy ? buyPrice(s, g) : sellPrice(s, g); const old = s.stock[g];
  s.stock[g] = Math.max(0, old + (buy ? n : -n)); const p1 = buy ? buyPrice(s, g) : sellPrice(s, g); s.stock[g] = old;
  return Math.round((p0 + p1) / 2 * n);
}
function trade(s, g, n, buy) {
  n = Math.floor(n); if (n <= 0) return "Zadej množství.";
  if (GOODS[g].exotic && buy) return "Exotické zboží se dá získat jen obchodními cestami.";
  const c = tradeCost(s, g, n, buy);
  if (buy) { if (s.money < c) return "Nedostatek zlata."; s.money -= c; s.stock[g] += n; }
  else { if (s.stock[g] < n) return "Tolik zboží nemáš."; s.money += c; s.stock[g] -= n; }
  s.last.trade = (s.last.trade || 0) + (buy ? -c : c);
  log(s, `${buy ? "Nakoupeno" : "Prodáno"} ${n}× ${GOODS[g].n} za ${c} zl.`, "obchod");
  return null;
}

// ---------- výroba ----------
function grainMult(s, p) {
  let m = 1 + (p.b.mlyn || 0) * 0.08 * (has(s, "vodni_kolo") ? 1.5 : 1);
  if (has(s, "trojpole")) m += 0.15; if (has(s, "pluh")) m += p.terrain === "nizina" ? 0.2 : 0.1;
  return m;
}
function provProduction(s, p, season = s.season) {
  const out = {}, use = {};
  if (p.owner !== "hrac" || p.occ) return { out, use };
  const workers = p.pop / 1000 * 0.8 * (1 - p.levy * 0.5);
  out.obili = workers * TERRAIN[p.terrain].fert * 13 * SEASON_GRAIN[season] * grainMult(s, p) * (0.75 + p.prosp / 200) + (p.b.pristav || 0) * 3 * (has(s, "koga") ? 1.5 : 1);
  if (p.terrain === "les") out.drevo = 3;
  if (s.laws.lesy === 1) out.drevo = (out.drevo || 0) + 1;
  const bm = { pila: has(s, "vodni_kolo") ? 1.5 : 1, dul: has(s, "kovarstvi") ? 1.5 : 1, kovarna: has(s, "kovarstvi") ? 1.5 : 1, hrebcin: has(s, "chov") ? 1.5 : 1, tkalci: has(s, "sukno") ? 1.5 : 1 };
  for (const [b, lvl] of Object.entries(p.b)) {
    const B = PBUILD[b]; if (!lvl || !B.prod) continue;
    for (const [g, q] of Object.entries(B.prod)) out[g] = (out[g] || 0) + q * lvl * (bm[b] || 1) * (season === 3 && (b === "vinice" || b === "ovcin") ? 0.3 : 1);
    if (B.use) for (const [g, q] of Object.entries(B.use)) use[g] = (use[g] || 0) + q * lvl * (bm[b] || 1);
  }
  return { out, use };
}
function seatProduction(s) {
  const out = {};
  if (s.seat.staje) out.kone = s.seat.staje * (has(s, "chov") ? 1.5 : 1);
  if (s.seat.zbrojnice) out.zbrane = s.seat.zbrojnice;
  return out;
}

// ---------- vojsko ----------
function armyUpkeep(s, units) {
  let m = 0, g = 0;
  for (const [u, n] of Object.entries(units)) { m += UNITS[u].up * n; g += UNITS[u].grain * n; }
  if (s.laws.vojsko === 2) m *= 1.1;
  return { money: m, grain: g };
}
function totalUnits(s) { const t = {}; for (const a of s.armies) for (const [u, n] of Object.entries(a.units)) t[u] = (t[u] || 0) + n; return t; }

// ---------- příjmy a výdaje ----------
function efficiency(s) {
  return 0.8 + cstat(s, "spravce") * 0.012 + cstat(s, "kancler") * 0.006 + Math.max(0, stat(ch(s, s.ruler), "spr") - 8) * 0.01 + s.seat.pokladnice * 0.05 + (has(s, "ucetnictvi") ? 0.1 : 0) + (s.legitimacy - 50) / 500;
}
function incomeBreakdown(s) {
  const t = s.tax, inc = { sedlaci: 0, mestane: 0, duchovni: 0, slechta: 0, myto: 0, domeny: 0, cesty: 0, mince: 0 };
  const mestaM = [0.8, 1, 1.3][s.laws.mesta];
  for (const p of myProvs(s)) {
    if (p.occ) continue;
    const k = p.pop / 1000, pr = p.prosp / 60;
    inc.sedlaci += k * 2 * TAX_MULT[t.sedlaci] * pr * (1 - p.levy * 0.4);
    inc.mestane += (k * 0.4 + (p.b.trziste || 0) * 4 + (p.b.tkalci || 0) * 2 + (p.b.pristav || 0) * 4) * TAX_MULT[t.mestane] * pr * mestaM;
    inc.duchovni += (k * 0.3 + (p.b.kostel || 0) * 2) * TAX_MULT[t.duchovni] * (s.laws.cirkev === 2 ? 1.6 : 1);
    inc.slechta += 5 * TAX_MULT[t.slechta];
    inc.myto += (p.b.cesty || 0) * 4 * pr;
  }
  if (s.flags.mestaneStrike > s.turn) inc.mestane = 0;
  inc.domeny = 10 + cstat(s, "spravce") * 0.8;
  for (const r of s.routes) inc.cesty += routeIncome(s, r);
  const eff = efficiency(s);
  for (const k of Object.keys(inc)) if (k !== "cesty") inc[k] *= eff;
  const base = sum(Object.values(inc));
  inc.mince = base * [0, 0.08, 0.18][s.laws.mince];
  for (const k of Object.keys(inc)) inc[k] = r1(inc[k]);
  return inc;
}
function routeIncome(s, r) {
  let v = r.exotic ? 25 : 6 + (r.with && s.rivals[r.with] ? rivalProvs(s, r.with).length * 2 : 0);
  if (has(s, "smenky")) v *= 1.2; if (has(s, "mince")) v *= 1.1;
  v *= [0.8, 1, 1.3][s.laws.mesta];
  return v;
}
function expenseBreakdown(s) {
  const ex = { vojsko: armyUpkeep(s, totalUnits(s)).money, rada: sum(COUNCIL_IDS.map(k => (s.council[k] ? salary(councillor(s, k)) : 0))), dvur: 6 + s.children.length * 1.5, sidlo: sum(Object.values(s.seat)) * 1, uroky: sum(s.debts.map(d => d.amount * d.rate)) };
  for (const k of Object.keys(ex)) ex[k] = r1(ex[k]);
  return ex;
}

function estateTarget(s, e) {

  for (const [l, opts] of Object.entries(LAW_EST)) { const v = opts[s.laws[l]][e]; if (v) rows.push([LAWS[l].n + ": " + LAWS[l].opts[s.laws[l]], v]); }
  const inCouncil = COUNCIL_IDS.filter(k => councillor(s, k) && councillor(s, k).estate === e).length;
  if (inCouncil) rows.push(["Zástupci v radě", inCouncil * 6]);
  if (e === "slechta") { rows.push(["Prestiž panovníka", clamp(Math.round((s.prestige - 50) / 25), -10, 12)]); if (s.wars.length) rows.push(["Válka (příležitost ke slávě)", 3]); }
  if (e === "duchovni") rows.push(["Zbožnost panovníka", clamp(Math.round((s.piety - 30) / 15), -10, 12)]);
  if (e === "mestane") { if (s.wars.length) rows.push(["Válka ruší obchod", -6]); if (s.debts.length) rows.push(["Úvěry u kupců", 3]); if (s.routes.length) rows.push(["Obchodní cesty", Math.min(9, s.routes.length * 3)]); }

  if (e !== "duchovni" && s.laws.cirkev === 2 && e === "slechta") rows.push(["Podíl na církevních statcích", 4]);
  for (const m of s.mods) if (m.e === e && m.until > s.turn) rows.push([m.why, m.v]);

}

  if (e === "duchovni") return clamp(18 + sum(ps.map(p => (p.b.kostel || 0) * 3)) + (s.laws.cirkev === 0 ? 10 : 0) + s.seat.kaple * 3, 5, 95);

// ---------- provincie ----------
function unrestTarget(s, p) {

  if (p.occ) rows.push(["Cizí vojsko", 20]);
  if (p.levy) rows.push(["Odvedení mužů", 8]);
  if (s.wars.length) rows.push(["Válka", 5]);
  if (p.b.hradek) rows.push(["Hrádek", -4 * p.b.hradek]);
  if (p.b.kostel) rows.push(["Kostel", -3 * p.b.kostel]);
  if (s.armies.some(a => a.loc === p.id && unitCount(a.units) > 0)) rows.push(["Posádka", -6]);
  if (has(s, "zakonik")) rows.push(["Zemský zákoník", -5]);
  if (s.laws.lesy === 1) rows.push(["Panské obory", 4]);
  if (s.laws.tolerance === 0) rows.push(["Pronásledování kacířů", 3]);
  if (p.id === s.capital && s.seat.zalar) rows.push(["Žalář", -5]);
  rows.push(["Nálada sedláků", Math.round((50 - s.estates.sedlaci.loy) / 4)]);
  if (p.conquered > s.turn) rows.push(["Nedávno dobyto", 20]);

}
function prospTarget(s, p) {

  if (p.hunger) rows.push(["Hlad", -20]);
  if (p.occ) rows.push(["Plenění", -25]);
  if (s.laws.mesta === 2) rows.push(["Městská privilegia", 6]);
  if (s.routes.length) rows.push(["Obchod", Math.min(10, s.routes.length * 2)]);
  return { rows, val: clamp(sum(rows.map(r => r[1])), 5, 100) };
}

// ---------- učenost ----------
function researchRate(s) {
  let v = 1 + stat(ch(s, s.ruler), "uce") / 4 + cstat(s, "kaplan") / 3 + s.seat.knihovna * 2 + s.seat.univerzita * 5 + sum(myProvs(s).map(p => (p.b.kostel || 0) * 0.5));
  if (has(s, "tisk")) v *= 1.5;
  return r1(v);
}
const techAvailable = (s, t) => !s.techs[t] && (TECHS[t].req || []).every(r => s.techs[r]);

function snapshot(s) {
  s.history.push({ t: s.turn, d: dateStr(s), money: Math.round(s.money), pop: totalPop(s), prov: myProvs(s).length, prestige: Math.round(s.prestige), piety: Math.round(s.piety), legit: Math.round(s.legitimacy), army: unitCount(totalUnits(s)), grain: Math.round(s.stock.obili), income: s.last.income || 0, expense: s.last.expense || 0 });
  if (s.history.length > 500) s.history.shift();
}

// Akce hráče. Každá vrací null (hotovo) nebo text chyby.

// ---------- stavby ----------
function buildCost(s, B, lvl) {
  let m = [1, 0.9, 0.75][s.laws.robota] * (has(s, "gotika") ? 0.8 : 1) * (1 - cstat(s, "spravce") * 0.01);
  return { money: Math.round(B.cost[0] * lvl * m), drevo: Math.round(B.cost[1] * lvl * m), kamen: Math.round(B.cost[2] * lvl * m) };
}
function canBuild(s, where, b) {
  const seat = where === "seat", B = seat ? SBUILD[b] : PBUILD[b];
  const cur = seat ? s.seat[b] : (s.provinces[where].b[b] || 0);
  if (cur >= B.max) return "Nejvyšší úroveň.";
  if (s.queue.some(q => q.where === where && q.b === b)) return "Už se staví.";
  if (B.need && !B.need(seat ? s : s.provinces[where])) return "Nesplněné podmínky.";
  if (!seat) { const p = s.provinces[where]; if (p.owner !== "hrac") return "Není tvé."; if (p.occ) return "Obsazeno nepřítelem."; }
  if (s.queue.length >= 3 + Math.floor(cstat(s, "spravce") / 6)) return "Příliš mnoho staveb najednou (purkrabí víc neuřídí).";
  const c = buildCost(s, B, cur + 1);
  if (s.money < c.money) return "Nedostatek zlata."; if (s.stock.drevo < c.drevo) return "Nedostatek dřeva."; if (s.stock.kamen < c.kamen) return "Nedostatek kamene.";
  return null;
}
function build(s, where, b) {
  const err = canBuild(s, where, b); if (err) return err;
  const seat = where === "seat", B = seat ? SBUILD[b] : PBUILD[b], cur = seat ? s.seat[b] : (s.provinces[where].b[b] || 0), c = buildCost(s, B, cur + 1);
  s.money -= c.money; s.stock.drevo -= c.drevo; s.stock.kamen -= c.kamen;
  const time = Math.max(1, B.time + Math.floor(cur / 2) - (s.laws.robota === 2 ? 1 : 0));
  s.queue.push({ where, b, lvl: cur + 1, left: time, total: time, paid: c.money });
  log(s, `Zahájena stavba: ${B.n} (úroveň ${cur + 1}) – ${seat ? "sídlo" : s.provinces[where].n}.`, "stavby");
  return null;
}
function cancelBuild(s, i) { const q = s.queue[i]; if (!q) return "Není."; s.money += Math.round(q.paid / 2); s.queue.splice(i, 1); log(s, "Stavba zrušena, vrácena polovina nákladů.", "stavby"); return null; }

// ---------- vojsko ----------
function canRecruit(s, u, n, armyId) {
  const U = UNITS[u], a = s.armies.find(x => x.id === armyId);
  if (!a) return "Vyber vojsko."; if (u === "hotovost") return "Hotovost se povolává z provincií.";
  if (U.tech && !has(s, U.tech)) return "Chybí objev: " + TECHS[U.tech].n + ".";
  const p = s.provinces[a.loc]; if (!p || p.owner !== "hrac" || p.occ) return "Verbovat lze jen na vlastním území.";
  if (u === "rytiri" && s.estates.slechta.loy < 30) return "Šlechta odmítá posílat rytíře (věrnost pod 30).";
  const cost = Math.round(U.cost * n * (u === "rytiri" && s.seat.staje ? 1 - s.seat.staje * 0.05 : 1) * s.inflation);
  if (s.money < cost) return "Nedostatek zlata (" + cost + " zl).";
  for (const [g, q] of Object.entries(U.goods || {})) if (s.stock[g] < q * n) return "Nedostatek: " + GOODS[g].n + ".";
  return null;
}
function recruit(s, u, n, armyId) {
  n = Math.floor(n); if (n <= 0) return "Zadej počet.";
  const err = canRecruit(s, u, n, armyId); if (err) return err;
  const U = UNITS[u], a = s.armies.find(x => x.id === armyId);
  s.money -= Math.round(U.cost * n * (u === "rytiri" && s.seat.staje ? 1 - s.seat.staje * 0.05 : 1) * s.inflation);
  for (const [g, q] of Object.entries(U.goods || {})) s.stock[g] -= q * n;
  a.morale = (a.morale * unitCount(a.units) + 0.85 * n) / (unitCount(a.units) + n);
  a.units[u] = (a.units[u] || 0) + n;
  log(s, `Naverbováno ${n}× ${U.n} (${a.name}).`, "vojsko");
  return null;
}
function disband(s, armyId, u, n) {
  const a = s.armies.find(x => x.id === armyId); if (!a || !a.units[u]) return "Není co rozpustit.";
  n = Math.min(a.units[u], Math.floor(n)); a.units[u] -= n;
  if (u === "hotovost") { const left = sum(s.armies.map(x => x.units.hotovost || 0)); if (!left) for (const p of myProvs(s)) p.levy = 0; }
  else if (UNITS[u].goods) for (const [g, q] of Object.entries(UNITS[u].goods)) if (g !== "drevo") s.stock[g] += Math.floor(q * n / 2);
  log(s, `Rozpuštěno ${n}× ${UNITS[u].n}.`, "vojsko");
  return null;
}
const levyMult = s => [1.6, 1, 0.5][s.laws.vojsko];
function raiseLevy(s) {
  const ps = myProvs(s).filter(p => !p.levy && !p.occ); if (!ps.length) return "Hotovost už je povolána.";
  let total = 0;
  for (const p of ps) {
    const n = Math.max(1, Math.round(p.pop / 1000 * levyMult(s))); p.levy = 1; total += n;
    const a = s.armies.find(x => x.loc === p.id) || s.armies.find(x => s.provinces[x.loc].owner === "hrac") || s.armies[0];
    if (a) a.units.hotovost = (a.units.hotovost || 0) + n;
  }
  mod(s, "sedlaci", -4, 4, "Povolání hotovosti");
  log(s, `Povolána selská hotovost: ${total} setnin. Pole budou méně obdělaná.`, "vojsko");
  return null;
}
function newArmy(s, fromId, u, n) {
  const a = s.armies.find(x => x.id === fromId); n = Math.floor(n);
  if (!a || !a.units[u] || n <= 0) return "Není co oddělit."; n = Math.min(n, a.units[u]);
  if (s.armies.length >= 4) return "Nejvýš 4 vojska.";
  a.units[u] -= n; const id = "a" + (s.nextId++);
  s.armies.push({ id, name: "Vojsko " + (s.armies.length + 1), loc: a.loc, units: { [u]: n }, morale: a.morale, order: null, commander: null });
  return null;
}
function moveUnits(s, fromId, toId, u, n) {
  const a = s.armies.find(x => x.id === fromId), b = s.armies.find(x => x.id === toId);
  if (!a || !b || a.loc !== b.loc) return "Vojska musí stát ve stejné provincii."; n = Math.min(Math.floor(n), a.units[u] || 0); if (n <= 0) return "Není co přesunout.";
  a.units[u] -= n; b.units[u] = (b.units[u] || 0) + n; return null;
}
function mergeArmies(s, fromId, toId) {
  const a = s.armies.find(x => x.id === fromId), b = s.armies.find(x => x.id === toId);
  if (!a || !b || a === b || a.loc !== b.loc) return "Vojska musí stát ve stejné provincii.";
  for (const [u, n] of Object.entries(a.units)) b.units[u] = (b.units[u] || 0) + n;
  if (a.commander === "ruler") b.commander = "ruler";
  s.armies = s.armies.filter(x => x !== a); return null;
}
function canEnter(s, pid) {
  const p = s.provinces[pid]; if (p.owner === "hrac") return true;
  const r = s.rivals[p.owner]; return !!(atWarWith(s, p.owner) || (r && r.alliance));
}
function findPath(s, from, to) {
  if (from === to) return [];
  const prev = { [from]: null }, q = [from];
  while (q.length) { const c = q.shift(); for (const n of s.provinces[c].nb) { if (n in prev || !canEnter(s, n)) continue; prev[n] = c; if (n === to) { const path = [n]; let x = c; while (x !== from) { path.unshift(x); x = prev[x]; } return path; } q.push(n); } }
  return null;
}
function orderMove(s, armyId, to) {
  const a = s.armies.find(x => x.id === armyId); if (!a) return "Není vojsko.";
  if (to === a.loc) { a.order = null; return null; }
  const path = findPath(s, a.loc, to); if (!path) return "Tam nevede cesta (cizí území lze vstoupit jen ve válce nebo u spojence).";
  a.order = { to, path }; return null;
}
function setCommander(s, armyId, who) {
  for (const a of s.armies) if (a.commander === who) a.commander = null;
  const a = s.armies.find(x => x.id === armyId); if (a) a.commander = who || null; return null;
}

// ---------- daně, zákony, dluhy ----------
function setTax(s, e, v) { s.tax[e] = clamp(v, 0, 4); return null; }
function lawChangeCost(s) { return 15 + s.realm.title * 5; }
function setLaw(s, l, v) {
  if (s.laws[l] === v) return null;
  if ((s.lawCd[l] || 0) > s.turn) return "Tento zákon lze znovu měnit až za " + (s.lawCd[l] - s.turn) + " období.";
  const c = lawChangeCost(s); if (s.legitimacy < c / 2) return "Nedostatek legitimity.";
  s.legitimacy -= c / 2; s.prestige -= c / 3;
  const old = s.laws[l]; s.laws[l] = v; s.lawCd[l] = s.turn + 8;
  if (l === "mince" && v < old) mod(s, "mestane", 8, 8, "Návrat k poctivé minci");
  log(s, `Zákon „${LAWS[l].n}“ změněn: ${LAWS[l].opts[old]} → ${LAWS[l].opts[v]}.`, "politika");
  return null;
}
function maxLoan(s) { return Math.round((300 + totalPop(s) / 100) * (has(s, "smenky") ? 2 : 1)); }
function loanRate(s) { return r1((0.05 - (has(s, "ucetnictvi") ? 0.01 : 0) - (s.estates.mestane.loy > 60 ? 0.005 : 0) + (s.debts.length * 0.005))* 1000) / 1000; }
function borrow(s, amount) {
  amount = Math.floor(amount); const debt = sum(s.debts.map(d => d.amount));
  if (amount <= 0) return "Zadej částku."; if (debt + amount > maxLoan(s)) return "Lichváři víc nepůjčí (strop " + maxLoan(s) + " zl).";
  const rate = loanRate(s); s.debts.push({ amount, rate, from: s.turn }); s.money += amount;
  log(s, `Půjčka ${amount} zl u lichvářů, úrok ${Math.round(rate * 1000) / 10} % za období.`, "hospodarstvi");
  return null;
}
function repay(s, i) { const d = s.debts[i]; if (!d) return "Není."; if (s.money < d.amount) return "Nedostatek zlata."; s.money -= d.amount; s.debts.splice(i, 1); log(s, `Splacen dluh ${d.amount} zl.`, "hospodarstvi"); return null; }

// ---------- rada a dvůr ----------
function appoint(s, seat, cid) {
  const c = ch(s, cid); if (!c) return "Není.";
  const old = s.council[seat];
  for (const k of COUNCIL_IDS) if (s.council[k] === cid) s.council[k] = null;
  s.council[seat] = cid; s.courtiers = s.courtiers.filter(x => x !== cid);
  if (old && old !== cid) { const o = ch(s, old); s.courtiers.push(old); o.loyalty -= 20; mod(s, o.estate, -4, 4, "Odvolání " + o.name); }
  log(s, `${c.name} jmenován(a) do úřadu: ${COUNCIL[seat].n}.`, "politika");
  return null;
}
function dismiss(s, seat) { const id = s.council[seat]; if (!id) return null; const o = ch(s, id); s.council[seat] = null; s.courtiers.push(id); o.loyalty -= 25; mod(s, o.estate, -4, 4, "Odvolání " + o.name); log(s, `${o.name} odvolán(a) z úřadu ${COUNCIL[seat].n}.`, "politika"); return null; }
function setFocus(s, cid, f) { const c = ch(s, cid); if (c) c.focus = f; return null; }

// ---------- objevy a výpravy ----------
function setResearch(s, t) { if (!techAvailable(s, t)) return "Nelze."; s.research.cur = t; return null; }
function startExpedition(s, id) {
  const E = EXPEDITIONS[id];
  if ((E.req || []).some(r => !has(s, r))) return "Chybí objevy.";
  if (s.expeditions.some(x => x.id === id)) return "Výprava už je na cestě.";
  if (s.expDone[id] && id !== "knihy" && id !== "hory") return "Tento kraj už je probádán.";
  if (s.money < E.cost) return "Nedostatek zlata.";
  if ((id === "levanta" || id === "ocean" || id === "sever") && !myProvs(s).some(p => p.b.pristav)) return "Potřebuješ přístav.";
  s.money -= E.cost; s.expeditions.push({ id, left: E.time });
  log(s, `Vyslána výprava: ${E.n}.`, "objevy"); return null;
}
function routeLimit(s) { return 1 + Math.floor(sum(myProvs(s).map(p => p.b.trziste || 0)) / 2) + (has(s, "koga") ? 1 : 0) + (myProvs(s).some(p => p.b.pristav) ? 1 : 0); }

// ---------- osobní činy panovníka (body činů) ----------
const ACTIONS = {
  hostina: { n: "Uspořádat hostinu", d: "šlechta +10 na 6 období, prestiž +4", cost: s => ({ money: 40 - s.seat.sin * 10, vino: 4 }) },
  turnaj: { n: "Vypsat turnaj", d: "prestiž +12, šlechta +6, možná nový rytíř; panovník se může zranit", cost: () => ({ money: 90 }) },
  objezd: { n: "Objet panství", d: "nepokoje −8 všude, sedláci +5, legitimita +2", cost: () => ({}) },
  soud: { n: "Zasednout k soudu", d: "legitimita +4, sedláci a měšťané +4", cost: () => ({}) },
  dar: { n: "Štědrý dar církvi", d: "zbožnost +12, duchovenstvo +8 na 8 období", cost: () => ({ money: 60 }) },
  pout: { n: "Vydat se na pouť", d: "zbožnost +20, legitimita +2; cesta je nebezpečná", cost: () => ({ money: 30 }) },
  hon: { n: "Velký hon", d: "prestiž +3, šlechta +4; riziko zranění", cost: () => ({}) },
  ucenci: { n: "Rozprava s učenci", d: "učenost +6 a podle vzdělání panovníka", cost: () => ({ money: 15 }) },
  vycvik: { n: "Přehlídka a výcvik vojska", d: "morálka všech vojsk +0,1 (max. 1,3)", cost: () => ({ money: 30 }) },
  cechy: { n: "Jednat s cechy", d: "měšťané +10 na 6 období, prestiž −3", cost: () => ({}) },
  berne: { n: "Vypsat mimořádnou berni", d: "zlato ve výši 1,5× příjmu, všechny stavy −10, nepokoje +12", cost: () => ({}) },
  dvorane: { n: "Pozvat nové dvořany", d: "noví kandidáti do rady", cost: () => ({ money: 20 }) },
};
function doAction(s, a) {
  if (s.ap <= 0) return "Panovník už v tomto období nemá čas (žádné body činů).";
  const A = ACTIONS[a], c = A.cost(s), R = ch(s, s.ruler);
  if (c.money && s.money < c.money) return "Nedostatek zlata."; if (c.vino && s.stock.vino < c.vino) return "Chybí víno.";
  s.money -= c.money || 0; s.stock.vino -= c.vino || 0; s.ap--;
  let msg = "";
  const injure = (p, txt) => { if (chance(s, p)) { R.health -= rint(s, 10, 25); msg += " " + txt; } };
  switch (a) {
    case "hostina": mod(s, "slechta", 10 + s.seat.sin * 3, 6, "Hostina"); s.prestige += 4; msg = "Páni se veselili do rána."; break;
    case "turnaj": s.prestige += 12; mod(s, "slechta", 6, 6, "Turnaj"); msg = "Turnaj se vydařil.";
      if (chance(s, 0.3)) { s.armies[0].units.rytiri = (s.armies[0].units.rytiri || 0) + 1; msg += " Potulný rytíř vstoupil do služby."; }

// ---------- diplomacie ----------

    const E = EXPEDITIONS[x.id], ok = chance(s, E.chance + (has(s, "portolan") ? 0.2 : 0) + cstat(s, "kancler") * 0.005);
    if (!ok) { log(s, `Výprava „${E.n}“ se nevrátila. Zůstaly jen pověsti.`, "objevy"); s.prestige -= 3; continue; }
    s.expDone[x.id] = (s.expDone[x.id] || 0) + 1; s.prestige += 10;
    if (x.id === "hory") { const ps = myProvs(s).filter(p => p.terrain === "hory" || p.terrain === "kopce"); const p = ps.length ? pick(s, ps) : null;
      if (p && !p.res.includes("zelezo")) { p.res.push("zelezo"); log(s, `Výprava našla železnou rudu v provincii ${p.n}!`, "objevy"); }
      else { const g = rint(s, 150, 350); s.money += g; log(s, `Výprava našla stříbrnou žílu – vytěženo ${g} zl.`, "objevy"); } }
    if (x.id === "sever") { s.routes.push({ n: "Severní moře (kožešiny, jantar)", exotic: true }); log(s, "Výprava navázala obchod se severskými kupci – nová obchodní cesta.", "objevy"); }
    if (x.id === "stepi") { s.routes.push({ n: "Hedvábná stezka", exotic: true, good: "hedvabi" }); log(s, "Karavana se vrátila s hedvábím! Otevřena hedvábná stezka.", "objevy"); }
    if (x.id === "levanta") { s.routes.push({ n: "Levantský obchod s kořením", exotic: true, good: "koreni" }); s.piety += 20; log(s, "Lodě přivezly koření a svaté ostatky z Levanty!", "objevy"); }
    if (x.id === "ocean") { s.prestige += 150; s.money += 400; log(s, "Výprava se vrátila ze země za oceánem! Celý svět mluví o tvém rodu.", "objevy"); }
    if (x.id === "knihy") { s.research.pts += 25; log(s, "Učenci z Bologni přinesli opisy knih (+25 učenosti).", "objevy"); }
  }
  s.expeditions = s.expeditions.filter(e => e.left > 0);
}

// ---------- rod ----------
function familyTurn(s) {
  const R = ch(s, s.ruler), sp = ch(s, s.spouse);
  const fam = [R, sp, ...s.children.map(id => ch(s, id))].filter(Boolean);
  if (s.season === 0) for (const c of fam) {
    c.age++;
    if (c.age > 45) c.health -= rint(s, 0, 3); else c.health += rint(s, -1, 2);
    if (c !== R && c !== sp && c.age <= 16 && c.focus) { c[c.focus] += 1; if (chance(s, 0.4)) c[c.focus] += 1; }
    if (c !== R && c !== sp && c.age < 16 && !c.focus) { for (const k of ["dip", "mil", "spr", "uce", "int"]) if (chance(s, 0.3)) c[k]++; }
    if (c.age === 6 && c !== R && c !== sp) s.events.push({ id: "vychova", cid: c.id });
  }
  for (const c of fam) c.health = clamp(c.health + (s.seat.donjon * 0.3) + (has(s, "medicina") ? 0.3 : 0) - 0.2, -10, 100);
  for (const c of s.children.map(id => ch(s, id))) if (c && chance(s, deathChance(c))) { s.children = s.children.filter(x => x !== c.id); s.dead.push({ n: c.name, d: dateStr(s), age: c.age }); log(s, `Zemřel(a) ${c.name} (${c.age} let). Rod truchlí.`, "rod"); }
  if (sp && chance(s, deathChance(sp))) { s.dead.push({ n: sp.name, d: dateStr(s), age: sp.age }); s.spouse = null; log(s, `Zemřela choť ${sp.name}.`, "rod"); s.events.push({ id: "vdovec" }); }
  if (R && R.age >= 16 && sp && sp.age < 42 && s.children.length < 8 && chance(s, 0.07)) {
    const c = newChar(s, { noSurname: true, age: 0, health: rint(s, 40, 90), estate: "rod", traits: [] }); c.name = pick(s, c.sex === "m" ? NAMES_M : NAMES_F); for (const k of ["dip", "mil", "spr", "uce", "int"]) c[k] = rint(s, 1, 4);
    s.children.push(c.id); s.legitimacy += 3; log(s, `Narodil(a) se ${c.sex === "m" ? "syn" : "dcera"} ${c.name}!`, "rod");
  }
  if (R && R.age >= 16 && !s.spouse && s.season === 0 && !s.events.some(e => e.id === "vdovec")) s.events.push({ id: "vdovec" });
  // rádci stárnou a jejich věrnost se mění
  for (const k of COUNCIL_IDS) { const c = councillor(s, k); if (!c) continue; if (s.season === 0) c.age++; c.loyalty = clamp(c.loyalty + (55 + (s.prestige > 150 ? 10 : 0) - (s.money < 0 ? 15 : 0) - c.loyalty) * 0.05 + rint(s, -2, 2), 0, 100);
    if (chance(s, deathChance(c) * 0.7)) { log(s, `Zemřel(a) ${c.name}, ${COUNCIL[k].n}. Úřad je volný.`, "politika"); s.council[k] = null; delete s.chars[c.id]; } }
  if (chance(s, deathChance(R))) succession(s);
}
function heirOf(s) {
  const kids = s.children.map(id => ch(s, id)).filter(c => c && !(c.married && c.sex === "f"));
  if (!kids.length) return null;
  const byAge = kids.slice().sort((a, b) => b.age - a.age);
  if (s.laws.nastupnictvi === 1) { const adults = kids.filter(c => c.age >= 16); const pool = adults.length ? adults : byAge; return pool.slice().sort((a, b) => sum(["dip", "mil", "spr", "uce", "int"].map(k => stat(b, k))) - sum(["dip", "mil", "spr", "uce", "int"].map(k => stat(a, k))))[0]; }
  return byAge.find(c => c.sex === "m") || byAge[0];
}
function succession(s) {
  const R = ch(s, s.ruler); const H = heirOf(s);
  s.dead.push({ n: R.name, d: dateStr(s), age: R.age, ruler: true });
  if (!H) { s.over = { win: false, txt: `${R.name} zemřel(a) bez dědice. Rod ${s.dynasty} vymřel po meči i po přeslici. Skóre: ${score(s)}.` }; return; }
  s.children = s.children.filter(x => x !== H.id);
  for (const a of s.armies) if (a.commander === "ruler") a.commander = null;
  s.ruler = H.id; s.ap = 2;
  if (H.married && H.sex === "m") { const sp = newChar(s, { name: H.spouseName, sex: "f", age: H.age, estate: "rod" }); s.spouse = sp.id; }
  else s.spouse = null;
  // sourozenci zůstávají jako děti rodu
  let txt = `Zemřel ${R.name} (${R.age} let). Vlády se ujímá ${H.name} (${H.age} let).`;
  s.legitimacy = H.sex === "f" ? s.legitimacy * 0.6 : s.legitimacy * 0.8;
  if (H.age < 16) { s.legitimacy -= 10; txt += " Do jeho zletilosti vládne regentská rada."; }
  if (s.laws.nastupnictvi === 1) mod(s, "slechta", 10, 8, "Šlechta zvolila panovníka");
  if (s.laws.nastupnictvi === 2) { s.money = Math.round(s.money * 0.7); s.prestige *= 0.7; txt += " Dědictví bylo rozděleno mezi sourozence."; }
  s.prestige = Math.round(s.prestige * 0.85);
  for (const r of aliveRivals(s)) r.attitude = Math.round(r.attitude * 0.7);
  log(s, txt, "rod"); s.events.push({ id: "_succ", txt });
  if (!s.spouse && H.age >= 16) s.events.push({ id: "vdovec" });
}

// Události s volbami. Každá: t (název), c (podmínka), w (váha), init (data), txt, ch (volby: t, e = efekt vrací zprávu, ok = podmínka).
const provName = (s, id) => s.provinces[id] ? s.provinces[id].n : "?";
const randMyProv = (s, f) => { const ps = myProvs(s).filter(p => !p.occ && (!f || f(p))); return ps.length ? pick(s, ps).id : null; };
function strongestArmy(s) { return s.armies.slice().sort((a, b) => playerArmyPower(s, b) - playerArmyPower(s, a))[0]; }
// boj proti rebelům nebo královu vojsku (bez mapy)
function fightAbstract(s, enemyPower, label) {
  const a = strongestArmy(s); if (!a || !unitCount(a.units)) return { win: false, txt: "Neměl jsi vojsko, které by se postavilo." };
  const pA = playerArmyPower(s, a, true) * (0.8 + rnd(s) * 0.4), pB = enemyPower * (0.8 + rnd(s) * 0.4), win = pA > pB;
  applyLosses(s, a.units, win ? 0.1 : 0.35); a.morale = clamp(a.morale + (win ? 0.05 : -0.2), 0.4, 1.3);
  const txt = `Boj s ${label}: ${win ? "vítězství" : "porážka"} (síla ${Math.round(pA)} : ${Math.round(pB)}).`;
  s.battles = s.battles || []; s.battles.unshift({ d: dateStr(s), place: provName(s, a.loc), enemy: label, win, my: unitCount(a.units), en: "–", myLost: "–", enLost: "–", pA: Math.round(pA), pB: Math.round(pB), score: 0 });
  return { win, txt };
}

function evDef(id) { return EVENTS[id] || SPECIAL[id]; }
function rollEvents(s) {
  if (s.flags.kingArmyBack && s.flags.kingArmyBack <= s.turn) { const a = s.armies[0]; if (a) a.units.kopinici = (a.units.kopinici || 0) + 3; s.flags.kingArmyBack = 0; log(s, "Vojsko se vrátilo z králova tažení (3 setniny přežily).", "vojsko"); }
  if (!chance(s, 0.5)) return;
  const pool = Object.entries(EVENTS).filter(([id, E]) => !E.c || E.c(s)).filter(([id]) => !(s.flags["ev_" + id] > s.turn));
  const tot = sum(pool.map(([, E]) => E.w || 1)); let x = rnd(s) * tot;
  for (const [id, E] of pool) { x -= E.w || 1; if (x <= 0) { const ev = Object.assign({ id }, E.init ? E.init(s) : {}); if ("pid" in ev && !ev.pid) return; if (E.pre) E.pre(s, ev); s.events.push(ev); s.flags["ev_" + id] = s.turn + 8; return; } }
}
function eventView(s, ev) {
  const E = evDef(ev.id); const T = x => (typeof x === "function" ? x(s, ev) : x);
  return { t: T(E.t), txt: T(E.txt), ch: E.ch.map((c, i) => ({ i, t: T(c.t), ok: !c.ok || c.ok(s, ev) })) };
}
function resolveEvent(s, idx, ci) {
  const ev = s.events[idx]; if (!ev) return "Není událost.";
  const E = evDef(ev.id), c = E.ch[ci]; if (!c) return "Neplatná volba.";
  if (c.ok && !c.ok(s, ev)) return "Tuto možnost nelze zvolit.";
  if (E.pre && SPECIAL[ev.id] && !ev._pre) { E.pre(s, ev); }
  const msg = c.e(s, ev); s.events.splice(idx, 1);
  log(s, `${typeof E.t === "function" ? E.t(s, ev) : E.t}: ${typeof c.t === "function" ? c.t(s, ev) : c.t}. ${msg || ""}`, "udalosti");
  const R = ch(s, s.ruler); if (R && R.health <= 0 && !s.over) succession(s);
  return null;
}

// Rozhraní: záložky s tabulkami, události v okně, ukládání v prohlížeči.
let S = null, TAB = "prehled", SEL = { prov: "vranov", army: null, logCat: "" };
const $ = q => document.querySelector(q);
const esc = t => String(t == null ? "" : t).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = n => (Math.round(n) || 0).toLocaleString("cs-CZ");
const sg = n => (n > 0 ? "+" : "") + fmt(n);
const cls = (v, lo, hi) => (v < lo ? "bad" : v > hi ? "good" : "");
const bar = (v, inv) => `<div class="bar ${inv ? (v > 60 ? "red" : v > 35 ? "yel" : "") : (v < 25 ? "red" : v < 45 ? "yel" : "")}"><i style="width:${clamp(v, 0, 100)}%"></i></div>`;
function btn(label, a, args = [], err = null, title = "") { return `<button class="b" data-a="${a}" data-x="${esc(JSON.stringify(args))}"${err ? ` disabled title="${esc(err)}"` : title ? ` title="${esc(title)}"` : ""}>${label}</button>`; }
const tbl = (head, rows) => `<table><thead><tr>${head.map(h => (h.startsWith("#") ? `<th class="n">${h.slice(1)}</th>` : `<th>${h}</th>`)).join("")}</tr></thead><tbody>${rows.join("") || `<tr><td colspan="${head.length}" class="muted">—</td></tr>`}</tbody></table>`;
const tr = cells => "<tr>" + cells.map(c => (typeof c === "number" ? `<td class="n">${fmt(c)}</td>` : String(c).startsWith("<td") ? c : `<td>${c}</td>`)).join("") + "</tr>";
const tdn = (v, c = "") => `<td class="n ${c}">${v}</td>`;
const card = (t, body) => `<div class="card"><h3>${t}</h3>${body}</div>`;
const costTxt = c => [c.money ? c.money + " zl" : "", c.drevo ? c.drevo + " dřeva" : "", c.kamen ? c.kamen + " kamene" : "", c.vino ? c.vino + " vína" : ""].filter(Boolean).join(", ") || "zdarma";

const provOwner = p => (p.owner === "hrac" ? "<b>ty</b>" : S.rivals[p.owner] ? esc(S.rivals[p.owner].n) : "?");

// ---------- akce ----------
const ACT = {
  build: (w, b) => build(S, w, b), cancel: i => cancelBuild(S, i), recruit: (u, n, a) => recruit(S, u, n, a), disband: (a, u, n) => disband(S, a, u, n),
  levy: () => raiseLevy(S), move: (a, to) => orderMove(S, a, to), cmd: (a, w) => setCommander(S, a, w), split: (a, u, n) => newArmy(S, a, u, n), merge: (a, b) => mergeArmies(S, a, b),
  rename: (a, n) => { const x = S.armies.find(y => y.id === a); if (x && n) x.name = n; },
  buy: (g, n) => trade(S, g, n, true), sell: (g, n) => trade(S, g, n, false), tax: (e, v) => setTax(S, e, +v), law: (l, v) => setLaw(S, l, +v),

  research: t => setResearch(S, t), exped: id => startExpedition(S, id), action: a => doAction(S, a), dip: (r, a, x) => dipAction(S, r, a, x),
  peace: (r, t, pid) => makePeace(S, r, { t, pid }), title: () => raiseTitle(S), event: (i, c) => resolveEvent(S, i, c),
  end: () => endTurn(S), prov: id => { SEL.prov = id; }, tab: t => { TAB = t; }, army: id => { SEL.army = id; }, logcat: c => { SEL.logCat = c; },
  save: n => saveSlot(n), load: n => loadSlot(n), del: n => { try { localStorage.removeItem("panovnik_slot_" + n); } catch (e) {} }, exportSave: () => exportSave(), importSave: () => $("#impFile").click(),
  newgame: () => { if (!confirm("Začít novou hru? Neuložený postup se ztratí.")) return; S = newGame({ realm: $("#ngRealm").value, ruler: $("#ngRuler").value, dynasty: $("#ngDyn").value, seed: $("#ngSeed").value ? +$("#ngSeed").value : undefined }); TAB = "prehled"; },
  theme: () => { const r = document.documentElement; const t = r.dataset.theme === "dark" ? "light" : r.dataset.theme === "light" ? "" : "dark"; if (t) r.dataset.theme = t; else delete r.dataset.theme; try { localStorage.setItem("panovnik_theme", t); } catch (e) {} },
};
document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-a]"); if (!el || el.disabled || el.tagName === "SELECT") return;
  run(el.dataset.a, JSON.parse(el.dataset.x || "[]"));
});
document.addEventListener("change", ev => {
  const el = ev.target.closest("select[data-a], input[data-a]"); if (!el) return;
  const args = JSON.parse(el.dataset.x || "[]"); args.push(el.value); run(el.dataset.a, args);
});
document.addEventListener("keydown", ev => { if (ev.key === "Enter" && ev.ctrlKey) run("end", []); });
function run(a, args) {
  args = args.map(x => (typeof x === "string" && x[0] === "#" ? ($(x) ? ($(x).type === "number" ? +$(x).value : $(x).value) : "") : x));
  let err = null; try { err = ACT[a](...args); } catch (e) { console.error(e); err = "Chyba: " + e.message; }
  if (err) toast(err);
  if (a === "end" && !err) { window.scrollTo(0, 0); toast(`${dateStr(S)} – nové období.`); }
  autosave(); render();
}

// ---------- ukládání ----------
function autosave() { try { localStorage.setItem("panovnik_auto", JSON.stringify(S)); } catch (e) {} }
function saveSlot(n) { try { localStorage.setItem("panovnik_slot_" + n, JSON.stringify(S)); toast("Uloženo do pozice " + n + "."); } catch (e) { return "Uložení se nezdařilo: " + e.message; } }

function exportSave() {
  const blob = new Blob([JSON.stringify(S)], { type: "application/json" }); const a = document.createElement("a");

// ---------- hlavička a záložky ----------
const TABS = [["prehled", "Přehled"], ["sidlo", "Sídlo"], ["uzemi", "Území"], ["hosp", "Hospodářství"], ["trh", "Trh a obchod"], ["vojsko", "Vojsko"], ["valka", "Válka"], ["politika", "Stavy a zákony"], ["dvur", "Rod a rada"], ["diplo", "Diplomacie"], ["objevy", "Objevy"], ["kronika", "Kronika"], ["hra", "Hra"]];

}

// ---------- Přehled ----------
function warnings() {
  const w = [], need = grainNeed(S), gn = need.lid + need.vojsko + need.dvur;
  if (S.stock.obili + (provProductionAll(S) || 0) - gn < gn * 0.5) w.push(["bad", `Hrozí hlad: zásoba ${fmt(S.stock.obili)}, spotřeba ${fmt(gn)} za období, tato sklizeň ${fmt(provProductionAll(S))}.`]);
  for (const e of ESTATE_IDS) if (S.estates[e].loy < 30) w.push(["bad", `${ESTATES[e].n}: věrnost jen ${fmt(S.estates[e].loy)} – hrozí krize.`]);
  for (const p of myProvs(S)) { if (p.unrest > 60) w.push(["warn", `Nepokoje v ${p.n}: ${fmt(p.unrest)}.`]); if (p.occ) w.push(["bad", `${p.n} je obsazena nepřítelem!`]); if (p.siege && p.siege.by !== "hrac") w.push(["bad", `${p.n} je obléhána (${fmt(p.siege.prog)} %).`]); }
  const net = sum(Object.values(incomeBreakdown(S))) - sum(Object.values(expenseBreakdown(S))); if (net < 0) w.push(["warn", `Výdaje převyšují příjmy o ${fmt(-net)} zl za období.`]);
  if (!S.research.cur) w.push(["warn", "Učenci nemají zadaný výzkum (záložka Objevy)."]);
  for (const k of COUNCIL_IDS) if (!S.council[k]) w.push(["warn", `Úřad ${COUNCIL[k].n} je neobsazený.`]);
  if (S.ap > 0) w.push(["muted", `Panovníkovi zbývají ${S.ap} body činů.`]);
  if (!S.spouse && ch(S, S.ruler).age >= 16) w.push(["warn", "Panovník nemá choť – rod nemá jistotu dědice."]);
  if (!heirOf(S)) w.push(["bad", "Rod nemá dědice!"]);
  return w;
}
function provProductionAll(s) { return Math.round(sum(myProvs(s).map(p => provProduction(s, p).out.obili || 0))); }

// ---------- Sídlo ----------
function buildRows(where, defs, cur) {
  return Object.entries(defs).map(([b, B]) => {
    const lvl = cur(b), next = lvl + 1, q = S.queue.find(x => x.where === where && x.b === b);
    const ok = !B.need || B.need(where === "seat" ? S : S.provinces[where]);
    if (!ok && !lvl) return tr([`<span class="muted">${B.n}</span>`, `<span class="muted small">${B.d}</span>`, "—", "", "", '<span class="muted small">nelze</span>']);
    const c = lvl < B.max ? buildCost(S, B, next) : null;
    return tr([B.n, `<span class="small">${B.d}</span>`, `<td class="n">${lvl}/${B.max}</td>`, c ? costTxt(c) : "—", c ? Math.max(1, B.time + Math.floor(lvl / 2) - (S.laws.robota === 2 ? 1 : 0)) + " obd." : "", q ? `<span class="warn">staví se (${q.left})</span>` : lvl >= B.max ? '<span class="good">hotovo</span>' : btn(lvl ? "Rozšířit" : "Postavit", "build", [where, b], canBuild(S, where, b))]);
  });
}
function queueCard() { return card("Rozestavěno", tbl(["Stavba", "Kde", "#Zbývá", ""], S.queue.map((q, i) => tr([`${(q.where === "seat" ? SBUILD : PBUILD)[q.b].n} ${q.lvl}`, q.where === "seat" ? "sídlo" : S.provinces[q.where].n, q.left, btn("Zrušit", "cancel", [i])]))) + `<p class="small muted">Najednou lze stavět ${3 + Math.floor(cstat(S, "spravce") / 6)} staveb (podle purkrabího). Robota: ${LAWS.robota.opts[S.laws.robota]}.</p>`); }
function tSidlo() {
  const cap_ = grainCap(S);
  return `<div class="grid"><div class="card" style="grid-column:1/-1"><h3>Panské sídlo – ${esc(S.provinces[S.capital].n)}</h3>${tbl(["Budova", "Účinek", "#Úroveň", "Cena další úrovně", "Doba", ""], buildRows("seat", SBUILD, b => S.seat[b] || 0))}</div>
  ${queueCard()}
  ${card("Hospodaření dvora", `<div class="kv"><span>Kapacita sýpek</span><span>${fmt(cap_)} obilí (nad ni 30 % zplesniví)</span><span>Kažení zásob</span><span>${r1((0.03 - S.seat.sypka * 0.008) * 100)} % za období</span><span>Spotřeba dvora</span><span>${4 + S.children.length} obilí, 1 víno, ½ sukna za období</span><span>Údržba sídla</span><span>${fmt(expenseBreakdown(S).sidlo)} zl za období</span><span>Obrana sídla</span><span>úroveň opevnění ${r1(fortLevel(S, S.provinces[S.capital]))}</span><span>Učenost ze sídla</span><span>${S.seat.knihovna * 2 + S.seat.univerzita * 5} bodů</span></div>`)}</div>`;
}

// ---------- Území ----------
function tUzemi() {
  const ps = myProvs(S); if (!ps.some(p => p.id === SEL.prov)) SEL.prov = ps[0] && ps[0].id;
  const rows = ps.map(p => { const pr = provProduction(S, p, 2); const yr = sum([0, 1, 2, 3].map(se => provProduction(S, p, se).out.obili || 0)); const need = p.pop / 1000 * 8 * 4;
    return `<tr class="${p.id === SEL.prov ? "sel" : ""}"><td>${btn(esc(p.n), "prov", [p.id])}${p.id === S.capital ? " ♛" : ""}</td><td>${TERRAIN[p.terrain].n}</td>${tdn(fmt(p.pop))}${tdn(fmt(p.prosp), cls(p.prosp, 30, 60))}${tdn(fmt(p.unrest), p.unrest > 60 ? "bad" : p.unrest > 35 ? "warn" : "")}${tdn(fmt(yr) + " / " + fmt(need), yr < need ? "bad" : "good")}<td>${p.res.map(r => GOODS[r].n).join(", ") || "—"}</td><td class="small">${Object.entries(p.b).filter(([, l]) => l).map(([b, l]) => PBUILD[b].n + " " + l).join(", ") || "—"}</td><td>${p.occ ? '<span class="bad">obsazeno</span>' : p.siege ? `<span class="warn">obléháno ${fmt(p.siege.prog)} %</span>` : p.hunger ? '<span class="bad">hlad</span>' : p.levy ? '<span class="warn">hotovost</span>' : "klid"}</td></tr>`; });
  const p = S.provinces[SEL.prov]; let det = "";
  if (p) {
    const pr = provProduction(S, p); const ut = unrestTarget(S, p), pt = prospTarget(S, p);
    det = `<div class="card" style="grid-column:1/-1"><h3>${esc(p.n)} – stavby</h3>${tbl(["Budova", "Účinek", "#Úroveň", "Cena", "Doba", ""], buildRows(p.id, PBUILD, b => p.b[b] || 0))}</div>
    ${card("Výroba v tomto období", tbl(["Zboží", "#Vyrobí", "#Spotřebuje"], Object.keys(Object.assign({}, pr.out, pr.use)).map(g => tr([GOODS[g].n, r1(pr.out[g] || 0), r1(pr.use[g] || 0)]))) + `<p class="small muted">Obilí: násobek ${r1(grainMult(S, p))} (mlýny, objevy), úrodnost ${TERRAIN[p.terrain].fert}. Sklizeň je hlavně v létě a na podzim.</p>`)}
    ${card(`Nepokoje: ${fmt(p.unrest)} → ${ut.val}`, tbl(["Vliv", "#Hodnota"], ut.rows.map(r => tr([r[0], `<td class="n ${r[1] > 0 ? "bad" : "good"}">${sg(r[1])}</td>`]))))}
    ${card(`Prosperita: ${fmt(p.prosp)} → ${pt.val}`, tbl(["Vliv", "#Hodnota"], pt.rows.map(r => tr([r[0], `<td class="n ${r[1] < 0 ? "bad" : "good"}">${sg(r[1])}</td>`]))))}`;
  }
  const foreign = Object.values(S.provinces).filter(x => x.owner !== "hrac").map(x => tr([esc(x.n), provOwner(x), TERRAIN[x.terrain].n, fmt(x.pop), x.res.map(r => GOODS[r].n).join(", ") || "—", x.nb.filter(n => S.provinces[n].owner === "hrac").length ? '<span class="warn">sousedí s tebou</span>' : "", x.occ === "hrac" ? '<span class="good">obsadili jsme</span>' : x.siege && x.siege.by === "hrac" ? `obléháme ${fmt(x.siege.prog)} %` : ""]));
  return `<div class="grid"><div class="card" style="grid-column:1/-1"><h3>Tvé provincie</h3>${tbl(["Provincie", "Terén", "#Obyvatel", "#Prosperita", "#Nepokoje", "#Obilí za rok / spotřeba", "Suroviny", "Stavby", "Stav"], rows)}</div>${det}${queueCard()}
  <div class="card" style="grid-column:1/-1"><h3>Cizí provincie</h3>${tbl(["Provincie", "Pán", "Terén", "#Obyvatel", "Suroviny", "Hranice", "Válka"], foreign)}</div></div>`;
}

// ---------- Hospodářství ----------
const INC_N = { sedlaci: "Daně sedláků (berně z lánů)", mestane: "Daně měst a cechů", duchovni: "Desátek a církevní dávky", slechta: "Štítné od šlechty", myto: "Mýto z cest", domeny: "Výnos panských dvorů", cesty: "Obchodní cesty", mince: "Zisk z ražby mince" };
const EXP_N = { vojsko: "Žold a výstroj vojska", rada: "Platy rádců", dvur: "Dvůr a rodina", sidlo: "Údržba sídla", uroky: "Úroky z dluhů" };
function tHosp() {
  const inc = incomeBreakdown(S), ex = expenseBreakdown(S), ti = sum(Object.values(inc)), te = sum(Object.values(ex)), need = grainNeed(S);
  const L = S.last || {};
  const lastInc = L.inc ? `<p class="small muted">Minulé období: příjem ${fmt(L.income)}, výdaje ${fmt(L.expense)}.</p>` : "";
  return `<div class="grid">
  ${card("Příjmy za období (odhad)", tbl(["Zdroj", "#Zlatých"], Object.entries(inc).map(([k, v]) => tr([INC_N[k], r1(v)]))) + `<p><b>Celkem ${fmt(ti)} zl</b> · výběrčí účinnost ${Math.round(efficiency(S) * 100)} %</p>` + lastInc)}
  ${card("Výdaje za období", tbl(["Položka", "#Zlatých"], Object.entries(ex).map(([k, v]) => tr([EXP_N[k], r1(v)]))) + `<p><b>Celkem ${fmt(te)} zl</b> · bilance <b class="${ti - te < 0 ? "bad" : "good"}">${sg(ti - te)}</b></p>`)}
  ${card("Daně podle stavů", tbl(["Stav", "Sazba", "#Věrnost", "Dopad"], ESTATE_IDS.map(e => tr([ESTATES[e].n, `<select data-a="tax" data-x='["${e}"]'>${TAX_LEVELS.map((t, i) => `<option value="${i}" ${S.tax[e] === i ? "selected" : ""}>${t}</option>`).join("")}</select>`, `<td class="n ${cls(S.estates[e].loy, 30, 60)}">${fmt(S.estates[e].loy)}</td>`, `<span class="small">věrnost ${sg(TAX_LOY[S.tax[e]])}${e === "sedlaci" ? `, nepokoje +${S.tax.sedlaci * 6}, prosperita −${S.tax.sedlaci * 5}` : ""}</span>`]))))}
  ${card("Bilance obilí", tbl(["Položka", "#Za období"], [tr(["Spotřeba lidu", r1(need.lid)]), tr(["Spotřeba vojska", r1(need.vojsko)]), tr(["Spotřeba dvora", r1(need.dvur)]), tr(["Letošní sklizeň (toto období)", provProductionAll(S)]), tr(["Zásoba", S.stock.obili]), tr(["Kapacita sýpek", grainCap(S)])]) + `<p class="small muted">Podíl roční sklizně: jaro ${SEASON_GRAIN[0]}, léto ${SEASON_GRAIN[1]}, podzim ${SEASON_GRAIN[2]}, zima 0. Na zimu je třeba mít zásoby.</p>`)}
  ${card("Dluhy a lichváři", tbl(["#Jistina", "#Úrok / obd.", "Od", ""], S.debts.map((d, i) => tr([d.amount, r1(d.amount * d.rate) + ` (${r1(d.rate * 100)} %)`, `období ${d.from}`, btn("Splatit", "repay", [i], S.money < d.amount ? "Nedostatek zlata" : null)]))) + `<div class="row">Půjčit: <input type="number" id="loanN" value="100" min="50" step="50"> ${btn("Vzít půjčku", "borrow", ["#loanN"])} <span class="small muted">úrok ${r1(loanRate(S) * 100)} % za období, strop ${fmt(maxLoan(S))} zl</span></div>`)}
  ${card("Výroba minulého období", tbl(["Zboží", "#Vyrobeno", "#Spotřebováno", "#Sklad"], GOOD_IDS.map(g => tr([GOODS[g].n, r1((L.prod || {})[g] || 0), r1((L.use || {})[g] || 0), Math.floor(S.stock[g])]))))}
  </div>`;
}

// ---------- Trh ----------
function tTrh() {
  const rows = GOOD_IDS.map(g => { const G = GOODS[g], m = S.market[g];
    return tr([G.n + (G.exotic ? ' <span class="tag">exotické</span>' : ""), Math.floor(S.stock[g]), `<td class="n">${r1(buyPrice(S, g))}</td>`, `<td class="n">${r1(sellPrice(S, g))}</td>`, `<td class="n ${m > 1.1 ? "good" : m < 0.9 ? "bad" : ""}">${m > 1.1 ? "▲ drahé" : m < 0.9 ? "▼ levné" : "• běžné"}</td>`,
      `<input type="number" id="q_${g}" value="10" min="1"> ${btn("Koupit", "buy", [g, "#q_" + g], G.exotic ? "Jen z obchodních cest" : null)} ${btn("Prodat", "sell", [g, "#q_" + g], S.stock[g] < 1 ? "Nemáš" : null)} ${btn("Prodat vše", "sell", [g, Math.floor(S.stock[g])], S.stock[g] < 1 ? "Nemáš" : null)}`]); });
  const routes = S.routes.map(r => tr([esc(r.n), r.exotic ? "dálková" : "sousedská", r.good ? GOODS[r.good].n + " +1/obd." : "—", r1(routeIncome(S, r))]));
  return `<div class="grid"><div class="card" style="grid-column:1/-1"><h3>Tržiště (ceny v zlatých za kus)</h3>${tbl(["Zboží", "#Sklad", "#Nákup", "#Prodej", "#Trh", "Obchod"], rows)}<p class="small muted">Ceny se řídí zásobou (čím víc máš, tím levněji prodáš), náhodnými výkyvy trhu a inflací (${r1(S.inflation * 100)} %). Velké obchody hýbou cenou.</p></div>
  ${card(`Obchodní cesty (${S.routes.length}/${routeLimit(S)})`, tbl(["Cesta", "Druh", "Dovoz", "#Zisk / obd."], routes) + '<p class="small muted">Sousedské cesty vznikají obchodní smlouvou (Diplomacie), dálkové výpravami (Objevy). Počet cest zvyšují tržiště, přístav a koga.</p>')}</div>`;
}

// ---------- Vojsko ----------
function provSelect(id, aid) {
  const a = S.armies.find(x => x.id === aid);
  const ok = Object.values(S.provinces).filter(p => canEnter(S, p.id)).sort((x, y) => (x.owner === "hrac" ? 0 : 1) - (y.owner === "hrac" ? 0 : 1));
  return `<select data-a="move" data-x='["${aid}"]'><option value="${a.loc}">— zůstat —</option>${ok.filter(p => p.id !== a.loc).map(p => `<option value="${p.id}" ${a.order && a.order.to === p.id ? "selected" : ""}>${esc(p.n)} (${p.owner === "hrac" ? "tvá" : esc(S.rivals[p.owner].n)})</option>`).join("")}</select>`;
}
function tVojsko() {
  if (!S.armies.some(a => a.id === SEL.army)) SEL.army = S.armies[0] && S.armies[0].id;
  const up = armyUpkeep(S, totalUnits(S));
  const armies = S.armies.map(a => {
    const p = S.provinces[a.loc], pow = playerArmyPower(S, a, true), au = armyUpkeep(S, a.units);
    const others = S.armies.filter(x => x !== a && x.loc === a.loc);
    const urows = UNIT_IDS.filter(u => a.units[u]).map(u => tr([UNITS[u].n, a.units[u], r1(UNITS[u].up * a.units[u]), `<input type="number" id="d_${a.id}_${u}" value="1" min="1" max="${a.units[u]}"> ${btn("Rozpustit", "disband", [a.id, u, "#d_" + a.id + "_" + u])} ${btn("Oddělit", "split", [a.id, u, "#d_" + a.id + "_" + u])}${others.map(o => btn("→ " + esc(o.name), "split_to", [a.id, o.id, u, "#d_" + a.id + "_" + u])).join("")}`]));
    return `<div class="card"><h3>${esc(a.name)} ${a.id === SEL.army ? "✔" : btn("vybrat pro nábor", "army", [a.id])}</h3>
      <div class="kv"><span>Poloha</span><span>${esc(p.n)} (${provOwner(p)})${a.order ? ` → ${esc(S.provinces[a.order.to].n)} (${a.order.path.length} obd.)` : ""}</span><span>Morálka</span><span class="${cls(a.morale * 100, 70, 105)}">${r1(a.morale)}</span><span>Síla (obrana)</span><span>${fmt(pow)}</span><span>Žold / obilí</span><span>${r1(au.money)} zl, ${r1(au.grain)} obilí</span>
      <span>Velitel</span><span><select data-a="cmd" data-x='["${a.id}"]'><option value="">kapitán (slabý)</option><option value="ruler" ${a.commander === "ruler" ? "selected" : ""}>panovník (válečnictví ${stat(ch(S, S.ruler), "mil")})</option><option value="marsal" ${a.commander === "marsal" ? "selected" : ""}>maršálek (${cstat(S, "marsal")})</option></select></span>
      <span>Rozkaz</span><span>${provSelect("mv_" + a.id, a.id)}</span></div>
      ${tbl(["Jednotka", "#Setnin", "#Žold", ""], urows)}
      <div class="row">${others.map(o => btn("Sloučit s " + esc(o.name), "merge", [a.id, o.id])).join("")} <input id="rn_${a.id}" value="${esc(a.name)}" size="14"> ${btn("Přejmenovat", "rename", [a.id, "#rn_" + a.id])}</div></div>`;
  }).join("");
  const sa = S.armies.find(x => x.id === SEL.army);
  const rec = UNIT_IDS.filter(u => u !== "hotovost").map(u => { const U = UNITS[u]; return tr([U.n + (U.d ? `<div class="small muted">${U.d}</div>` : ""), U.atk, U.def, tdn(U.mor), Math.round(U.cost * S.inflation), U.up, Object.entries(U.goods || {}).map(([g, q]) => q + "× " + GOODS[g].n).join(", ") || "—", U.tech ? (has(S, U.tech) ? '<span class="good">' + TECHS[U.tech].n + "</span>" : '<span class="bad">' + TECHS[U.tech].n + "</span>") : "—",
    sa ? `<input type="number" id="r_${u}" value="1" min="1"> ${btn("Naverbovat", "recruit", [u, "#r_" + u, sa.id], canRecruit(S, u, 1, sa.id))}` : ""]); });
  return `<div class="grid">${armies}
  <div class="card" style="grid-column:1/-1"><h3>Nábor${sa ? " do: " + esc(sa.name) : ""}</h3>${tbl(["Jednotka", "#Útok", "#Obrana", "#Kázeň", "#Cena", "#Žold", "Zboží", "Objev", ""], rec)}
  <div class="row">${btn("Povolat selskou hotovost", "levy")} <span class="small muted">Asi ${fmt(sum(myProvs(S).filter(p => !p.levy).map(p => Math.max(1, Math.round(p.pop / 1000 * levyMult(S))))))} setnin (podle zákona o branné povinnosti). Odvedení mužové chybí na polích: nižší sklizeň a daně. Rozpuštěním hotovosti se vrátí domů.</span></div>
  <p class="small">Celkem ${unitCount(totalUnits(S))} setnin, žold ${fmt(up.money)} zl a ${fmt(up.grain)} obilí za období.</p></div></div>`;
}
ACT.split_to = (a, b, u, n) => moveUnits(S, a, b, u, n);

// ---------- Válka ----------
function tValka() {
  const wars = S.wars.map(w => { const r = S.rivals[w.enemy], po = peaceOptions(S, w.enemy);
    return card(`Válka s ${esc(r.n)}`, `<div class="kv"><span>Stav války</span><span class="${po.score >= 0 ? "good" : "bad"}"><b>${po.score}</b> (−100 až +100)</span><span>Od</span><span>období ${w.start}</span><span>Nepřátelské vojsko</span><span>${rivalEstimate(S, r).txt}, u ${esc(S.provinces[r.loc] ? S.provinces[r.loc].n : "?")}, morálka ${r1(r.morale)}</span><span>Vyčerpání nepřítele</span><span>${fmt(r.exhaustion)}</span><span>Spojenci</span><span>${w.allies.map(a => esc(S.rivals[a].n)).join(", ") || "—"}</span><span>Nárok</span><span>${w.just ? "spravedlivá válka" : "bez nároku"}</span></div>
      <h4>Mírová jednání</h4>${po.opts.map(o => `<div>${btn(esc(o.n), "peace", [w.enemy, o.t, o.pid || null], o.ok ? null : "Soupeř by nepřijal")}</div>`).join("")}`); }).join("");
  const sieges = Object.values(S.provinces).filter(p => p.siege || p.occ).map(p => tr([esc(p.n), provOwner(p), p.occ ? (p.occ === "hrac" ? '<span class="good">obsadili jsme</span>' : `<span class="bad">obsazeno: ${esc(S.rivals[p.occ].n)}</span>`) : "", p.siege ? `${p.siege.by === "hrac" ? "obléháme" : "obléhá " + esc(S.rivals[p.siege.by].n)} – ${fmt(p.siege.prog)} %` : "", r1(fortLevel(S, p))]));
  const bat = (S.battles || []).map(b => tr([b.d, esc(b.place), esc(b.enemy), b.win ? '<span class="good">vítězství</span>' : '<span class="bad">porážka</span>', `<td class="n">${b.pA} : ${b.pB}</td>`, `<span class="small">${esc(b.myLost)}</span>`, `<span class="small">${esc(b.enLost)}</span>`, `<td class="n">${sg(b.score)}</td>`]));
  return `<div class="grid">${wars || card("Mír", "<p>Nevedeš žádnou válku. Válku vyhlásíš v záložce Diplomacie. Bez nároku je válka nespravedlivá – ztratíš prestiž, zbožnost a přízeň krále.</p>")}
  ${card("Obléhání a okupace", tbl(["Provincie", "Pán", "Okupace", "Obléhání", "#Opevnění"], sieges) + '<p class="small muted">Vojsko v nepřátelské provincii bez obránců ji obléhá. Rychlost zvyšují obléhací stroje a počet mužů, snižuje hrádek a hradby. Každá obsazená provincie dává 12 bodů stavu války.</p>')}
  <div class="card" style="grid-column:1/-1"><h3>Bitvy</h3>${tbl(["Kdy", "Kde", "Nepřítel", "Výsledek", "#Síla", "Naše ztráty", "Jejich ztráty", "#Stav války"], bat)}</div></div>`;
}

// ---------- Stavy a zákony ----------
function tPolitika() {
  const est = ESTATE_IDS.map(e => { const E = S.estates[e], t = estateTarget(S, e);
    return `<tr><td><b>${ESTATES[e].n}</b></td><td class="n ${cls(E.loy, 30, 60)}">${fmt(E.loy)}</td><td>${bar(E.loy)}</td><td class="n">${t.val}</td><td class="n">${E.infl}</td><td>${bar(E.infl, true)}</td><td><details><summary>rozpis</summary>${tbl(["Vliv", "#"], t.rows.map(r => tr([esc(r[0]), `<td class="n ${r[1] < 0 ? "bad" : "good"}">${sg(r[1])}</td>`])))}</details></td></tr>`; });
  const laws = Object.entries(LAWS).map(([l, L]) => tr([`<b>${L.n}</b><div class="small muted">${L.d}</div>`, `<select data-a="law" data-x='["${l}"]' ${(S.lawCd[l] || 0) > S.turn ? "disabled" : ""}>${L.opts.map((o, i) => `<option value="${i}" ${S.laws[l] === i ? "selected" : ""}>${o}</option>`).join("")}</select>`, `<span class="small">${ESTATE_IDS.map(e => { const v = LAW_EST[l][S.laws[l]][e]; return v ? ESTATES[e].n + " " + sg(v) : ""; }).filter(Boolean).join(", ") || "—"}</span>`, (S.lawCd[l] || 0) > S.turn ? `${S.lawCd[l] - S.turn} obd.` : "lze měnit"]));
  return `<div class="grid"><div class="card" style="grid-column:1/-1"><h3>Stavy země</h3><table><thead><tr><th>Stav</th><th class="n">Věrnost</th><th></th><th class="n">Směřuje k</th><th class="n">Vliv</th><th></th><th>Proč</th></tr></thead><tbody>${est.join("")}</tbody></table>
  <p class="small muted">Věrnost se každé období posune o pětinu k cílové hodnotě. Stav s věrností pod 25 a velkým vlivem může vyvolat krizi: šlechtickou vzpouru, interdikt, stávku měst nebo útěky sedláků. Daně nastavíš v Hospodářství.</p></div>
  <div class="card" style="grid-column:1/-1"><h3>Zákony</h3>${tbl(["Zákon", "Platí", "Vliv na stavy (nyní)", "Změna"], laws)}<p class="small muted">Změna zákona stojí ${lawChangeCost(S) / 2} legitimity a ${Math.round(lawChangeCost(S) / 3)} prestiže a další změna je možná až za 8 období.</p></div>
  ${card("Lenní pán", `<div class="kv"><span>Král</span><span>${esc(cap(S.liege.n))}</span><span>Přízeň</span><span class="${cls(S.liege.opinion, 25, 60)}">${fmt(S.liege.opinion)}</span></div><p class="small">Každý podzim král žádá berni. Nízká přízeň vede k trestné výpravě, vysoká k darům a povýšení. Válka bez nároku a odmítání služby přízeň snižují.</p>`)}</div>`;
}

// ---------- Rod a rada ----------
const statCells = c => ["dip", "mil", "spr", "uce", "int"].map(k => `<td class="n">${stat(c, k)}</td>`).join("");
const traitTxt = c => c.traits.map(t => TRAITS[t] ? TRAITS[t].n : t).join(", ") || "—";
function tDvur() {
  const R = ch(S, S.ruler), sp = ch(S, S.spouse), H = heirOf(S);
  const fam = [[R, "panovník"], [sp, "choť"]].filter(x => x[0]).map(([c, role]) => tr([`<b>${esc(c.name)}</b>`, role, c.age, `<td class="n ${cls(c.health, 35, 70)}">${fmt(c.health)}</td>`, statCells(c), traitTxt(c), ""]));
  const kids = S.children.map(id => ch(S, id)).filter(Boolean).map(c => tr([esc(c.name) + (H && H.id === c.id ? " ♛" : ""), c.sex === "m" ? "syn" : "dcera", c.age, `<td class="n">${fmt(c.health)}</td>`, statCells(c), traitTxt(c),
    (c.married ? `oddán(a): ${esc(c.spouseName)}` : "") + (c.age < 16 ? ` <select data-a="focus" data-x='["${c.id}"]'><option value="">výchova: volná</option>${[["dip", "diplomacie"], ["mil", "válečnictví"], ["spr", "správa"], ["uce", "učenost"], ["int", "intriky"]].map(([k, n]) => `<option value="${k}" ${c.focus === k ? "selected" : ""}>${n}</option>`).join("")}</select>` : "")]));
  const council = COUNCIL_IDS.map(k => { const c = councillor(S, k); return tr([`<b>${COUNCIL[k].n}</b><div class="small muted">${COUNCIL[k].d}</div>`, c ? esc(c.name) : '<span class="bad">neobsazeno</span>', c ? `<td class="n">${stat(c, COUNCIL[k].stat)}</td>` : "", c ? `<td class="n ${cls(c.loyalty, 30, 70)}">${fmt(c.loyalty)}</td>` : "", c ? ESTATES[c.estate] ? ESTATES[c.estate].n : c.estate : "", c ? salary(c) : "", c ? btn("Odvolat", "dismiss", [k]) : ""]); });
  const court = S.courtiers.map(id => ch(S, id)).filter(Boolean).map(c => tr([esc(c.name), c.age, ESTATES[c.estate] ? ESTATES[c.estate].n : c.estate, statCells(c), traitTxt(c), `<select data-a="appoint_sel" data-x='["${c.id}"]'><option value="">jmenovat…</option>${COUNCIL_IDS.map(k => `<option value="${k}">${COUNCIL[k].n}</option>`).join("")}</select>`]));
  return `<div class="grid"><div class="card" style="grid-column:1/-1"><h3>Rod ${esc(S.dynasty)}</h3>${tbl(["Jméno", "Role", "#Věk", "#Zdraví", "#Dipl.", "#Válka", "#Správa", "#Učen.", "#Intr.", "Vlastnosti", ""], fam.concat(kids))}
  <p class="small muted">Nástupnictví: ${LAWS.nastupnictvi.opts[S.laws.nastupnictvi]}. Dědic: ${H ? esc(H.name) : '<span class="bad">žádný</span>'}. Do 16 let lze potomkům určit výchovu. Sňatky potomků s rody sousedů dohodneš v Diplomacii.</p>
  ${S.dead.length ? `<details><summary>Zesnulí (${S.dead.length})</summary>${tbl(["Jméno", "Zemřel(a)", "#Věk"], S.dead.slice().reverse().map(d => tr([esc(d.n) + (d.ruler ? " ♛" : ""), d.d, d.age])))}</details>` : ""}</div>
  <div class="card" style="grid-column:1/-1"><h3>Královská rada</h3>${tbl(["Úřad", "Držitel", "#Schopnost", "#Věrnost", "Stav", "#Plat", ""], council)}<p class="small muted">Rádce ze stavu zvyšuje věrnost toho stavu (+6). Odvolání rádce jeho stav rozladí.</p></div>
  <div class="card" style="grid-column:1/-1"><h3>Dvořané</h3>${tbl(["Jméno", "#Věk", "Stav", "#Dipl.", "#Válka", "#Správa", "#Učen.", "#Intr.", "Vlastnosti", ""], court)}<p class="small muted">Nové dvořany pozveš činem panovníka „Pozvat nové dvořany“.</p></div></div>`;
}
ACT.appoint_sel = (cid, seat) => (seat ? appoint(S, seat, cid) : null);

// ---------- Diplomacie ----------
function tDiplo() {
  const rows = aliveRivals(S).map(r => { const R = ch(S, r.ruler), est = rivalEstimate(S, r), w = atWarWith(S, r.id);
    const flags = [r.alliance ? '<span class="good">spojenec</span>' : "", r.trade ? "obchod" : "", r.marriage ? "spřízněni sňatkem" : "", r.truce > S.turn ? `příměří ${r.truce - S.turn} obd.` : "", w ? '<span class="bad">VÁLKA</span>' : "", S.claims[r.id] ? '<span class="warn">máš nárok</span>' : "", borders(S, r.id) ? "soused" : ""].filter(Boolean).join(", ");
    return tr([`<b>${esc(r.n)}</b>`, `${esc(r.title)} ${esc(R.name)} (${R.age})<div class="small muted">${traitTxt(R)}</div>`, `<td class="n ${cls(r.attitude, -20, 30)}">${fmt(r.attitude)}</td>`, est.txt + (est.exact ? "" : " ?"), `<td class="n">${est.exact ? fmt(r.treasury) : "?"}</td>`, rivalProvs(S, r.id).length, flags,
      `<select id="dp_${r.id}">${Object.entries(DIP).map(([k, d]) => `<option value="${k}">${d.n}</option>`).join("")}</select> ${btn("Provést", "dip", [r.id, "#dp_" + r.id], r.lastDip === S.turn ? null : null)}`]); });
  const kids = unmarriedChildren(S);
  return `<div class="grid"><div class="card" style="grid-column:1/-1"><h3>Sousední mocnosti</h3>${tbl(["Země", "Vládce", "#Vztah", "Vojsko", "#Pokladna", "#Provincie", "Vztahy", "Jednání"], rows)}
  <p class="small muted">Každé zemi lze poslat jedno poselstvo za období (zvědové a intriky mimo tento limit). Úspěch závisí na diplomacii panovníka a kancléře, intriky na mistru šeptů. ${kids.length ? "Sňatek: nejstarší svobodný potomek je " + esc(kids[0].name) + "." : "Pro sňatek potřebuješ svobodného potomka starého aspoň 10 let."}</p></div>
  ${card("Zprávy ze světa", S.log.filter(l => l.cat === "svet" || l.cat === "diplomacie" || l.cat === "intriky").slice(0, 15).map(l => `<div class="small"><span class="tag">${SEASONS[l.se]} ${l.y}</span>${esc(l.txt)}</div>`).join("") || '<span class="muted">Zatím nic.</span>')}</div>`;
}

// ---------- Objevy ----------
function tObjevy() {
  const cur = S.research.cur, rate = researchRate(S);
  const cats = [...new Set(TECH_IDS.map(t => TECHS[t].cat))];
  const tabs = cats.map(c => card(c, tbl(["Objev", "Účinek", "#Cena", "Předpoklady", ""], TECH_IDS.filter(t => TECHS[t].cat === c).map(t => { const T = TECHS[t];
    return tr([S.techs[t] ? `<span class="good">✔ ${T.n}</span>` : cur === t ? `<b>▶ ${T.n}</b>` : T.n, `<span class="small">${T.d}</span>`, T.cost, (T.req || []).map(r => (S.techs[r] ? '<span class="good">' : '<span class="bad">') + TECHS[r].n + "</span>").join(", ") || "—", S.techs[t] ? "" : cur === t ? `${fmt(S.research.pts)}/${T.cost}` : btn("Zkoumat", "research", [t], techAvailable(S, t) ? null : "Chybí předpoklady")]); })))).join("");
  const ex = Object.entries(EXPEDITIONS).map(([id, E]) => { const on = S.expeditions.find(x => x.id === id);
    return tr([E.n, `<span class="small">${E.d}</span>`, E.cost, E.time + " obd.", Math.round((E.chance + (has(S, "portolan") ? 0.2 : 0)) * 100) + " %", (E.req || []).map(r => (S.techs[r] ? '<span class="good">' : '<span class="bad">') + TECHS[r].n + "</span>").join(", ") || "—", on ? `<span class="warn">na cestě (${on.left})</span>` : S.expDone[id] && id !== "knihy" && id !== "hory" ? '<span class="good">probádáno</span>' : btn("Vyslat", "exped", [id])]); });
  return `<div class="grid">${card("Učenost", `<div class="kv"><span>Zkoumá se</span><span>${cur ? TECHS[cur].n + ` – ${fmt(S.research.pts)}/${TECHS[cur].cost}` : '<span class="bad">nic</span>'}</span><span>Přírůstek</span><span>${rate} bodů za období</span><span>Zdroje</span><span class="small">panovník (učenost), kaplan, knihovna, kostely, univerzita, knihtisk</span><span>Objeveno</span><span>${Object.keys(S.techs).length} z ${TECH_IDS.length}</span></div>`)}
  ${tabs}<div class="card" style="grid-column:1/-1"><h3>Výpravy do neznáma</h3>${tbl(["Kraj", "Co přinese", "#Cena", "Doba", "Šance", "Potřeba", ""], ex)}<p class="small muted">Námořní výpravy potřebují přístav.</p></div></div>`;
}

// ---------- Kronika ----------
const LOGCATS = { "": "vše", rod: "rod", politika: "politika", hospodarstvi: "hospodářství", obchod: "obchod", stavby: "stavby", vojsko: "vojsko", valka: "válka", diplomacie: "diplomacie", intriky: "intriky", objevy: "objevy", udalosti: "události", panovnik: "činy", svet: "svět" };
function tKronika() {
  const l = S.log.filter(x => !SEL.logCat || x.cat === SEL.logCat).slice(0, 300);
  return `<div class="card"><h3>Kronika rodu ${esc(S.dynasty)}</h3><div class="row">${Object.entries(LOGCATS).map(([k, n]) => btn(SEL.logCat === k ? `<b>${n}</b>` : n, "logcat", [k])).join("")}</div>
  <div class="log">${l.map(x => `<div><span class="tag">${SEASONS[x.se]} ${x.y}</span><span class="tag">${LOGCATS[x.cat] || x.cat}</span>${esc(x.txt)}</div>`).join("")}</div></div>`;
}

// ---------- Hra ----------
function tHra() {
  const slots = [1, 2, 3, 4, 5].map(n => { const i = slotInfo(n); return tr([n, i ? esc(i) : '<span class="muted">prázdná</span>', btn("Uložit", "save", [n]) + btn("Načíst", "load", [n], i ? null : "Prázdná") + btn("Smazat", "del", [n], i ? null : "Prázdná")]); });
  return `<div class="grid">${card("Uložené hry", tbl(["#", "Obsah", ""], slots) + `<p class="small muted">Hra se po každém kroku sama ukládá v prohlížeči.</p><div class="row">${btn("Stáhnout uloženou hru (soubor)", "exportSave")} ${btn("Nahrát ze souboru", "importSave")}</div>`)}
  ${card("Nová hra", `<div class="kv"><span>Panství</span><input id="ngRealm" value="Panství Vranovské"><span>Panovník</span><input id="ngRuler" value="Bořivoj"><span>Rod</span><input id="ngDyn" value="Vranovští"><span>Semínko náhody</span><input id="ngSeed" type="number" placeholder="náhodné"></div><div class="row">${btn("Začít novou hru", "newgame")}</div>`)}
  ${card("Vzhled", btn("Přepnout světlý / tmavý vzhled", "theme"))}
  <div class="card help" style="grid-column:1/-1"><h3>Jak hrát</h3>
  <p>Vládneš feudálnímu panství v letech ${START_YEAR}–${END_YEAR}. Každé kolo je jedno roční období. Rozhodni, co chceš, a stiskni <b>Konec období</b>. Cílem je stát se králem (hraběte, vévody a nakonec koruny dosáhneš v Přehledu) nebo přečkat sto let s co nejvyšším skóre.</p>
  <h4>Hospodářství</h4><p>Obilí se sklízí hlavně v létě a na podzim, jí se po celý rok. Hlad snižuje počet obyvatel, morálku a zvedá nepokoje. Peníze plynou z daní stavů, mýta, obchodu a panských dvorů. Stavby stojí zlato, dřevo a kámen – co chybí, nakup na trhu. Přebytky (železo, víno, sůl, sukno) prodávej.</p>
  <h4>Stavy a zákony</h4><p>Šlechta, duchovenstvo, měšťané a sedláci mají věrnost a vliv. Vysoké daně a tvrdé zákony dávají peníze, ale věrnost klesá. Nevěrný a vlivný stav vyvolá krizi. Rádci ze stavu jej uklidňují.</p>
  <h4>Válka</h4><p>Vyhlas válku sousedovi (nejlépe s nárokem od kancléře), přesuň vojsko do jeho provincie a obléhej. Bitvy se odehrají, když se vojska potkají. Stav války roste vítězstvími a obsazenými provinciemi; podle něj si diktuješ mír – odškodné, provincie, nebo podrobení celé země.</p>
  <h4>Rod</h4><p>Panovník stárne a umírá. Zajisti si choť a dědice, vychovávej potomky a žeň je s rody sousedů – sňatky zlepšují vztahy. Když rod vymře, hra končí.</p>
  <h4>Objevy</h4><p>Učenost z kaplana, knihovny a kostelů odemyká zemědělské, řemeslné, správní a válečné objevy. Výpravy do neznáma přinášejí ložiska, dálkový obchod a slávu.</p></div></div>`;
}

// ---------- start ----------
function boot() {
  try { const t = localStorage.getItem("panovnik_theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  try { const t = localStorage.getItem("panovnik_auto"); if (t) S = JSON.parse(t); } catch (e) { S = null; }
  if (!S || !S.provinces) S = newGame();
  const f = document.createElement("input"); f.type = "file"; f.id = "impFile"; f.accept = ".json,application/json"; f.style.display = "none"; f.onchange = () => f.files[0] && importFile(f.files[0]); document.body.appendChild(f);
  render();
}
if (typeof document !== "undefined") document.addEventListener("DOMContentLoaded", boot);
</script>
</body>
</html>

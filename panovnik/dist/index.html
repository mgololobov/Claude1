<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panovník</title>
<style>
:root {
  --bg: #f3ecdc; --panel: #fbf7ee; --ink: #2b2118; --muted: #7a6a58; --line: #d9ccb4; --accent: #7a2e1d; --accent2: #2f5d50;
  --good: #2f6b2f; color-scheme: light; --bad: #a3271b; --warn: #a86b12; --head: #e8dcc2; --btn: #efe4cc; --btnh: #e2d3b2;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1d1915; --panel: #26211b; --ink: #ece2d0; --muted: #a8977f; --line: #3d342a; --accent: #d9774f; --accent2: #6fb39f;
  --good: #7fc37f; --bad: #ef7b6c; --warn: #e3ac55; --head: #312a22; --btn: #342c23; --btnh: #43392d; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #1d1915; --panel: #26211b; --ink: #ece2d0; --muted: #a8977f; --line: #3d342a; --accent: #d9774f; --accent2: #6fb39f;
  --good: #7fc37f; --bad: #ef7b6c; --warn: #e3ac55; --head: #312a22; --btn: #342c23; --btnh: #43392d; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 Georgia, "Times New Roman", serif; }
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel); border-bottom: 2px solid var(--accent); padding: 6px max(16px, env(safe-area-inset-right, 0px)) 6px max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; }
header .realm { font-size: 17px; font-weight: bold; color: var(--accent); margin-right: 8px; }
header .st { white-space: nowrap; } header .st b { font-variant-numeric: tabular-nums; }
header .sp { flex: 1; }
nav { display: flex; flex-wrap: wrap; gap: 2px; padding: 6px max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--line); background: var(--bg); }
nav button { border: 1px solid var(--line); border-bottom: none; background: var(--btn); color: var(--ink); padding: 5px 10px; border-radius: 6px 6px 0 0; cursor: pointer; font: inherit; }
nav button.on { background: var(--panel); font-weight: bold; color: var(--accent); }
main { padding: 12px max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px)); max-width: 1400px; margin: 0 auto; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); align-items: start; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; overflow-x: auto; }
.card h3 { margin: 0 0 8px; font-size: 15px; color: var(--accent); border-bottom: 1px solid var(--line); padding-bottom: 4px; }
.card h4 { margin: 10px 0 4px; font-size: 14px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { border-bottom: 1px solid var(--line); padding: 3px 6px; text-align: left; vertical-align: top; }
th { background: var(--head); font-weight: bold; position: sticky; top: 0; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.sel td { background: var(--head); }
.good { color: var(--good); } .bad { color: var(--bad); } .warn { color: var(--warn); } .muted { color: var(--muted); } .small { font-size: 12px; }
button.b, select, input { font: inherit; font-size: 13px; }
button.b { background: var(--btn); color: var(--ink); border: 1px solid var(--line); border-radius: 5px; padding: 2px 8px; cursor: pointer; margin: 1px; }
button.b:hover:not(:disabled) { background: var(--btnh); } button.b:disabled { opacity: .45; cursor: default; }
button.main { background: var(--accent); color: #fff; border: none; border-radius: 6px; padding: 6px 14px; font-weight: bold; cursor: pointer; font: inherit; }
button.main:disabled { opacity: .5; }
select, input { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 2px 4px; }
input[type=number] { width: 62px; }
.bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; min-width: 60px; }
.bar > i { display: block; height: 100%; background: var(--accent2); }
.bar.red > i { background: var(--bad); } .bar.yel > i { background: var(--warn); }
.log { max-height: 70vh; overflow-y: auto; }
.log div { border-bottom: 1px dotted var(--line); padding: 2px 0; }
.tag { display: inline-block; font-size: 11px; padding: 0 5px; border-radius: 8px; background: var(--head); color: var(--muted); margin-right: 4px; }
#modal { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 20; display: flex; align-items: center; justify-content: center; padding: 16px; }
#modal.hidden { display: none; }
#modal .box { background: var(--panel); border: 2px solid var(--accent); border-radius: 10px; max-width: 560px; width: 100%; padding: 16px 18px; max-height: 90vh; overflow-y: auto; }
#modal h2 { margin: 0 0 8px; color: var(--accent); }
#modal .ch { display: block; width: 100%; text-align: left; margin: 6px 0; padding: 7px 10px; }
#toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 6px; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 30; max-width: 90vw; }
#toast.on { opacity: .95; }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 4px 0; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; }
.kv > :nth-child(odd) { color: var(--muted); }
details summary { cursor: pointer; color: var(--accent2); }
.help p { margin: 4px 0 8px; } .help h4 { color: var(--accent); }
.wide { grid-column: 1 / -1; }
.tw { overflow-x: auto; max-width: 100%; }
.card { min-width: 0; }
.grid.map2 { grid-template-columns: minmax(0, 2fr) minmax(280px, 1fr); }
.grid.map2 > .wide:first-child { grid-column: auto; }
svg.map { width: 100%; height: auto; display: block; background: var(--head); border-radius: 6px; }
svg.map .edge { stroke: var(--line); stroke-width: 1; }
svg.map .edge.same { stroke: var(--muted); stroke-opacity: .45; stroke-width: 1.6; }
svg.map circle { stroke: var(--panel); stroke-width: 1; cursor: pointer; }
svg.map circle.mine { stroke: var(--ink); stroke-width: 2.2; }
svg.map circle.war { stroke: var(--bad); stroke-width: 2.2; }
svg.map circle.capc { stroke-dasharray: 2 1.5; }
svg.map circle.siege { fill: none; stroke: var(--bad); stroke-dasharray: 3 2; stroke-width: 1.5; pointer-events: none; }
svg.map .pv.sel circle:first-of-type { stroke: var(--accent); stroke-width: 3; }
svg.map .lbl { font-size: 8.5px; fill: var(--muted); pointer-events: none; font-family: Georgia, serif; }
svg.map .lbl.lm { fill: var(--ink); font-weight: bold; }
svg.map .army { stroke: var(--ink); stroke-width: .8; }
.chip { display: inline-block; padding: 0 6px 0 4px; border-radius: 9px; font-size: 12px; background: var(--head); border-left: 6px solid var(--c); margin: 1px 2px; white-space: nowrap; }
.legend { line-height: 1.9; }
.lg { border-bottom: 1px dotted var(--line); padding: 2px 0; font-size: 13px; }
a.lnk { color: var(--accent2); cursor: pointer; text-decoration: underline dotted; }
.realm { border-left: 8px solid var(--c); padding-left: 6px; }
button.b.go { background: var(--accent2); color: #fff; border-color: transparent; }
button.b.danger { color: var(--bad); }
.provpick { margin-bottom: 8px; }
@media (max-width: 900px) { .grid.map2 { grid-template-columns: 1fr; } }
@media (max-width: 600px) { .grid { grid-template-columns: 1fr; } header { font-size: 13px; } }

/* --- grafika: erby, dlaždice, pruhy, grafy, mapa, rodokmen --- */
.shield { vertical-align: middle; flex: none; }
.chip { border-left: none; padding: 0 7px 0 3px; display: inline-flex; align-items: center; gap: 4px; }
.realm { display: inline-flex; align-items: center; gap: 8px; border-left: none; padding-left: 0; }
nav button { display: inline-flex; align-items: center; gap: 5px; }
.ico { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 12px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; min-width: 0; display: flex; flex-direction: column; justify-content: space-between; }
.tile .tl { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.tile .tv { font-size: 24px; font-weight: bold; font-variant-numeric: tabular-nums; line-height: 1.2; }
.tile .tv small { font-size: 14px; color: var(--muted); }
.tile .ts { font-size: 12px; color: var(--muted); }
.tile .tsp { margin-top: 4px; } .tile .spark { width: 100%; height: 26px; display: block; }
.crest { display: flex; gap: 12px; align-items: center; margin-bottom: 8px; }
.crest .big { font-size: 18px; font-weight: bold; color: var(--accent); }
.alert { padding: 4px 8px; border-left: 4px solid var(--line); margin: 3px 0; background: var(--head); border-radius: 0 4px 4px 0; font-size: 13px; }
.alert.bad { border-color: var(--bad); } .alert.warn { border-color: var(--warn); } .alert.info { border-color: var(--accent2); } .alert.good { border-color: var(--good); }
td.sb { min-width: 52px; }
.sbv { display: inline-block; min-width: 44px; text-align: right; padding: 0 4px; border-radius: 3px; background: linear-gradient(90deg, color-mix(in srgb, var(--accent2) 35%, transparent) var(--v), transparent var(--v)); }
td.sb.low .sbv { background: linear-gradient(90deg, color-mix(in srgb, var(--bad) 40%, transparent) var(--v), transparent var(--v)); }
.meter { display: grid; grid-template-columns: 110px 1fr auto; gap: 8px; align-items: center; font-size: 13px; margin: 3px 0; }
.meter .ml { color: var(--muted); } .meter .mv { font-variant-numeric: tabular-nums; font-size: 12px; }
.meter .mt { height: 9px; background: var(--line); border-radius: 5px; overflow: hidden; } .meter .mt i { display: block; height: 100%; background: var(--accent2); border-radius: 5px; }
.tbar { display: flex; height: 12px; border-radius: 4px; overflow: hidden; min-width: 90px; background: var(--line); margin: 4px 0; } .tbar i { display: block; height: 100%; }
.tleg { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: var(--muted); margin: 2px 0 6px; } .tleg i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
td.wbar { min-width: 110px; }
svg.chart { width: 100%; height: auto; display: block; margin: 0 auto; }
svg.chart .grid { stroke: var(--line); stroke-width: 1; }
svg.chart .ax { font-size: 10px; fill: var(--muted); font-family: Georgia, serif; }
svg.chart .lbl2 { fill: var(--ink); }
.relbar { display: inline-block; width: 60px; height: 8px; background: var(--line); border-radius: 4px; position: relative; vertical-align: middle; margin-left: 4px; }
.relbar i { position: absolute; top: 0; bottom: 0; border-radius: 4px; } .relbar b { position: absolute; top: -2px; bottom: -2px; width: 1px; background: var(--ink); }
.pill { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 8px; background: var(--head); margin: 1px 2px 1px 0; white-space: nowrap; }
.pill.good { color: var(--good); } .pill.bad { color: var(--bad); }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--head); }
td.shc { width: 24px; }
.grid.split { grid-template-columns: minmax(0, 3fr) minmax(300px, 2fr); }
.card.sticky { position: sticky; top: 64px; align-self: start; }
@media (max-width: 900px) { .grid.split { grid-template-columns: 1fr; } .card.sticky { position: static; } }
svg.map .sea { fill: var(--head); }
svg.map .road { stroke: rgba(0,0,0,.18); stroke-width: .8; stroke-dasharray: 2 2; }
svg.map .hit { fill: transparent; cursor: pointer; }
svg.map .castle { stroke: rgba(0,0,0,.7); stroke-width: 1; }
svg.map .castle.mine { stroke: var(--ink); stroke-width: 2; }
svg.map .castle.war { stroke: var(--bad); stroke-width: 2; }
svg.map .capm { stroke: rgba(0,0,0,.8); stroke-width: 1; }
svg.map .selring { fill: none; stroke: var(--accent); stroke-width: 2.5; }
svg.map .realmname { font-size: 11px; letter-spacing: .14em; fill: rgba(0,0,0,.45); font-weight: bold; pointer-events: none; font-family: Georgia, serif; }
svg.map .lbl { font-size: 9px; fill: var(--ink); paint-order: stroke; stroke: var(--panel); stroke-width: 2.5px; stroke-linejoin: round; }
svg.map .lbl.lm { font-weight: bold; }
svg.map .army line { stroke: var(--ink); stroke-width: 1.2; } svg.map .army path { stroke: var(--ink); stroke-width: .6; }
.tree { display: flex; flex-direction: column; align-items: center; gap: 0; }
.tree .gen { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.tree .stem { width: 2px; height: 18px; background: var(--line); }
.fam { border: 1px solid var(--line); border-top: 4px solid var(--accent2); border-radius: 6px; padding: 6px 10px; min-width: 150px; max-width: 220px; background: var(--panel); }
.fam.f { border-top-color: #a85e7f; } .fam.empty { color: var(--muted); border-style: dashed; display: flex; align-items: center; justify-content: center; }
.fam .fn { font-weight: bold; }
.minis { display: flex; gap: 3px; align-items: flex-end; height: 30px; margin: 4px 0; }
.minis span { width: 10px; height: 28px; background: var(--line); display: flex; align-items: flex-end; border-radius: 2px; }
.minis span i { display: block; width: 100%; background: var(--accent2); border-radius: 2px; }
.lg.c-valka { border-left: 3px solid var(--bad); padding-left: 5px; } .lg.c-rod { border-left: 3px solid #a85e7f; padding-left: 5px; } .lg.c-rise, .lg.c-cirkev { border-left: 3px solid #7a5ea8; padding-left: 5px; }
</style>

<script>
"use strict";
// Pravidla a číselníky: měsíce, terén, vojsko, hodnosti, rozkazy, budovy, objevy, zákony, stavy.
const MONTHS = ["Leden", "Únor", "Březen", "Duben", "Květen", "Červen", "Červenec", "Srpen", "Září", "Říjen", "Listopad", "Prosinec"];
const MONTHS2 = ["ledna", "února", "března", "dubna", "května", "června", "července", "srpna", "září", "října", "listopadu", "prosince"];
const START_YEAR = 1256;

const TERRAIN = {
  n: { n: "Nížina", agri: 1.2, def: 1.0, cav: 1.25, move: 1 },

// Druhy vojska (počty v mužích). atk/def za 100 mužů.

  zoldneri: { n: "Žoldnéři", atk: 1.6, def: 1.6, cost: 30, up: 3, goods: {} },

const TROOP_IDS = Object.keys(TROOPS);

// Hodnosti vazalů: limit velení (mužů), měsíční plat, potřebné zásluhy
const RANKS = [
  { n: "Panoš", cmd: 1000, pay: 1, merit: 0 },
  { n: "Rytíř", cmd: 2000, pay: 2, merit: 60 },
  { n: "Pán", cmd: 3500, pay: 4, merit: 180 },
  { n: "Hrabě", cmd: 6000, pay: 7, merit: 400 },

];

const STATS = { ved: "Vůdcovství", uda: "Udatnost", roz: "Rozum", spr: "Správa" };
const STAT_IDS = Object.keys(STATS);

const TRAITS = {
  stateny: { n: "Statečný", uda: 8 }, zbabely: { n: "Zbabělý", uda: -10 },
  moudry: { n: "Moudrý", roz: 8 }, prchlivy: { n: "Prchlivý", roz: -5, uda: 4 },
  lstivy: { n: "Lstivý", roz: 5, loy: -5 }, verny: { n: "Věrný", loy: 15 },
  ctizadostivy: { n: "Ctižádostivý", ved: 4, loy: -10 }, skromny: { n: "Skromný", loy: 8 },
  zbozny: { n: "Zbožný", spr: 2 }, lakomy: { n: "Lakomý", spr: 4, loy: -4 },
  stedry: { n: "Štědrý" }, kruty: { n: "Krutý", ved: 3 },
  hospodar: { n: "Dobrý hospodář", spr: 10 }, vojevudce: { n: "Rozený vojevůdce", ved: 10 },
  diplomat: { n: "Diplomat", roz: 6 }, nemocny: { n: "Neduživý" }, silny: { n: "Silák", uda: 6 },
};
const TRAIT_IDS = Object.keys(TRAITS);

// Rozkazy vazalům (jeden za měsíc)
const CMDS = {
  zemedelstvi: { n: "Rozvoj polí", d: "zvýší zemědělství kraje", cost: 30, stat: "spr" },
  obchod: { n: "Rozvoj trhů a řemesel", d: "zvýší obchod kraje", cost: 30, stat: "spr" },
  hradby: { n: "Opravit opevnění", d: "zvýší stav hradeb", cost: 25, stat: "spr" },
  nabor: { n: "Verbovat vojsko", d: "naverbuje muže z obyvatel kraje", cost: 0, stat: "ved" },
  vycvik: { n: "Výcvik posádky", d: "zvýší výcvik", cost: 5, stat: "ved" },
  lid: { n: "Péče o lid", d: "rozdá obilí, zvýší spokojenost", cost: 0, stat: "spr" },
  hledat: { n: "Hledat schopné muže", d: "hledá potulné rytíře a učence v kraji", cost: 10, stat: "roz" },
  studium: { n: "Podporovat učence", d: "body učenosti pro objevy", cost: 20, stat: "roz" },
  stavba: { n: "Řídit stavbu", d: "zahájí stavbu v kraji", cost: 0, stat: "spr" },
  zvedy: { n: "Vyzvědět kraj", d: "zjistí přesný stav cizího kraje", cost: 10, stat: "roz" },
  podnecovat: { n: "Podněcovat nepokoje", d: "sníží spokojenost a posádku v cizím kraji", cost: 40, stat: "roz" },
  naklonit: { n: "Naklonit si cizího vazala", d: "úplatky a sliby – sníží jeho věrnost, případně přejde k tobě", cost: 50, stat: "roz" },
  poselstvo: { n: "Vést poselstvo", d: "diplomatické jednání s jiným rodem", cost: 0, stat: "roz" },
  presun: { n: "Odjet do jiného kraje", d: "přesun vazala (dorazí příští měsíc)", cost: 0, stat: null },
};

// Stavby v kraji: cena (zlato), doba v měsících, max. úroveň
const BUILD = {
  hrad: { n: "Hrad (zvýšit úroveň)", cost: 300, time: 6, max: 5, d: "silnější obrana, delší obléhání, vyšší strop hradeb" },
  mesto: { n: "Lokace města", cost: 200, time: 4, max: 3, d: "+25 stropu obchodu, +obyvatelé, měšťané (německé právo)" },
  klaster: { n: "Klášter", cost: 180, time: 5, max: 2, d: "+učenost, +spokojenost lidu, +přízeň papeže" },
  dul: { n: "Důl / solivar", cost: 220, time: 5, max: 3, need: p => p.res.some(r => ["stribro", "zelezo", "sul"].includes(r)), d: "výnos podle suroviny (stříbro, železo – zbroj, sůl)" },
  hrebcin: { n: "Hřebčín", cost: 160, time: 4, max: 2, need: p => p.ter !== "h", d: "+5 koní měsíčně za úroveň" },
  pristav: { n: "Přístav", cost: 250, time: 6, max: 2, need: p => p.ter === "p", d: "+20 stropu obchodu, obchod po moři" },
  vinice: { n: "Vinice", cost: 120, time: 4, max: 2, need: p => p.res.includes("vino"), d: "+obchod, víno pro dvůr (+prestiž)" },
};
const RES = { stribro: "stříbro", zelezo: "železo", sul: "sůl", vino: "víno" };

const GOODS = { obili: { n: "Obilí", base: 1.2 }, kone: { n: "Koně", base: 6 }, zbroj: { n: "Zbroj a zbraně", base: 5 } };

const TECHS = {
  trojpole: { n: "Trojpolní hospodaření", cat: "Zemědělství", cost: 60, d: "+10 % sklizně" },

// Jádro: náhoda, postavy, založení světa, pomocné výpočty.
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const r1 = v => Math.round(v * 10) / 10;
const sum = a => a.reduce((x, y) => x + y, 0);
function rnd(s) { let t = (s.seed = (s.seed + 0x6D2B79F5) | 0); t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
const chance = (s, p) => rnd(s) < p;
const rint = (s, a, b) => a + Math.floor(rnd(s) * (b - a + 1));
const pick = (s, a) => a[Math.floor(rnd(s) * a.length)];
const cap = t => (t ? t.charAt(0).toUpperCase() + t.slice(1) : "");
const dateStr = s => MONTHS[s.month] + " " + s.year;
const pairKey = (a, b) => (a < b ? a + "|" + b : b + "|" + a);

function log(s, txt, cat = "obecne", clans) { s.log.unshift({ y: s.year, m: s.month, txt, cat, cl: clans || null }); if (s.log.length > 1500) s.log.length = 1500; }
// zpráva, která se týká hráče (nebo je důležitá pro svět)
function news(s, txt, cat, clans) { log(s, txt, cat, clans); }

// ---------- postavy ----------
const age = (s, c) => s.year - c.by;
function st(c, k) { if (!c) return 0; let v = c[k] || 0; for (const t of c.traits || []) v += (TRAITS[t] && TRAITS[t][k]) || 0; return clamp(v, 1, 100); }
const chr = (s, id) => (id ? s.chars[id] : null);
function genName(s, cul, sex) {
  const N = NAMES[cul] || NAMES.de;
  if (sex === "f") return pick(s, FEMALE[cul] || FEMALE.de) + " " + pick(s, N.s);
  return pick(s, N.m) + " " + pick(s, N.s);
}
function makeChar(s, o) {
  const c = Object.assign({ id: "c" + s.nextId++, n: "?", sex: "m", by: START_YEAR - 30, cl: null, st: "off", loc: null, ved: 40, uda: 40, roz: 40, spr: 40, traits: [], loy: 70, rank: 0, merit: 0, c: 0, dyn: 0, father: null, spouse: null, kids: [], hp: rint(s, 60, 95), acted: -1 }, o);
  s.chars[c.id] = c; return c;
}
function genOfficer(s, cl, cul, loc, o = {}) {
  const base = () => rint(s, 22, 66);
  const c = makeChar(s, Object.assign({ n: genName(s, cul, "m"), by: START_YEAR - rint(s, 18, 55), cl, loc, ved: base(), uda: base(), roz: base(), spr: base(), loy: rint(s, 50, 85), rank: pick(s, [0, 0, 1, 1, 1, 2, 2, 3]) }, o));
  const k = pick(s, STAT_IDS); c[k] = clamp(c[k] + rint(s, 12, 32), 1, 98);
  const nt = rint(s, 0, 2); for (let i = 0; i < nt; i++) { const t = pick(s, TRAIT_IDS); if (!c.traits.includes(t)) c.traits.push(t); }
  c.merit = RANKS[c.rank].merit + rint(s, 0, 40);
  return c;
}

// ---------- dotazy ----------
const clanProvs = (s, cid) => Object.values(s.provs).filter(p => p.owner === cid);
const officers = (s, cid) => Object.values(s.chars).filter(c => c.cl === cid && c.st === "off");
const officersIn = (s, pid) => Object.values(s.chars).filter(c => c.st === "off" && c.loc === pid && c.cl === s.provs[pid].owner);
const aliveClans = s => Object.values(s.clans).filter(c => c.alive);
const men = t => (t ? sum(TROOP_IDS.map(k => t[k] || 0)) : 0);
const P = s => s.clans[s.player];
const isPlayer = (s, cid) => cid === s.player;
const leaderOf = (s, cid) => chr(s, s.clans[cid].leader);
const clanName = (s, cid) => (s.clans[cid] ? s.clans[cid].n : cid);
const rel = (s, a, b) => (a === b ? 100 : (s.clans[a].rel[b] || 0));
function addRel(s, a, b, v) { if (a === b || !s.clans[a] || !s.clans[b]) return; s.clans[a].rel[b] = clamp((s.clans[a].rel[b] || 0) + v, -100, 100); s.clans[b].rel[a] = clamp((s.clans[b].rel[a] || 0) + v, -100, 100); }
const atWar = (s, a, b) => s.wars.some(w => (w.a === a && w.b === b) || (w.a === b && w.b === a));
const enemiesOf = (s, a) => s.wars.filter(w => w.a === a || w.b === a).map(w => (w.a === a ? w.b : w.a));
const allied = (s, a, b) => !!s.alliances[pairKey(a, b)];
const truceUntil = (s, a, b) => s.truces[pairKey(a, b)] || 0;
const hasTech = (s, cid, t) => !!s.clans[cid].techs[t];
const married = (s, a, b) => !!s.marriages[pairKey(a, b)];
function vassalsOf(s, cid) { return aliveClans(s).filter(c => c.vassalOf === cid); }
function realmProvs(s, cid) { return clanProvs(s, cid).length + sum(vassalsOf(s, cid).map(v => clanProvs(s, v.id).length)); }

// vzdálenost v km (přibližně)
function dist(a, b) { const kx = 111 * Math.cos((a.lat + b.lat) / 2 * Math.PI / 180); return Math.hypot((a.lon - b.lon) * kx, (a.lat - b.lat) * 111); }
function computeNeighbors(provs) {
  const L = Object.values(provs);
  for (const p of L) p.nb = [];
  for (const p of L) {
    const ds = L.filter(q => q !== p).map(q => [q, dist(p, q)]).sort((x, y) => x[1] - y[1]);
    ds.forEach(([q, d], i) => { if (d < 120 || (i < 3 && d < 260) || (i < 5 && d < 150)) { if (!p.nb.includes(q.id)) p.nb.push(q.id); if (!q.nb.includes(p.id)) q.nb.push(p.id); } });
  }
}

  for (const [id, n, lon, lat, ter, v, owner, fl, res] of PROVINCES) {

    s.provs[id] = { id, n, lon, lat, ter, v, owner, lord: null, pop: v * 9 + rint(s, 0, 4), agri: Math.round(agriMax * (0.45 + rnd(s) * 0.2)), agriMax, com: Math.round(comMax * (0.4 + rnd(s) * 0.2)), comMax,
      castle: capf ? 3 : v >= 4 ? 2 : 1, dur: 0, troops: { pesi: v * 220 + rint(s, 0, 150), strelci: v * 70, jizda: v * 30 + (capf ? 120 : 0), zoldneri: 0 }, train: 35 + rint(s, 0, 20), loy: 55 + rint(s, 0, 20),

    .map(T => ({ T, sc: powerRatio(s, cid, T.id) * (1 - rel(s, cid, T.id) / 150) * (married(s, cid, T.id) ? 0.6 : 1) * (T.type !== "dyn" ? 0.6 : 1) * ((T.ban || 0) > s.turn ? 1.5 : 1) * (isPlayer(s, T.id) ? 1 : 1) }))
    .filter(x => x.sc > 1.6 && rel(s, cid, x.T.id) < 15).sort((a, b) => b.sc - a.sc);
  if (cands.length && enemiesOf(s, cid).length === 0) declareWar(s, cid, cands[0].T.id, null);
}
function aiDiplomacy(s, cid) {
  const C = s.clans[cid], envoy = officers(s, cid).filter(c => !c.army && c.acted !== s.turn).sort((a, b) => st(b, "roz") - st(a, "roz"))[0];
  if (!envoy || !chance(s, 0.12)) return;
  const foes = enemiesOf(s, cid);
  // mír, když se válka nedaří
  for (const f of foes) { const w = s.wars.find(x => (x.a === cid && x.b === f) || (x.b === cid && x.a === f)); if (w && s.turn - w.start > 6 && (powerRatio(s, cid, f) < 0.8 || s.turn - w.start > 24) && chance(s, 0.5)) { doCmd(s, cid, envoy.id, "poselstvo", f, "mir"); return; } }
  const others = aliveClans(s).filter(o => o.id !== cid && !atWar(s, cid, o.id));
  const o = pick(s, others); if (!o) return;
  const r = rel(s, cid, o.id), ratio = powerRatio(s, cid, o.id);
  if (r > 45 && !allied(s, cid, o.id) && chance(s, 0.4)) { doCmd(s, cid, envoy.id, "poselstvo", o.id, "spojenectvi"); return; }
  if (C.type === "dyn" && o.type === "dyn" && r > 0 && marriageable(s, cid).length && chance(s, 0.3)) { doCmd(s, cid, envoy.id, "poselstvo", o.id, "snatek"); return; }
  if (ratio > 3.5 && !o.vassalOf && !C.vassalOf && clanProvs(s, o.id).some(p => p.nb.some(n => s.provs[n].owner === cid)) && chance(s, 0.3)) { doCmd(s, cid, envoy.id, "poselstvo", o.id, "vazalstvi"); return; }
  if (r < 10 && ratio < 0.7 && C.gold > 300 && chance(s, 0.4)) { doCmd(s, cid, envoy.id, "poselstvo", o.id, "dar"); return; }
  if (o.vassalOf === cid && s.turn - o.vassalSince >= 24 && r >= 70 && chance(s, 0.3)) doCmd(s, cid, envoy.id, "poselstvo", o.id, "pripojit");
}
function aiCaptives(s, cid) {
  for (const c of Object.values(s.chars).filter(x => x.st === "cap" && x.capBy === cid)) {
    if (!chance(s, 0.25)) continue;
    const home = c.cl && s.clans[c.cl] && s.clans[c.cl].alive ? c.cl : null, lead = home && s.clans[home].leader === c.id;
    if (lead || (home && chance(s, 0.5))) { captiveAction(s, cid, c.id, "vykupne"); continue; }
    const x = rnd(s); if (x < 0.4) captiveAction(s, cid, c.id, "naverbovat"); else if (x < 0.85) captiveAction(s, cid, c.id, "propustit"); else if (leaderOf(s, cid) && leaderOf(s, cid).traits.includes("kruty")) captiveAction(s, cid, c.id, "popravit"); else captiveAction(s, cid, c.id, "propustit");
  }
}

  const rows = sorted.map(c => `<tr class="click${c.id === SEL.off ? " sel" : ""}" data-a="selOff" data-x='["${c.id}"]'><td><b>${esc(c.n)}</b>${c.dyn ? ' <span class="tag">rod</span>' : ""}${Object.values(S.provs).some(p => p.lord === c.id) ? ' <span class="tag">purkrabí</span>' : ""}</td>${tdn(age(S, c))}${STAT_IDS.map(x => statBar(st(c, x))).join("")}<td>${RANKS[c.rank].n}</td>${statBar(c.loy, c.loy < 35 ? "low" : "")}<td>${c.army ? '<span class="warn">v poli</span>' : esc(S.provs[c.loc] ? S.provs[c.loc].n : "?")}</td></tr>`);
  const caps = Object.values(S.chars).filter(c => c.st === "cap" && c.capBy === me()).map(c => tr([esc(c.n), c.cl && S.clans[c.cl] ? chip(c.cl) : "—", ...STAT_IDS.map(x => statBar(st(c, x))), RANKS[c.rank].n, `${btn("Propustit", "captive", [c.id, "propustit"])} ${btn("Výkupné", "captive", [c.id, "vykupne"])} ${btn("Naverbovat", "captive", [c.id, "naverbovat"])} ${btn("Popravit", "captive", [c.id, "popravit"], null, "danger")}`]));
  const mineCap = Object.values(S.chars).filter(c => c.st === "cap" && c.cl === me()).map(c => tr([esc(c.n), chip(c.capBy), RANKS[c.rank].n]));
  const wand = Object.values(S.chars).filter(c => c.st === "wand" && S.provs[c.loc] && S.provs[c.loc].owner === me()).length;
  const sel_ = chr(S, SEL.off);
  return `<div class="grid split">${card(`Vazalové (${all.length})`, `<div class="row">Řadit: ${[["rank", "hodnost"], ["ved", "vůdcovství"], ["uda", "udatnost"], ["roz", "rozum"], ["spr", "správa"], ["loy", "nejméně věrní"]].map(([x, n]) => btn(k === x ? `<b>${n}</b>` : n, "sortOff", [x])).join("")}</div>` +
    tbl(["Jméno", "#Věk", "#Vůdc.", "#Udat.", "#Rozum", "#Správa", "Hodnost", "#Věrnost", "Kde"], rows) + `<p class="small muted">Klikni na vazala pro podrobnosti a odměny. V tvých krajích se potuluje ${wand} schopných mužů – najdeš je rozkazem „Hledat schopné muže“.</p>`)}
    ${sel_ ? card("Vazal", offCard(sel_), "sticky") : ""}
    ${card("Zajatci v tvém žaláři", tbl(["Jméno", "Rod", "#Vůdc.", "#Udat.", "#Rozum", "#Správa", "Hodnost", ""], caps), "wide")}
    ${mineCap.length ? card("Tvoji lidé v zajetí", tbl(["Jméno", "Drží je", "Hodnost"], mineCap)) : ""}</div>`;
}

// ---------- Vojsko ----------
function tVojsko() {
  const mine = S.armies.filter(a => a.cl === me()).map(a => { const p = S.provs[a.loc];
    const tgt = Object.values(S.provs).filter(q => atWar(S, me(), q.owner)).sort((x, y) => dist(p, x) - dist(p, y)).slice(0, 15);
    return tr([`${esc(a.cmds.map(id => chr(S, id).n).join(", ") || "bez velitele")}`, esc(p.n) + (a.path && a.path.length ? ` → ${esc(S.provs[a.to].n)} (${a.path.length} měs.)` : ""), fmt(men(a.t)), troopBar(a.t), `<td class="n ${cls(a.morale, 40, 70)}">${Math.round(a.morale)}</td>`, `<td class="n">${Math.round(a.grain)}</td>`,
      p.siege && p.siege.army === a.id ? `obléhá (${p.siege.months}. měs., hradby ${Math.round(p.dur)}, posádka ${estimate(S, p, men(p.troops))})` : a.mode === "presun" ? "přesun" : "pochod",
      `${btn(a.siegeMode === "ztec" ? "<b>Zteč</b>" : "Zteč", "army", [a.id, "ztec"])} ${btn(a.siegeMode === "obleh" ? "<b>Obléhat</b>" : "Obléhat", "army", [a.id, "obleh"])} ${sel("ato_" + a.id, tgt.map(q => [q.id, q.n]), "")} ${btn("Táhnout", "army", [a.id, "tahnout"])} ${btn("Domů", "army", [a.id, "domu"])}`]); });
  const foes = S.armies.filter(a => a.cl !== me() && (knows(S, S.provs[a.loc]) || atWar(S, me(), a.cl))).map(a => tr([chip(a.cl), esc(S.provs[a.loc].n), knows(S, S.provs[a.loc]) ? estimate(S, S.provs[a.loc], men(a.t)) : "?", a.to ? esc(S.provs[a.to].n) : "", atWar(S, me(), a.cl) ? '<span class="bad">nepřítel</span>' : ""]));
  const wars = S.wars.filter(w => w.a === me() || w.b === me()).map(w => { const o = w.a === me() ? w.b : w.a; return tr([chip(o), `${Math.floor((S.turn - w.start) / 12)} r. ${(S.turn - w.start) % 12} m.`, fmt(clanMen(S, o)) + " (odhad)", clanProvs(S, o).length, allied(S, me(), o) ? "" : ""]); });
  const garr = clanProvs(S, me()).sort((a, b) => men(b.troops) - men(a.troops)).map(p => tr([btn(esc(p.n), "prov", [p.id]), `<td class="wbar">${troopBar(p.troops)}</td>`, ...TROOP_IDS.map(k => p.troops[k] || 0), men(p.troops), Math.round(p.train), p.nb.some(n => atWar(S, me(), S.provs[n].owner)) ? '<span class="bad">fronta</span>' : ""]));
  const bat = S.battles.filter(b => b.a === me() || b.b === me()).slice(0, 25).map(b => tr([b.d, esc(b.place), b.kind, chip(b.a), `${fmt(b.aStart)} → ${fmt(b.aEnd)}`, chip(b.b), `${fmt(b.bStart)} → ${fmt(b.bEnd)}`, b.win === me() ? '<span class="good">vítězství</span>' : '<span class="bad">porážka</span>', `<details><summary>${b.rounds.length} kol</summary>${battleChart(b)}${b.rounds.map((r, i) => `${i + 1}. kolo: ztráty ${r[0]} / ${r[1]} (síla ${r[2]} : ${r[3]})`).join("<br>")}<br>Velitelé: ${esc(b.aCmd)} × ${esc(b.bCmd)}${b.fate.length ? "<br>" + esc(b.fate.join(", ")) : ""}</details>`]));
  return `<div class="grid">${card("Války", tbl(["Nepřítel", "Trvá", "#Jeho vojsko", "#Jeho kraje", ""], wars) + '<p class="small muted">Mír sjednáš poselstvem (záložka Diplomacie nebo rozkaz vazala).</p>')}
  ${card("Nepřátelská a cizí vojska v dohledu", tbl(["Rod", "Kde", "#Mužů", "Cíl", ""], foes))}
  ${card("Tvá vojska v poli", tbl(["Velitelé", "Kde", "#Mužů", "Složení", "#Morálka", "#Obilí", "Stav", "Rozkazy"], mine), "wide")}
  ${card("Posádky", troopLegend() + tbl(["Kraj", "Složení", ...TROOP_IDS.map(k => "#" + TROOPS[k].n.split(" ")[0]), "#Celkem", "#Výcvik", ""], garr), "wide")}
  ${card("Bitvy", tbl(["Kdy", "Kde", "Druh", "Útočník", "#Muži", "Obránce", "#Muži", "Výsledek", "Průběh"], bat), "wide")}</div>`;
}

// ---------- Diplomacie ----------
function relStatus(c) {
  return [atWar(S, me(), c.id) ? '<span class="pill bad">válka</span>' : "", allied(S, me(), c.id) ? '<span class="pill good">spojenec</span>' : "", truceUntil(S, me(), c.id) > S.turn ? `<span class="pill">příměří ${truceUntil(S, me(), c.id) - S.turn} m.</span>` : "", married(S, me(), c.id) ? '<span class="pill">sňatek</span>' : "",
    c.vassalOf === me() ? '<span class="pill good">tvůj vazal</span>' : c.vassalOf ? `<span class="pill">vazal: ${esc(S.clans[c.vassalOf].house.split(" (")[0])}</span>` : "", P(S).vassalOf === c.id ? '<span class="pill">tvůj lenní pán</span>' : "", c.excom > S.turn ? '<span class="pill bad">klatba</span>' : "", (c.ban || 0) > S.turn ? '<span class="pill bad">říšská klatba</span>' : ""].join("");
}
function relBar(r) { const f = (r + 100) / 2; return `<span class="relbar" title="vztah ${Math.round(r)}"><i style="left:${Math.min(50, f)}%;width:${Math.abs(f - 50)}%;background:${r < 0 ? "var(--bad)" : "var(--good)"}"></i><b style="left:50%"></b></span>`; }
function tDiplo() {
  const others = aliveClans(S).filter(c => c.id !== me()).sort((a, b) => clanProvs(S, b.id).length - clanProvs(S, a.id).length);
  if (!others.some(c => c.id === SEL.dip)) SEL.dip = others[0] && others[0].id;
  const rows = others.map(c => `<tr class="click${c.id === SEL.dip ? " sel" : ""}" data-a="selDip" data-x='["${c.id}"]'><td class="shc">${shield(c.id, 20)}</td><td><b>${esc(c.house)}</b><div class="small muted">${esc(c.n)}</div></td>${tdn(clanProvs(S, c.id).length)}${tdn("~" + fmt(Math.round(clanMen(S, c.id) / 500) * 500))}<td class="n">${Math.round(rel(S, me(), c.id))} ${relBar(rel(S, me(), c.id))}</td><td>${relStatus(c)}</td></tr>`);
  const T = S.clans[SEL.dip]; let dossier = "";
  if (T) {
    const L = leaderOf(S, T.id), envoys = officers(S, me()).filter(c => c.acted !== S.turn && !c.army && S.provs[c.loc] && S.provs[c.loc].owner === me()).sort((a, b) => st(b, "roz") - st(a, "roz"));
    const foes = enemiesOf(S, T.id), friends = aliveClans(S).filter(o => o.id !== T.id && allied(S, T.id, o.id)), kin = aliveClans(S).filter(o => o.id !== T.id && married(S, T.id, o.id));
    const best = aliveClans(S).filter(o => o.id !== T.id).sort((a, b) => rel(S, T.id, b.id) - rel(S, T.id, a.id));
    dossier = card("Rod", `<div class="crest">${shield(T.id, 64)}<div><div class="big">${esc(T.house)}</div><div>${esc(T.n)}</div><div class="muted">${esc(cap(T.t))} ${esc(L ? L.n : "—")}${L ? ` (${age(S, L)} let)${L.st === "cap" ? ", v zajetí" : ""}` : ""}</div><div class="muted">${T.hre ? "říšské knížectví" : "mimo říši"}${T.titles.length ? " · " + T.titles.join(", ") : ""}</div></div></div>
      <div>${relStatus(T) || '<span class="muted small">žádné smlouvy</span>'}</div>
      ${meter("Vztah k tobě", Math.round(rel(S, me(), T.id)) + 100, 200, rel(S, me(), T.id) < 0 ? "var(--bad)" : "var(--good)")}
      <div class="kv"><span>Kraje</span><span>${clanProvs(S, T.id).map(p => esc(p.n)).join(", ")}</span><span>Vojsko</span><span>asi ${fmt(Math.round(clanMen(S, T.id) / 500) * 500)} mužů</span><span>Prestiž</span><span>${fmt(T.prestige)}</span><span>Válčí s</span><span>${foes.map(f => chip(f)).join(" ") || "—"}</span><span>Spojenci</span><span>${friends.map(f => chip(f.id)).join(" ") || "—"}</span><span>Spřízněni s</span><span>${kin.map(f => chip(f.id)).join(" ") || "—"}</span><span>Přátelé</span><span>${best.slice(0, 2).map(f => chip(f.id)).join(" ")}</span><span>Nepřátelé</span><span>${best.slice(-2).map(f => chip(f.id)).join(" ")}</span></div>
      <h4>Poselstvo</h4><div class="kv"><span>Vyslanec</span>${sel("env_" + T.id, [["", "— vyber —"]].concat(envoys.map(c => [c.id, `${c.n} (rozum ${st(c, "roz")})`])), envoys[0] ? envoys[0].id : "")}<span>Jednání</span>${sel("dt_" + T.id, Object.entries(DIPLO).map(([k, d]) => [k, d.n]), atWar(S, me(), T.id) ? "mir" : "dar")}</div>
      <div class="row">${btn("Vyslat poselstvo", "dip", [T.id], envoys.length ? null : "Žádný volný vazal", "go")} ${atWar(S, me(), T.id) ? "" : btn(SEL.warConfirm === T.id ? "<b>Opravdu vyhlásit válku?</b>" : "Vyhlásit válku", "war", [T.id], null, "danger")}</div>
      <p class="small muted">Poselstvo spotřebuje měsíční rozkaz vyslance; jeho rozum zvyšuje šanci. Porušení příměří či spojenectví stojí prestiž a přízeň papeže, útok na církevní zemi papeže rozzlobí. Vymře-li spřízněný rod, zdědíš jeho země.</p>`, "sticky");
  }
  return `<div class="grid split">${card("Rody střední Evropy", tbl(["", "Rod", "#Kraje", "#Vojsko", "#Vztah", "Smlouvy"], rows))}${dossier}</div>`;
}

// ---------- Říše a církev ----------
function tRise() {
  const H = S.hre, C = P(S), cands = candidates(S), holders = electorHolders(S);
  const el = Object.entries(holders).map(([t, cid]) => tr([`Kurfiřt – ${t}`, chip(cid), cid === me() ? "ty" : `vztah ${Math.round(rel(S, me(), cid))}`, ""]))
    .concat(EXT_ELECTORS.map(e => tr([esc(cap(e.n)), "mimo mapu", `přízeň k tobě ${Math.round(H.ext[e.id][me()] || 0)}`, H.election ? `<input type="number" id="br_${e.id}" value="100" min="50" step="50"> ${btn("Poslat dary", "bribe", [e.id])}` : ""])));
  const last = H.lastElection ? `<h4>Poslední volba (${H.lastElection.d})</h4>${tbl(["Kurfiřt", "Hlas"], H.lastElection.votes.map(v => tr([esc(v[0]), esc(v[1])])))}<p>${esc(H.lastElection.txt || "")}</p>` : "";
  const crowns = Object.entries(CROWNS).map(([k, K]) => { const h = crownHolder(S, k), own = K.core.filter(id => S.provs[id].owner === me()).length;
    return tr([`<b>${k}</b>`, h ? chip(h.id) : "<i>neobsazena</i>", `${own}/${K.core.length}`, esc(S.provs[K.cap].n), btn("Korunovat se", "crown", [k], canCrown(S, me(), k))]); });
  const pope = aliveClans(S).sort((a, b) => (S.pope.op[b.id] || 0) - (S.pope.op[a.id] || 0)).slice(0, 12).map(c => tr([chip(c.id), `<td class="n ${cls(S.pope.op[c.id] || 0, -20, 40)}">${Math.round(S.pope.op[c.id] || 0)}</td>`, c.excom > S.turn ? '<span class="bad">klatba</span>' : ""]));
  const hreClans = aliveClans(S).filter(c => c.hre && c.id !== me());
  return `<div class="grid">${card("Svatá říše římská", `<div class="kv"><span>Římský král</span><span>${hreKingTxt()}</span><span>Volba</span><span>${H.election ? `${MONTHS[(S.month + H.election - S.turn) % 12]} ${S.year + Math.floor((S.month + H.election - S.turn) / 12)}` : "nevypsána"}</span><span>Tvůj rod</span><span>${C.hre ? "říšské knížectví" : "mimo říši"}</span></div>
    <h4>Kandidáti</h4>${tbl(["Kandidát", ""], cands.map(c => tr([esc(c.n), c.ext ? "cizí kandidát (zlato pro arcibiskupy)" : ""])))}
    <div class="row">${btn("Ucházet se o římskou korunu", "stand", [], C.candidate ? "Už kandiduješ" : null)}</div>
    <h4>Kurfiřti</h4>${tbl(["Hlas", "Drží", "Postoj", ""], el)}${last}
    ${H.kingClan === me() ? `<h4>Pravomoci římského krále</h4><div class="row">${sel("banT", hreClans.map(c => [c.id, c.house]), "")} ${btn("Uvalit říšskou klatbu (50 prestiže)", "ban")} ${btn("Jet do Říma ke korunovaci (800 zl)", "coronation", [], H.emperor ? "Už jsi císař" : null)}</div><p class="small muted">Říšská klatba dovolí válku bez ztráty cti a ostatní knížata se proti postiženému obrátí. Římský král dostává 35 zl měsíčně z říšských příjmů a snáze žádá lenní hold od říšských knížat.</p>` : ""}
    <p class="small muted">Sedm kurfiřtů: tři rýnští arcibiskupové (mimo mapu – získáš je dary a přízní papeže) a držitelé Čech, Falce, Saska a Braniborska (hlasují podle vztahů). Hlas drží rod, který ovládá sídelní kraj (Praha, Rýnská Falc, Wittenbersko, Braniborsko).</p>`, "wide")}
  ${card("Královské koruny", tbl(["Koruna", "Drží", "#Tvé jádro", "Korunovační kraj", ""], crowns) + '<p class="small muted">Ke korunovaci musíš držet korunovační kraj a polovinu jádra koruny, mít přízeň papeže aspoň 30 a 500 zl.</p>')}
  ${card(`Papež ${esc(S.pope.n)}`, `<div class="kv"><span>Přízeň k tobě</span><span>${Math.round(S.pope.op[me()] || 0)}</span><span>Klatba</span><span>${C.excom > S.turn ? `ano, ještě ${C.excom - S.turn} měs.` : "ne"}</span></div><div class="row">${btn("Dar Svatému stolci (100 zl)", "popeGift")} ${btn("Veřejné pokání (250 zl)", "penance", [], C.excom > S.turn ? null : "Nejsi v klatbě")}</div>` + tbl(["Rod", "#Přízeň", ""], pope) + '<p class="small muted">Klatba (pod −60) snižuje věrnost vazalů i lidu. Přízeň zvedají dary, kláštery, výprava do Pruska a poslušnost Římu; snižují ji útoky na církevní země, popravy a zrada příměří.</p>')}</div>`;
}

// ---------- Hospodářství ----------
const INC_N = { domeny: "Panské dvory a regálie", kraje: "Daně a dávky z krajů", doly: "Doly a solivary", dan_vazalu: "Poplatky vazalů / lennímu pánovi", rise: "Říšské příjmy", cirkev: "Církevní statky (investitura)" };
const EXP_N = { platy: "Platy vazalů", vojsko: "Vydržování vojska", dvur: "Dvůr", uroky: "Úroky" };
function tHosp() {
  const C = P(S), b = clanBudget(S, me());
  const rows = clanProvs(S, me()).sort((a, c) => provGold(S, c) - provGold(S, a)).map(p => tr([btn(esc(p.n), "prov", [p.id]), r1(provGold(S, p)), r1(provMines(S, p).gold), Math.round(provHarvest(S, p)), r1(garrisonGrain(p)), p.agri, p.com, Math.round(p.loy), p.deleg ? "purkrabí" : "<b>ty</b>"]));
  return `<div class="grid">${card("Měsíční příjmy", tbl(["Zdroj", "#Zlatých"], Object.entries(b.inc).map(([k, v]) => tr([INC_N[k], v]))) + `<p><b>Celkem ${fmt(sum(Object.values(b.inc)))} zl</b></p>`)}
  ${card("Měsíční výdaje", tbl(["Položka", "#Zlatých"], Object.entries(b.ex).map(([k, v]) => tr([EXP_N[k], v]))) + `<p><b>Celkem ${fmt(sum(Object.values(b.ex)))} zl</b> · bilance <b class="${b.net < 0 ? "bad" : "good"}">${sg(b.net)}</b></p>`)}
  ${card("Daně a obilí", `<div class="kv"><span>Daňová zátěž</span>${sel("taxs", TAX_LEVELS.map((t, i) => [i, t]), C.tax, `data-a="tax" data-x='[]'`)}<span>Obilí</span><span>${fmt(C.grain)} (spotřeba posádek a vojsk ${r1(clanGrainUse(S, me()))} měsíčně)</span><span>Poslední žně</span><span>${fmt(C.last.harvest || 0)} (v září)</span><span>Koně / zbroj</span><span>${fmt(C.kone)} / ${fmt(C.zbroj)}</span><span>Inflace</span><span>${Math.round(S.inflation * 100)} %</span></div><p class="small muted">Vyšší daně = víc zlata, ale nižší spokojenost lidu (a tím i výnos a sklizeň).</p>`)}
  ${card("Trh", tbl(["Zboží", "#Máš", "#Nákup", "#Prodej", ""], Object.entries(GOODS).map(([g, G]) => tr([G.n, Math.floor(C[g === "obili" ? "grain" : g] || 0), r1(price(S, g) * 1.15), r1(price(S, g) * 0.85), `<input type="number" id="q_${g}" value="100" min="1" step="50"> ${btn("Koupit", "buy", [g])} ${btn("Prodat", "sell", [g])}`]))) + '<p class="small muted">Koně a zbroj potřebuješ k verbování jízdy a střelců. Hřebčíny a železné doly je vyrábějí.</p>')}
  ${card("Lombardští bankéři", tbl(["#Jistina", "#Úrok/měs.", ""], (C.debts || []).map((d, i) => tr([d.amount, r1(d.amount * d.rate), btn("Splatit", "repay", [i])]))) + `<div class="row"><input type="number" id="loan" value="200" step="100"> ${btn("Půjčit si", "borrow")} <span class="small muted">strop ${maxLoan(S, me())} zl</span></div>`)}
  ${card("Kraje", tbl(["Kraj", "#Zlato/měs.", "#Doly", "#Sklizeň", "#Obilí/měs.", "#Pole", "#Obchod", "#Spokoj.", "Správa"], rows), "wide")}</div>`;
}

// ---------- Stavy a zákony ----------
function tStavy() {
  const C = P(S);
  const est = ESTATE_IDS.map(e => { const t = estateTarget(S, e); return tr([`<b>${ESTATES[e]}</b>`, `<td class="n ${cls(C.estates[e], 30, 60)}">${Math.round(C.estates[e])}</td>`, bar(C.estates[e]), t.val, `<details><summary>proč</summary>${tbl(["Vliv", "#"], t.rows.map(r => tr([esc(r[0]), `<td class="n ${r[1] < 0 ? "bad" : "good"}">${sg(r[1])}</td>`])))}</details>`]); });
  const laws = Object.entries(LAWS).map(([l, L]) => tr([`<b>${L.n}</b><div class="small muted">${L.d}</div>`, sel("law_" + l, L.opts.map((o, i) => [i, o]), C.laws[l], `data-a="law" data-x='["${l}"]' ${(C.lawCd[l] || 0) > S.turn ? "disabled" : ""}`), (C.lawCd[l] || 0) > S.turn ? `za ${C.lawCd[l] - S.turn} měs.` : "lze měnit"]));

    <div class="minis">${STAT_IDS.map(k => `<span title="${STATS[k]}"><i style="height:${st(c, k) * 0.28}px"></i></span>`).join("")}</div>
    ${c.spouse && chr(S, c.spouse) && role !== "choť" ? `<div class="small">∞ ${esc(chr(S, c.spouse).n)}</div>` : ""}

}
function tRod() {

  const dead = Object.values(S.chars).filter(c => c.dyn && c.st === "dead" && c.cl === me()).slice(-15).map(c => tr([esc(c.n), c.died || ""]));
  return `<div class="grid">${card("Rodokmen " + esc(C.house), `<div class="tree"><div class="gen">${famCard(L, cap(C.t))}${sp ? famCard(sp, "choť") : '<div class="fam empty">bez choti</div>'}</div>

  ${card("Spřízněné rody", aliveClans(S).filter(c => married(S, me(), c.id)).map(c => chip(c.id)).join(" ") || "—")}

// ---------- Objevy ----------

// ---------- Hra ----------
function tHra() {
  const slots = [1, 2, 3, 4, 5].map(n => { const i = slotInfo(n); return tr([n, i ? esc(i) : '<span class="muted">prázdná</span>', btn("Uložit", "save", [n]) + btn("Načíst", "load", [n], i ? null : "Prázdná") + btn("Smazat", "del", [n], i ? null : "Prázdná")]); });
  const clansSel = CLANS.filter(c => c.type === "dyn").map(c => { const n = PROVINCES.filter(p => p[6] === c.id).length, h = HIST.find(x => x.cl === c.id && x.r === "leader"); return [c.id, `${c.house} – ${c.n} (${n} krajů${h ? ", " + h.n : ""})`]; });
  return `<div class="grid">${card("Uložené hry", tbl(["#", "Obsah", ""], slots) + `<p class="small muted">Hra se sama ukládá po každém kroku.</p><div class="row">${btn("Stáhnout do souboru", "exportSave")} ${btn("Nahrát ze souboru", "importSave")}</div>`)}
  ${card("Nová hra – leden 1256", `<div class="kv"><span>Rod</span>${sel("ngClan", clansSel, SEL.ng, `data-a="ngClan" data-x='[]'`)}<span>Semínko náhody</span><input id="ngSeed" type="number" placeholder="náhodné"></div><div class="row">${btn(SEL.ngConfirm ? "<b>Ano, začít</b>" : "Začít novou hru", "newgame")}</div><p class="small muted">Velké rody (Přemyslovci, Arpádovci) jsou nejsnazší. Habsburkové, Wittelsbachové nebo slezští Piastovci začínají malí – to je výzva.</p>`)}
  ${card("Vzhled", btn("Přepnout světlý / tmavý vzhled", "theme"))}
  <section class="card wide help"><h3>Jak hrát</h3>
  <p>Jsi hlavou panovnického rodu ve střední Evropě po pádu Štaufů (od ledna 1256). Kolo je jeden měsíc. <b>Cíl:</b> ovládnout polovinu krajů (sám nebo skrze vazaly), nebo se stát císařem a vládnout třetině krajů. Prohraješ, když přijdeš o všechny kraje.</p>
  <h4>Měsíc</h4><p>V záložce <b>Kraj a rozkazy</b> dáš každému vazalovi jeden rozkaz: rozvoj polí a trhů, opravy hradeb, nábor, výcvik, péči o lid, stavby, hledání schopných mužů, zvědy, podněcování, naklonění cizích vazalů, poselstva nebo přesun. Kraje, které „svěříš purkrabímu“, spravuje umělá inteligence sama. Pak stiskni <b>Konec měsíce</b>.</p>
  <h4>Hospodářství</h4><p>Zlato plyne každý měsíc z obchodu a obyvatel, obilí jednou za rok při žních v září. Obilím se živí posádky a vojska v poli. Stříbrné doly (Jihlava, Kutná Hora a Čáslavsko, Štiavnica, Freiberg…) jsou pokladem.</p>
  <h4>Válka</h4><p>Vyhlas válku (Diplomacie), vyšli vojsko s veliteli (Kraj a rozkazy → Vyslat vojsko). Vojsko táhne kraj za měsíc. U cíle obléhá hrad – vyhladovění trvá podle úrovně hradu, zteč je rychlá, ale krvavá. Bitva má až šest kol; rozhoduje počet, druh vojska, výcvik, terén, morálka a schopnosti velitelů. Poražení velitelé mohou padnout nebo být zajati.</p>
  <h4>Vazalové</h4><p>Věrnost závisí na hodnosti, darech, prestiži rodu a náladě šlechty. Nevěrný purkrabí může přeběhnout k sousedovi i s krajem nebo se vzbouřit. Cizí vazaly lze úplatky naklonit na svou stranu.</p>
  <h4>Evropská politika</h4><p>Sňatky spojují rody a dávají nárok na dědictví. Slabší rody mohou složit lenní hold. Kurfiřti volí římského krále; papež může dát rod do klatby. Kdo ovládne jádro koruny (Čechy, Uhry, Polsko, Halič), může se nechat korunovat.</p>
  <p class="small muted">Historické postavy a vládci odpovídají roku 1256 (roky narození jsou přibližné). Jejich schopnosti a všichni ostatní vazalové jsou herní výmysl.</p></section></div>`;
}

  const f = document.createElement("input"); f.type = "file"; f.id = "impFile"; f.accept = ".json,application/json"; f.style.display = "none"; f.onchange = () => f.files[0] && importFile(f.files[0]); document.body.appendChild(f);

}

// ---------- pruhy ----------
function statBar(v, cls2 = "") { return `<td class="n sb ${cls2}"><span class="sbv" style="--v:${clamp(v, 0, 100)}%">${Math.round(v)}</span></td>`; }
function meter(label, v, max, col) { const f = clamp(v / Math.max(1, max) * 100, 0, 100); return `<div class="meter"><span class="ml">${label}</span><span class="mt"><i style="width:${f}%;${col ? "background:" + col : ""}"></i></span><span class="mv">${fmt(v)}${max ? " / " + fmt(max) : ""}</span></div>`; }
const TROOP_COL = { pesi: "#8a7a5c", strelci: "#4f7f4f", jizda: "#a3332b", zoldneri: "#5d5d8c" };
function troopBar(t) { const n = men(t); if (!n) return '<div class="tbar empty"></div>'; return `<div class="tbar" title="${TROOP_IDS.map(k => TROOPS[k].n + ": " + fmt(t[k] || 0)).join(", ")}">${TROOP_IDS.filter(k => t[k]).map(k => `<i style="flex:${t[k]};background:${TROOP_COL[k]}"></i>`).join("")}</div>`; }
const troopLegend = () => `<div class="tleg">${TROOP_IDS.map(k => `<span><i style="background:${TROOP_COL[k]}"></i>${TROOPS[k].n}</span>`).join("")}</div>`;

// ---------- grafy ----------
function sparkline(vals, w = 120, h = 30, col = "var(--accent2)") {
  if (vals.length < 2) return "";
  const mn = Math.min(...vals), mx = Math.max(...vals), sy = v => h - 3 - (mx === mn ? 0.5 : (v - mn) / (mx - mn)) * (h - 6), sx = i => i / (vals.length - 1) * (w - 4) + 2;
  const pts = vals.map((v, i) => `${sx(i).toFixed(1)},${sy(v).toFixed(1)}`).join(" ");
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><polygon points="2,${h} ${pts} ${w - 2},${h}" fill="${col}" opacity=".15"/><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.6"/><circle cx="${sx(vals.length - 1)}" cy="${sy(vals[vals.length - 1])}" r="2.5" fill="${col}"/></svg>`;
}
function lineChart(series, labels, w = 640, h = 220, maxw) {
  const all = series.flatMap(s => s.vals); if (!all.length || labels.length < 2) return '<p class="muted small">Graf se zaplní, jak poběží čas.</p>';
  const mx = Math.max(1, ...all), pl = 34, pr = 110, pt = 8, pb = 22, W = w - pl - pr, H = h - pt - pb;
  const sx = i => pl + i / (labels.length - 1) * W, sy = v => pt + H - v / mx * H;
  let g = ""; const step = Math.max(1, Math.ceil(mx / 4));
  for (let v = 0; v <= mx; v += step) g += `<line x1="${pl}" x2="${pl + W}" y1="${sy(v)}" y2="${sy(v)}" class="grid"/><text x="${pl - 5}" y="${sy(v) + 3}" class="ax" text-anchor="end">${v}</text>`;
  const every = Math.max(1, Math.ceil(labels.length / 6));
  labels.forEach((l, i) => { if (i % every === 0 || i === labels.length - 1) g += `<text x="${sx(i)}" y="${h - 6}" class="ax" text-anchor="middle">${esc(l)}</text>`; });
  const ends = [];
  for (const s of series) { const pts = s.vals.map((v, i) => `${sx(i).toFixed(1)},${sy(v).toFixed(1)}`).join(" "); g += `<polyline points="${pts}" fill="none" stroke="${s.col}" stroke-width="${s.bold ? 3 : 1.8}"/>`; ends.push([sy(s.vals[s.vals.length - 1]), s]); }
  ends.sort((a, b) => a[0] - b[0]); let last = -99;
  for (const [y0, s] of ends) { const y = Math.max(y0, last + 11); last = y; g += `<circle cx="${pl + W}" cy="${y0}" r="3" fill="${s.col}"/><text x="${pl + W + 6}" y="${y + 3}" class="ax lbl2" ${s.bold ? 'font-weight="bold"' : ""}>${esc(s.name)} ${s.vals[s.vals.length - 1]}</text>`; }
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" style="max-width:${maxw || w * 1.25}px" role="img" aria-label="Graf">${g}</svg>`;
}
// průběh bitvy: kolik mužů zbývá po každém kole
function battleChart(b) {
  let a = b.aStart, d = b.bStart; const A = [a], D = [d];
  for (const r of b.rounds) { a -= r[0]; d -= r[1]; A.push(Math.max(0, a)); D.push(Math.max(0, d)); }
  return lineChart([{ name: S.clans[b.a].house.split(" (")[0], col: S.clans[b.a].col, vals: A }, { name: S.clans[b.b].house.split(" (")[0], col: S.clans[b.b].col, vals: D }], A.map((_, i) => i ? i + ". kolo" : "začátek"), 460, 160, 520);
}

function territoryImage(W, H, MXf, MYf) {
  const key = Object.values(S.provs).map(p => p.owner).join(",") + "|" + S.player;
  if (TERR.key === key && TERR.url) return TERR.url;

  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {

    for (let i = 0; i < n; i++) { const dx = px[i] - jx, dy = py[i] - jy, d = dx * dx + dy * dy; if (d < bd) { bd = d; best = i; } }

    const realm = nb.some(j => j !== i && (j < 0 || own[j] !== own[i])), prov = nb.some(j => j >= 0 && j !== i);
    const [r, g, b] = cols[i];
    if (realm) { D[o] = r * 0.35; D[o + 1] = g * 0.35; D[o + 2] = b * 0.35; D[o + 3] = 235; }
    else if (prov) { D[o] = r * 0.75; D[o + 1] = g * 0.75; D[o + 2] = b * 0.75; D[o + 3] = 150; }
    else { D[o] = r; D[o + 1] = g; D[o + 2] = b; D[o + 3] = mine[i] ? 200 : 140; }
  }
  ctx.putImageData(img, 0, 0);

  return TERR.url;
}

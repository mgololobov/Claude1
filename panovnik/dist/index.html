<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panovník</title>
<style>
:root {
  --bg: #f3ecdc; --panel: #fbf7ee; --ink: #2b2118; --muted: #7a6a58; --line: #d9ccb4; --accent: #7a2e1d; --accent2: #2f5d50;
  --good: #2f6b2f; color-scheme: light; --bad: #a3271b; --warn: #a86b12; --head: #e8dcc2; --btn: #efe4cc; --btnh: #e2d3b2;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1d1915; --panel: #26211b; --ink: #ece2d0; --muted: #a8977f; --line: #3d342a; --accent: #d9774f; --accent2: #6fb39f;
  --good: #7fc37f; --bad: #ef7b6c; --warn: #e3ac55; --head: #312a22; --btn: #342c23; --btnh: #43392d; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #1d1915; --panel: #26211b; --ink: #ece2d0; --muted: #a8977f; --line: #3d342a; --accent: #d9774f; --accent2: #6fb39f;
  --good: #7fc37f; --bad: #ef7b6c; --warn: #e3ac55; --head: #312a22; --btn: #342c23; --btnh: #43392d; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 Georgia, "Times New Roman", serif; }
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel); border-bottom: 2px solid var(--accent); padding: 6px max(16px, env(safe-area-inset-right, 0px)) 6px max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; }
header .realm { font-size: 17px; font-weight: bold; color: var(--accent); margin-right: 8px; }
header .st { white-space: nowrap; } header .st b { font-variant-numeric: tabular-nums; }
header .sp { flex: 1; }
nav { display: flex; flex-wrap: wrap; gap: 2px; padding: 6px max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--line); background: var(--bg); }
nav button { border: 1px solid var(--line); border-bottom: none; background: var(--btn); color: var(--ink); padding: 5px 10px; border-radius: 6px 6px 0 0; cursor: pointer; font: inherit; }
nav button.on { background: var(--panel); font-weight: bold; color: var(--accent); }
main { padding: 12px max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px)); max-width: 1400px; margin: 0 auto; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); align-items: start; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; overflow-x: auto; }
.card h3 { margin: 0 0 8px; font-size: 15px; color: var(--accent); border-bottom: 1px solid var(--line); padding-bottom: 4px; }
.card h4 { margin: 10px 0 4px; font-size: 14px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { border-bottom: 1px solid var(--line); padding: 3px 6px; text-align: left; vertical-align: top; }
th { background: var(--head); font-weight: bold; position: sticky; top: 0; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.sel td { background: var(--head); }
.good { color: var(--good); } .bad { color: var(--bad); } .warn { color: var(--warn); } .muted { color: var(--muted); } .small { font-size: 12px; }
button.b, select, input { font: inherit; font-size: 13px; }
button.b { background: var(--btn); color: var(--ink); border: 1px solid var(--line); border-radius: 5px; padding: 2px 8px; cursor: pointer; margin: 1px; }
button.b:hover:not(:disabled) { background: var(--btnh); } button.b:disabled { opacity: .45; cursor: default; }
button.main { background: var(--accent); color: #fff; border: none; border-radius: 6px; padding: 6px 14px; font-weight: bold; cursor: pointer; font: inherit; }
button.main:disabled { opacity: .5; }
select, input { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 2px 4px; }
input[type=number] { width: 62px; }
.bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; min-width: 60px; }
.bar > i { display: block; height: 100%; background: var(--accent2); }
.bar.red > i { background: var(--bad); } .bar.yel > i { background: var(--warn); }
.log { max-height: 70vh; overflow-y: auto; }
.log div { border-bottom: 1px dotted var(--line); padding: 2px 0; }
.tag { display: inline-block; font-size: 11px; padding: 0 5px; border-radius: 8px; background: var(--head); color: var(--muted); margin-right: 4px; }
#modal { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 20; display: flex; align-items: center; justify-content: center; padding: 16px; }
#modal.hidden { display: none; }
#modal .box { background: var(--panel); border: 2px solid var(--accent); border-radius: 10px; max-width: 560px; width: 100%; padding: 16px 18px; max-height: 90vh; overflow-y: auto; }
#modal h2 { margin: 0 0 8px; color: var(--accent); }
#modal .ch { display: block; width: 100%; text-align: left; margin: 6px 0; padding: 7px 10px; }
#toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 6px; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 30; max-width: 90vw; }
#toast.on { opacity: .95; }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 4px 0; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; }
.kv > :nth-child(odd) { color: var(--muted); }
details summary { cursor: pointer; color: var(--accent2); }
.help p { margin: 4px 0 8px; } .help h4 { color: var(--accent); }
.wide { grid-column: 1 / -1; }
.tw { overflow-x: auto; max-width: 100%; }
.card { min-width: 0; }
.grid.map2 { grid-template-columns: minmax(0, 2fr) minmax(280px, 1fr); }
.grid.map2 > .wide:first-child { grid-column: auto; }
svg.map { width: 100%; height: auto; display: block; background: var(--head); border-radius: 6px; }
svg.map .edge { stroke: var(--line); stroke-width: 1; }
svg.map .edge.same { stroke: var(--muted); stroke-opacity: .45; stroke-width: 1.6; }
svg.map circle { stroke: var(--panel); stroke-width: 1; cursor: pointer; }
svg.map circle.mine { stroke: var(--ink); stroke-width: 2.2; }
svg.map circle.war { stroke: var(--bad); stroke-width: 2.2; }
svg.map circle.capc { stroke-dasharray: 2 1.5; }
svg.map circle.siege { fill: none; stroke: var(--bad); stroke-dasharray: 3 2; stroke-width: 1.5; pointer-events: none; }
svg.map .pv.sel circle:first-of-type { stroke: var(--accent); stroke-width: 3; }
svg.map .lbl { font-size: 8.5px; fill: var(--muted); pointer-events: none; font-family: Georgia, serif; }
svg.map .lbl.lm { fill: var(--ink); font-weight: bold; }
svg.map .army { stroke: var(--ink); stroke-width: .8; }
.chip { display: inline-block; padding: 0 6px 0 4px; border-radius: 9px; font-size: 12px; background: var(--head); border-left: 6px solid var(--c); margin: 1px 2px; white-space: nowrap; }
.legend { line-height: 1.9; }
.lg { border-bottom: 1px dotted var(--line); padding: 2px 0; font-size: 13px; }
a.lnk { color: var(--accent2); cursor: pointer; text-decoration: underline dotted; }
.realm { border-left: 8px solid var(--c); padding-left: 6px; }
button.b.go { background: var(--accent2); color: #fff; border-color: transparent; }
button.b.danger { color: var(--bad); }
.provpick { margin-bottom: 8px; }
@media (max-width: 900px) { .grid.map2 { grid-template-columns: 1fr; } }
@media (max-width: 600px) { .grid { grid-template-columns: 1fr; } header { font-size: 13px; } }

/* --- grafika: erby, dlaždice, pruhy, grafy, mapa, rodokmen --- */
.shield { vertical-align: middle; flex: none; }
.chip { border-left: none; padding: 0 7px 0 3px; display: inline-flex; align-items: center; gap: 4px; }
.realm { display: inline-flex; align-items: center; gap: 8px; border-left: none; padding-left: 0; }
nav button { display: inline-flex; align-items: center; gap: 5px; }
.ico { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 12px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; min-width: 0; display: flex; flex-direction: column; justify-content: space-between; }
.tile .tl { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.tile .tv { font-size: 24px; font-weight: bold; font-variant-numeric: tabular-nums; line-height: 1.2; }
.tile .tv small { font-size: 14px; color: var(--muted); }
.tile .ts { font-size: 12px; color: var(--muted); }
.tile .tsp { margin-top: 4px; } .tile .spark { width: 100%; height: 26px; display: block; }
.crest { display: flex; gap: 12px; align-items: center; margin-bottom: 8px; }
.crest .big { font-size: 18px; font-weight: bold; color: var(--accent); }
.alert { padding: 4px 8px; border-left: 4px solid var(--line); margin: 3px 0; background: var(--head); border-radius: 0 4px 4px 0; font-size: 13px; }
.alert.bad { border-color: var(--bad); } .alert.warn { border-color: var(--warn); } .alert.info { border-color: var(--accent2); } .alert.good { border-color: var(--good); }
td.sb { min-width: 52px; }
.sbv { display: inline-block; min-width: 44px; text-align: right; padding: 0 4px; border-radius: 3px; background: linear-gradient(90deg, color-mix(in srgb, var(--accent2) 35%, transparent) var(--v), transparent var(--v)); }
td.sb.low .sbv { background: linear-gradient(90deg, color-mix(in srgb, var(--bad) 40%, transparent) var(--v), transparent var(--v)); }
.meter { display: grid; grid-template-columns: 110px 1fr auto; gap: 8px; align-items: center; font-size: 13px; margin: 3px 0; }
.meter .ml { color: var(--muted); } .meter .mv { font-variant-numeric: tabular-nums; font-size: 12px; }
.meter .mt { height: 9px; background: var(--line); border-radius: 5px; overflow: hidden; } .meter .mt i { display: block; height: 100%; background: var(--accent2); border-radius: 5px; }
.tbar { display: flex; height: 12px; border-radius: 4px; overflow: hidden; min-width: 90px; background: var(--line); margin: 4px 0; } .tbar i { display: block; height: 100%; }
.tleg { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: var(--muted); margin: 2px 0 6px; } .tleg i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
td.wbar { min-width: 110px; }
svg.chart { width: 100%; height: auto; display: block; margin: 0 auto; }
svg.chart .grid { stroke: var(--line); stroke-width: 1; }
svg.chart .ax { font-size: 10px; fill: var(--muted); font-family: Georgia, serif; }
svg.chart .lbl2 { fill: var(--ink); }
.relbar { display: inline-block; width: 60px; height: 8px; background: var(--line); border-radius: 4px; position: relative; vertical-align: middle; margin-left: 4px; }
.relbar i { position: absolute; top: 0; bottom: 0; border-radius: 4px; } .relbar b { position: absolute; top: -2px; bottom: -2px; width: 1px; background: var(--ink); }
.pill { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 8px; background: var(--head); margin: 1px 2px 1px 0; white-space: nowrap; }
.pill.good { color: var(--good); } .pill.bad { color: var(--bad); }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--head); }
td.shc { width: 24px; }
.grid.split { grid-template-columns: minmax(0, 3fr) minmax(300px, 2fr); }
.card.sticky { position: sticky; top: 64px; align-self: start; }
@media (max-width: 900px) { .grid.split { grid-template-columns: 1fr; } .card.sticky { position: static; } }
svg.map .sea { fill: var(--head); }
svg.map .road { stroke: rgba(0,0,0,.18); stroke-width: .8; stroke-dasharray: 2 2; }
svg.map .hit { fill: transparent; cursor: pointer; }
svg.map .castle { stroke: rgba(0,0,0,.7); stroke-width: 1; }
svg.map .castle.mine { stroke: var(--ink); stroke-width: 2; }
svg.map .castle.war { stroke: var(--bad); stroke-width: 2; }
svg.map .capm { stroke: rgba(0,0,0,.8); stroke-width: 1; }
svg.map .selring { fill: none; stroke: var(--accent); stroke-width: 2.5; }
svg.map .realmname { font-size: 11px; letter-spacing: .14em; fill: rgba(0,0,0,.45); font-weight: bold; pointer-events: none; font-family: Georgia, serif; }
svg.map .lbl { font-size: 9px; fill: var(--ink); paint-order: stroke; stroke: var(--panel); stroke-width: 2.5px; stroke-linejoin: round; }
svg.map .lbl.lm { font-weight: bold; }
svg.map .army line { stroke: var(--ink); stroke-width: 1.2; } svg.map .army path { stroke: var(--ink); stroke-width: .6; }
.tree { display: flex; flex-direction: column; align-items: center; gap: 0; }
.tree .gen { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.tree .stem { width: 2px; height: 18px; background: var(--line); }
.fam { border: 1px solid var(--line); border-top: 4px solid var(--accent2); border-radius: 6px; padding: 6px 10px; min-width: 150px; max-width: 220px; background: var(--panel); }
.fam.f { border-top-color: #a85e7f; } .fam.empty { color: var(--muted); border-style: dashed; display: flex; align-items: center; justify-content: center; }
.fam .fn { font-weight: bold; }
.minis { display: flex; gap: 3px; align-items: flex-end; height: 30px; margin: 4px 0; }
.minis span { width: 10px; height: 28px; background: var(--line); display: flex; align-items: flex-end; border-radius: 2px; }
.minis span i { display: block; width: 100%; background: var(--accent2); border-radius: 2px; }
.lg.c-valka { border-left: 3px solid var(--bad); padding-left: 5px; } .lg.c-rod { border-left: 3px solid #a85e7f; padding-left: 5px; } .lg.c-rise, .lg.c-cirkev { border-left: 3px solid #7a5ea8; padding-left: 5px; }

/* --- plánovač, bitva, cesty, pochody --- */
svg.map .route { fill: none; stroke-width: 3.5; stroke-opacity: .75; stroke-linecap: round; stroke-linejoin: round; }
svg.map .route.cut { stroke-dasharray: 4 4; stroke-opacity: .5; }
svg.map .march { fill: none; stroke-width: 2.5; stroke-linejoin: round; }
svg.map .march.own { stroke: #1f5fa8; } svg.map .march.foe { stroke: var(--bad); stroke-dasharray: 5 3; }
svg.map .mo { fill: #1f5fa8; } svg.map .mf { fill: var(--bad); }
.rdot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
tr.muted td { opacity: .55; }
#modal .box.wide { max-width: 820px; }
.bgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 8px 0; }
.bside { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 0; }
.orders { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 6px; }
.orders .ch { margin: 0; }
@media (max-width: 600px) { .bgrid { grid-template-columns: 1fr; } }

/* ===== Rozvržení ve stylu Europa Universalis ===== */
:root { --frame: #2a2017; --frame2: #3a2d20; --gold: #e2c27a; --gold2: #b8964f; --sea: #84aac4; }
html, body { height: 100%; }
body { display: grid; grid-template-rows: auto 1fr; grid-template-columns: auto 1fr; height: 100vh; overflow: hidden; }
header#top { grid-column: 1 / -1; position: relative; top: 0; background: linear-gradient(var(--frame2), var(--frame)); color: #efe3c5; border-bottom: 2px solid var(--gold2); padding: 5px 12px; gap: 6px 10px; flex-wrap: nowrap; overflow-x: auto; }
header#top .realm { color: var(--gold); gap: 8px; font-size: 14px; flex: none; }
header#top .realm small { display: block; font-size: 11px; color: #cdbb94; font-weight: normal; }
header#top .muted, header#top small { color: #cdbb94; }
.resbar { display: flex; gap: 4px; flex-wrap: nowrap; }
.res { display: inline-flex; align-items: center; gap: 4px; background: rgba(0,0,0,.28); border: 1px solid rgba(226,194,122,.25); border-radius: 4px; padding: 2px 7px; white-space: nowrap; font-size: 13px; }
.res .ico { width: 14px; height: 14px; stroke: var(--gold); }
.res .rl { display: none; }
.res small { font-size: 11px; }
.res.bad b { color: #ff9a8a; } .res.good b { color: #9fe39f; } .res.warn b { color: #f3c46b; }
header#top .good { color: #9fe39f; } header#top .bad { color: #ff9a8a; }
.mpdot { display: inline-flex; width: 16px; height: 16px; border-radius: 50%; color: #fff; font-style: normal; font-size: 10px; font-weight: bold; align-items: center; justify-content: center; border: 1px solid rgba(0,0,0,.4); flex: none; }
.mpdot.big { width: 26px; height: 26px; font-size: 14px; }
.clock { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; color: var(--gold); flex: none; }
.speed { display: inline-flex; gap: 1px; }
.speed .b { background: rgba(0,0,0,.3); color: #efe3c5; border-color: rgba(226,194,122,.3); padding: 1px 6px; }
.speed .b.on { background: var(--gold2); color: #1c140c; }
.speed .ico { width: 12px; height: 12px; fill: currentColor; stroke: none; }
header#top button.main { flex: none; background: #8c2f1f; border: 1px solid var(--gold2); }
nav#tabs { grid-row: 2; grid-column: 1; flex-direction: column; flex-wrap: nowrap; gap: 2px; padding: 6px 4px; background: var(--frame); border-right: 2px solid var(--gold2); border-bottom: none; overflow-y: auto; width: 56px; }
nav#tabs button { border: 1px solid transparent; border-radius: 6px; background: transparent; color: #cdbb94; padding: 7px 0; justify-content: center; position: relative; width: 46px; }
nav#tabs button span { display: none; }
nav#tabs button .ico { width: 22px; height: 22px; stroke: currentColor; }
nav#tabs button:hover, nav#tabs button.on { background: var(--frame2); color: var(--gold); border-color: var(--gold2); font-weight: normal; }
nav#tabs button:hover span { display: block; position: absolute; left: 52px; top: 50%; transform: translateY(-50%); background: var(--frame); color: var(--gold); padding: 3px 8px; border: 1px solid var(--gold2); border-radius: 4px; white-space: nowrap; z-index: 40; font-size: 13px; }
.badge { position: absolute; top: 1px; right: 1px; background: var(--accent2); color: #fff; font-style: normal; font-size: 10px; border-radius: 8px; padding: 0 4px; line-height: 14px; }
.badge.bad { background: #b0301f; }
main#main { grid-row: 2; grid-column: 2; position: relative; padding: 0; max-width: none; margin: 0; overflow: hidden; display: grid; grid-template-columns: 1fr 330px; min-height: 0; }
#mapwrap { position: relative; overflow: hidden; background: var(--sea); min-width: 0; min-height: 0; }
#mapwrap svg.map.eu { width: 100%; height: 100%; border-radius: 0; background: var(--sea); touch-action: none; cursor: grab; }
svg.map.eu .sea { fill: var(--sea); }
svg.map.eu .river { fill: none; stroke: #5f8fb3; stroke-linecap: round; stroke-linejoin: round; opacity: .9; }
svg.map.eu .mtn { fill: rgba(120, 100, 75, .55); stroke: #5d4b36; stroke-width: .6; pointer-events: none; }
svg.map.eu .tree { fill: #3f6b35; stroke: #2c4a25; stroke-width: .4; pointer-events: none; }
svg.map.eu .marsh { stroke: #4d7364; stroke-width: .8; pointer-events: none; }
svg.map.eu .hit { stroke: none; fill: transparent; }
svg.map.eu .siege { fill: none; stroke: #c0301f; stroke-width: 1.4; stroke-dasharray: 3 2; }
svg.map.eu .selring { fill: none; stroke: #fff; stroke-width: 2; filter: drop-shadow(0 0 2px #000); }
svg.map.eu .castle { fill: #f2e8d0; stroke: #3a2e22; stroke-width: .8; }
svg.map.eu .capm { fill: #e2b13c; stroke: #3a2e22; stroke-width: .9; }
svg.map.eu .realmname { fill: rgba(40, 25, 10, .5); letter-spacing: .18em; font-weight: bold; pointer-events: none; font-family: Georgia, serif; }
svg.map.eu .lbl { fill: #1e160e; stroke: rgba(246, 238, 220, .85); stroke-width: 2.2px; paint-order: stroke; pointer-events: none; font-family: Georgia, serif; }
svg.map.eu .atok { cursor: pointer; } svg.map.eu .atok rect:first-of-type { stroke: #111; stroke-width: .8; }
svg.map.eu .atok.sel rect:first-of-type { stroke: #fff; stroke-width: 2; } svg.map.eu .atok.foe rect:first-of-type { stroke: #ff3b2b; stroke-width: 1.5; }
svg.map.eu .atok .mor { fill: #6fdc6f; } svg.map.eu .atok text { fill: #fff; font-size: 7.5px; font-weight: bold; font-family: Georgia, serif; paint-order: stroke; stroke: rgba(0,0,0,.6); stroke-width: 1.5px; }
.mmodes { position: absolute; left: 8px; bottom: 8px; display: flex; flex-wrap: wrap; gap: 3px; max-width: calc(100% - 120px); }
.mmodes .b, .zoom .b { background: rgba(42, 32, 23, .88); color: #efe3c5; border-color: var(--gold2); }
.mmodes .b.on { background: var(--gold2); color: #1c140c; }
.zoom { position: absolute; right: 8px; bottom: 8px; display: flex; gap: 3px; }
.zoom .b { width: 30px; font-size: 16px; }
.mlegend { position: absolute; left: 8px; bottom: 44px; background: rgba(246, 238, 220, .92); color: #2b2118; border: 1px solid var(--gold2); border-radius: 6px; padding: 4px 8px; font-size: 12px; display: flex; flex-wrap: wrap; gap: 4px 10px; max-width: 60%; }

    if (h.father) { const x = byName(h.father); if (x) { c.father = x.id; x.kids.push(c.id); } }

function dist(a, b) { const kx = 111 * Math.cos((a.lat + b.lat) / 2 * Math.PI / 180); return Math.hypot((a.lon - b.lon) * kx, (a.lat - b.lat) * 111); }

// ---------- nároky a záminky ----------

  if ((B.ban || 0) > s.turn && A.hre) return "klatba";

// ---------- okupace ----------

  if (friendly) { if (p.occ) news(s, `${C.house} osvobodili kraj ${p.n}.`, "valka", [a.cl, owner, p.occ]); p.occ = null; return; }
  const loot = Math.round((p.com * 2 + p.pop * 2) * (hasIdea(s, a.cl, "korist") ? 2 : 1)); C.gold += loot; s.clans[owner].gold = Math.max(0, s.clans[owner].gold - loot / 2);

    else { const esc = clanProvs(s, owner).filter(q => q.id !== p.id && !q.occ); if (esc.length) c.loc = (esc.find(q => q.id === s.clans[owner].capital) || esc[0]).id; }
  }

  if (isPlayer(s, owner) && !s.over) s.events.push({ id: "_lost", pid: p.id, by: a.cl });

}

// ---------- válečné skóre ----------
function warOf(s, a, b) { return s.wars.find(w => (w.a === a && w.b === b) || (w.a === b && w.b === a)); }

// ---------- mírová jednání ----------
// položky: {t:"kraj", pid} | {t:"zlato", g} | {t:"vazal"} | {t:"pripojit"} | {t:"bila"}
function provPeaceCost(s, winner, loser, p) { const tot = clanDev(s, loser) || 1; return Math.max(5, Math.round(100 * dev(p) / tot * (claimValid(s, winner, p.id) || p.cores.includes(winner) ? 0.7 : 1))); }

}
function peaceCostSum(items) { return sum(items.map(i => i.cost || 0)); }
function aiAcceptsPeace(s, from, to, items, fromIsWinner) {

}

    if (it.t === "zlato") { const g = Math.min(it.g, Math.max(0, L.gold)); L.gold -= g; W.gold += g; got.push(g + " zl"); }

}
function proposePeace(s, from, to, items, fromIsWinner) {

  if (aiAcceptsPeace(s, from, to, items, fromIsWinner)) { if (fromIsWinner) applyPeace(s, from, to, items); else applyPeace(s, to, from, items); return null; }
  addRel(s, from, to, -3); return `${s.clans[to].house} podmínky odmítli (válečné skóre ${warScore(s, from, to)}, požadováno ${peaceCostSum(items)}).`;
}
function greedyDemand(s, winner, loser, ws) {
  const all = peaceItems(s, winner, loser); if (all.some(i => i.t === "pripojit") && ws >= 95) return [all.find(i => i.t === "pripojit")];

    applyPeace(s, win, lose, aws >= 10 ? greedyDemand(s, win, lose, aws) : []);
  }
}

// ---------- agresivní expanze a koalice ----------
function aggressiveExpansion(s, cid, amount, pids) {
  const k = hasIdea(s, cid, "smir") ? 0.67 : 1;
  for (const o of aliveClans(s)) {
    if (o.id === cid || o.vassalOf === cid) continue;
    const near = pids && pids.length ? Math.min(...clanProvs(s, o.id).map(p => Math.min(...pids.map(id => dist(p, s.provs[id]))))) : 300;
    const f = near < 150 ? 1 : near < 350 ? 0.6 : 0.3;
    addRel(s, cid, o.id, -Math.round(amount / 6 * f * k));
  }
}
function coalitionTick(s) {
  if (s.turn % 3) return;
  const top = aliveClans(s).sort((a, b) => realmProvs(s, b.id) - realmProvs(s, a.id)).slice(0, 4).map(c => c.id);
  if (!top.includes(s.player)) top.push(s.player);
  for (const X of top) {
    if (!s.clans[X] || !s.clans[X].alive || (s.flags["coal_" + X] || 0) > s.turn) continue;
    const angry = aliveClans(s).filter(o => o.id !== X && rel(s, X, o.id) < -50 && !allied(s, X, o.id) && o.vassalOf !== X && !atWar(s, X, o.id) && truceUntil(s, X, o.id) <= s.turn && clanProvs(s, o.id).some(p => p.nb.some(n => s.provs[n].owner === X) || dist(p, s.provs[s.clans[X].capital] || p) < 400));
    if (angry.length < 3 || sum(angry.map(o => clanPower(s, o.id))) < clanPower(s, X) * 0.9 || !chance(s, 0.25)) continue;
    s.flags["coal_" + X] = s.turn + 60;
    for (const a of angry) for (const b of angry) if (a.id < b.id) s.alliances[pairKey(a.id, b.id)] = true;
    news(s, `Proti rodu ${s.clans[X].house} se zformovala koalice: ${angry.map(o => o.house).join(", ")}!`, "valka", [X]);
    for (const a of angry) declareWar(s, a.id, X, "koalice");
  }
}

// ---------- ideje a úkoly ----------
function nextIdea(s, cid, g) { return IDEAS[g].list.find(([id]) => !hasIdea(s, cid, id)); }
function buyIdea(s, cid, g) {
  const C = s.clans[cid], nx = nextIdea(s, cid, g); if (!nx) return "Skupina je hotová."; const k = IDEAS[g].mp;
  if (C.mp[k] < IDEA_COST) return `Potřebuješ ${IDEA_COST} bodů (${MP[k].n.toLowerCase()}).`;
  C.mp[k] -= IDEA_COST; C.ideas[nx[0]] = true; if (isPlayer(s, cid)) log(s, `Nová idea: ${nx[1]} (${nx[2]}).`, "politika", [cid]); return null;
}
function missionsFor(s, cid) { return MISSIONS.filter(m => !m.only || m.only === cid || (Array.isArray(m.only) && m.only.includes(cid))); }
function missionTick(s) {
  for (const C of aliveClans(s)) for (const m of missionsFor(s, C.id)) if (!C.missions[m.id] && m.t(s, C.id)) { C.missions[m.id] = s.turn; m.g(s, C.id); if (isPlayer(s, C.id)) { log(s, `Úkol splněn: ${m.n}! Odměna: ${m.r}.`, "rod", [C.id]); s.events.push({ id: "_mission", mid: m.id }); } }
}

// ---------- víra ----------
function convertProv(s, cid, c, p) {
  if (p.rel === relig(s, cid)) return "Kraj už vyznává tvou víru.";
  const ch = (0.12 + st(c, "roz") / 300) * (hasIdea(s, cid, "misie") ? 2 : 1) * (cid === "rad" ? 1.5 : 1);
  if (chance(s, ch)) { p.rel = relig(s, cid); p.loy = Math.max(0, p.loy - 5); return `kraj ${p.n} přijal víru ${RELIGIONS[p.rel].n}.`; }
  return `misie v kraji ${p.n} zatím nepřinesla obrácení.`;
}

// ---------- měsíční tah a umělá inteligence ----------
function euTick(s) {
  mpTick(s); weTick(s); coreTick(s);
  for (const C of aliveClans(s)) {
    for (const k of Object.keys(C.claims)) if (C.claims[k] <= s.turn) delete C.claims[k];
    if (hasIdea(s, C.id, "pout")) C.prestige += 0.5; if (hasIdea(s, C.id, "biskupove")) s.pope.op[C.id] = Math.min(100, (s.pope.op[C.id] || 0) + 0.5);
    if (!isPlayer(s, C.id)) aiEU(s, C.id);
  }
  aiPeaceTick(s); coalitionTick(s); missionTick(s);
}
function aiEU(s, cid) {
  const C = s.clans[cid];
  if (C.stab < 1 && C.mp.adm >= stabCost(s, cid)) raiseStab(s, cid);
  for (const p of clanProvs(s, cid)) if (!p.cores.includes(cid) && !p.coring && !p.occ && C.mp.adm >= coreCost(s, p) + 20) startCore(s, cid, p.id);
  if (C.we > 6 && C.mp.dip > 120) reduceWE(s, cid);
  for (const k of MP_IDS) if (C.mp[k] > 400) { const groups = Object.keys(IDEAS).filter(g => IDEAS[g].mp === k && nextIdea(s, cid, g)); if (groups.length && chance(s, 0.3)) buyIdea(s, cid, pick(s, groups)); else { const p = clanProvs(s, cid).filter(q => !q.occ).sort((a, b) => b.v - a.v)[0]; if (p) develop(s, cid, p.id, k); } }
  // nečinná vojska táhnou dál nebo domů
  for (const a of s.armies.filter(x => x.cl === cid && (!x.path || !x.path.length) && !x.engaged)) {
    const p = s.provs[a.loc]; if (p.siege && p.siege.army === a.id) continue;
    if (ctrl(p) === cid && p.owner !== cid) {
      const t = p.nb.map(n => s.provs[n]).filter(q => atWar(s, cid, ctrl(q)) && provDefense(s, q) * (q.occ ? 0.2 : 1) < troopPower(s, cid, a.t, { train: a.train }) * 1.1).sort((x, y) => dev(y) - dev(x))[0];
      if (t) orderArmy(s, cid, a.id, "tahnout", t.id); else armyHome(s, a);
    }
  }
}

// Umělá inteligence rodů (a správa svěřených krajů hráče).

function borderEnemies(s, cid, p) { return p.nb.filter(n => atWar(s, cid, ctrl(s.provs[n]))); }

function aiDomestic(s, cid, c, delegated) {
  const C = s.clans[cid], p = s.provs[c.loc]; if (!p || p.owner !== cid || p.siege) return;
  const reserve = delegated ? 120 : 60, gold = C.gold - reserve, war = enemiesOf(s, cid).length > 0, thr = threatened(s, cid, p);
  const tryCmd = (k, a, b) => doCmd(s, cid, c.id, k, a, b) === null;
  if (p.loy < 30 && C.grain > p.pop * 3 && tryCmd("lid")) return;
  if ((war || thr) && men(p.troops) < troopCap(p) * 0.75 && gold > 60) {
    const type = C.kone >= 20 && C.zbroj >= 10 && chance(s, 0.3) ? "jizda" : chance(s, 0.3) && C.zbroj > 5 ? "strelci" : "pesi";
    const n = Math.min(maxRecruit(s, p, c), Math.floor(gold / TROOPS[type].cost * 100 * 0.7));
    if (n >= 100 && tryCmd("nabor", type, n)) return;
  }
  if (men(p.troops) > 300 && p.train < (war || thr ? 65 : 45) && gold > 10 && tryCmd("vycvik")) return;
  if (!p.build && gold > 400 && chance(s, delegated ? 0.15 : 0.25)) {
    const opts = [];
    if (thr && p.castle < 3) opts.push("hrad"); if (BUILD.dul.need(p) && (p.b.dul || 0) < 2) opts.push("dul");
    if ((p.city || p.v >= 3) && (p.b.mesto || 0) < 2) opts.push("mesto"); if ((p.b.klaster || 0) < 1) opts.push("klaster");
    if (BUILD.vinice.need(p) && (p.b.vinice || 0) < 2) opts.push("vinice");
    const b = opts.find(x => !canBuild(s, cid, p, x)); if (b && tryCmd("stavba", b)) return;
  }
  if (gold > 30 && p.agri < agriCap(s, p) * 0.97 && (p.agri / agriCap(s, p) <= p.com / Math.max(1, comCap(s, p)) || p.com >= comCap(s, p)) && tryCmd("zemedelstvi")) return;
  if (gold > 30 && p.com < comCap(s, p) && tryCmd("obchod")) return;
  if (gold > 25 && p.dur < durMax(s, p) * 0.9 && tryCmd("hradby")) return;
  if (gold > 30 && men(p.troops) < troopCap(p) * 0.5 && !delegated) { const n = Math.min(maxRecruit(s, p, c), Math.floor(gold / 8 * 100 * 0.5)); if (n >= 100 && tryCmd("nabor", "pesi", n)) return; }
  if (!delegated && gold > 20 && chance(s, 0.4) && tryCmd("studium")) return;
  if (gold > 10 && chance(s, 0.15) && officers(s, cid).length < offCap(s, cid)) tryCmd("hledat");
}

function aiClan(s, cid) {
  const C = s.clans[cid]; if (!C.alive) return;
  const offs = officers(s, cid).filter(c => !c.army);
  // rozdělení vazalů do krajů bez purkrabího
  const empty = clanProvs(s, cid).filter(p => !officersIn(s, p.id).length && !p.siege);
  for (const p of empty) { const spare = offs.find(c => c.acted !== s.turn && c.id !== C.leader && officersIn(s, c.loc).length > 1 && s.provs[c.loc] && s.provs[c.loc].owner === cid); if (spare) doCmd(s, cid, spare.id, "presun", p.id); }

  for (const c of officers(s, cid)) if (c.acted !== s.turn && !c.army) aiDomestic(s, cid, c, false);
  aiDiplomacy(s, cid);
  if (C.gold > 450 && chance(s, 0.05)) { const p = clanProvs(s, cid).find(q => !q.hanza && (q.b.mesto || q.city) && ROUTES.find(R => R.hanza).provs.includes(q.id)); if (p) joinHanza(s, cid, p.id); }
  aiCaptives(s, cid);
}

function aiMilitary(s, cid) {
  const C = s.clans[cid], foes = enemiesOf(s, cid);
  // vojska v poli: rozhodnutí o zteči
  for (const a of s.armies.filter(x => x.cl === cid)) { const p = s.provs[a.loc]; if (p.siege && p.siege.army === a.id) a.siegeMode = troopPower(s, cid, a.t, { train: a.train }) > provDefense(s, p) * 1.6 ? "ztec" : "obleh"; }
  if (!foes.length) { aiWarDecision(s, cid); return; }
  const busy = new Set(s.armies.filter(x => x.cl === cid).map(x => x.to));
  if (s.armies.filter(x => x.cl === cid && x.mode === "utok").length >= 1 + Math.floor(clanProvs(s, cid).length / 6)) return;
  const options = [];
  for (const p of clanProvs(s, cid)) {
    if (p.siege || p.occ) continue;
    for (const n of borderEnemies(s, cid, p)) {
      const q = s.provs[n]; if (busy.has(n)) continue;
      const avail = {}; for (const k of TROOP_IDS) avail[k] = Math.floor((p.troops[k] || 0) * (threatened(s, cid, p) ? 0.7 : 0.9));
      const atk = troopPower(s, cid, avail, { train: p.train }), def = provDefense(s, q) * (s.armies.some(x => x.loc === n && x.cl === q.owner) ? 2 : 1);

    }
  }
  options.sort((a, b) => b.score - a.score);

  const disl = officers(S, me()).filter(c => c.loy < 35 && !c.dyn); if (disl.length) out.push(["warn", `Nespolehliví vazalové: ${disl.map(c => esc(c.n) + " (" + Math.round(c.loy) + ")").join(", ")}.`]);

    <label><input type="checkbox" data-a="deleg" data-x='["${p.id}"]' ${p.deleg ? "checked" : ""}> svěřit správu purkrabímu (rozkazy zadá sám)</label></div>

  ${card(`${shield(me(), 22)} ${esc(p.n)}`, provDetail(p) + `<div class="kv"><span>Měsíční výnos</span><span>${r1(provGold(S, p) + provMines(S, p).gold)} zl</span><span>Sklizeň (září)</span><span>asi ${Math.round(provHarvest(S, p))} obilí</span><span>Výcvik</span><span>${Math.round(p.train)}</span><span>Strop posádky</span><span>${fmt(troopCap(p))}</span><span>Stavba</span><span>${p.build ? BUILD[p.build.b].n + `, zbývá ${p.build.left} měs.` : "—"}</span></div>`)}
  ${card("Spokojenost lidu a obchod", (() => { const lb = loyBreakdown(S, p); return meter("Spokojenost", Math.round(p.loy), 100, p.loy < 30 ? "var(--bad)" : "var(--accent2)") + `<p class="small">Směřuje k <b>${lb.val}</b> (mění se pozvolna).</p>` + tbl(["Proč", "#"], lb.rows.map(r => tr([esc(r[0]), `<td class="n ${r[1] < 0 ? "bad" : "good"}">${sg(r[1])}</td>`]))); })() + `<h4>Obchodní cesty</h4>${provRoutes(p).map(R => `<div><span class="rdot" style="background:${R.col}"></span>${R.n} – průchodnost ${Math.round(routeState(S, R) * 100)} %</div>`).join("") || '<span class="muted small">Kraj neleží na žádné obchodní cestě.</span>'}<div class="small">Zisk z cest: ${r1(routeIncomeProv(S, p))} zl/měs.${p.hanza ? " · člen Hanzy" : ""}</div>`)}
  ${card("Posádka", troopBar(p.troops) + troopLegend() + tbl(["Druh", "#Mužů"], TROOP_IDS.map(k => tr([TROOPS[k].n, p.troops[k] || 0]))) + meter("Výcvik", Math.round(p.train), 100, "#a3332b") + `<p class="small">Celkem ${fmt(men(p.troops))} mužů, obranná síla ${r1(provDefense(S, p))}.</p>`)}
  ${card(`Vazalové v kraji – rozkazy (${offs.filter(c => c.acted !== S.turn).length} volných)`, tbl(["Vazal", "#Vůd", "#Uda", "#Roz", "#Spr", "Rozkaz", ""], rows) + `<p class="small muted">Každý vazal vykoná jeden rozkaz za měsíc. Výsledek závisí na jeho schopnostech (správa: rozvoj, vůdcovství: nábor a výcvik, rozum: zvědové, intriky a diplomacie).</p>`, "wide")}
  ${card("Vyslat vojsko", `<div class="kv"><span>Cíl</span>${sel("dto", reach.map(q => [q.id, `${q.n} (${q.owner === me() ? "vlastní" : S.clans[q.owner].house}, ${Math.round(dist(p, q))} km)`]), "")}<span>Druh</span>${sel("dmode", [["utok", "tažení (dobýt kraj)"], ["presun", "přesun posádky do vlastního kraje"]], "utok")}
    ${TROOP_IDS.map(k => `<span>${TROOPS[k].n}</span><span><input type="number" id="dt_${k}" value="${Math.floor((p.troops[k] || 0) * 0.7)}" min="0" max="${p.troops[k] || 0}"> / ${fmt(p.troops[k] || 0)}</span>`).join("")}
    <span>Velitel</span>${sel("dc1", cmOpts, cmOpts[1] ? cmOpts[1][0] : "")}<span>Druhý velitel</span>${sel("dc2", cmOpts, "")}<span>Třetí velitel</span>${sel("dc3", cmOpts, "")}
    <span>Zásoby (měsíce)</span><span><input type="number" id="dmon" value="4" min="1" max="12"> <span class="small muted">12 obilí na 1000 mužů a měsíc</span></span></div><div class="row">${btn("Vytáhnout", "dispatch", [p.id], null, "go")}</div>
    <p class="small muted">Velitelé určují, kolik mužů lze vést (součet podle hodností). Vojsko táhne jeden kraj za měsíc. V nepřátelském kraji oblehne hrad; zteč nařídíš v záložce Vojsko a války.</p>`)}
  </div>`;
}

// ---------- Vazalové ----------
function offCard(c) {
  const nx = RANKS[c.rank + 1], lordOf = Object.values(S.provs).filter(p => p.lord === c.id).map(p => p.n).join(", "), lead = c.id === P(S).leader;
  return `<div class="crest">${shield(me(), 44)}<div><div class="big">${esc(c.n)}</div><div class="muted">${RANKS[c.rank].n}, ${age(S, c)} let${c.hist ? ", historická postava" : ""}${c.dyn ? ", člen rodu" : ""}</div><div class="muted">${traitsTxt(c) || "bez zvláštních vlastností"}${c.burgher ? " · měšťan" : ""}${Object.entries(P(S).offices || {}).filter(([, v]) => v === c.id).map(([k]) => " · " + OFFICES[k].n).join("")}</div></div></div>
  ${STAT_IDS.map(k => meter(STATS[k], st(c, k), 100, { ved: "#a3332b", uda: "#b06a2e", roz: "#3f6fa8", spr: "#4f7f4f" }[k])).join("")}
  ${meter("Věrnost", Math.round(c.loy), 100, c.loy < 35 ? "var(--bad)" : "var(--accent2)")}
  ${c.dyn || lead ? "" : (() => { const lb = offLoyBreakdown(S, c); return `<details><summary>Proč je věrný(á) – směřuje k ${lb.val}</summary>${tbl(["Vliv", "#"], lb.rows.map(r => tr([esc(r[0]), `<td class="n ${r[1] < 0 ? "bad" : "good"}">${sg(r[1])}</td>`])))}</details>`; })()}
  ${nx ? meter("Zásluhy do hodnosti " + nx.n, Math.round(c.merit), nx.merit, "#7a5ea8") : ""}
  <div class="kv"><span>Kde</span><span>${c.army ? "s vojskem v poli" : esc(S.provs[c.loc] ? S.provs[c.loc].n : "?")}</span><span>Purkrabí v</span><span>${esc(lordOf) || "—"}</span><span>Velí až</span><span>${fmt(RANKS[c.rank].cmd)} mužům</span><span>Plat</span><span>${c.dyn || lead ? "—" : RANKS[c.rank].pay + " zl/měs."}</span></div>
  ${c.dyn || lead ? "" : `<div class="row">${btn("Povýšit", "promote", [c.id], nx && c.merit >= nx.merit ? null : "Málo zásluh")} <input type="number" id="rw_${c.id}" value="50" min="10" step="10"> ${btn("Odměnit", "reward", [c.id])} ${!lordOf && S.provs[c.loc] && S.provs[c.loc].owner === me() && !c.army ? btn("Jmenovat purkrabím", "lord", [c.loc, c.id]) : ""} ${btn("Propustit", "dismiss", [c.id], null, "danger")}</div>`}`;
}
function tVazalove() {
  const all = officers(S, me()); const k = SEL.sortOff;
  if (!all.some(c => c.id === SEL.off)) SEL.off = all[0] && all[0].id;
  const sorted = all.slice().sort((a, b) => k === "rank" ? b.rank - a.rank || b.merit - a.merit : k === "loy" ? a.loy - b.loy : st(b, k) - st(a, k));
  const rows = sorted.map(c => `<tr class="click${c.id === SEL.off ? " sel" : ""}" data-a="selOff" data-x='["${c.id}"]'><td><b>${esc(c.n)}</b>${c.dyn ? ' <span class="tag">rod</span>' : ""}${Object.values(S.provs).some(p => p.lord === c.id) ? ' <span class="tag">purkrabí</span>' : ""}</td>${tdn(age(S, c))}${STAT_IDS.map(x => statBar(st(c, x))).join("")}<td>${RANKS[c.rank].n}</td>${statBar(c.loy, c.loy < 35 ? "low" : "")}<td>${c.army ? '<span class="warn">v poli</span>' : esc(S.provs[c.loc] ? S.provs[c.loc].n : "?")}</td></tr>`);
  const caps = Object.values(S.chars).filter(c => c.st === "cap" && c.capBy === me()).map(c => tr([esc(c.n), c.cl && S.clans[c.cl] ? chip(c.cl) : "—", ...STAT_IDS.map(x => statBar(st(c, x))), RANKS[c.rank].n, `${btn("Propustit", "captive", [c.id, "propustit"])} ${btn("Výkupné", "captive", [c.id, "vykupne"])} ${btn("Naverbovat", "captive", [c.id, "naverbovat"])} ${btn("Popravit", "captive", [c.id, "popravit"], null, "danger")}`]));
  const mineCap = Object.values(S.chars).filter(c => c.st === "cap" && c.cl === me()).map(c => tr([esc(c.n), chip(c.capBy), RANKS[c.rank].n]));
  const wand = Object.values(S.chars).filter(c => c.st === "wand" && S.provs[c.loc] && S.provs[c.loc].owner === me()).length;
  const sel_ = chr(S, SEL.off);
  return `<div class="grid split">${card(`Vazalové (${all.length})`, `<div class="row">Řadit: ${[["rank", "hodnost"], ["ved", "vůdcovství"], ["uda", "udatnost"], ["roz", "rozum"], ["spr", "správa"], ["loy", "nejméně věrní"]].map(([x, n]) => btn(k === x ? `<b>${n}</b>` : n, "sortOff", [x])).join("")}</div>` +
    tbl(["Jméno", "#Věk", "#Vůdc.", "#Udat.", "#Rozum", "#Správa", "Hodnost", "#Věrnost", "Kde"], rows) + `<p class="small muted">Klikni na vazala pro podrobnosti a odměny. V tvých krajích se potuluje ${wand} schopných mužů – najdeš je rozkazem „Hledat schopné muže“.</p>`)}
    ${sel_ ? card("Vazal", offCard(sel_), "sticky") : ""}
    ${officesCard()}
    ${card("Zajatci v tvém žaláři", tbl(["Jméno", "Rod", "#Vůdc.", "#Udat.", "#Rozum", "#Správa", "Hodnost", ""], caps), "wide")}
    ${mineCap.length ? card("Tvoji lidé v zajetí", tbl(["Jméno", "Drží je", "Hodnost"], mineCap)) : ""}</div>`;
}

// ---------- Vojsko ----------
function tVojsko() {
  const mine = S.armies.filter(a => a.cl === me()).map(a => { const p = S.provs[a.loc];
    const tgt = Object.values(S.provs).filter(q => atWar(S, me(), q.owner)).sort((x, y) => dist(p, x) - dist(p, y)).slice(0, 15);
    return tr([`${esc(a.cmds.map(id => chr(S, id).n).join(", ") || "bez velitele")}`, esc(p.n) + (a.path && a.path.length ? ` → ${esc(S.provs[a.to].n)} (${marchTime(S, a.path) - (a.slow ? 1 : 0)} měs.)` : "") + (a.slow ? '<div class="small muted">brodí se těžkým terénem</div>' : ""), fmt(men(a.t)), troopBar(a.t), `<td class="n ${cls(a.morale, 40, 70)}">${Math.round(a.morale)}</td>`, `<td class="n">${Math.round(a.grain)}</td>`,
      p.siege && p.siege.army === a.id ? `obléhá (${p.siege.months}. měs., hradby ${Math.round(p.dur)}, posádka ${estimate(S, p, men(p.troops))})` : a.mode === "presun" ? "přesun" : "pochod",
      `${btn(a.siegeMode === "ztec" ? "<b>Zteč</b>" : "Zteč", "army", [a.id, "ztec"])} ${btn(a.siegeMode === "obleh" ? "<b>Obléhat</b>" : "Obléhat", "army", [a.id, "obleh"])} ${sel("ato_" + a.id, tgt.map(q => [q.id, q.n]), "")} ${btn("Táhnout", "army", [a.id, "tahnout"])} ${btn("Domů", "army", [a.id, "domu"])}<div class="row small">${sel("tac_" + a.id, Object.entries(TACTICS).map(([k, T]) => [k, T.n]), a.tac || "vyvazena", `data-a="tac" data-x='["${a.id}"]' title="Sestava pro bitvy"`)} <label title="Bitvy povedeš kolo po kole sám"><input type="checkbox" data-a="manual" data-x='["${a.id}"]' ${a.manual ? "checked" : ""}> velet osobně</label></div>`]); });
  const foes = S.armies.filter(a => a.cl !== me() && (knows(S, S.provs[a.loc]) || atWar(S, me(), a.cl))).map(a => tr([chip(a.cl), esc(S.provs[a.loc].n), knows(S, S.provs[a.loc]) ? estimate(S, S.provs[a.loc], men(a.t)) : "?", a.to ? esc(S.provs[a.to].n) : "", atWar(S, me(), a.cl) ? '<span class="bad">nepřítel</span>' : ""]));
  const wars = S.wars.filter(w => w.a === me() || w.b === me()).map(w => { const o = w.a === me() ? w.b : w.a; return tr([chip(o), `${Math.floor((S.turn - w.start) / 12)} r. ${(S.turn - w.start) % 12} m.`, fmt(clanMen(S, o)) + " (odhad)", clanProvs(S, o).length, allied(S, me(), o) ? "" : ""]); });
  const garr = clanProvs(S, me()).sort((a, b) => men(b.troops) - men(a.troops)).map(p => tr([btn(esc(p.n), "prov", [p.id]), `<td class="wbar">${troopBar(p.troops)}</td>`, ...TROOP_IDS.map(k => p.troops[k] || 0), men(p.troops), Math.round(p.train), p.nb.some(n => atWar(S, me(), S.provs[n].owner)) ? '<span class="bad">fronta</span>' : ""]));
  const bat = S.battles.filter(b => b.a === me() || b.b === me()).slice(0, 25).map(b => tr([b.d, esc(b.place), b.kind, chip(b.a), `${fmt(b.aStart)} → ${fmt(b.aEnd)}`, chip(b.b), `${fmt(b.bStart)} → ${fmt(b.bEnd)}`, b.win === me() ? '<span class="good">vítězství</span>' : '<span class="bad">porážka</span>', `<details><summary>${b.rounds.length} kol${b.retreat ? ", ústup" : ""}</summary>${battleChart(b)}${b.why ? tbl(["Proč to dopadlo takhle", "#Útočník", "#Obránce"], b.why.map(w => tr([w[0], `<td class="n">${esc(w[1])}</td>`, `<td class="n">${esc(w[2])}</td>`]))) : ""}${b.rounds.map((r, i) => `${i + 1}. kolo: ${r[4] ? ORDERS[r[4]].n + " × " + ORDERS[r[5]].n + " – " : ""}ztráty ${r[0]} / ${r[1]} (síla ${r[2]} : ${r[3]})`).join("<br>")}<br>Velitelé: ${esc(b.aCmd)} × ${esc(b.bCmd)}${b.fate.length ? "<br>" + esc(b.fate.join(", ")) : ""}</details>`]));
  return `<div class="grid">${card("Války", tbl(["Nepřítel", "Trvá", "#Jeho vojsko", "#Jeho kraje", ""], wars) + '<p class="small muted">Mír sjednáš poselstvem (záložka Diplomacie nebo rozkaz vazala).</p>')}
  ${card("Nepřátelská a cizí vojska v dohledu", tbl(["Rod", "Kde", "#Mužů", "Cíl", ""], foes))}
  ${card("Tvá vojska v poli", tbl(["Velitelé", "Kde", "#Mužů", "Složení", "#Morálka", "#Obilí", "Stav", "Rozkazy"], mine), "wide")}
  ${card("Sestavy a taktika", `<div class="kv"><span>Obrana hradů</span>${sel("deftac", Object.entries(TACTICS).map(([k, T]) => [k, T.n]), P(S).defTac || "sik", `data-a="defTac" data-x='[]'`)}</div>` + tbl(["Sestava", "Popis"], Object.values(TACTICS).map(T => tr([`<b>${T.n}</b>`, `<span class="small">${T.d}</span>`]))) + '<p class="small muted">Sestavu vojska zvolíš u každého vojska v poli. „Velet osobně“ znamená, že o rozkazech v každém kole bitvy rozhodneš sám.</p>')}
  ${card("Posádky", troopLegend() + tbl(["Kraj", "Složení", ...TROOP_IDS.map(k => "#" + TROOPS[k].n.split(" ")[0]), "#Celkem", "#Výcvik", ""], garr), "wide")}
  ${card("Bitvy", tbl(["Kdy", "Kde", "Druh", "Útočník", "#Muži", "Obránce", "#Muži", "Výsledek", "Průběh"], bat), "wide")}</div>`;
}

// ---------- Diplomacie ----------
function relStatus(c) {
  return [atWar(S, me(), c.id) ? '<span class="pill bad">válka</span>' : "", allied(S, me(), c.id) ? '<span class="pill good">spojenec</span>' : "", truceUntil(S, me(), c.id) > S.turn ? `<span class="pill">příměří ${truceUntil(S, me(), c.id) - S.turn} m.</span>` : "", married(S, me(), c.id) ? '<span class="pill">sňatek</span>' : "",
    c.vassalOf === me() ? '<span class="pill good">tvůj vazal</span>' : c.vassalOf ? `<span class="pill">vazal: ${esc(S.clans[c.vassalOf].house.split(" (")[0])}</span>` : "", P(S).vassalOf === c.id ? '<span class="pill">tvůj lenní pán</span>' : "", c.excom > S.turn ? '<span class="pill bad">klatba</span>' : "", (c.ban || 0) > S.turn ? '<span class="pill bad">říšská klatba</span>' : ""].join("");
}
function relBar(r) { const f = (r + 100) / 2; return `<span class="relbar" title="vztah ${Math.round(r)}"><i style="left:${Math.min(50, f)}%;width:${Math.abs(f - 50)}%;background:${r < 0 ? "var(--bad)" : "var(--good)"}"></i><b style="left:50%"></b></span>`; }
function tDiplo() {
  const others = aliveClans(S).filter(c => c.id !== me()).sort((a, b) => clanProvs(S, b.id).length - clanProvs(S, a.id).length);
  if (!others.some(c => c.id === SEL.dip)) SEL.dip = others[0] && others[0].id;
  const rows = others.map(c => `<tr class="click${c.id === SEL.dip ? " sel" : ""}" data-a="selDip" data-x='["${c.id}"]'><td class="shc">${shield(c.id, 20)}</td><td><b>${esc(c.house)}</b><div class="small muted">${esc(c.n)}</div></td>${tdn(clanProvs(S, c.id).length)}${tdn("~" + fmt(Math.round(clanMen(S, c.id) / 500) * 500))}<td class="n">${Math.round(rel(S, me(), c.id))} ${relBar(rel(S, me(), c.id))}</td><td>${relStatus(c)}</td></tr>`);
  const T = S.clans[SEL.dip]; let dossier = "";
  if (T) {
    const L = leaderOf(S, T.id), envoys = officers(S, me()).filter(c => c.acted !== S.turn && !c.army && S.provs[c.loc] && S.provs[c.loc].owner === me()).sort((a, b) => st(b, "roz") - st(a, "roz"));
    const foes = enemiesOf(S, T.id), friends = aliveClans(S).filter(o => o.id !== T.id && allied(S, T.id, o.id)), kin = aliveClans(S).filter(o => o.id !== T.id && married(S, T.id, o.id));
    const best = aliveClans(S).filter(o => o.id !== T.id).sort((a, b) => rel(S, T.id, b.id) - rel(S, T.id, a.id));
    dossier = card("Rod", `<div class="crest">${shield(T.id, 64)}<div><div class="big">${esc(T.house)}</div><div>${esc(T.n)}</div><div class="muted">${esc(cap(T.t))} ${esc(L ? L.n : "—")}${L ? ` (${age(S, L)} let)${L.st === "cap" ? ", v zajetí" : ""}` : ""}</div><div class="muted">${T.hre ? "říšské knížectví" : "mimo říši"}${T.titles.length ? " · " + T.titles.join(", ") : ""}</div></div></div>
      <div>${relStatus(T) || '<span class="muted small">žádné smlouvy</span>'}</div>
      ${meter("Vztah k tobě", Math.round(rel(S, me(), T.id)) + 100, 200, rel(S, me(), T.id) < 0 ? "var(--bad)" : "var(--good)")}
      <div class="kv"><span>Kraje</span><span>${clanProvs(S, T.id).map(p => esc(p.n)).join(", ")}</span><span>Vojsko</span><span>asi ${fmt(Math.round(clanMen(S, T.id) / 500) * 500)} mužů</span><span>Prestiž</span><span>${fmt(T.prestige)}</span><span>Válčí s</span><span>${foes.map(f => chip(f)).join(" ") || "—"}</span><span>Spojenci</span><span>${friends.map(f => chip(f.id)).join(" ") || "—"}</span><span>Spřízněni s</span><span>${kin.map(f => chip(f.id)).join(" ") || "—"}</span><span>Přátelé</span><span>${best.slice(0, 2).map(f => chip(f.id)).join(" ")}</span><span>Nepřátelé</span><span>${best.slice(-2).map(f => chip(f.id)).join(" ")}</span></div>
      ${warPeaceBlock(T)}
      <h4>Poselstvo</h4><div class="kv"><span>Vyslanec</span>${sel("env_" + T.id, [["", "— vyber —"]].concat(envoys.map(c => [c.id, `${c.n} (rozum ${st(c, "roz")})`])), envoys[0] ? envoys[0].id : "")}<span>Jednání</span>${sel("dt_" + T.id, Object.entries(DIPLO).map(([k, d]) => [k, d.n]), atWar(S, me(), T.id) ? "mir" : "dar")}</div>
      <div class="row">${btn("Vyslat poselstvo", "dip", [T.id], envoys.length ? null : "Žádný volný vazal", "go")} ${atWar(S, me(), T.id) ? "" : btn(SEL.warConfirm === T.id ? "<b>Opravdu vyhlásit válku?</b>" : "Vyhlásit válku", "war", [T.id], null, "danger")}</div>
      <p class="small muted">Poselstvo spotřebuje měsíční rozkaz vyslance; jeho rozum zvyšuje šanci. Porušení příměří či spojenectví stojí prestiž a přízeň papeže, útok na církevní zemi papeže rozzlobí. Vymře-li spřízněný rod, zdědíš jeho země.</p>`, "sticky");
  }
  return `<div class="grid split">${card("Rody střední Evropy", tbl(["", "Rod", "#Kraje", "#Vojsko", "#Vztah", "Smlouvy"], rows))}${dossier}</div>`;
}

// ---------- Říše a církev ----------
function tRise() {
  const H = S.hre, C = P(S), cands = candidates(S), holders = electorHolders(S);
  const el = Object.entries(holders).map(([t, cid]) => tr([`Kurfiřt – ${t}`, chip(cid), cid === me() ? "ty" : `vztah ${Math.round(rel(S, me(), cid))}`, ""]))
    .concat(EXT_ELECTORS.map(e => tr([esc(cap(extElectorName(S, e))), "mimo mapu", `přízeň k tobě ${Math.round(H.ext[e.id][me()] || 0)}`, H.election ? `<input type="number" id="br_${e.id}" value="100" min="50" step="50"> ${btn("Poslat dary", "bribe", [e.id])}` : ""])));
  const last = H.lastElection ? `<h4>Poslední volba (${H.lastElection.d})</h4>${tbl(["Kurfiřt", "Hlas"], H.lastElection.votes.map(v => tr([esc(v[0]), esc(v[1])])))}<p>${esc(H.lastElection.txt || "")}</p>` : "";
  const crowns = Object.entries(CROWNS).map(([k, K]) => { const h = crownHolder(S, k), own = K.core.filter(id => S.provs[id].owner === me()).length;
    return tr([`<b>${k}</b>`, h ? chip(h.id) : "<i>neobsazena</i>", `${own}/${K.core.length}`, esc(S.provs[K.cap].n), btn("Korunovat se", "crown", [k], canCrown(S, me(), k))]); });
  const pope = aliveClans(S).sort((a, b) => (S.pope.op[b.id] || 0) - (S.pope.op[a.id] || 0)).slice(0, 12).map(c => tr([chip(c.id), `<td class="n ${cls(S.pope.op[c.id] || 0, -20, 40)}">${Math.round(S.pope.op[c.id] || 0)}</td>`, c.excom > S.turn ? '<span class="bad">klatba</span>' : ""]));
  const hreClans = aliveClans(S).filter(c => c.hre && c.id !== me());
  return `<div class="grid">${card("Svatá říše římská", `<div class="kv"><span>Římský král</span><span>${hreKingTxt()}</span><span>Volba</span><span>${H.election ? `${MONTHS[(S.month + H.election - S.turn) % 12]} ${S.year + Math.floor((S.month + H.election - S.turn) / 12)}` : "nevypsána"}</span><span>Tvůj rod</span><span>${C.hre ? "říšské knížectví" : "mimo říši"}</span></div>
    <h4>Kandidáti</h4>${tbl(["Kandidát", ""], cands.map(c => tr([esc(c.n), c.ext ? "cizí kandidát (zlato pro arcibiskupy)" : ""])))}
    <div class="row">${btn("Ucházet se o římskou korunu", "stand", [], C.candidate ? "Už kandiduješ" : null)}</div>

    ${H.kingClan === me() ? `<h4>Pravomoci římského krále</h4><div class="row">${sel("banT", hreClans.map(c => [c.id, c.house]), "")} ${btn("Uvalit říšskou klatbu (50 prestiže)", "ban")} ${btn("Jet do Říma ke korunovaci (800 zl)", "coronation", [], H.emperor ? "Už jsi císař" : null)}</div><p class="small muted">Říšská klatba dovolí válku bez ztráty cti a ostatní knížata se proti postiženému obrátí. Římský král dostává 35 zl měsíčně z říšských příjmů a snáze žádá lenní hold od říšských knížat.</p>` : ""}
    <p class="small muted">Sedm kurfiřtů: tři rýnští arcibiskupové (mimo mapu – získáš je dary a přízní papeže) a držitelé Čech, Falce, Saska a Braniborska (hlasují podle vztahů). Hlas drží rod, který ovládá sídelní kraj (Praha, Rýnská Falc, Wittenbersko, Braniborsko).</p>`, "wide")}
  ${card("Královské koruny", tbl(["Koruna", "Drží", "#Tvé jádro", "Korunovační kraj", ""], crowns) + '<p class="small muted">Ke korunovaci musíš držet korunovační kraj a polovinu jádra koruny, mít přízeň papeže aspoň 30 a 500 zl.</p>')}
  ${card(`Papež ${esc(S.pope.n)}`, `<div class="kv"><span>Přízeň k tobě</span><span>${Math.round(S.pope.op[me()] || 0)}</span><span>Klatba</span><span>${C.excom > S.turn ? `ano, ještě ${C.excom - S.turn} měs.` : "ne"}</span></div><div class="row">${btn("Dar Svatému stolci (100 zl)", "popeGift")} ${btn("Veřejné pokání (250 zl)", "penance", [], C.excom > S.turn ? null : "Nejsi v klatbě")}</div>` + tbl(["Rod", "#Přízeň", ""], pope) + '<p class="small muted">Klatba (pod −60) snižuje věrnost vazalů i lidu. Přízeň zvedají dary, kláštery, výprava do Pruska a poslušnost Římu; snižují ji útoky na církevní země, popravy a zrada příměří.</p>')}</div>`;
}

// ---------- Hospodářství ----------
const INC_N = { obchod: "Obchodní cesty a clo", domeny: "Panské dvory a regálie", kraje: "Daně a dávky z krajů", doly: "Doly a solivary", dan_vazalu: "Poplatky vazalů / lennímu pánovi", rise: "Říšské příjmy", cirkev: "Církevní statky (investitura)" };
const EXP_N = { platy: "Platy vazalů", vojsko: "Vydržování vojska", dvur: "Dvůr", uroky: "Úroky" };
function tHosp() {
  const C = P(S), b = clanBudget(S, me());
  const rows = clanProvs(S, me()).sort((a, c) => provGold(S, c) - provGold(S, a)).map(p => tr([btn(esc(p.n), "prov", [p.id]), r1(provGold(S, p)), r1(provMines(S, p).gold), Math.round(provHarvest(S, p)), r1(garrisonGrain(p)), p.agri, p.com, Math.round(p.loy), p.deleg ? "purkrabí" : "<b>ty</b>"]));
  return `<div class="grid">${card("Měsíční příjmy", tbl(["Zdroj", "#Zlatých"], Object.entries(b.inc).map(([k, v]) => tr([INC_N[k], v]))) + `<p><b>Celkem ${fmt(sum(Object.values(b.inc)))} zl</b></p>`)}
  ${card("Měsíční výdaje", tbl(["Položka", "#Zlatých"], Object.entries(b.ex).map(([k, v]) => tr([EXP_N[k], v]))) + `<p><b>Celkem ${fmt(sum(Object.values(b.ex)))} zl</b> · bilance <b class="${b.net < 0 ? "bad" : "good"}">${sg(b.net)}</b></p>`)}
  ${card("Daně a obilí", `<div class="kv"><span>Daňová zátěž</span>${sel("taxs", TAX_LEVELS.map((t, i) => [i, t]), C.tax, `data-a="tax" data-x='[]'`)}<span>Obilí</span><span>${fmt(C.grain)} (spotřeba posádek a vojsk ${r1(clanGrainUse(S, me()))} měsíčně)</span><span>Poslední žně</span><span>${fmt(C.last.harvest || 0)} (v září)</span><span>Koně / zbroj</span><span>${fmt(C.kone)} / ${fmt(C.zbroj)}</span><span>Inflace</span><span>${Math.round(S.inflation * 100)} %</span></div><p class="small muted">Vyšší daně = víc zlata, ale nižší spokojenost lidu (a tím i výnos a sklizeň).</p>`)}
  ${card("Trh", tbl(["Zboží", "#Máš", "#Nákup", "#Prodej", ""], Object.entries(GOODS).map(([g, G]) => tr([G.n, Math.floor(C[g === "obili" ? "grain" : g] || 0), r1(price(S, g) * 1.15), r1(price(S, g) * 0.85), `<input type="number" id="q_${g}" value="100" min="1" step="50"> ${btn("Koupit", "buy", [g])} ${btn("Prodat", "sell", [g])}`]))) + '<p class="small muted">Koně a zbroj potřebuješ k verbování jízdy a střelců. Hřebčíny a železné doly je vyrábějí.</p>')}
  ${routesCard()}
  ${card("Lombardští bankéři", tbl(["#Jistina", "#Úrok/měs.", ""], (C.debts || []).map((d, i) => tr([d.amount, r1(d.amount * d.rate), btn("Splatit", "repay", [i])]))) + `<div class="row"><input type="number" id="loan" value="200" step="100"> ${btn("Půjčit si", "borrow")} <span class="small muted">strop ${maxLoan(S, me())} zl</span></div>`)}
  ${card("Kraje", tbl(["Kraj", "#Zlato/měs.", "#Doly", "#Sklizeň", "#Obilí/měs.", "#Pole", "#Obchod", "#Spokoj.", "Správa"], rows), "wide")}</div>`;
}

// ---------- Stavy a zákony ----------
function tStavy() {
  const C = P(S);
  const est = ESTATE_IDS.map(e => { const t = estateTarget(S, e); return tr([`<b>${ESTATES[e]}</b>`, `<td class="n ${cls(C.estates[e], 30, 60)}">${Math.round(C.estates[e])}</td>`, bar(C.estates[e]), t.val, `<details><summary>proč</summary>${tbl(["Vliv", "#"], t.rows.map(r => tr([esc(r[0]), `<td class="n ${r[1] < 0 ? "bad" : "good"}">${sg(r[1])}</td>`])))}</details>`]); });
  const laws = Object.entries(LAWS).map(([l, L]) => tr([`<b>${L.n}</b><div class="small muted">${L.d}</div>`, sel("law_" + l, L.opts.map((o, i) => [i, o]), C.laws[l], `data-a="law" data-x='["${l}"]' ${(C.lawCd[l] || 0) > S.turn ? "disabled" : ""}`), (C.lawCd[l] || 0) > S.turn ? `za ${C.lawCd[l] - S.turn} měs.` : "lze měnit"]));

  ${card("Zákony země", tbl(["Zákon", "Platí", "Změna"], laws) + '<p class="small muted">Změna zákona stojí 20 prestiže a další změna je možná po dvou letech.</p>', "wide")}</div>`;
}

// ---------- Rod ----------
function famCard(c, role) {
  if (!c) return "";
  const H = heirsOf(S, me())[0];
  return `<div class="fam ${c.sex === "f" ? "f" : "m"}${c.st === "dead" ? " dead" : ""}"><div class="fn">${esc(c.n)}${c.id === P(S).leader ? " ♛" : ""}</div><div class="small muted">${role || (c.sex === "m" ? "syn" : "dcera")}, ${age(S, c)} let${H && H.id === c.id ? ", <b>dědic</b>" : ""}${c.st === "cap" ? ", v zajetí" : ""}${c.c ? ", duchovní" : ""}</div>
    <div class="minis">${STAT_IDS.map(k => `<span title="${STATS[k]}"><i style="height:${st(c, k) * 0.28}px"></i></span>`).join("")}</div>
    ${c.spouse && chr(S, c.spouse) && role !== "choť" ? `<div class="small">∞ ${esc(chr(S, c.spouse).n)}</div>` : ""}
    ${c.st === "kid" ? sel("fo_" + c.id, [["", "výchova: volná"], ["ved", "vojevůdce"], ["uda", "rytířská"], ["roz", "učená"], ["spr", "správní"]], c.focus || "", `data-a="focus" data-x='["${c.id}"]'`) : ""}</div>`;
}
function tRod() {
  const C = P(S), L = leaderOf(S, me()), sp = L && chr(S, L.spouse), H = heirsOf(S, me());
  const kids = L ? L.kids.map(id => chr(S, id)).filter(c => c && c.st !== "dead") : [];
  const others = Object.values(S.chars).filter(c => c.cl === me() && c.dyn && c.st !== "dead" && c !== L && c !== sp && !kids.includes(c));
  const dead = Object.values(S.chars).filter(c => c.dyn && c.st === "dead" && c.cl === me()).slice(-15).map(c => tr([esc(c.n), c.died || ""]));
  return `<div class="grid">${card("Rodokmen " + esc(C.house), `<div class="tree"><div class="gen">${famCard(L, cap(C.t))}${sp ? famCard(sp, "choť") : '<div class="fam empty">bez choti</div>'}</div>
    ${kids.length ? `<div class="stem"></div><div class="gen kids">${kids.map(c => famCard(c)).join("")}</div>` : '<p class="muted small">Zatím bez potomků.</p>'}
    ${others.length ? `<h4>Další členové rodu</h4><div class="gen kids">${others.map(c => famCard(c, c.sex === "m" ? "příbuzný" : "příbuzná")).join("")}</div>` : ""}</div>
    <p class="small muted">Dědic: ${H[0] ? esc(H[0].n) : '<b class="bad">žádný</b>'} (${LAWS.nastupnictvi.opts[C.laws ? C.laws.nastupnictvi : 0]}). Sloupce u jména: vůdcovství, udatnost, rozum, správa. Synové v 15 letech vstupují do služby. Sňatky dohodneš poselstvem v Diplomacii.</p>`, "wide")}
  ${card("Spřízněné rody", aliveClans(S).filter(c => married(S, me(), c.id)).map(c => chip(c.id)).join(" ") || "—")}
  ${card("Zesnulí", tbl(["Jméno", "Zemřel(a)"], dead))}</div>`;
}

// ---------- Objevy ----------
function tObjevy() {
  const C = P(S), cats = [...new Set(TECH_IDS.map(t => TECHS[t].cat))];

  ${cats.map(cat => card(cat, tbl(["Objev", "Účinek", "#Cena", ""], TECH_IDS.filter(t => TECHS[t].cat === cat).map(t => { const T = TECHS[t]; return tr([C.techs[t] ? `<span class="good">✔ ${T.n}</span>` : C.res.cur === t ? `<b>▶ ${T.n}</b>` : T.n, `<span class="small">${T.d}${T.req ? " · vyžaduje: " + T.req.map(r => TECHS[r].n).join(", ") : ""}</span>`, T.cost, C.techs[t] || C.res.cur === t ? "" : btn("Zkoumat", "research", [t], techAvail(S, me(), t) ? null : "Chybí předpoklady")]); })))).join("")}</div>`;
}

// ---------- Kronika ----------
function tKronika() {
  const f = SEL.logF; const l = S.log.filter(x => f === "vse" || (f === "moje" ? x.cl && x.cl.includes(me()) : f === "svet" ? !x.cl || !x.cl.includes(me()) : x.cat === f)).slice(0, 400);
  return card("Kronika", `<div class="row">${[["moje", "můj rod"], ["svet", "svět"], ["vse", "vše"], ["valka", "války"], ["rise", "říše"], ["rod", "rody"], ["diplomacie", "diplomacie"], ["rozkazy", "rozkazy"]].map(([k, n]) => btn(f === k ? `<b>${n}</b>` : n, "logF", [k])).join("")}</div><div class="log">${l.map(x => `<div class="lg"><span class="tag">${MONTHS[x.m].slice(0, 3)} ${x.y}</span>${esc(x.txt)}</div>`).join("")}</div>`, "wide");
}

// ---------- Hra ----------
function tHra() {
  const slots = [1, 2, 3, 4, 5].map(n => { const i = slotInfo(n); return tr([n, i ? esc(i) : '<span class="muted">prázdná</span>', btn("Uložit", "save", [n]) + btn("Načíst", "load", [n], i ? null : "Prázdná") + btn("Smazat", "del", [n], i ? null : "Prázdná")]); });
  const sc = SEL.ngScen || 1256; SCEN_CACHE[sc] = SCEN_CACHE[sc] || scenarioClans(sc);
  const clansSel = SCEN_CACHE[sc].sort((a, b) => b.provs - a.provs).map(c => [c.id, `${c.house} – ${c.n} (${c.provs} krajů, ${c.leader})`]);
  if (!SCEN_CACHE[sc].some(c => c.id === SEL.ng)) SEL.ng = "premysl";
  return `<div class="grid">${card("Uložené hry", tbl(["#", "Obsah", ""], slots) + `<p class="small muted">Hra se sama ukládá po každém kroku.</p><div class="row">${btn("Stáhnout do souboru", "exportSave")} ${btn("Nahrát ze souboru", "importSave")}</div>`)}
  ${card("Nová hra", `<div class="kv"><span>Scénář</span>${sel("ngScen", Object.entries(SCENARIOS).map(([k, x]) => [k, x.n]), sc, `data-a="ngScen" data-x='[]'`)}<span></span><span class="small muted">${esc(SCENARIOS[sc].d)}</span><span>Rod</span>${sel("ngClan", clansSel, SEL.ng, `data-a="ngClan" data-x='[]'`)}<span>Obtížnost</span>${sel("ngDiff", DIFFS.map((d, i) => [i, d]), SEL.ngDiff != null ? SEL.ngDiff : 1, `data-a="ngDiff" data-x='[]'`)}<span>Mlha války</span><label><input type="checkbox" id="ngFog" ${SEL.ngFog === false ? "" : "checked"} data-a="ngFog" data-x='[]'> o vzdálených krajích víš jen odhady</label><span>Semínko náhody</span><input id="ngSeed" type="number" placeholder="náhodné"></div><div class="row">${btn(SEL.ngConfirm ? "<b>Ano, začít</b>" : "Začít novou hru", "newgame")}</div><p class="small muted">Velké rody (Přemyslovci, Arpádovci) jsou nejsnazší. Habsburkové, Wittelsbachové nebo slezští Piastovci začínají malí – to je výzva.</p>`)}
  ${card("Vzhled", btn("Přepnout světlý / tmavý vzhled", "theme"))}
  <section class="card wide help"><h3>Jak hrát</h3>
  <p>Jsi hlavou panovnického rodu ve střední Evropě po pádu Štaufů (od ledna 1256). Kolo je jeden měsíc. <b>Cíl:</b> ovládnout polovinu krajů (sám nebo skrze vazaly), nebo se stát císařem a vládnout třetině krajů. Prohraješ, když přijdeš o všechny kraje.</p>
  <h4>Mapa</h4><p>Hlavní obrazovkou je mapa. Kolečkem myši přibližuješ, tažením posouváš. Dole přepínáš mapové režimy (terén, rozvoj, spokojenost, vztahy, kultura, víra, obchod, začlenění). Klikni na kraj – vpravo se ukáže jeho panel. Klikni na žeton svého vojska a pak na kraj: vojsko tam potáhne. Mezerník spustí a zastaví běh času, Esc zavře okno.</p>
  <h4>Body vlády a stabilita</h4><p>Každý měsíc získáváš body správy, diplomacie a vojska podle schopností panovníka a rádců v úřadech. Utrácíš je za rozvoj krajů, stabilitu, začleňování nově získaných krajů, ideje a snižování válečného vyčerpání (okno Vláda).</p>
  <h4>Válka a mír</h4><p>Bez záminky (nárok, jádro, koruna, klatba) válka stojí stabilitu a prestiž. Dobytý hrad se jen obsadí. Válečné skóre roste vítězstvími a obsazenými kraji; v Diplomacii pak požaduješ kraje, odškodné, vazalství nebo připojení celé země. Kdo se rozpíná příliš rychle, rozzlobí sousedy – mohou proti němu uzavřít koalici.</p>
  <h4>Měsíc</h4><p>V záložce <b>Kraj a rozkazy</b> dáš každému vazalovi jeden rozkaz: rozvoj polí a trhů, opravy hradeb, nábor, výcvik, péči o lid, stavby, hledání schopných mužů, zvědy, podněcování, naklonění cizích vazalů, poselstva nebo přesun. Kraje, které „svěříš purkrabímu“, spravuje umělá inteligence sama. Pak stiskni <b>Konec měsíce</b>.</p>
  <h4>Hospodářství</h4><p>Zlato plyne každý měsíc z obchodu a obyvatel, obilí jednou za rok při žních v září. Obilím se živí posádky a vojska v poli. Stříbrné doly (Jihlava, Kutná Hora a Čáslavsko, Štiavnica, Freiberg…) jsou pokladem.</p>
  <h4>Válka</h4><p>Vyhlas válku (Diplomacie), vyšli vojsko s veliteli (Kraj a rozkazy → Vyslat vojsko). Vojsko táhne kraj za měsíc. U cíle obléhá hrad – vyhladovění trvá podle úrovně hradu, zteč je rychlá, ale krvavá. Bitva má až šest kol; rozhoduje počet, druh vojska, výcvik, terén, morálka a schopnosti velitelů. Poražení velitelé mohou padnout nebo být zajati.</p>
  <h4>Vazalové</h4><p>Věrnost závisí na hodnosti, darech, prestiži rodu a náladě šlechty. Nevěrný purkrabí může přeběhnout k sousedovi i s krajem nebo se vzbouřit. Cizí vazaly lze úplatky naklonit na svou stranu.</p>
  <h4>Evropská politika</h4><p>Sňatky spojují rody a dávají nárok na dědictví. Slabší rody mohou složit lenní hold. Kurfiřti volí římského krále; papež může dát rod do klatby. Kdo ovládne jádro koruny (Čechy, Uhry, Polsko, Halič), může se nechat korunovat.</p>
  <p class="small muted">Historické postavy a vládci odpovídají roku 1256 (roky narození jsou přibližné). Jejich schopnosti a všichni ostatní vazalové jsou herní výmysl.</p></section></div>`;
}

// ---------- start ----------
function boot() {
  try { const t = localStorage.getItem("panovnik_theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  try { const t = localStorage.getItem("panovnik2_auto"); if (t) S = JSON.parse(t); } catch (e) { S = null; }
  if (!S || !S.provs || S.v !== 2) S = newGame();
  const f = document.createElement("input"); f.type = "file"; f.id = "impFile"; f.accept = ".json,application/json"; f.style.display = "none"; f.onchange = () => f.files[0] && importFile(f.files[0]); document.body.appendChild(f);
  render();
}
if (typeof document !== "undefined") { if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot(); }

// Grafika: erby, politická mapa s územími, grafy, pruhy a ikony.

// Zjednodušené erby (barvy a dělení podle skutečné heraldiky, figury jsou stylizované)

// ---------- grafy ----------
function sparkline(vals, w = 120, h = 30, col = "var(--accent2)") {
  if (vals.length < 2) return "";
  const mn = Math.min(...vals), mx = Math.max(...vals), sy = v => h - 3 - (mx === mn ? 0.5 : (v - mn) / (mx - mn)) * (h - 6), sx = i => i / (vals.length - 1) * (w - 4) + 2;
  const pts = vals.map((v, i) => `${sx(i).toFixed(1)},${sy(v).toFixed(1)}`).join(" ");
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><polygon points="2,${h} ${pts} ${w - 2},${h}" fill="${col}" opacity=".15"/><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.6"/><circle cx="${sx(vals.length - 1)}" cy="${sy(vals[vals.length - 1])}" r="2.5" fill="${col}"/></svg>`;
}
function lineChart(series, labels, w = 640, h = 220, maxw) {
  const all = series.flatMap(s => s.vals); if (!all.length || labels.length < 2) return '<p class="muted small">Graf se zaplní, jak poběží čas.</p>';
  const mx = Math.max(1, ...all), pl = 34, pr = 110, pt = 8, pb = 22, W = w - pl - pr, H = h - pt - pb;
  const sx = i => pl + i / (labels.length - 1) * W, sy = v => pt + H - v / mx * H;
  let g = ""; const step = Math.max(1, Math.ceil(mx / 4));
  for (let v = 0; v <= mx; v += step) g += `<line x1="${pl}" x2="${pl + W}" y1="${sy(v)}" y2="${sy(v)}" class="grid"/><text x="${pl - 5}" y="${sy(v) + 3}" class="ax" text-anchor="end">${v}</text>`;
  const every = Math.max(1, Math.ceil(labels.length / 6));
  labels.forEach((l, i) => { if (i % every === 0 || i === labels.length - 1) g += `<text x="${sx(i)}" y="${h - 6}" class="ax" text-anchor="middle">${esc(l)}</text>`; });
  const ends = [];
  for (const s of series) { const pts = s.vals.map((v, i) => `${sx(i).toFixed(1)},${sy(v).toFixed(1)}`).join(" "); g += `<polyline points="${pts}" fill="none" stroke="${s.col}" stroke-width="${s.bold ? 3 : 1.8}"/>`; ends.push([sy(s.vals[s.vals.length - 1]), s]); }
  ends.sort((a, b) => a[0] - b[0]); let last = -99;
  for (const [y0, s] of ends) { const y = Math.max(y0, last + 11); last = y; g += `<circle cx="${pl + W}" cy="${y0}" r="3" fill="${s.col}"/><text x="${pl + W + 6}" y="${y + 3}" class="ax lbl2" ${s.bold ? 'font-weight="bold"' : ""}>${esc(s.name)} ${s.vals[s.vals.length - 1]}</text>`; }
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" style="max-width:${maxw || w * 1.25}px" role="img" aria-label="Graf">${g}</svg>`;
}

function battleChart(b) {

  for (const r of b.rounds) { a -= r[0]; d -= r[1]; A.push(Math.max(0, a)); D.push(Math.max(0, d)); }

let TERR = { key: null, url: null };
function hexRgb(h) { const m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(h || ""); return m ? [parseInt(m[1], 16), parseInt(m[2], 16), parseInt(m[3], 16)] : [136, 136, 136]; }
function territoryImage(W, H, MXf, MYf) {
  const key = Object.values(S.provs).map(p => p.owner).join(",") + "|" + S.player;
  if (TERR.key === key && TERR.url) return TERR.url;
  if (typeof document === "undefined") return "";
  const sc = 2, w = Math.floor(W / sc), h = Math.floor(H / sc), ps = Object.values(S.provs), n = ps.length;
  const px = ps.map(p => MXf(p.lon) / sc), py = ps.map(p => MYf(p.lat) / sc), idx = new Int16Array(w * h), lim = (64 / sc) ** 2;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    let best = -1, bd = lim;
    // lehké zvlnění hranic
    const jx = x + Math.sin(y * 0.35) * 1.2, jy = y + Math.cos(x * 0.31) * 1.2;
    for (let i = 0; i < n; i++) { const dx = px[i] - jx, dy = py[i] - jy, d = dx * dx + dy * dy; if (d < bd) { bd = d; best = i; } }
    idx[y * w + x] = best;
  }
  const cv = document.createElement("canvas"); cv.width = w; cv.height = h; const ctx = cv.getContext("2d"), img = ctx.createImageData(w, h), D = img.data;
  const cols = ps.map(p => hexRgb(S.clans[p.owner].col)), own = ps.map(p => p.owner), mine = ps.map(p => p.owner === S.player);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const k = y * w + x, i = idx[k], o = k * 4; if (i < 0) { D[o + 3] = 0; continue; }
    const nb = [x > 0 ? idx[k - 1] : -1, x < w - 1 ? idx[k + 1] : -1, y > 0 ? idx[k - w] : -1, y < h - 1 ? idx[k + w] : -1];
    const realm = nb.some(j => j !== i && (j < 0 || own[j] !== own[i])), prov = nb.some(j => j >= 0 && j !== i);
    const [r, g, b] = cols[i];
    if (realm) { D[o] = r * 0.35; D[o + 1] = g * 0.35; D[o + 2] = b * 0.35; D[o + 3] = 235; }
    else if (prov) { D[o] = r * 0.75; D[o + 1] = g * 0.75; D[o + 2] = b * 0.75; D[o + 3] = 150; }
    else { D[o] = r; D[o + 1] = g; D[o + 2] = b; D[o + 3] = mine[i] ? 200 : 140; }
  }
  ctx.putImageData(img, 0, 0);
  TERR = { key, url: cv.toDataURL() };
  return TERR.url;
}

// ---------- Plán měsíce ----------
function suggestCmd(c, p) {
  if (p.loy < 35) return "lid";
  if (p.agri < agriCap(S, p) * 0.9) return "zemedelstvi";
  if (p.com < comCap(S, p)) return c.burgher ? "obchodovat" : "obchod";
  if (men(p.troops) > 300 && p.train < 50) return "vycvik";
  if (p.dur < durMax(S, p) * 0.8) return "hradby";
  return provRoutes(p).length ? "obchodovat" : "studium";
}
function tPlan() {
  const cmdOpts = Object.entries(CMDS).map(([k, K]) => [k, K.n + (K.cost ? ` (${K.cost} zl)` : "")]);
  const ps = clanProvs(S, me()).filter(p => !p.siege).sort((a, b) => (b.id === P(S).capital) - (a.id === P(S).capital) || b.v - a.v);
  let idle = 0; const rows = [];
  for (const p of ps) for (const c of officersIn(S, p.id).filter(x => !x.army)) {
    const done = c.acted === S.turn; if (done && !SEL.planDone) continue; if (!done) idle++;
    const k = SEL.cmd[c.id] || suggestCmd(c, p); SEL.cmd[c.id] = k;
    rows.push(tr([`<b>${esc(c.n)}</b>${c.burgher ? ' <span class="tag">měšťan</span>' : ""}<div class="small muted">${RANKS[c.rank].n}, věrnost ${Math.round(c.loy)}</div>`, `${btn(esc(p.n), "provOnly", [p.id])}${p.deleg ? '<div class="small muted">svěřený kraj</div>' : ""}`, statsTd(c),
      done ? '<td colspan="2" class="muted">tento měsíc už jedná</td>' : `<td>${sel("cs_" + c.id, cmdOpts, k, `data-a="cmdSel" data-x='["${c.id}"]'`)}<div class="small muted">${CMDS[k].d}</div></td><td>${cmdParams(c, k, p)} ${btn("Provést", "cmd", [c.id], null, "go")} ${btn("Nechat na rádci", "advise", [c.id])}</td>`], done ? "muted" : ""));
  }
  const C = P(S), b = clanBudget(S, me());
  return `<div class="tiles">${tile("Volní vazalové", idle, "čekají na rozkaz")}${tile("Zlato", fmt(C.gold), `<span class="${b.net < 0 ? "bad" : "good"}">${sg(b.net)} za měsíc</span>`)}${tile("Obilí", fmt(C.grain), "do žní " + ((8 - S.month + 12) % 12) + " měs.")}${tile("Kraje", clanProvs(S, me()).length, `${clanProvs(S, me()).filter(p => p.deleg).length} svěřených purkrabím`)}</div>
  ${card("Plán měsíce – všichni vazalové na jednom místě", `<div class="row">${btn("Rádce rozhodne za všechny volné", "adviseAll", [], idle ? null : "Nikdo nečeká", "go")} ${btn(SEL.planDone ? "Skrýt ty, kdo už jednají" : "Ukázat i ty, kdo už jednají", "planDone")} <span class="small muted">Předvybraný rozkaz je doporučení podle stavu kraje. „Nechat na rádci“ provede, co by udělal purkrabí.</span></div>` +
    tbl(["Vazal", "Kraj", "#Vůdc.", "#Udat.", "#Rozum", "#Správa", "Rozkaz", ""], rows), "wide")}`;

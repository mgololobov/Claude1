<title>Herní dílna</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Atkinson+Hyperlegible:wght@400;700&family=Chivo+Mono:wght@400;600&family=Cinzel:wght@600;800&family=Patrick+Hand&display=swap">
<style>
/* Layout: plnovýškový nástroj – horní lišta s projektem a záložkami, pod ní pracovní plocha; stůl je zelená řezací podložka s mřížkou, na ní mapa s hexy. */
:root {
  --paper: #eef1ef;
  --surface: #ffffff;
  --ink: #1b2421;
  --muted: #5a6762;
  --line: #d3dbd7;
  --mat: #2b5d4e;
  --mat-line: rgba(255,255,255,.10);
  --mat-line-strong: rgba(255,255,255,.22);
  --accent: #e0aa2e;
  --accent-ink: #1b2421;
  --danger: #b0402c;
  --good: #2f7a45;
  --shadow: 0 1px 2px rgba(20,30,26,.12), 0 4px 14px rgba(20,30,26,.10);
  --f-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", -apple-system, "Segoe UI", system-ui, sans-serif;
  --f-mono: "Chivo Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #121816; --surface: #1b2320; --ink: #e5ece9; --muted: #95a39d; --line: #2c3733;
  --mat: #1d4136; --mat-line: rgba(255,255,255,.07); --mat-line-strong: rgba(255,255,255,.16);
  --accent: #e8b84a; --accent-ink: #15130c; --danger: #e07a62; --good: #6cc184;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.35); color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #121816; --surface: #1b2320; --ink: #e5ece9; --muted: #95a39d; --line: #2c3733;
  --mat: #1d4136; --mat-line: rgba(255,255,255,.07); --mat-line-strong: rgba(255,255,255,.16);
  --accent: #e8b84a; --accent-ink: #15130c; --danger: #e07a62; --good: #6cc184;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.35); color-scheme: dark }

html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.45;
  display: flex; flex-direction: column; overflow: hidden; -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.15; }
h2 { font-size: 1.35rem; font-weight: 700; }
h3 { font-size: 1.05rem; font-weight: 700; }
p { margin: 0; }

/* Horní lišta */
.top { background: var(--surface); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px 0; display: flex; flex-direction: column; gap: 8px; flex: none; }
.top-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { font-family: var(--f-display); font-weight: 800; font-size: 1.25rem; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; }
.brand svg { width: 26px; height: 26px; }
.proj-pick { display: flex; gap: 8px; align-items: center; flex: 1; min-width: 220px; }
.proj-pick select { flex: 1; min-width: 0; max-width: 360px; }
.save-state { font-family: var(--f-mono); font-size: .75rem; color: var(--muted); white-space: nowrap; }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tab { border: 0; background: none; padding: 10px 12px 11px; font-weight: 700; color: var(--muted); border-bottom: 3px solid transparent; white-space: nowrap; min-height: 44px; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

main { flex: 1; min-height: 0; overflow: auto; }
.page { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px; max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

/* Ovládací prvky */
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 14px; min-height: 44px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; justify-content: center; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--danger); }
.btn.small { min-height: 36px; padding: 4px 10px; font-size: .9rem; }
.btn.on { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.btn:disabled { opacity: .45; cursor: default; }
input[type=text], input[type=number], input[type=date], select, textarea {
  background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; min-height: 44px; width: 100%; }
input[type=range] { width: 100%; }
textarea { resize: vertical; min-height: 120px; line-height: 1.5; }
.f { display: flex; flex-direction: column; gap: 4px; font-size: .85rem; color: var(--muted); font-weight: 700; min-width: 0; }
.f > input, .f > select, .f > textarea { color: var(--ink); font-weight: 400; font-size: 1rem; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.spread { justify-content: space-between; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.eyebrow { font-family: var(--f-mono); font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.muted { color: var(--muted); }
.hint { color: var(--muted); font-size: .9rem; }
.banner { background: color-mix(in srgb, var(--accent) 22%, var(--surface)); border: 1px solid color-mix(in srgb, var(--accent) 55%, var(--line)); border-radius: 10px; padding: 12px 14px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: space-between; }
.two { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 820px) { .two { grid-template-columns: 1fr; } }
.list { display: flex; flex-direction: column; gap: 10px; }
.item-row { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: var(--surface); }
.empty { border: 1.5px dashed var(--line); border-radius: 12px; padding: 24px; text-align: center; color: var(--muted); }
.chk { display: inline-flex; align-items: center; gap: 6px; font-size: .9rem; min-height: 44px; }
.chk input { width: 22px; height: 22px; }
hr.sep { border: 0; border-top: 1px solid var(--line); width: 100%; margin: 0; }

/* Přehled */
.hero-name { font-size: clamp(1.8rem, 4vw, 2.6rem); font-weight: 800; letter-spacing: -.02em; }
.facts { display: flex; gap: 8px; flex-wrap: wrap; }
.fact { font-family: var(--f-mono); font-size: .85rem; border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; background: var(--paper); }
.changelog { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.changelog li { display: grid; grid-template-columns: 70px 1fr auto; gap: 10px; align-items: baseline; border-bottom: 1px dashed var(--line); padding-bottom: 8px; }
.ver { font-family: var(--f-mono); font-weight: 600; }

/* Komponenty */
.decks { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 12px; min-height: 44px; display: inline-flex; gap: 8px; align-items: center; font-weight: 700; }
.chip[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.dot { width: 14px; height: 14px; border-radius: 4px; flex: none; display: inline-block; }
.count { font-family: var(--f-mono); font-size: .8rem; color: var(--muted); font-weight: 400; }
.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
.card-cell { display: flex; flex-direction: column; gap: 6px; align-items: center; border: 0; background: none; padding: 0; }
.card-cell .qty { font-family: var(--f-mono); font-size: .8rem; color: var(--muted); }
.swatches { display: flex; gap: 6px; flex-wrap: wrap; }
.swatch { width: 34px; height: 34px; border-radius: 8px; border: 2px solid transparent; }
.swatch[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 2px var(--surface) inset; }
.unit-grid { display: flex; flex-wrap: wrap; gap: 14px; }
.unit-cell { display: flex; flex-direction: column; align-items: center; gap: 4px; border: 0; background: none; padding: 4px; border-radius: 8px; font-size: 15px; }
.unit-cell:hover { background: var(--paper); }
.unit-cell .pair { display: flex; gap: 6px; }
.unit-cell .lbl { font-size: .78rem; color: var(--muted); max-width: 150px; text-align: center; }

/* Wargame žeton jednotky – velikost v em, takže jde zvětšit přes font-size */
.unit { width: 5.2em; height: 5.2em; border-radius: .45em; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: space-between;
  padding: .3em .2em .25em; box-shadow: 0 .15em 0 rgba(0,0,0,.35), 0 .3em .8em rgba(0,0,0,.25); border: .1em solid rgba(0,0,0,.35); font-family: var(--f-body); overflow: hidden; flex: none; }
.unit .nm { font-size: .78em; line-height: 1; font-weight: 700; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.unit .sym { display: flex; flex-direction: column; align-items: center; line-height: 1; }
.unit .sz { font-size: .62em; letter-spacing: .1em; font-weight: 700; height: 1em; }
.unit svg { width: 2.8em; height: 1.8em; display: block; }
.unit .vals { font-family: var(--f-mono); font-weight: 600; font-size: 1.05em; line-height: 1; letter-spacing: -.02em; }
.unit.red::after { content: ""; position: absolute; top: .45em; right: -1.4em; width: 4em; height: .5em; background: rgba(255,255,255,.75); transform: rotate(45deg); }
.unit.red .vals { text-decoration: underline; text-decoration-thickness: .08em; }
.unit .note { position: absolute; left: .2em; top: 1.4em; font-size: .55em; font-weight: 700; opacity: .9; }

/* Žeton */
.token { width: 46px; height: 46px; display: grid; place-items: center; color: #fff; font-family: var(--f-mono); font-weight: 600; font-size: .95rem; text-align: center; line-height: 1.05;
  box-shadow: 0 2px 0 rgba(0,0,0,.25), 0 4px 10px rgba(0,0,0,.25); border: 2px solid rgba(255,255,255,.55); overflow: hidden; padding: 2px; }
.token .tt { font-family: var(--f-body); font-weight: 700; font-size: .58rem; display: block; max-width: 100%; overflow-wrap: anywhere; }
.token.kruh { border-radius: 50%; }
.token.ctverec { border-radius: 8px; }
.token.figurka { border: 0; box-shadow: none; background: none !important; width: 46px; height: 54px; padding: 0; }
.token.figurka svg { width: 46px; height: 54px; filter: drop-shadow(0 3px 3px rgba(0,0,0,.35)); }
.token-label { position: absolute; left: 50%; top: 100%; transform: translateX(-50%); margin-top: 3px; font-size: .68rem; color: #fff; background: rgba(0,0,0,.5); border-radius: 4px; padding: 0 4px; white-space: nowrap; pointer-events: none; }

/* Mapa */
.board-svg text { font-family: var(--f-body); pointer-events: none; }
.board-svg .coord { font-family: var(--f-mono); font-size: 7px; fill: rgba(0,0,0,.45); }
.board-svg .glyph { font-size: 13px; fill: rgba(0,0,0,.32); }
.board-svg .lab { font-size: 10px; font-weight: 700; fill: #fff; stroke: rgba(0,0,0,.65); stroke-width: 2.5px; paint-order: stroke; }
.board-svg .cell { stroke: rgba(0,0,0,.35); stroke-width: 1; }
.board-svg .ctrl { pointer-events: none; }
.ed-wrap { overflow: auto; background: var(--mat); border-radius: 12px; max-height: 70vh; padding: 10px; }
.ed-wrap svg { display: block; }
.ed-wrap.paint svg { touch-action: none; cursor: crosshair; }
.tool { min-height: 40px; }
.terr-swatch { width: 22px; height: 22px; border-radius: 5px; border: 1px solid rgba(0,0,0,.3); display: inline-grid; place-items: center; font-size: 12px; color: rgba(0,0,0,.5); flex: none; }

/* Stůl */
.table-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 320px; height: 100%; min-height: 0; }
@media (max-width: 900px) { .table-wrap { grid-template-columns: 1fr; grid-template-rows: minmax(380px, 62vh) auto; height: auto; min-height: 100%; } }
.mat-area { position: relative; min-height: 0; display: flex; flex-direction: column; }
.mat-area > .mat-scroll { flex: 1; }
.mat-scroll { overflow: auto; touch-action: pan-x pan-y; background: var(--mat); position: relative; min-height: 0; }
.mat { position: relative; touch-action: pan-x pan-y;
  background-color: var(--mat);
  background-image: linear-gradient(var(--mat-line-strong) 1px, transparent 1px), linear-gradient(90deg, var(--mat-line-strong) 1px, transparent 1px),
    linear-gradient(var(--mat-line) 1px, transparent 1px), linear-gradient(90deg, var(--mat-line) 1px, transparent 1px);
  background-size: 100px 100px, 100px 100px, 20px 20px, 20px 20px; }
.mat.ctrlmode { cursor: cell; }
.mat-ruler { position: absolute; left: 0; top: 0; right: 0; height: 18px; font-family: var(--f-mono); font-size: 10px; color: rgba(255,255,255,.55); pointer-events: none; }
.mat-ruler span { position: absolute; top: 2px; transform: translateX(3px); }
.boardlayer { position: absolute; pointer-events: none; filter: drop-shadow(0 6px 16px rgba(0,0,0,.35)); }
.titem { position: absolute; touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; }
.titem .unit { font-size: 10px; }
.titem.sel { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 10px; }
.titem.drag { cursor: grabbing; filter: drop-shadow(0 10px 14px rgba(0,0,0,.35)); }

.side { background: var(--surface); border-left: 1px solid var(--line); overflow: auto; padding: 14px; display: flex; flex-direction: column; gap: 16px; min-width: 0;
  padding-right: max(14px, env(safe-area-inset-right, 0px)); }
@media (max-width: 900px) { .side { border-left: 0; border-top: 1px solid var(--line); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); } }
.side section { display: flex; flex-direction: column; gap: 8px; }
.tools { display: flex; flex-wrap: wrap; gap: 4px; }
.tools button { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 6px 11px; font-weight: 700; font-size: .85rem; min-height: 36px; }
.tools button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.pile { display: grid; grid-template-columns: 14px 1fr; gap: 4px 8px; align-items: center; border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
.pile .nm { font-weight: 700; overflow-wrap: anywhere; }
.pile .nums { grid-column: 2; font-family: var(--f-mono); font-size: .78rem; color: var(--muted); }
.pile .row { grid-column: 1 / -1; }
.selbar { border: 1px solid var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--surface)); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.lib { display: flex; flex-wrap: wrap; gap: 6px; }
.lib-btn { border: 1px solid var(--line); background: var(--paper); border-radius: 8px; padding: 4px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 7px; }
.lib-btn span { font-size: .72rem; max-width: 70px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lib-btn > span:last-child { font-size: 11px; }
.dice-btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.dice-out { display: flex; flex-wrap: wrap; gap: 6px; min-height: 44px; align-items: center; }
.die { width: 40px; height: 40px; border-radius: 9px; background: var(--ink); color: var(--surface); display: grid; place-items: center; font-family: var(--f-mono); font-weight: 600; font-size: 1rem; position: relative; }
.die.hit { background: var(--good); color: #fff; }
.die.miss { opacity: .45; }
.die small { position: absolute; bottom: 1px; right: 3px; font-size: .5rem; opacity: .6; }
.die.roll { animation: tumble .45s ease-out; }
@keyframes tumble { 0% { transform: rotate(-200deg) scale(.6); opacity: .2 } 100% { transform: none; opacity: 1 } }
@media (prefers-reduced-motion: reduce) { .die.roll { animation: none; } }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.log { font-family: var(--f-mono); font-size: .75rem; color: var(--muted); display: flex; flex-direction: column; gap: 2px; max-height: 120px; overflow: auto; }
.result { border-radius: 10px; padding: 10px 12px; background: var(--ink); color: var(--surface); display: flex; flex-direction: column; gap: 2px; }
.result b { font-family: var(--f-mono); font-size: 1.5rem; }
.phases { display: flex; flex-direction: column; gap: 4px; }
.phase { padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); font-weight: 700; display: flex; gap: 8px; align-items: center; }
.phase.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.turnbig { font-family: var(--f-display); font-size: 2rem; font-weight: 800; line-height: 1; }
.action { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; }
.slots { display: flex; gap: 6px; flex-wrap: wrap; }
.slot { width: 40px; height: 40px; border-radius: 50%; border: 2px dashed var(--muted); background: transparent; display: grid; place-items: center; padding: 0; }
.slot.taken { border-style: solid; border-color: rgba(0,0,0,.3); }
.slot svg { width: 26px; height: 30px; }
.fchips { display: flex; flex-wrap: wrap; gap: 6px; }
.fchip { border: 2px solid transparent; border-radius: 999px; padding: 4px 10px 4px 6px; display: inline-flex; gap: 6px; align-items: center; font-weight: 700; font-size: .85rem; background: var(--paper); min-height: 36px; }
.fchip[aria-pressed="true"] { border-color: var(--ink); }
.hand { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.score { display: grid; grid-template-columns: 16px 1fr auto auto; gap: 6px 10px; align-items: center; font-size: .9rem; }
.crt-tab { border-collapse: collapse; font-family: var(--f-mono); font-size: .8rem; width: 100%; }
.crt-tab th, .crt-tab td { border: 1px solid var(--line); padding: 3px 4px; text-align: center; }
.crt-tab td.hl, .crt-tab th.hl { background: var(--accent); color: var(--accent-ink); }
.crt-ed input { min-height: 36px; padding: 4px; text-align: center; font-family: var(--f-mono); font-size: .85rem; min-width: 52px; }

/* Testy */
.stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
.stat { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; background: var(--surface); }
.stat b { display: block; font-family: var(--f-mono); font-size: 1.6rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.bars { display: flex; flex-direction: column; gap: 8px; }
.bar { display: grid; grid-template-columns: minmax(70px, 140px) 1fr 70px; gap: 10px; align-items: center; font-size: .9rem; }
.bar .tr { height: 14px; background: var(--paper); border-radius: 4px; overflow: hidden; border: 1px solid var(--line); }
.bar .fl { height: 100%; background: var(--accent); display: block; }
.bar .v { font-family: var(--f-mono); font-size: .8rem; text-align: right; font-variant-numeric: tabular-nums; }
.bar .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sess { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; background: var(--surface); }
.sess-hd { display: flex; gap: 10px; flex-wrap: wrap; align-items: baseline; justify-content: space-between; }
.pl-chip { font-size: .85rem; border-radius: 999px; padding: 2px 10px; border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.pl-chip.win { background: color-mix(in srgb, var(--good) 18%, var(--surface)); border-color: var(--good); font-weight: 700; }
.pl-edit { display: grid; grid-template-columns: 1fr 90px auto auto; gap: 8px; align-items: center; }

/* Dialog */
.scrim { position: fixed; inset: 0; background: rgba(10,16,14,.5); display: grid; place-items: center; z-index: 50; padding: 16px; }
.dialog { background: var(--surface); border-radius: 14px; padding: 20px; width: min(560px, 100%); max-height: 90vh; overflow: auto; display: flex; flex-direction: column; gap: 14px; box-shadow: var(--shadow); }
.dialog.wide { width: min(820px, 100%); }
.editor { display: grid; grid-template-columns: 1fr 190px; gap: 18px; align-items: start; }
@media (max-width: 560px) { .editor { grid-template-columns: 1fr; } }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 10px; z-index: 60; font-weight: 700; max-width: calc(100% - 32px); pointer-events: none; }
.hand.mini { grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); }

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function plural(n, a, b, c) { return n === 1 ? a : (n >= 2 && n <= 4 ? b : c); }
function inkFor(hex) { const n = parseInt(String(hex).slice(1), 16); if (isNaN(n)) return "#fff"; const r = n >> 16, g = (n >> 8) & 255, b = n & 255; return (0.299 * r + 0.587 * g + 0.114 * b) > 160 ? "#15130c" : "#ffffff"; }

function normalize(p) {

  p.factions = p.factions || [{ id: uid(), name: "Modří", color: "#3f6fb0" }, { id: uid(), name: "Červení", color: "#b0402c" }];

  p.factions.forEach(f => { if (f.ability == null) f.ability = ""; });
  p.decks.forEach(d => { if (d.market == null) d.market = 0; if (d.starter == null) d.starter = false; d.cards.forEach(c => { ["suit", "value", "vp", "icon", "effect"].forEach(k => { if (c[k] == null) c[k] = ""; }); if (c.locked == null) c.locked = false; }); });
  // Verze 4 omylem ukládala nastavení hlídání do pole s textem pravidel – text se dá poskládat zpět ze znaků.
  if (p.rules && typeof p.rules === "object") {
    const keys = Object.keys(p.rules).filter(k => /^\d+$/.test(k)).sort((a, b) => a - b);

function exampleTrade() {
  const d1 = uid(), d2 = uid();

// Přednostně úložiště artefaktu (plná kvalita). Bez něj se obrázek zmenší a uloží přímo do projektu.
async function storeImage(file, opt = {}) {
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); });
  const draw = max => { const sc = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement("canvas"); c.width = Math.max(1, Math.round(img.width * sc)); c.height = Math.max(1, Math.round(img.height * sc)); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); return c; };
  const assets = await cap("assets");
  if (assets) { try { const blob = await new Promise(res => draw(opt.max || 1400).toBlob(res, "image/jpeg", .85)); const r = await assets.upload(blob); return { url: r.url, id: r.id }; } catch {} }
  let max = opt.dataMax || 1400, q = .72, data; const limit = opt.limit || 170000;
  do { data = draw(max).toDataURL("image/jpeg", q); max = Math.round(max * .8); q = Math.max(.45, q - .07); } while (data.length > limit && max > 100);
  return { data };
}
// Pro tiskovou archu: obrázky z úložiště převede na data, aby šly vytisknout i offline.
async function inlineImages(html) {
  const urls = [...new Set([...html.matchAll(/url\('([^']+)'\)/g)].map(m => m[1]).filter(u => !u.startsWith("data:")))];
  for (const u of urls) {
    try { const real = u.replace(/&amp;/g, "&"); const b = await (await fetch(real)).blob(); const d = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(b); }); html = html.split(u).join(d); } catch {}
  }
  return html;
}

function wireBoardEditor(p, b) {
  const svg = $("#boardEd"); if (!svg) return;
  const g = geo(b);
  const cellAt = e => { const r = svg.getBoundingClientRect(); const sx = g.W / r.width; return g.pick((e.clientX - r.left) * sx, (e.clientY - r.top) * sx); };
  let painting = false, last = null, changed = false;
  const info = $("#hexInfo");
  const apply = cr => {
    if (!cr) return; const k = cr.join(","); if (k === last) return; last = k;
    if (S.edTool === "erase") { if (b.terrain[k] || b.labels[k] || b.regions[k] || b.numbers[k]) { delete b.terrain[k]; delete b.labels[k]; delete b.regions[k]; delete b.numbers[k]; changed = true; } }
    else if (S.edTool === "region") { if (!S.regionName) { toast("Nejdřív napiš název oblasti"); painting = false; return; } if (b.regions[k] !== S.regionName) { b.regions[k] = S.regionName; changed = true; } }
    else if (p.terrains.find(t => t.id === S.edTool)) { if (b.terrain[k] !== S.edTool) { b.terrain[k] = S.edTool; changed = true; } }
    const poly = svg.querySelector(`polygon.cell[data-k="${k}"]`);
    if (poly) { const t = terrainOf(p, b, k); poly.setAttribute("fill", t ? t.color : (b.bg ? "transparent" : p.terrains[0].color)); }
  };
  svg.addEventListener("pointermove", e => { const cr = cellAt(e); if (cr) { const t = terrainOf(p, b, cr.join(",")) || p.terrains[0]; info.textContent = `Pole ${pad2(cr[0] + 1)}${pad2(cr[1] + 1)} · ${t ? t.name : ""}${b.labels[cr.join(",")] ? " · " + b.labels[cr.join(",")] : ""}`; } if (painting) apply(cr); });
  svg.addEventListener("pointerdown", e => {
    if (S.edTool === "pan") return;
    const cr = cellAt(e); if (!cr) return;
    if (S.edTool === "number") { const k = cr.join(","); askText(`Číslo pole ${pad2(cr[0] + 1)}${pad2(cr[1] + 1)}`, b.numbers[k] || "", v => { if (+v >= 2 && +v <= 12) b.numbers[k] = +v; else delete b.numbers[k]; touch(p); render(); }, "Součet 2k6 (2–12), při kterém pole produkuje. Prázdné číslo smaže."); return; }
    if (S.edTool === "label") { const k = cr.join(","); askText(`Popisek pole ${pad2(cr[0] + 1)}${pad2(cr[1] + 1)}`, b.labels[k] || "", v => { if (v) b.labels[k] = v; else delete b.labels[k]; touch(p); render(); }, "Název města, řeky nebo oblasti. Prázdné pole popisek smaže."); return; }
    e.preventDefault(); svg.setPointerCapture(e.pointerId); painting = true; last = null; changed = false; apply(cr);
  });
  const end = () => { if (!painting) return; painting = false; if (changed) { touch(p); const w = $("#edWrap"); const keep = [w.scrollLeft, w.scrollTop]; render(); const w2 = $("#edWrap"); if (w2) { w2.scrollLeft = keep[0]; w2.scrollTop = keep[1]; } } };
  svg.addEventListener("pointerup", end); svg.addEventListener("pointercancel", end);
}

      <div class="panel"><h2>Trasy a cíle</h2>

        <label class="chk"><input type="checkbox" id="rtExcl" ${p.routes.exclusive ? "checked" : ""}> Úsek může patřit jen jednomu hráči</label>
        ${(p.routes.tickets || []).map(x => `<div class="row"><input type="text" data-tka="${x.id}" value="${esc(x.a)}" placeholder="Odkud" style="width:110px"><input type="text" data-tkb="${x.id}" value="${esc(x.b)}" placeholder="Kam" style="width:110px"><input type="number" data-tkp="${x.id}" value="${x.pts}" style="width:70px" aria-label="Body"><select data-tkf="${x.id}" style="width:auto"><option value="">všichni</option>${p.factions.map(f => `<option value="${f.id}" ${f.id === x.fid ? "selected" : ""}>${esc(f.name)}</option>`).join("")}</select><button class="btn small danger" data-tkdel="${x.id}" aria-label="Smazat cíl">✕</button></div>`).join("")}

    </div>
    <div class="two">
      <div class="panel"><h2>Burza a většiny</h2>

        ${p.stock.goods.map((g, i) => `<div class="row"><select data-sgr="${i}" style="width:auto">${p.resources.filter(r => !r.global).map(r => `<option value="${r.id}" ${r.id === g.resId ? "selected" : ""}>${esc(r.name)}</option>`).join("")}</select>
          <label class="f" style="flex-direction:row;align-items:center;gap:4px">cena<input type="number" data-sgp="${i}" value="${g.price}" style="width:64px"></label><label class="f" style="flex-direction:row;align-items:center;gap:4px">od<input type="number" data-sgmin="${i}" value="${g.min}" style="width:60px"></label><label class="f" style="flex-direction:row;align-items:center;gap:4px">do<input type="number" data-sgmax="${i}" value="${g.max}" style="width:60px"></label><button class="btn small danger" data-sgdel="${i}" aria-label="Odebrat komoditu">✕</button></div>`).join("")}
        <button class="btn small" id="addGood" ${p.resources.length ? "" : "disabled"}>+ Komodita</button>
        <p class="hint">Cena komodity roste s každým nákupem a klesá s prodejem.</p><hr class="sep">
        <label class="f">Body za 1., 2., 3. místo ve většině oblasti<input type="text" id="majPts" value="${esc(p.majority.points)}" placeholder="5,3,1"></label>
        <p class="hint">Oblasti nakreslíš v záložce Mapa nástrojem Oblast. Počítají se jednotky stran v polích oblasti.</p><hr class="sep">
        <label class="f">Produkci z polí s čísly dostane<select id="prodMode"><option value="both">vlastník pole i jednotky na poli a vedle</option><option value="control" ${p.production.mode === "control" ? "selected" : ""}>jen vlastník pole</option><option value="units" ${p.production.mode === "units" ? "selected" : ""}>jen jednotky na poli a vedle</option></select></label>
        <p class="hint">Čísla polí a co terén produkuje nastavíš v záložce Mapa (jako v Osadnících z Katanu).</p></div>
      <div class="panel"><h2>Tajné role</h2>
        <p class="hint">Jedna role na řádek. Při rozdání dostane každý hráč náhodně jednu – hodí se pro zrádce, skryté cíle nebo frakce.</p>
        <textarea id="roles" style="min-height:140px" placeholder="Zrádce&#10;Věrný&#10;Věrný">${esc(p.roles)}</textarea>
        <label class="f">Trest za prohru v blafování<input type="text" id="bluffPen" value="${esc(p.bluffPenalty)}" placeholder="-1 Body"></label></div>
    </div>
    <div class="panel">
      <h2>Boj a pohyb</h2>
      <div class="two">
        <div style="display:flex;flex-direction:column;gap:10px;min-width:0">
          <h3>Bojová tabulka (CRT)</h3>
          <p class="hint">Sloupce jsou poměry útok : obrana, řádky hody kostkou. Poměr se zaokrouhluje ve prospěch obránce.</p>
          <div style="overflow-x:auto"><table class="crt-tab crt-ed"><thead><tr><th>Hod</th>${crt.cols.map((c, i) => `<th><input type="text" data-cc="${i}" value="${esc(c)}" aria-label="Sloupec ${i + 1}"></th>`).join("")}</tr></thead>
            <tbody>${crt.rows.map((r, ri) => `<tr><th>${ri + 1}</th>${r.map((v, ci) => `<td><input type="text" data-cr="${ri}" data-ci="${ci}" value="${esc(v)}" aria-label="Hod ${ri + 1}, sloupec ${ci + 1}"></td>`).join("")}</tr>`).join("")}</tbody></table></div>
          <div class="row"><button class="btn small" id="colAdd">+ Sloupec</button><button class="btn small" id="colDel">− Sloupec</button><button class="btn small" id="rowAdd">+ Řádek</button><button class="btn small" id="rowDel">− Řádek</button><button class="btn small" id="crtReset">Výchozí tabulka</button></div>
        </div>
        <div style="display:flex;flex-direction:column;gap:10px;min-width:0">
          <label class="f">Vysvětlivky výsledků<textarea id="legend" style="min-height:120px">${esc(crt.legend)}</textarea></label>

          <div class="grid" style="grid-template-columns:1fr 1fr">

          </div>

          <label class="chk"><input type="checkbox" id="zoc" ${p.zoc ? "checked" : ""}> Zóny kontroly: vstup na pole sousedící s nepřítelem ukončí pohyb</label>
          <p class="hint">Dosah pohybu na stole počítá s cenou terénu (Mapa) a pohybem jednotky. Terén s pohybem „–“ je neprůchodný.</p>

      </div>
    </div></div>`;
  wireBanner(main);
  const F = id => p.factions.find(f => f.id === id);
  $("#addF").onclick = () => { p.factions.push({ id: uid(), name: "Strana " + (p.factions.length + 1), color: COLORS[p.factions.length % COLORS.length], ability: "" }); touch(p); render(); };
  $$("[data-fn]", main).forEach(i => i.addEventListener("input", () => { F(i.dataset.fn).name = i.value; touch(p); }));
  $$("[data-fa]", main).forEach(i => i.addEventListener("input", () => { F(i.dataset.fa).ability = i.value; touch(p); }));
  $$("[data-fs]", main).forEach(i => i.addEventListener("input", () => { F(i.dataset.fs).setup = i.value; touch(p); }));
  $$("[data-fb]", main).forEach(i => i.onchange = () => { F(i.dataset.fb).bot = i.value; touch(p); });
  $$("[data-fc]", main).forEach(x => x.onclick = () => { F(x.dataset.fcId).color = x.dataset.fc; touch(p); render(); });
  $$("[data-fdel]", main).forEach(x => x.onclick = () => confirmDialog("Smazat stranu?", "Její jednotky zůstanou bez strany.", "Smazat", () => { p.factions = p.factions.filter(f => f.id !== x.dataset.fdel); touch(p); render(); }));
  $("#phases").addEventListener("input", e => { p.phases = e.target.value.split(/\r?\n/).map(s => s.trim()).filter(Boolean); touch(p); });
  // zdroje
  const R = id => p.resources.find(r => r.id === id);
  $("#addR").onclick = () => { p.resources.push({ id: uid(), name: "Zdroj " + (p.resources.length + 1), color: COLORS[(p.resources.length + 4) % COLORS.length], start: 0, income: 0, max: "", vp: false, global: false }); touch(p); render(); };
  const rin = (attr, key, conv) => $$(`[${attr}]`, main).forEach(i => i.addEventListener("change", () => { R(i.getAttribute(attr))[key] = conv(i); touch(p); }));
  rin("data-rn", "name", i => i.value); rin("data-ricon", "icon", i => i.value.trim()); rin("data-rc", "color", i => i.value); rin("data-rs", "start", i => +i.value || 0); rin("data-ri", "income", i => +i.value || 0);
  rin("data-rm", "max", i => i.value === "" ? "" : +i.value); rin("data-rv", "vp", i => i.checked); rin("data-rg", "global", i => i.checked);
  $$("[data-rdel]", main).forEach(x => x.onclick = () => { p.resources = p.resources.filter(r => r.id !== x.dataset.rdel); touch(p); render(); });
  $("#marketCur").onchange = e => { p.marketCur = e.target.value; touch(p); };
  $("#setField").onchange = e => { p.scoring.field = e.target.value; touch(p); };
  $("#setTable").addEventListener("change", e => { p.scoring.table = e.target.value; touch(p); });
  $("#trickPts").addEventListener("change", e => { p.scoring.trick = +e.target.value || 0; touch(p); });
  // akce
  $("#actMode").onchange = e => { p.actionMode = e.target.value; touch(p); render(); };
  if ($("#roleRes")) $("#roleRes").onchange = e => { p.roleRes = e.target.value; touch(p); };
  if ($("#rFree")) { $("#rFree").addEventListener("change", e => { p.rondel.free = Math.max(1, +e.target.value || 3); touch(p); render(); }); $("#rPay").onchange = e => { p.rondel.pay = e.target.value; touch(p); }; }
  $("#addA").onclick = () => { p.actions.push({ id: uid(), name: "Akce " + (p.actions.length + 1), text: "", slots: 1 }); touch(p); render(); };
  const A = id => p.actions.find(a => a.id === id);
  $$("[data-an]", main).forEach(i => i.addEventListener("input", () => { A(i.dataset.an).name = i.value; touch(p); }));
  $$("[data-at]", main).forEach(i => i.addEventListener("input", () => { A(i.dataset.at).text = i.value; touch(p); }));
  $$("[data-ae]", main).forEach(i => i.addEventListener("input", () => { A(i.dataset.ae).effect = i.value; touch(p); }));
  $$("[data-as]", main).forEach(i => i.addEventListener("input", () => { A(i.dataset.as).slots = Math.max(1, Math.min(8, parseInt(i.value, 10) || 1)); touch(p); }));
  $$("[data-adel]", main).forEach(x => x.onclick = () => { p.actions = p.actions.filter(a => a.id !== x.dataset.adel); touch(p); render(); });
  // boj
  $$("[data-cc]", main).forEach(i => i.addEventListener("input", () => { crt.cols[+i.dataset.cc] = i.value.trim(); touch(p); }));
  $$("[data-cr]", main).forEach(i => i.addEventListener("input", () => { crt.rows[+i.dataset.cr][+i.dataset.ci] = i.value.trim(); touch(p); }));
  $("#colAdd").onclick = () => { const last = crt.cols[crt.cols.length - 1] || "1:1"; const n = parseInt(last, 10) || 1; crt.cols.push((n + 1) + ":1"); crt.rows.forEach(r => r.push(r[r.length - 1] || "")); touch(p); render(); };
  $("#colDel").onclick = () => { if (crt.cols.length < 2) return; crt.cols.pop(); crt.rows.forEach(r => r.pop()); touch(p); render(); };
  $("#rowAdd").onclick = () => { crt.rows.push([...(crt.rows[crt.rows.length - 1] || crt.cols.map(() => ""))]); touch(p); render(); };
  $("#rowDel").onclick = () => { if (crt.rows.length < 2) return; crt.rows.pop(); touch(p); render(); };
  $("#crtReset").onclick = () => confirmDialog("Obnovit výchozí tabulku?", "Tvoje úpravy tabulky se přepíšou.", "Obnovit", () => { p.crt = defaultCRT(); touch(p); render(); });
  $("#legend").addEventListener("input", e => { crt.legend = e.target.value; touch(p); });
  $("#aHit").addEventListener("input", e => { p.dice.aHit = Math.max(1, Math.min(6, +e.target.value || 5)); touch(p); });
  $("#dHit").addEventListener("input", e => { p.dice.dHit = Math.max(1, Math.min(6, +e.target.value || 5)); touch(p); });
  $("#zoc").onchange = e => { p.zoc = e.target.checked; touch(p); };
  // dráha, trasy, burza, role
  $("#trLen").addEventListener("change", e => { p.track.length = Math.max(0, Math.min(120, +e.target.value || 0)); touch(p); });
  $("#trDie").onchange = e => { p.track.die = +e.target.value; touch(p); };
  $("#trSp").addEventListener("input", e => { p.track.spaces = e.target.value; touch(p); });
  $("#trAuto").onchange = e => { p.track.autoNext = e.target.checked; touch(p); };
  $("#rtCost").onchange = e => { p.routes.cost = e.target.value; touch(p); };
  $("#rtPrice").addEventListener("change", e => { p.routes.price = Math.max(1, +e.target.value || 1); touch(p); });
  $("#rtExcl").onchange = e => { p.routes.exclusive = e.target.checked; touch(p); };
  const TK = id => p.routes.tickets.find(x => x.id === id);
  $("#addTk").onclick = () => { p.routes.tickets.push({ id: uid(), a: "", b: "", pts: 5, fid: "" }); touch(p); render(); };
  [["data-tka", "a"], ["data-tkb", "b"]].forEach(([at, k]) => $$(`[${at}]`, main).forEach(i => i.addEventListener("input", () => { TK(i.getAttribute(at))[k] = i.value; touch(p); })));
  $$("[data-tkp]", main).forEach(i => i.addEventListener("change", () => { TK(i.dataset.tkp).pts = +i.value || 0; touch(p); }));
  $$("[data-tkf]", main).forEach(i => i.onchange = () => { TK(i.dataset.tkf).fid = i.value; touch(p); });
  $$("[data-tkdel]", main).forEach(x => x.onclick = () => { p.routes.tickets = p.routes.tickets.filter(z => z.id !== x.dataset.tkdel); touch(p); render(); });
  $("#stCur").onchange = e => { p.stock.currency = e.target.value; touch(p); render(); };
  $("#addGood").onclick = () => { const r0 = p.resources.find(r => !r.global && r.id !== p.stock.currency) || p.resources[0]; p.stock.goods.push({ resId: r0.id, price: 3, min: 1, max: 8 }); touch(p); render(); };
  [["data-sgp", "price"], ["data-sgmin", "min"], ["data-sgmax", "max"]].forEach(([at, k]) => $$(`[${at}]`, main).forEach(i => i.addEventListener("change", () => { p.stock.goods[+i.getAttribute(at)][k] = +i.value || 0; touch(p); })));
  $$("[data-sgr]", main).forEach(i => i.onchange = () => { p.stock.goods[+i.dataset.sgr].resId = i.value; touch(p); });
  $$("[data-sgdel]", main).forEach(x => x.onclick = () => { p.stock.goods.splice(+x.dataset.sgdel, 1); touch(p); render(); });
  $("#majPts").addEventListener("change", e => { p.majority.points = e.target.value; touch(p); });
  $("#roles").addEventListener("input", e => { p.roles = e.target.value; touch(p); });
  $("#bluffPen").addEventListener("input", e => { p.bluffPenalty = e.target.value; touch(p); });
  $("#prodMode").onchange = e => { p.production.mode = e.target.value; touch(p); };
}

// ---------- Scénáře ----------
function renderScenarios(main, p) {
  const cnt = s => (s.setup && s.setup.items ? s.setup.items.length : 0);
  main.innerHTML = `<div class="page">
    ${exampleBanner(p)}
    <div class="row spread"><h2>Scénáře</h2><button class="btn primary" id="addSc">+ Nový scénář</button></div>
    <p class="hint">Scénář si pamatuje mapu, rozestavění jednotek a žetonů, kontrolu území, počet kol a podmínky vítězství. Rozestav jednotky na stole a ulož je tlačítkem „Uložit rozestavění ze stolu“.</p>
    ${p.scenarios.length ? p.scenarios.map(s => `<div class="panel">
      <div class="row spread"><input type="text" data-sn="${s.id}" value="${esc(s.name)}" style="font-family:var(--f-display);font-weight:700;font-size:1.2rem;max-width:420px" aria-label="Název scénáře">
        <div class="row"><button class="btn primary" data-play="${s.id}">Spustit na stole</button><button class="btn" data-save="${s.id}">Uložit rozestavění ze stolu</button></div></div>
      <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr))">
        <label class="f">Mapa<select data-sb="${s.id}"><option value="">Bez mapy</option>${p.boards.map(b => `<option value="${b.id}" ${b.id === s.boardId ? "selected" : ""}>${esc(b.name)}</option>`).join("")}</select></label>
        <label class="f">Počet kol<input type="number" min="1" max="99" data-st="${s.id}" value="${esc(s.turns)}"></label>
        <div class="f"><span>Rozestavění</span><span style="color:var(--ink);font-weight:400;padding-top:10px">${cnt(s)} ${plural(cnt(s), "položka", "položky", "položek")}, ${Object.keys((s.setup && s.setup.control) || {}).length} ovládaných polí</span></div>
      </div>
      <label class="f">Úvod a situace<textarea data-sd="${s.id}" style="min-height:70px">${esc(s.desc)}</textarea></label>
      <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))">
        <label class="f">Podmínky vítězství<textarea data-sv="${s.id}" style="min-height:90px">${esc(s.victory)}</textarea></label>
        <label class="f">Zvláštní pravidla<textarea data-ss="${s.id}" style="min-height:90px">${esc(s.special)}</textarea></label>
      </div>
      <div class="row"><span class="hint">Hlídaný cíl na konci posledního kola:</span><select data-shf="${s.id}" style="width:auto"><option value="">nehlídat</option>${p.factions.map(f => `<option value="${f.id}" ${f.id === s.holdF ? "selected" : ""}>${esc(f.name)}</option>`).join("")}</select>
        <span class="hint">musí ovládat pole</span><input type="text" data-shl="${s.id}" value="${esc(s.holdLabels || "")}" placeholder="Brod, Most" style="width:180px" aria-label="Popisky polí"></div>
      <div class="row"><button class="btn small" data-dup="${s.id}">Duplikovat</button><button class="btn small danger" data-del="${s.id}">Smazat</button></div>
    </div>`).join("") : `<div class="empty">Zatím žádný scénář.</div>`}
    <div class="panel"><h2>Kampaň a legacy</h2>
      <p class="hint">Zapisuj výsledky scénářů za sebou a odemykej zamčené karty, které do hry vstoupí až později (karta má v editoru volbu „Zamčená“).</p>
      <div class="row"><input type="text" id="cmpText" placeholder="Např. Scénář 1: vyhráli Modří, most zničen" style="flex:1;width:auto"><button class="btn primary" id="cmpAdd">Zapsat</button></div>
      ${p.campaign.log.length ? `<ul class="changelog">${[...p.campaign.log].reverse().map(e => `<li><span class="ver">${fmtDate(e.date)}</span><span>${esc(e.text)}</span><button class="btn small danger" data-cmpdel="${e.id}" aria-label="Smazat záznam">✕</button></li>`).join("")}</ul>` : ""}
      ${(() => { const lk = p.decks.flatMap(d => d.cards.filter(c => c.locked).map(c => ({ d, c }))); return lk.length ? `<div class="eyebrow">Zamčené karty</div><div class="row">${lk.map(x => `<button class="btn small" data-unlock="${x.d.id}|${x.c.id}">🔓 ${esc(x.c.title)} <span class="count">${esc(x.d.name)}</span></button>`).join("")}</div>` : `<span class="hint">Žádné zamčené karty.</span>`; })()}
    </div>
  </div>`;
  wireBanner(main);
  const Sc = id => p.scenarios.find(s => s.id === id);
  $("#addSc").onclick = () => { p.scenarios.push({ id: uid(), name: "Scénář " + (p.scenarios.length + 1), turns: 6, boardId: p.boards[0] ? p.boards[0].id : "", desc: "", victory: "", special: "", setup: { items: [], control: {} } }); touch(p); render(); };
  const tin = (attr, key, conv = v => v) => $$(`[${attr}]`, main).forEach(i => i.addEventListener("input", () => { Sc(i.getAttribute(attr))[key] = conv(i.value); touch(p); }));
  tin("data-sn", "name"); tin("data-sd", "desc"); tin("data-sv", "victory"); tin("data-ss", "special"); tin("data-st", "turns", v => Math.max(1, parseInt(v, 10) || 1));
  $$("[data-sb]", main).forEach(i => i.onchange = () => { Sc(i.dataset.sb).boardId = i.value; touch(p); });
  $$("[data-shf]", main).forEach(i => i.onchange = () => { Sc(i.dataset.shf).holdF = i.value; touch(p); });
  $$("[data-shl]", main).forEach(i => i.addEventListener("input", () => { Sc(i.dataset.shl).holdLabels = i.value; touch(p); }));
  $("#cmpAdd").onclick = () => { const v = $("#cmpText").value.trim(); if (!v) return; p.campaign.log.push({ id: uid(), date: today(), text: v }); touch(p); render(); };
  $$("[data-cmpdel]", main).forEach(b => b.onclick = () => { p.campaign.log = p.campaign.log.filter(e => e.id !== b.dataset.cmpdel); touch(p); render(); });
  $$("[data-unlock]", main).forEach(b => b.onclick = () => { const [dId, cId] = b.dataset.unlock.split("|"); const d = p.decks.find(x => x.id === dId); const c = d.cards.find(x => x.id === cId); c.locked = false;
    p.campaign.log.push({ id: uid(), date: today(), text: `Odemčena karta ${c.title} (${d.name})` });
    if (p.table && p.table.piles[dId]) { for (let i = 0; i < (+c.qty || 0); i++) p.table.piles[dId].push(c.id); shuffle(p.table.piles[dId]); }

  const names = Object.entries(byName).sort((a, b) => b[1].wins / b[1].games - a[1].wins / a[1].games || b[1].games - a[1].games);

      <div class="stat"><span class="eyebrow">Těsnost výsledku</span><b>${avgMargin == null ? "–" : avgMargin.toLocaleString("cs-CZ", { maximumFractionDigits: 1 })}</b><span class="muted">bodů mezi 1. a 2. místem</span></div>
    </div>
    ${n ? `<div class="two">
      <div class="panel"><h3>Úspěšnost hráčů a stran</h3><div class="bars">${names.map(([k, v]) => bar(k, v.wins, v.games, `${v.wins}/${v.games}`)).join("")}</div>
        <h3>Výhry podle pořadí v tahu</h3><p class="hint">Prozradí výhodu prvního hráče. Hráče zapisuj v pořadí, v jakém hráli.</p>
        <div class="bars">${Object.entries(seat).map(([k, v]) => bar(`${+k + 1}. hráč`, v.wins, v.games, `${Math.round(v.wins / v.games * 100)} %`)).join("")}</div></div>

    if (s.boardId && !p.boards.find(b => b.id === s.boardId)) E(`Scénář „${s.name}“ odkazuje na smazanou mapu.`);
    if (s.holdF && s.holdLabels) s.holdLabels.split(",").map(x => x.trim()).filter(Boolean).forEach(l => { if (!allLabels.has(l.toLowerCase())) E(`Scénář „${s.name}“: pole „${l}“ na mapě není.`); });

  if (p.stock.currency && !p.resources.find(r => r.id === p.stock.currency)) E("Burza platí smazaným zdrojem.");
  p.stock.goods.forEach(g => { if (!p.resources.find(r => r.id === g.resId)) E("Burza obchoduje se smazaným zdrojem."); });
  if (p.ruleset.playCost && !p.resources.find(r => r.id === p.ruleset.playCost)) E("Cena vyložení karty odkazuje na smazaný zdroj.");

// ---------- Nástroje podle hry ----------
function toolRelevant(p, k) {
  switch (k) {
    case "trh": return p.decks.some(d => +d.market > 0);
    case "akce": return p.actions.length > 0;
    case "draft": case "ruce": return p.decks.some(d => !d.starter) || p.decks.length > 0;
    case "styk": return p.decks.some(d => d.cards.some(c => c.suit && c.value));
    case "program": return p.decks.length > 0 && p.factions.length > 1;
    case "drazba": return p.factions.length > 1;
    case "obchod": return p.resources.some(r => !r.global);
    case "sacek": return p.bags.length > 0;
    case "dilky": return p.tiles.length > 0;
    case "draha": return +p.track.length > 0;
    case "tajne": return !!String(p.roles || "").trim() || p.decks.length > 0;
    case "boj": return p.units.length > 0;
    case "uzemi": return p.boards.length > 0;
    case "hraci": return p.factions.length > 0;
    default: return true;
  }
}

}

function describeEffect(text) {
  let body = String(text || "").trim(); if (!body) return ""; const parts = [];
  const once = body.match(/^jednou\s+za\s+(kolo|tah|hru)\s*:\s*/i); if (once) { parts.push(`jednou za ${once[1]}:`); body = body.slice(once[0].length); }

    if ((m = c.match(/^pokud\s+(.+?)\s*:\s*(.+)$/i))) return `pokud ${m[1]}, pak ${m[2].split(",").map(one).join(" a ")}`;
    if ((m = c.match(/^zaplať\s+(.+?)\s*:\s*(.+)$/i))) return `zaplať ${m[1].replace(/\+/g, "a")} a ${m[2].split(",").map(one).join(" a ")}`;
    if ((m = c.match(/^vyber\s*:\s*(.+)$/i))) return `vyber si: ${m[1].split("|").map(o => o.split(",").map(one).join(" a ")).join(", nebo ")}`;
    if ((m = c.match(/^soupeř\s+(.+)$/i))) return `zvolený soupeř: ${one(m[1])}`;
    if ((m = c.match(/^(všichni|ostatní|hráč)?\s*([+-])\s*(\d+)\s+(.+)$/i))) { const who = (m[1] || "").toLowerCase(); const verb = m[2] === "+" ? (who ? "získají" : "získej") : (who ? "ztratí" : "ztrať"); return `${who ? who + " " : ""}${verb} ${m[3]} × ${m[4]}`; }
    if ((m = c.match(/^líznout\s+(\d+)(?:\s+z\s+(.+))?$/i))) return `lízni ${m[1]} ${plural(+m[1], "kartu", "karty", "karet")}${m[2] ? " z balíčku " + m[2] : ""}`;
    if ((m = c.match(/^táhnout\s+(\d+)\s+z\s+(.+)$/i))) return `táhni ${m[1]} ${plural(+m[1], "žeton", "žetony", "žetonů")} ze sáčku ${m[2]}`;
    if ((m = c.match(/^(všichni|ostatní)?\s*posun\s+([+-]?\d+)$/i))) return `${m[1] ? m[1] + " se posunou" : "posuň se"} o ${Math.abs(+m[2])} ${Math.abs(+m[2]) >= 5 ? "polí" : "pole"} ${+m[2] < 0 ? "zpět" : "vpřed"}`;
    if ((m = c.match(/^událost(?:\s+z\s+(.+))?$/i))) return `otoč událost${m[1] ? " z balíčku " + m[1] : ""}`;
    if ((m = c.match(/^nastav\s+(.+?)\s+(-?\d+)$/i))) return `nastav ${m[1]} na ${m[2]}`;
    if ((m = c.match(/^odhodit\s+(\d+)$/i))) return `odhoď náhodně ${m[1]} ${plural(+m[1], "kartu", "karty", "karet")}`;
    if ((m = c.match(/^(?:zpráva|oznámení)\s+(.+)$/i))) return `„${m[1]}“`;
    if (/^(vítěz|vyhrává|konec hry)$/i.test(c)) return "vyhráváš";
    return c; };
  body.split(/[;\n]/).map(s => s.trim()).filter(Boolean).forEach(c => parts.push(one(c)));
  const s = (once ? parts.shift() + " " : "") + parts.join("; "); return s.charAt(0).toUpperCase() + s.slice(1) + ".";
}

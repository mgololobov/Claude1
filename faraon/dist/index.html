<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pán Obou zemí</title>
<style>
:root {
  --bg: #efe6d1; --panel: #fbf6ea; --ink: #2a2117; --muted: #76664f; --line: #d8c9a8; --accent: #9c3b1e; --accent2: #1f6f78; --gold: #a87a1f;
  --good: #2f6b2f; --bad: #a3271b; --warn: #a86b12; --head: #eadfc4; --btn: #efe3c6; --btnh: #e3d2ad; --sea: #c9dbe0; --desert: #eadbb8; --nile: #2f7f9a; color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1b1813; --panel: #25211a; --ink: #efe5d0; --muted: #a8977c; --line: #3e3528; --accent: #e0794f; --accent2: #5fb8b8; --gold: #d9a94a;
  --good: #7fc37f; --bad: #ef7b6c; --warn: #e3ac55; --head: #322b21; --btn: #342c22; --btnh: #45392b; --sea: #1d3138; --desert: #2d271d; --nile: #4aa3c0; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #1b1813; --panel: #25211a; --ink: #efe5d0; --muted: #a8977c; --line: #3e3528; --accent: #e0794f; --accent2: #5fb8b8; --gold: #d9a94a;
  --good: #7fc37f; --bad: #ef7b6c; --warn: #e3ac55; --head: #322b21; --btn: #342c22; --btnh: #45392b; --sea: #1d3138; --desert: #2d271d; --nile: #4aa3c0; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 14px/1.42 Georgia, "Times New Roman", serif; }
header { position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 3px double var(--gold); padding: 6px 16px; display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; }
header .realm { font-size: 17px; font-weight: bold; color: var(--accent); display: inline-flex; align-items: center; gap: 8px; }
header .st { white-space: nowrap; } header .st b { font-variant-numeric: tabular-nums; }
header .sp { flex: 1; }
nav { display: flex; flex-wrap: wrap; gap: 2px; padding: 6px 16px 0; border-bottom: 1px solid var(--line); background: var(--bg); }
nav button { border: 1px solid var(--line); border-bottom: none; background: var(--btn); color: var(--ink); padding: 5px 10px; border-radius: 6px 6px 0 0; cursor: pointer; font: inherit; display: inline-flex; align-items: center; gap: 5px; }
nav button.on { background: var(--panel); font-weight: bold; color: var(--accent); }
nav .badge { background: var(--accent); color: #fff; border-radius: 8px; font-size: 11px; padding: 0 5px; }
main { padding: 12px 16px; max-width: 1400px; margin: 0 auto; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); align-items: start; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; overflow-x: auto; min-width: 0; }
.card h3 { margin: 0 0 8px; font-size: 15px; color: var(--accent); border-bottom: 1px solid var(--line); padding-bottom: 4px; }
.card h4 { margin: 10px 0 4px; font-size: 14px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { border-bottom: 1px solid var(--line); padding: 3px 6px; text-align: left; vertical-align: top; }
th { background: var(--head); font-weight: bold; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.muted td { opacity: .55; } tr.click { cursor: pointer; } tr.click:hover td { background: var(--head); } tr.sel td { background: var(--head); }
.good { color: var(--good); } .bad { color: var(--bad); } .warn { color: var(--warn); } .muted { color: var(--muted); } .small { font-size: 12px; }
button.b, select, input { font: inherit; font-size: 13px; }
button.b { background: var(--btn); color: var(--ink); border: 1px solid var(--line); border-radius: 5px; padding: 2px 8px; cursor: pointer; margin: 1px; }
button.b:hover:not(:disabled) { background: var(--btnh); } button.b:disabled { opacity: .45; cursor: default; }
button.b.go { background: var(--accent2); color: #fff; border-color: transparent; }
button.b.danger { color: var(--bad); }
button.main { background: var(--accent); color: #fff; border: none; border-radius: 6px; padding: 6px 14px; font-weight: bold; cursor: pointer; font: inherit; }
select, input { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 2px 4px; max-width: 100%; }
input[type=number] { width: 80px; }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 4px 0; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; }
.kv > :nth-child(odd) { color: var(--muted); }
details summary { cursor: pointer; color: var(--accent2); }
.help p { margin: 4px 0 8px; } .help h4 { color: var(--accent); }
.wide { grid-column: 1 / -1; }
.tag { display: inline-block; font-size: 11px; padding: 0 5px; border-radius: 8px; background: var(--head); color: var(--muted); margin-right: 4px; }
.pill { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 8px; background: var(--head); margin: 1px 2px 1px 0; white-space: nowrap; }
.pill.good { color: var(--good); } .pill.bad { color: var(--bad); } .pill.warn { color: var(--warn); }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 0 7px 0 3px; border-radius: 9px; font-size: 12px; background: var(--head); margin: 1px 2px; white-space: nowrap; }
.emb { vertical-align: middle; flex: none; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 12px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; min-width: 0; }
.tile .tl { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.tile .tv { font-size: 22px; font-weight: bold; font-variant-numeric: tabular-nums; line-height: 1.25; }
.tile .ts { font-size: 12px; color: var(--muted); }
.tile .spark { width: 100%; height: 26px; display: block; margin-top: 4px; }
.alert { padding: 4px 8px; border-left: 4px solid var(--line); margin: 3px 0; background: var(--head); border-radius: 0 4px 4px 0; font-size: 13px; }
.alert.bad { border-color: var(--bad); } .alert.warn { border-color: var(--warn); } .alert.info { border-color: var(--accent2); } .alert.good { border-color: var(--good); }
.meter { display: grid; grid-template-columns: 120px 1fr auto; gap: 8px; align-items: center; font-size: 13px; margin: 3px 0; }
.meter .ml { color: var(--muted); } .meter .mv { font-variant-numeric: tabular-nums; font-size: 12px; }
.meter .mt { height: 9px; background: var(--line); border-radius: 5px; overflow: hidden; } .meter .mt i { display: block; height: 100%; background: var(--accent2); border-radius: 5px; }
.tbar { display: flex; height: 10px; border-radius: 4px; overflow: hidden; min-width: 80px; background: var(--line); margin: 3px 0; } .tbar i { display: block; height: 100%; }
.tleg { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: var(--muted); margin: 2px 0 6px; } .tleg i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
.sbv { display: inline-block; min-width: 34px; text-align: right; padding: 0 4px; border-radius: 3px; background: linear-gradient(90deg, color-mix(in srgb, var(--accent2) 35%, transparent) var(--v), transparent var(--v)); }
.relbar { display: inline-block; width: 60px; height: 8px; background: var(--line); border-radius: 4px; position: relative; vertical-align: middle; margin-left: 4px; }
.relbar i { position: absolute; top: 0; bottom: 0; border-radius: 4px; } .relbar b { position: absolute; top: -2px; bottom: -2px; width: 1px; background: var(--ink); left: 50%; }
.log { max-height: 70vh; overflow-y: auto; }
.lg { border-bottom: 1px dotted var(--line); padding: 2px 0; font-size: 13px; }
.lg.c-valka { border-left: 3px solid var(--bad); padding-left: 5px; } .lg.c-rod { border-left: 3px solid #a85e7f; padding-left: 5px; } .lg.c-nil { border-left: 3px solid var(--nile); padding-left: 5px; } .lg.c-intriky { border-left: 3px solid var(--warn); padding-left: 5px; }
#modal { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 20; display: flex; align-items: center; justify-content: center; padding: 16px; }
#modal.hidden { display: none; }
#modal .box { background: var(--panel); border: 2px solid var(--gold); border-radius: 10px; max-width: 580px; width: 100%; padding: 16px 18px; max-height: 90vh; overflow-y: auto; }
#modal h2 { margin: 0 0 8px; color: var(--accent); }
#modal .ch { display: block; width: 100%; text-align: left; margin: 6px 0; padding: 7px 10px; }
#toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 6px; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 30; max-width: 90vw; }
#toast.on { opacity: .95; }
.grid.map2 { grid-template-columns: minmax(0, 3fr) minmax(300px, 2fr); }
.card.sticky { position: sticky; top: 64px; align-self: start; max-height: calc(100vh - 80px); overflow-y: auto; }
svg.map { width: 100%; height: auto; display: block; background: var(--desert); border-radius: 6px; max-height: 82vh; }
svg.map .sea { fill: var(--sea); stroke: none; }
svg.map .coast { fill: none; stroke: var(--muted); stroke-width: .6; stroke-opacity: .6; }
svg.map .nile { fill: none; stroke: var(--nile); stroke-linecap: round; stroke-linejoin: round; }
svg.map .edge { stroke: var(--muted); stroke-opacity: .35; stroke-dasharray: 2 2; }
svg.map .pv { cursor: pointer; }
svg.map .pv circle.dot { stroke: rgba(0,0,0,.6); }
svg.map .pv.mine circle.dot { stroke: var(--ink); }
svg.map .pv.war circle.dot { stroke: var(--bad); }
svg.map .selring { fill: none; stroke: var(--accent); }
svg.map .siege { fill: none; stroke: var(--bad); stroke-dasharray: 3 2; pointer-events: none; }
svg.map .lbl { fill: var(--ink); paint-order: stroke; stroke: var(--panel); stroke-linejoin: round; pointer-events: none; font-family: Georgia, serif; }
svg.map .lbl.cap { font-weight: bold; }
svg.map .region { fill: var(--muted); font-style: italic; letter-spacing: .15em; pointer-events: none; font-family: Georgia, serif; opacity: .8; }
svg.map .army { stroke: var(--ink); }
svg.map .march { fill: none; stroke-linejoin: round; } svg.map .march.own { stroke: #1f5fa8; } svg.map .march.foe { stroke: var(--bad); }
svg.chart { width: 100%; height: auto; display: block; }
svg.chart .grid { stroke: var(--line); stroke-width: 1; }
svg.chart .ax { font-size: 10px; fill: var(--muted); font-family: Georgia, serif; }
.tree { display: flex; flex-direction: column; align-items: center; }
.tree .gen { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.tree .stem { width: 2px; height: 18px; background: var(--line); }
.fam { border: 1px solid var(--line); border-top: 4px solid var(--accent2); border-radius: 6px; padding: 6px 10px; min-width: 150px; max-width: 230px; background: var(--panel); }
.fam.f { border-top-color: #a85e7f; } .fam.empty { color: var(--muted); border-style: dashed; display: flex; align-items: center; justify-content: center; }
.fam .fn { font-weight: bold; }
.minis { display: flex; gap: 3px; align-items: flex-end; height: 30px; margin: 4px 0; }
.minis span { width: 10px; height: 28px; background: var(--line); display: flex; align-items: flex-end; border-radius: 2px; }
.minis span i { display: block; width: 100%; background: var(--accent2); border-radius: 2px; }
.floodbars { display: flex; align-items: flex-end; gap: 2px; height: 90px; border-bottom: 1px solid var(--line); margin: 6px 0 2px; }
.floodbars span { flex: 1; min-width: 4px; background: var(--nile); border-radius: 2px 2px 0 0; position: relative; }
.floodbars span.low { background: var(--bad); } .floodbars span.high { background: var(--warn); }
.bgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.ico { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.zoom { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
@media (max-width: 900px) { .grid.map2 { grid-template-columns: 1fr; } .card.sticky { position: static; max-height: none; } }
@media (max-width: 600px) { .grid { grid-template-columns: 1fr; } header { font-size: 13px; position: static; padding: 6px 12px; } nav { padding: 6px 12px 0; } nav button { padding: 4px 7px; } .bgrid { grid-template-columns: 1fr; } .meter { grid-template-columns: 90px 1fr auto; } main { padding: 10px 12px; } }
</style>
</head>
<body>
<header id="top"></header>
<nav id="tabs"></nav>
<main id="main"></main>
<div id="modal" class="hidden"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
"use strict";
// Pán Obou zemí – data: kalendář, terén, vojsko, hodnosti, rozkazy, stavby, výpravy, vědění, zákony, stavy.
// Letopočty podle běžné „střední“ chronologie (I. Shaw, The Oxford History of Ancient Egypt, 2000); nejistota je desítky let.

// Egyptský občanský rok: tři období po čtyřech měsících o 30 dnech + 5 dní navíc (epagomenální).
const SEASONS = ["Achet", "Peret", "Šemu"];
const SEASONS2 = ["Achetu", "Peretu", "Šemu"];
const SEASON_D = ["záplava", "setí a růst", "sklizeň"];
const monthName = m => `${(m % 4) + 1}. měsíc ${SEASONS2[Math.floor(m / 4)]}`;
const monthShort = m => `${(m % 4) + 1}. ${SEASONS[Math.floor(m / 4)]}`;
const FLOOD_MONTH = 1;   // vrchol záplavy (2. měsíc Achetu) – nilometr ukáže výšku
const HARVEST_MONTH = 8; // sklizeň a výběr daně (1. měsíc Šemu)
const OSIRIS_MONTH = 3;  // Usirovy mystéria v Abydu (4. měsíc Achetu, měsíc Chojak)

const TERRAIN = {
  udoli: { n: "Nilské údolí", agri: 1.0, def: 1.0, vuz: 1.15, nile: 1 },
  delta: { n: "Delta (bažiny a pastviny)", agri: 1.05, def: 1.2, vuz: 0.7, nile: 1 },
  fajjum: { n: "Fajjúmská pánev", agri: 1.1, def: 1.05, vuz: 1.0, nile: 1 },
  nubie: { n: "Núbijské údolí", agri: 0.55, def: 1.15, vuz: 0.9, nile: 1 },
  katarakt: { n: "Katarakt (skaliska)", agri: 0.35, def: 1.5, vuz: 0.5, nile: 1 },
  oaza: { n: "Oáza", agri: 0.5, def: 1.35, vuz: 0.8, nile: 0 },
  poust: { n: "Poušť a vádí", agri: 0.08, def: 1.25, vuz: 0.9, nile: 0 },
};

// Vojsko. Počty v mužích; síla útoku/obrany na 100 mužů. Cena v debenech na 100 mužů.
// Příděl: každý voják dostává 1,5 charu obilí měsíčně (char ≈ 77 litrů).
const TROOPS = {
  kopinici: { n: "Kopiníci", atk: 1.0, def: 1.3, cost: 150, col: "#9a7b4f" },
  lucistnici: { n: "Lučištníci", atk: 1.35, def: 0.8, cost: 250, col: "#5f7f3f" },
  medzajove: { n: "Médžajové", atk: 1.6, def: 1.1, cost: 700, upd: 0.6, col: "#7a4b8c", d: "núbijští lučištníci a zvědové z pouště, žoldnéři" },
  vozy: { n: "Válečné vozy", atk: 2.6, def: 1.4, cost: 2000, horses: 100, col: "#a3332b", d: "vyžaduje vědění Válečný vůz a koně" },
};
const TROOP_IDS = Object.keys(TROOPS);
const RATION_SOLDIER = 1.5;

// Hodnosti úředníků (podle titulatury Střední říše). Plat je měsíční příděl v charech obilí.
const RANKS = [
  { n: "Písař", cmd: 600, pay: 20, merit: 0 },
  { n: "Jedinečný přítel", cmd: 1200, pay: 40, merit: 60 },
  { n: "Hodnostář (hatia)", cmd: 2500, pay: 80, merit: 180 },
  { n: "Velký vládce župy", cmd: 4500, pay: 150, merit: 400 },
  { n: "Kníže (iripat)", cmd: 8000, pay: 250, merit: 800 },
];

const STATS = { ved: "Velení", uda: "Statečnost", roz: "Moudrost", spr: "Správa" };
const STAT_IDS = Object.keys(STATS);

const TRAITS = {
  stateny: { n: "Statečný", uda: 8 }, zbabely: { n: "Zbabělý", uda: -10 },
  moudry: { n: "Moudrý", roz: 8 }, prchlivy: { n: "Prchlivý", roz: -5, uda: 4 },
  lstivy: { n: "Lstivý", roz: 5, loy: -5 }, verny: { n: "Věrný", loy: 15 },
  ctizadostivy: { n: "Ctižádostivý", ved: 4, loy: -10 }, skromny: { n: "Skromný", loy: 8 },
  zbozny: { n: "Zbožný", roz: 2 }, chamtivy: { n: "Chamtivý", spr: 4, loy: -6 },
  stedry: { n: "Štědrý" }, kruty: { n: "Krutý", ved: 3 },
  hospodar: { n: "Dobrý hospodář", spr: 10 }, vojevudce: { n: "Rozený vojevůdce", ved: 10 },
  vyrecny: { n: "Výmluvný", roz: 6 }, nemocny: { n: "Neduživý" }, silny: { n: "Silák", uda: 6 },
};
const TRAIT_IDS = Object.keys(TRAITS);

// Rozkazy úředníkům (jeden za měsíc). cost = debeny, grain = obilí (příděly pro robotníky).
const CMDS = {
  zavlaha: { n: "Kanály a hráze", d: "robotníci prohloubí kanály a opraví hráze – víc orné půdy", cost: 100, grain: 3000, stat: "spr" },
  remesla: { n: "Dílny a trhy", d: "podpora řemesel (len, keramika, kov) a směny – vyšší výnos v debenech", cost: 300, stat: "spr" },
  hradby: { n: "Opravit hradby", d: "obnoví cihlové hradby pevnosti", cost: 200, grain: 1500, stat: "spr" },
  odvod: { n: "Odvod mužů", d: "povolá muže z vesnic do vojska", cost: 0, stat: "ved" },
  vycvik: { n: "Výcvik vojska", d: "zvýší výcvik posádky", cost: 50, stat: "ved" },
  rozdat: { n: "Rozdat obilí", d: "naplní obecní sýpky z pokladu – chrání před hladem, těší lid", cost: 0, stat: "spr" },
  scitani: { n: "Sčítání lidu a dobytka", d: "nový soupis polí a stád: na dva roky vyšší výnos daně, lid reptá", cost: 150, stat: "spr" },
  obeti: { n: "Obětiny v chrámu", d: "dary místnímu bohu: maat, přízeň kněží, spokojenost", cost: 400, grain: 2000, stat: "roz" },
  hledat: { n: "Hledat schopné muže", d: "hledá písaře a bojovníky, kteří by vstoupili do služby", cost: 100, stat: "roz" },
  uceni: { n: "Dům života", d: "písaři opisují a studují texty – body vědění", cost: 250, stat: "roz" },
  stavba: { n: "Řídit stavbu", d: "zahájí stavbu v župě", cost: 0, stat: "spr" },
  vyprava: { n: "Vést výpravu", d: "výprava do lomů, dolů nebo cizích zemí (úředník odjede na několik měsíců)", cost: 0, stat: "spr" },
  zvedy: { n: "Vyzvědět župu", d: "zjistí přesný stav cizí župy", cost: 150, stat: "roz" },
  podnecovat: { n: "Podněcovat nepokoje", d: "sníží spokojenost a posádku v cizí župě", cost: 600, stat: "roz" },
  naklonit: { n: "Naklonit si cizího úředníka", d: "dary a sliby – sníží jeho věrnost, případně přejde k tobě", cost: 800, stat: "roz" },
  presun: { n: "Odjet do jiné župy", d: "přesun úředníka (dorazí příští měsíc)", cost: 0, stat: null },
};

// Stavby v župě: debeny (materiál) + obilí (příděly pro robotníky), doba v měsících.
// Během záplavy (Achet) se staví rychleji – rolníci nemohou na pole a jdou na robotu.
const BUILD = {
  pevnost: { n: "Pevnost (cihlové hradby)", cost: 3000, grain: 12000, time: 5, max: 5, d: "silnější obrana, delší obléhání" },
  chram: { n: "Chrám místního boha", cost: 5000, grain: 30000, time: 8, max: 3, d: "maat, přízeň kněží, spokojenost lidu, body vědění" },
  sypka: { n: "Státní sýpky", cost: 1500, grain: 8000, time: 3, max: 3, d: "menší ztráty obilí, větší obecní zásoby proti hladu" },
  dilny: { n: "Dílny (len, keramika, kov)", cost: 3000, grain: 10000, time: 4, max: 3, d: "+20 stropu řemesel a obchodu" },
  pristav: { n: "Přístaviště a loděnice", cost: 2500, grain: 10000, time: 4, max: 2, need: p => TERRAIN[p.ter].nile || p.coast, d: "+15 stropu obchodu, rychlejší přesun vojska po Nilu" },
  lom: { n: "Lom nebo důl", cost: 3000, grain: 15000, time: 5, max: 3, need: p => p.res.some(r => RES[r] && RES[r].mine), d: "výnos podle suroviny" },
};

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const r1 = v => Math.round(v * 10) / 10;
const sum = a => a.reduce((x, y) => x + y, 0);
function rnd(s) { let t = (s.seed = (s.seed + 0x6D2B79F5) | 0); t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
const chance = (s, p) => rnd(s) < p;
const rint = (s, a, b) => a + Math.floor(rnd(s) * (b - a + 1));
const rrange = (s, a, b) => a + rnd(s) * (b - a);
const pick = (s, a) => a[Math.floor(rnd(s) * a.length)];
const gauss = s => Math.sqrt(-2 * Math.log(Math.max(1e-9, rnd(s)))) * Math.cos(2 * Math.PI * rnd(s));
const cap = t => (t ? t.charAt(0).toUpperCase() + t.slice(1) : "");
const pairKey = (a, b) => (a < b ? a + "|" + b : b + "|" + a);
const dateStr = s => `${monthName(s.month)}, ≈ ${s.bce} př. n. l.`;
const dateShort = (m, bce) => `${monthShort(m)} ${bce}`;

function log(s, txt, cat = "obecne", clans) { s.log.unshift({ t: s.turn, m: s.month, y: s.bce, txt, cat, cl: clans || null }); if (s.log.length > 1500) s.log.length = 1500; }

// ---------- postavy ----------
const age = (s, c) => c.by - s.bce;
function st(c, k) { if (!c) return 0; let v = c[k] || 0; for (const t of c.traits || []) v += (TRAITS[t] && TRAITS[t][k]) || 0; if (c.wound && c.wound > 0) v -= 10; return clamp(v, 1, 100); }
const chr = (s, id) => (id ? s.chars[id] : null);

  const N = NAMES[cul] || NAMES.eg;
  if (sex === "f") return pick(s, N.f) + ", dcera " + pick(s, N.m);
  let a = pick(s, N.m), b = pick(s, N.m); if (a === b) b = pick(s, N.m);
  if (cul === "hyk" && chance(s, 0.5)) { a = pick(s, NAMES.eg.m); }
  return a + ", syn " + b;
}
function makeChar(s, o) {
  const c = Object.assign({ id: "c" + s.nextId++, n: "?", sex: "m", by: s.bce + 30, cl: null, st: "off", loc: null, ved: 40, uda: 40, roz: 40, spr: 40, traits: [], loy: 70, rank: 0, merit: 0, dyn: 0, father: null, spouse: null, kids: [], acted: -1, army: null }, o);
  s.chars[c.id] = c; return c;
}
function genOfficer(s, cl, cul, loc, o = {}) {
  const base = () => rint(s, 22, 64);
  const c = makeChar(s, Object.assign({ n: genName(s, cul, "m"), by: s.bce + rint(s, 18, 52), cl, loc, ved: base(), uda: base(), roz: base(), spr: base(), loy: rint(s, 50, 85), rank: pick(s, [0, 0, 1, 1, 1, 2, 2, 3]) }, o));
  const k = pick(s, STAT_IDS); c[k] = clamp(c[k] + rint(s, 12, 30), 1, 96);
  const nt = rint(s, 0, 2); for (let i = 0; i < nt; i++) { const t = pick(s, TRAIT_IDS); if (!c.traits.includes(t)) c.traits.push(t); }
  c.merit = RANKS[c.rank].merit + rint(s, 0, 40);
  return c;
}

// ---------- dotazy ----------
const clanProvs = (s, cid) => Object.values(s.provs).filter(p => p.owner === cid);
const officers = (s, cid) => Object.values(s.chars).filter(c => c.cl === cid && c.st === "off");
const officersIn = (s, pid) => Object.values(s.chars).filter(c => c.st === "off" && c.loc === pid && c.cl === s.provs[pid].owner && !c.army && !c.away && !c.moving);
const aliveClans = s => Object.values(s.clans).filter(c => c.alive);
const men = t => (t ? sum(TROOP_IDS.map(k => t[k] || 0)) : 0);

const isPlayer = (s, cid) => cid === s.player;
const leaderOf = (s, cid) => chr(s, s.clans[cid].leader);

const rel = (s, a, b) => (a === b ? 100 : (s.clans[a].rel[b] || 0));
function addRel(s, a, b, v) { if (a === b || !s.clans[a] || !s.clans[b]) return; s.clans[a].rel[b] = clamp((s.clans[a].rel[b] || 0) + v, -100, 100); s.clans[b].rel[a] = clamp((s.clans[b].rel[a] || 0) + v, -100, 100); }
const atWar = (s, a, b) => s.wars.some(w => (w.a === a && w.b === b) || (w.a === b && w.b === a));
const enemiesOf = (s, a) => s.wars.filter(w => w.a === a || w.b === a).map(w => (w.a === a ? w.b : w.a));
const allied = (s, a, b) => !!s.alliances[pairKey(a, b)];
const truceUntil = (s, a, b) => s.truces[pairKey(a, b)] || 0;
const hasTech = (s, cid, t) => !!(s.clans[cid] && s.clans[cid].techs[t]);

const vassalsOf = (s, cid) => aliveClans(s).filter(c => c.vassalOf === cid);
const isKmen = (s, cid) => s.clans[cid] && s.clans[cid].type === "kmen";
const coreProvs = s => Object.values(s.provs).filter(p => p.flags.includes("e"));
function realmProvs(s, cid) { return clanProvs(s, cid).length + sum(vassalsOf(s, cid).map(v => clanProvs(s, v.id).length)); }
function realmCore(s, cid) { const ids = [cid].concat(vassalsOf(s, cid).map(v => v.id)); return coreProvs(s).filter(p => ids.includes(p.owner)).length; }
const regYear = (s, cid) => Math.floor((s.turn - (s.clans[cid].reign || 0)) / 12) + 1;
function friendly(s, a, b) { if (a === b) return true; const A = s.clans[a], B = s.clans[b]; return allied(s, a, b) || A.vassalOf === b || B.vassalOf === a; }
function borderClans(s, cid) { const set = new Set(); for (const p of clanProvs(s, cid)) for (const n of p.nb) { const o = s.provs[n].owner; if (o !== cid) set.add(o); } return [...set]; }
function isBorder(s, p) { return p.nb.some(n => s.provs[n].owner !== p.owner); }
function isFront(s, p) { return p.nb.some(n => atWar(s, s.provs[n].owner, p.owner)); }

      if (!to && lordOf) { const cands = lordOf.nb.map(n => s.provs[n].owner).filter(o => o !== c.cl && !isKmen(s, o)); if (cands.length) to = cands.sort((a, b) => rel(s, c.cl, a) - rel(s, c.cl, b))[0]; }
      if (to && tryDefect(s, c, to)) continue;
      const old = c.cl; c.st = "wand"; c.cl = null; for (const p of Object.values(s.provs)) if (p.lord === c.id) p.lord = null;
      if (isPlayer(s, old)) log(s, `${c.n} z nespokojenosti opustil tvé služby.`, "intriky", [old]); assignLords(s, old);
    }
  }
  for (const p of Object.values(s.provs)) {
    p.loy = clamp(p.loy + (provLoyTarget(s, p) - p.loy) * 0.15, 0, 100);
    p.hunger = Math.max(0, p.hunger - 0.03);
    if (p.loy < 14 && !isKmen(s, p.owner) && chance(s, 0.12) && p.unrest < s.turn) {
      p.unrest = s.turn + 3; lossApply(p.troops, men(p.troops) * 0.15);
      if (isPlayer(s, p.owner)) queueEvent(s, "nepokoje", { pid: p.id }); else p.loy += 10;
      log(s, `V župě ${p.n} se bouří lid (spokojenost ${Math.round(p.loy)}).`, "zupy", [p.owner]);
    }
  }
}

// ---------- hospodářství měsíce ----------
function economyTick(s) {
  for (const C of aliveClans(s)) {
    const b = clanBudget(s, C.id);
    C.deben += b.net; C.grain += b.gnet; C.last.net = b.net; C.last.gnet = b.gnet;
    if (hasTech(s, C.id, "vuz")) C.kone += sum(clanProvs(s, C.id).filter(p => p.ter === "delta").map(p => p.v * (hasTech(s, C.id, "dobytek") ? 4 : 2)));
    if (C.grain < 0) { // hlad ve vojsku: dezerce
      for (const p of clanProvs(s, C.id)) lossApply(p.troops, men(p.troops) * 0.08);
      for (const a of s.armies.filter(x => x.cl === C.id)) lossApply(a.t, men(a.t) * 0.1);
      if (isPlayer(s, C.id)) log(s, `Sýpky jsou prázdné! Vojáci bez přídělů dezertují.`, "hospodarstvi", [C.id]);
      C.grain = 0;
    }
    if (C.deben < 0) { C.maat = Math.max(0, C.maat - 0.5); for (const p of clanProvs(s, C.id)) if (p.troops.medzajove) p.troops.medzajove = Math.round(p.troops.medzajove * 0.85); }
    // výcvik velitelem vojska
    const vt = officeVal(s, C.id, "vojsko"); if (vt) for (const p of clanProvs(s, C.id)) if (p.train < 70) p.train = Math.min(70, p.train + vt / 40);
    const kv = officeVal(s, C.id, "knez"); if (kv) { C.maat = Math.min(100, C.maat + kv / 400); if (C.estates) C.estates.knezi = Math.min(100, C.estates.knezi + kv / 300); }
    if (hasTech(s, C.id, "texty")) C.maat = Math.min(100, C.maat + 0.05);
    // výzkum z chrámů
    C.res.pts += sum(clanProvs(s, C.id).map(p => (p.b.chram || 0) * 0.6)) * researchMult(s, C.id);
    researchTick(s, C.id); tombTick(s, C.id);
    C.prestige = Math.max(0, C.prestige * 0.996);
    C.maat = clamp(C.maat + (50 - C.maat) * 0.02, 0, 100);
    // kmeny doplňují bojovníky
    if (C.type === "kmen") for (const p of clanProvs(s, C.id)) { const cap_ = troopCap(p) * 0.9 + 300; if (men(p.troops) < cap_) { p.troops.lucistnici = (p.troops.lucistnici || 0) + 30; p.troops.kopinici = (p.troops.kopinici || 0) + 20; } }
  }
  // stavby
  for (const p of Object.values(s.provs)) {
    if (!p.build || p.siege) continue; const C = s.clans[p.owner];
    p.build.left -= (s.month < 4 ? 1.5 : 1) * (C.laws.robota === 2 ? 1.25 : C.laws.robota === 0 ? 0.85 : 1);
    if (p.build.left <= 0) { const b = p.build.b; if (b === "pevnost") { p.castle++; p.dur = durMax(s, p); } else p.b[b] = (p.b[b] || 0) + 1; if (b === "chram") C.maat = Math.min(100, C.maat + 3); C.prestige += 5; if (isPlayer(s, p.owner)) log(s, `Dokončena stavba v župě ${p.n}: ${BUILD[b].n} (úroveň ${buildLevel(p, b)}).`, "stavby", [p.owner]); p.build = null; }
  }
  // obecní zásoby se pomalu kazí
  for (const p of Object.values(s.provs)) p.stock = Math.round(p.stock * (1 - Math.max(0.004, 0.012 - (p.b.sypka || 0) * 0.003)));
  // přesuny úředníků, návraty z výprav
  for (const c of Object.values(s.chars)) {
    if (c.moving && c.moving.at <= s.turn) { const t = s.provs[c.moving.to]; c.moving = null; if (t && t.owner === c.cl) c.loc = t.id; if (c.cl) assignLords(s, c.cl); }
    if (c.away && c.away.until <= s.turn && c.st === "off") expeditionReturn(s, c);
  }
}
function floodTick(s) {
  const h = s.flood.next; s.flood.h = h; s.flood.hist.push({ y: s.bce, h }); if (s.flood.hist.length > 80) s.flood.hist.shift();
  log(s, `Nilometr: záplava dosáhla ${String(h).replace(".", ",")} loktů – ${floodWord(h)}.`, "nil");
  s.market.p = r1(clamp(2 / Math.pow(floodFactor(h), 1.4) * rrange(s, 0.9, 1.1), 1, 9));
  if (h >= 18) for (const p of Object.values(s.provs)) if (TERRAIN[p.ter].nile) { p.agri = Math.max(10, p.agri - rint(s, 2, 5)); p.dur = Math.max(0, p.dur - 20); p.pop = r1(p.pop * 0.99); }
  if (P(s) && P(s).alive) { if (h < 13.5) queueEvent(s, "nizka", { h }); else if (h >= 18) queueEvent(s, "vysoka", { h }); }
}
function harvestTick(s) {
  const hungry = {};
  for (const p of Object.values(s.provs)) {
    const C = s.clans[p.owner]; if (!C) continue;
    const H = provHarvest(s, p), food = provFood(s, p), tax = C.type === "kmen" ? 0 : provTax(s, p);
    C.grain += tax;
    const left = food - tax - provNeed(p);
    if (left >= 0) { p.stock = Math.min(Math.round(p.pop * 1000 * (1.5 + (p.b.sypka || 0) * 0.7)), p.stock + Math.round(left * 0.6)); p.hunger = Math.max(0, p.hunger - 0.2); p.pop = r1(p.pop * (p.loy > 35 ? 1.015 : 1.005)); }
    else {
      const def = -left, fromStock = Math.min(p.stock, def); p.stock -= fromStock; const rest = def - fromStock;
      if (rest >= 1) { let d = rest / provNeed(p); if (hasTech(s, p.owner, "nilometr")) d *= 0.67; p.hunger = clamp(p.hunger + d * 1.5, 0, 1); p.pop = r1(Math.max(0.5, p.pop * (1 - d * 0.22))); p.loy = Math.max(0, p.loy - d * 50); (hungry[p.owner] = hungry[p.owner] || []).push([p.id, Math.round(rest)]); }
    }
    p._lastH = Math.round(H); p._lastTax = Math.round(tax);
  }
  for (const [cid, list] of Object.entries(hungry)) {
    if (isPlayer(s, cid)) queueEvent(s, "hlad", { list });
    else { const C = s.clans[cid]; for (const [pid, d] of list) { if (C.grain > d * 2) { C.grain -= d; s.provs[pid].stock += d; s.provs[pid].loy += 8; } } }
    log(s, `${clanName(s, cid)}: hlad v župách ${list.map(([id]) => s.provs[id].n).join(", ")}.`, "nil", [cid]);
  }
  // sklady se kazí, úroda se přičte
  for (const C of aliveClans(s)) { C.last.harvest = s.turn; }
}

  // vazal se vzbouří
  if (C.vassalOf && s.clans[C.vassalOf] && chance(s, 0.02) && realmPower(s, cid) > realmPower(s, C.vassalOf) * 0.8 && rel(s, cid, C.vassalOf) < 20) declareWar(s, cid, C.vassalOf, "za nezávislost");
  // tribut
  if (C.tributeTo && (atWar(s, cid, C.tributeTo) || realmPower(s, cid) > realmPower(s, C.tributeTo) * 1.2) && chance(s, 0.05)) { C.last["d_" + C.tributeTo] = -1; diplo(s, cid, C.tributeTo, "tribut_stop"); }

}

// ---------- vítězství ----------
function checkEnd(s) {
  if (s.over && !s.over.cont) return;
  const C = P(s); if (!C || !C.alive) return;
  const core = coreProvs(s).length, mine = realmCore(s, s.player);
  if (!s.flags.won && C.cul === "eg" && mine >= Math.ceil(core * 0.9) && clanProvs(s, s.player).some(p => p.id === "l1" || p.id === "u4" || p.id === "u20" || p.id === "lav")) {
    s.flags.won = 1; C.maat = Math.min(100, C.maat + 20); C.prestige += 300;
    const L = leaderOf(s, s.player);
    s.over = { win: true, cont: true, txt: `${L.n} sjednotil Horní a Dolní Egypt (sema-taui) a nasadil si dvojitou korunu. Ovládáš ${mine} z ${core} žup egyptského jádra. Tak jako Montuhotep II. kolem roku 2055 př. n. l. nebo Ahmose I. po dobytí Avaridu jsi zakladatelem nové éry. Můžeš vládnout dál.` };
    queueEvent(s, "vitezstvi", { win: true, txt: s.over.txt });
  }
  if (!s.flags.won && C.cul !== "eg" && mine >= Math.ceil(core * 0.5) && ["n_kerma", "n_buhen", "u1"].every(id => s.provs[id].owner === s.player || (s.clans[s.provs[id].owner].vassalOf === s.player))) {
    s.flags.won = 1; s.over = { win: true, cont: true, txt: `Kuš ovládá Núbii i polovinu Egypta. Tak mocná Kerma nebyla nikdy – až o devět století později vládli Egyptu kušitští králové 25. dynastie.` };
    queueEvent(s, "vitezstvi", { win: true, txt: s.over.txt });
  }
}

// ---------- konec měsíce ----------
function endTurn(s) {
  if (s.over && !s.over.cont) return;
  delegated(s);
  for (const C of aliveClans(s)) if (!isPlayer(s, C.id)) aiClan(s, C.id);
  moveArmies(s); siegeTick(s); raids(s);
  economyTick(s);
  if (s.month === 0) { s.flood.next = rollFlood(s); }
  if (s.month === FLOOD_MONTH) floodTick(s);
  if (s.month === HARVEST_MONTH) harvestTick(s);
  loyaltyTick(s);
  // stavy (jen hráč): pomalý návrat k rovnováze

    for (const e of ESTATE_IDS) C.estates[e] = clamp(C.estates[e] + (50 - C.estates[e]) * 0.02, 0, 100);

    if (C.estates.nomarchove < 20 && chance(s, 0.1)) { const c = pick(s, officers(s, s.player).filter(x => !x.dyn) || []); if (c) { c.loy = Math.max(0, c.loy - 15); log(s, `Nomarchové reptají; ${c.n} se veřejně staví proti dvoru.`, "intriky", [s.player]); } }
  }
  // AI pokoušení hráčových úředníků
  for (const e of aliveClans(s).filter(x => !isPlayer(s, x.id) && x.type !== "kmen" && (atWar(s, x.id, s.player) || rel(s, x.id, s.player) < -30))) {
    if (!chance(s, 0.06)) continue; const cs = officers(s, s.player).filter(c => !c.dyn && c.loy < 45 && Object.values(s.provs).some(q => q.lord === c.id && q.nb.some(n => s.provs[n].owner === e.id)));
    if (cs.length) { const c = pick(s, cs); c.loy = Math.max(0, c.loy - rint(s, 6, 14)); c.tempt = e.id; log(s, `Šeptá se, že ${c.n} přijímá dary od rodu ${e.house}.`, "intriky", [s.player]); }
  }
  scriptedEvents(s);
  // posun kalendáře
  s.turn++; s.month++;
  if (s.month >= 12) { s.month = 0; s.bce--; log(s, `Pět dní navíc (epagomenální): slaví se narození Usira, Hora, Sutecha, Eset a Nebthet. Začíná nový rok.`, "nil"); yearLife(s); if (C) { if (hasTech(s, s.player, "hvezdy")) C.maat = Math.min(100, C.maat + 2); } }

}

  for (const e of enemiesOf(S, me())) out.push(["bad", `Válka s rodem ${S.clans[e].house}.`]);
  for (const p of Object.values(S.provs).filter(p => p.siege && (p.owner === me() || p.siege.cl === me()))) out.push(["bad", p.owner === me() ? `Župa ${p.n} je obléhána! Hradby ${Math.round(p.dur)}.` : `Obléháš pevnost v župě ${p.n} (hradby ${Math.round(p.dur)}).`]);

// ---------- Plán měsíce ----------
function suggestCmd(c, p) {
  if (p.loy < 32 || p.hunger > 0.2) return "rozdat";
  if (isFront(S, p) && men(p.troops) < troopCap(p) * 0.7) return "odvod";
  if (p.agri < agriCap(S, p) - 1) return "zavlaha";
  if (p.com < comCap(S, p) - 1) return "remesla";
  if (men(p.troops) > 300 && p.train < 50) return "vycvik";
  if (p.dur < durMax(S, p) * 0.8) return "hradby";

}

  if (k === "zvedy" || k === "podnecovat") { const near = Object.values(S.provs).filter(q => q.owner !== me() && q.nb.some(n => S.provs[n].owner === me())); return sel("p1_" + id, near.map(q => [q.id, `${q.n} (${S.clans[q.owner].n})`]), SEL["p1_" + id]); }
  if (k === "naklonit") { const near = new Set(Object.values(S.provs).filter(q => q.owner !== me() && q.nb.some(n => S.provs[n].owner === me())).map(q => q.id)); const xs = Object.values(S.chars).filter(x => x.st === "off" && x.cl !== me() && !x.dyn && near.has(x.loc)); return xs.length ? sel("p1_" + id, xs.map(x => [x.id, `${x.n} (${S.clans[x.cl].n}, ${RANKS[x.rank].n})`]), SEL["p1_" + id]) : '<span class="muted small">v sousedství nikdo</span>'; }

    h += `<div class="small">Pevnost úrovně ${p.castle} · obecní zásoby ${fmtK(p.stock)} charů${p.hunger > 0.05 ? ` · <b class="bad">hlad</b>` : ""}${p.unrest > S.turn ? " · <b class='bad'>nepokoje</b>" : ""}</div>`;

    if (p._lastH) h += `<div class="small muted">Poslední sklizeň ≈ ${fmtK(p._lastH)} charů, daň ${fmtK(p._lastTax)}. Odhad příští daně ≈ ${fmtK(provTax(S, p, S.flood.h || 15.5))}.</div>`;
  } else h += '<p class="small muted">O této župě víš málo. Pošli zvědy (rozkaz Vyzvědět župu).</p>';
  if (p.siege) { const sc = S.clans[p.siege.cl]; h += `<div class="alert bad">Obléhá ${esc(sc.house)} už ${p.siege.m} měs.</div>`; }
  if (own) {
    h += `<h4>Úředníci v župě</h4>` + (officersIn(S, p.id).map(c => `<div class="small">${esc(c.n)} – ${RANKS[c.rank].n}${c.acted === S.turn ? ' <span class="muted">(jedná)</span>' : ""}</div>`).join("") || '<p class="small muted">Nikdo. Pošli sem úředníka rozkazem „Odjet do jiné župy“.</p>');

      const cmds = officersIn(S, p.id).filter(c => c.acted !== S.turn);

// ---------- Diplomacie ----------
function relStatus(cid) {
  const C = P(S), O = S.clans[cid], t = [];
  if (atWar(S, me(), cid)) t.push('<span class="pill bad">válka</span>');
  else if (truceUntil(S, me(), cid) > S.turn) t.push(`<span class="pill">příměří ${truceUntil(S, me(), cid) - S.turn} měs.</span>`);
  if (allied(S, me(), cid)) t.push('<span class="pill good">spojenec</span>');
  if (O.vassalOf === me()) t.push('<span class="pill good">tvůj poddaný</span>');
  if (C.vassalOf === cid) t.push('<span class="pill warn">tvůj pán</span>');
  if (C.tributeTo === cid) t.push('<span class="pill warn">platíš mu tribut</span>');
  if (O.tributeTo === me()) t.push('<span class="pill good">platí ti tribut</span>');
  if (S.trade[pairKey(me(), cid)]) t.push('<span class="pill">obchod</span>');
  if (married(S, me(), cid)) t.push('<span class="pill">sňatek</span>');
  if (O.vassalOf && O.vassalOf !== me()) t.push(`<span class="pill">poddaný: ${esc(S.clans[O.vassalOf].n)}</span>`);
  return t.join(" ");
}

  });

      <p class="small">${relStatus(id) || "bez zvláštních vztahů"}</p>

      <div class="row">${war ? btn("Nabídnout mír", "diplo", [id, "mir"], e, "go") : btn("Vyhlásit válku", "diplo", [id, "valka"], e || (S.clans[me()].vassalOf === id ? null : null), "danger")}

      ${btn("Obchodní smlouva", "diplo", [id, "obchod"], e || (war ? "Válčíte" : S.trade[pairKey(me(), id)] ? "Už ji máte" : null))}
      ${btn("Žádat poddanství", "diplo", [id, "podruci"], e || (D.vassalOf ? "Už je něčím poddaným" : D.type === "kmen" ? null : null))}

      <p class="small muted">Poměr sil (tvá říše : jejich) ${dec(warScore(S, me(), id))} : 1. Mír přijmou spíš, když prohrávají nebo válka trvá dlouho. Poddanství přijmou při převaze víc než 3 : 1. Vyhlášení války během příměří nebo proti spojenci poškodí maat.</p>`;

  ${card("Trh – směna obilí za debeny", `<p>Cena: <b>${dec(S.market.p)} debenu za char</b> (prodej ${dec(S.market.p * 0.8)}, nákup ${dec(S.market.p * 1.25)}). Kupci tento měsíc smění ještě ${fmt(capQ - used)} charů.</p>
    <div class="row"><input id="mktQ" type="number" step="1000" min="0" placeholder="charů"> ${btn("Prodat obilí", "trade", [-1])} ${btn("Koupit obilí", "trade", [1])}</div><p class="small muted">Po slabé záplavě obilí zdraží. Objem směny závisí na řemeslech a obchodu ve tvých župách. Za Nové říše stál char pšenice dvoj až čtyřnásobek debenu.</p>`)}
  ${card("Nilometr – výšky záplav", fh.length ? `<div class="floodbars">${fh.map(x => `<span class="${x.h < 13.5 ? "low" : x.h >= 18 ? "high" : ""}" style="height:${clamp((x.h - 8) / 13 * 100, 4, 100)}%" title="${x.y} př. n. l.: ${dec(x.h)} loktů"></span>`).join("")}</div><div class="small muted">Posledních ${fh.length} let. Červeně hladová, oranžově ničivá záplava.</div>` : '<p class="muted small">První záplava přijde ve 2. měsíci Achetu.</p>' + '<p class="small">Plinius Starší zapsal pravidlo z memfidského nilometru: dvanáct loktů znamená hlad, třináct nouzi, čtrnáct radost, patnáct bezpečí a šestnáct hojnost. Víc než osmnáct loktů strhává hráze.</p>')}
  ${card("Výpravy", tbl(["Cíl", "Výchozí župy", "#Měs.", "Výnos (deb.)", "#Riziko", ""], ex) + '<p class="small muted">Výpravu vede úředník rozkazem „Vést výpravu“. Nápisy výprav se dochovaly ve Vádí Hammámát, v Hatnubu i na Sinaji; výpravy do Puntu vyplouvaly ze Sauu (Marsá Gavásis).</p>', "wide")}</div>`;
}

// ---------- Chrámy a stavy ----------
function tChramy() {
  const C = P(S), tc = tombCost(S, me());
  const laws = Object.entries(LAWS).map(([k, Lw]) => tr([`<b>${Lw.n}</b><div class="small muted">${Lw.d}</div>`, sel("law_" + k, Lw.opts.map((o, i) => [i, o]), C.laws[k], `data-a="law" data-x='["${k}"]'`) + ((C.lawCd[k] || 0) > S.turn ? `<div class="small muted">změna možná za ${C.lawCd[k] - S.turn} měs.</div>` : "")]));
  const temples = myProvs().filter(p => p.b.chram).map(p => tr([provLink(p), esc(p.god), tdn(p.b.chram)]));
  const EST_D = { knezi: "maat a chrámová kázeň", nomarchove: "věrnost úředníků", pisari: "výnos debenů a vědění", lid: "spokojenost žup" };
  return `<div class="grid">
  ${card("Maat a stavy", meter("Maat", C.maat, 100, "var(--gold)") + ESTATE_IDS.map(e => meter(ESTATES[e], C.estates[e], 100, C.estates[e] < 30 ? "var(--bad)" : "")).join("") + `<p class="small muted">${ESTATE_IDS.map(e => `${ESTATES[e]}: ${EST_D[e]}`).join(" · ")}. Maat je řád světa; panovník ji udržuje obětinami, chrámy, spravedlností a vítězstvími. Hlad, zpustošení hrobů a porušené smlouvy ji narušují.</p>`)}
  ${card(`Hrobka panovníka – ${esc(C.tombN)}`, `<div class="small">${TOMB_STAGES.map((t, i) => `<div>${i < C.tomb.stage ? '<span class="good">✔</span>' : i === C.tomb.stage && C.tomb.active ? "▶" : "○"} ${t}</div>`).join("")}</div>
    ${C.tomb.active ? `<p>Pracuje se, zbývá asi ${Math.max(1, Math.ceil(C.tomb.left / (S.month < 4 ? 2 : 1)))} měs.</p>` : C.tomb.stage < TOMB_STAGES.length ? `<div class="row">${btn(`Zahájit fázi „${TOMB_STAGES[C.tomb.stage]}“ (${fmt(tc.deben)} d., ${fmtK(tc.grain)} ch.)`, "tomb", [], null, "go")}</div>` : '<p class="good">Hrobka je dokončena.</p>'}
    <p class="small muted">Když panovník zemře s hrobkou hotovou aspoň do třetí fáze, nástupce získá maat; bez hrobky ji ztratí. Za záplavy (Achet) se staví dvakrát rychleji – rolníci jsou volní pro robotu.</p>`)}
  ${card("Zákony", tbl(["Zákon", "Nastavení"], laws), "wide")}
  ${card("Chrámy", tbl(["Župa", "Bůh", "#Úroveň"], temples) + '<p class="small muted">Chrám staví úředník rozkazem „Řídit stavbu“. Každá úroveň dává maat, spokojenost a body vědění.</p>')}</div>`;
}

// ---------- Rod ----------
function famCard(c, role) {
  if (!c) return ""; const H = heirsOf(S, me())[0];
  return `<div class="fam ${c.sex === "f" ? "f" : ""}"><div class="fn">${esc(c.n)}${c.id === P(S).leader ? " ♛" : ""}</div><div class="small muted">${role || (c.sex === "m" ? "syn" : "dcera")}, ${age(S, c)} let${H && H.id === c.id ? ", <b>dědic</b>" : ""}${c.st === "cap" ? ", v zajetí" : ""}</div>
    <div class="minis">${STAT_IDS.map(k => `<span title="${STATS[k]} ${st(c, k)}"><i style="height:${st(c, k) * 0.28}px"></i></span>`).join("")}</div>
    ${c.note ? `<div class="small muted">${esc(c.note)}</div>` : ""}
    ${c.spouse && chr(S, c.spouse) && role !== "choť" ? `<div class="small">∞ ${esc(chr(S, c.spouse).n)}</div>` : ""}
    ${c.st === "kid" ? sel("fo_" + c.id, [["", "výchova: volná"], ["ved", "vojenská"], ["uda", "lovy a zápas"], ["roz", "dům života (písař)"], ["spr", "správa statků"]], c.focus || "", `data-a="focus" data-x='["${c.id}"]'`) : ""}</div>`;
}
function tRod() {
  const C = P(S), L = ruler(), sp = L && chr(S, L.spouse), H = heirsOf(S, me());
  const kids = L ? L.kids.map(id => chr(S, id)).filter(c => c && c.st !== "dead") : [];
  const others = Object.values(S.chars).filter(c => c.cl === me() && c.dyn && c.st !== "dead" && c !== L && c !== sp && !kids.includes(c));
  const dead = Object.values(S.chars).filter(c => c.dyn && c.st === "dead" && c.cl === me()).slice(-15).map(c => tr([esc(c.n), esc(c.died || "")]));
  const canKing = C.t !== "král" && C.cul === "eg" && clanProvs(S, me()).length >= 6;
  return `<div class="grid">${card("Rodokmen – " + esc(C.house), `<div class="tree"><div class="gen">${famCard(L, cap(C.t))}${sp ? famCard(sp, "choť") : '<div class="fam empty">bez choti</div>'}</div>
    ${kids.length ? `<div class="stem"></div><div class="gen">${kids.map(c => famCard(c)).join("")}</div>` : '<p class="muted small">Zatím bez potomků.</p>'}
    ${others.length ? `<h4>Další členové rodu</h4><div class="gen">${others.map(c => famCard(c, c.sex === "m" ? "příbuzný" : "příbuzná")).join("")}</div>` : ""}</div>
    <p class="small muted">Dědic: ${H[0] ? esc(H[0].n) : '<b class="bad">žádný</b>'} (${LAWS.nastupnictvi.opts[C.laws.nastupnictvi]}). Sloupce: velení, statečnost, moudrost, správa. Synové v 15 letech vstupují do služby. Sňatky s jinými rody dohodneš v Diplomacii. Bez dědice převezme vládu nejschopnější úředník a založí novou dynastii.</p>`, "wide")}
  ${card("Královský titul", C.t === "král" ? `<p>${esc(L ? L.n : "")} nosí titul krále Horního a Dolního Egypta.</p>` : `<p>Jsi ${esc(C.t)}. Kdo ovládne aspoň šest žup, může přijmout královskou titulaturu a pět jmen panovníka – jako Intefové v Thébách.</p>${btn("Prohlásit se králem", "king", [], canKing ? null : "Potřebuješ aspoň 6 žup (a egyptský rod)", "go")}<p class="small muted">Vazalské pouto k pánovi se tím zpřetrhá a hrozí válka.</p>`)}
  ${card("Spřízněné rody", aliveClans(S).filter(c => married(S, me(), c.id)).map(c => chip(c.id)).join(" ") || "—")}
  ${card("Zesnulí", tbl(["Jméno", "Zemřel(a)"], dead))}</div>`;
}

// ---------- Vědění ----------
function tVedeni() {
  const C = P(S), cats = [...new Set(TECH_IDS.map(t => TECHS[t].cat))];
  return `<div class="grid">${card("Dům života", `<p>Zkoumá se: <b>${C.res.cur ? TECHS[C.res.cur].n + ` (${Math.round(C.res.pts)}/${techCost(S, me(), C.res.cur)})` : "nic"}</b>. Body přinášejí rozkaz „Dům života“ a chrámy.</p><p class="small muted">Vědění, které znají sousedé nebo nepřátelé, se učí o třetinu levněji – tak se do Egypta dostal válečný vůz a kompozitní luk.</p>`)}
  ${cats.map(cat => card(cat, tbl(["Vědění", "Účinek", "#Cena", ""], TECH_IDS.filter(t => TECHS[t].cat === cat).map(t => { const T = TECHS[t]; return tr([C.techs[t] ? `<span class="good">✔ ${T.n}</span>` : C.res.cur === t ? `<b>▶ ${T.n}</b>` : T.n, `<span class="small">${T.d}${T.req ? " · vyžaduje: " + T.req.map(r => TECHS[r].n).join(", ") : ""}</span>`, tdn(techCost(S, me(), t)), C.techs[t] || C.res.cur === t ? "" : btn("Zkoumat", "research", [t], techAvail(S, me(), t) ? null : "Chybí předpoklady")]); })))).join("")}</div>`;
}

// ---------- Kronika ----------
function tKronika() {
  const f = SEL.logF; const l = S.log.filter(x => f === "vse" || (f === "moje" ? x.cl && x.cl.includes(me()) : f === "svet" ? !x.cl || !x.cl.includes(me()) : x.cat === f)).slice(0, 400);
  return card("Kronika", `<div class="row">${[["moje", "můj rod"], ["svet", "svět"], ["vse", "vše"], ["valka", "války"], ["nil", "Nil"], ["rod", "rody"], ["diplomacie", "diplomacie"], ["rozkazy", "rozkazy"], ["intriky", "intriky"]].map(([k, n]) => btn(f === k ? `<b>${n}</b>` : n, "logF", [k])).join("")}</div><div class="log">${l.map(x => `<div class="lg c-${x.cat}"><span class="tag">${monthShort(x.m)} ${x.y}</span>${esc(x.txt)}</div>`).join("")}</div>`, "wide");
}

// ---------- Hra ----------
const SCEN_CACHE = {};
function tHra() {
  const slots = [1, 2, 3, 4, 5].map(n => { const i = slotInfo(n); return tr([n, i ? esc(i) : '<span class="muted">prázdná</span>', btn("Uložit", "save", [n]) + btn("Načíst", "load", [n], i ? null : "Prázdná") + btn("Smazat", "del", [n], i ? null : "Prázdná")]); });
  const sc = SEL.ngScen, Sc = SCENARIOS[sc];
  const clans = Sc.clans.filter(c => c.type !== "kmen");
  if (!clans.some(c => c.id === SEL.ngClan)) SEL.ngClan = clans[0].id;
  const histNote = id => (Sc.hist.find(h => h.cl === id && h.r === "leader") || {}).n || "";
  return `<div class="grid">${card("Nová hra", `<div class="kv"><span>Scénář</span>${sel("ngScen", Object.entries(SCENARIOS).map(([k, x]) => [k, x.n]), sc, `data-a="ngScen" data-x='[]'`)}<span></span><span class="small muted">${esc(Sc.d)}</span>
    <span>Rod</span>${sel("ngClan", clans.map(c => [c.id, `${c.n} – ${c.house} (${c.provs.length} žup${histNote(c.id) ? ", " + histNote(c.id) : ""})`]), SEL.ngClan, `data-a="ngClan" data-x='[]'`)}
    <span>Obtížnost</span>${sel("ngDiff", [[0, "Snadná"], [1, "Obvyklá"], [2, "Těžká"]], SEL.ngDiff, `data-a="ngDiff" data-x='[]'`)}
    <span>Mlha</span><label><input type="checkbox" id="ngFog" ${SEL.ngFog === false ? "" : "checked"} data-a="ngFog" data-x='[]'> o vzdálených župách víš jen odhady</label>
    <span>Semínko</span><input id="ngSeed" type="number" placeholder="náhodné"></div>
    <div class="row">${btn(SEL.ngConfirm ? "<b>Ano, začít</b>" : "Začít novou hru", "newgame", [], null, "go")}</div>
    <p class="small muted">Thébané a Hérakleopolští (2070) nebo Thébané a Hyksósové (1560) jsou velké říše. Nomarchové Asjútu, Hermopole, Beni Hasanu nebo kníže Teti začínají s jedinou župou – to je výzva.</p>`)}
  ${card("Uložené hry", tbl(["#", "Obsah", ""], slots) + `<p class="small muted">Hra se sama ukládá po každém kroku (v tomto prohlížeči).</p><div class="row">${btn("Stáhnout do souboru", "exportSave")} ${btn("Nahrát ze souboru", "importSave")} ${btn("Světlý / tmavý vzhled", "theme")}</div>`)}
  <section class="card wide help"><h3>Jak hrát</h3>
  <p>Jsi hlavou vládnoucího rodu nebo rodu nomarchů v době, kdy je Egypt rozdělený. Jedno kolo je jeden měsíc egyptského občanského roku: čtyři měsíce záplavy (Achet), čtyři měsíce setí (Peret) a čtyři měsíce sklizně (Šemu), na konci pět dní navíc. <b>Cíl:</b> sjednotit Horní a Dolní Egypt – ovládnout (sám nebo skrze poddané) devět desetin žup egyptského jádra. Prohraješ, když přijdeš o všechny župy.</p>
  <h4>Měsíc</h4><p>V záložce <b>Plán měsíce</b> dáš každému úředníkovi jeden rozkaz: kanály a hráze, dílny a trhy, hradby, odvod, výcvik, rozdělení obilí, sčítání, obětiny, hledání schopných mužů, dům života, stavby, výpravy, zvědy, intriky nebo přesun. Župy svěřené rádci spravuje umělá inteligence sama. Pak stiskni <b>Konec měsíce</b>.</p>
  <h4>Nil a obilí</h4><p>Ve 2. měsíci Achetu ukáže nilometr výšku záplavy. Ta rozhodne o sklizni v 1. měsíci Šemu, kdy písaři vyberou daň v obilí. Obilím platíš příděly vojákům a úředníkům i robotníky na stavbách. Obecní sýpky v župách chrání lid před hladem; při nízké záplavě je doplň rozkazem „Rozdat obilí“. Debeny (měděná jednotka hodnoty) plynou z řemesel, obchodu, dolů a výprav.</p>
  <h4>Válka</h4><p>Válku vyhlásíš v Diplomacii, vojsko vyšleš z panelu župy na Mapě. Vojsko táhne jednu župu za měsíc, s říční flotilou dvě. Bitva má až šest kol; rozhoduje počet, druh vojska, výcvik, vědění, terén, hradby a velitel. Pevnosti se obléhají – hradby z nepálených cihel padnou, nebo posádka vyhladoví. Kmeny Libyjců, Aamu, Médžajů a Núbijců podnikají nájezdy.</p>
  <h4>Úředníci a maat</h4><p>Věrnost úředníků závisí na hodnosti, úřadech, darech, maat a slávě. Nevěrný nomarcha pohraniční župy může přeběhnout i se župou. Maat udržuješ obětinami, chrámy, péčí o hladové a hrobkou panovníka; po třiceti letech vlády můžeš slavit svátek sed.</p></section>
  <section class="card wide help"><h3>Historické pozadí a zdroje</h3>
  <p><b>První přechodné období (≈ 2160–2055 př. n. l.):</b> po pádu Staré říše vládli v Hérakleopoli králové 9. a 10. dynastie („dům Chetiho“), v Thébách se Intefové 11. dynastie prohlásili králi. O Thinidu a Abydos se bojovalo; Ponaučení pro Merikarea lituje zpustošení hrobů v Thinidě. Nomarchové Asjútu (Tefibi, Cheti II.) stáli při Hérakleopoli, nomarcha Anchtifi z Moally líčí velký hlad. Egypt sjednotil Montuhotep II. kolem roku 2055 př. n. l.</p>
  <p><b>Druhé přechodné období (≈ 1650–1550 př. n. l.):</b> Hyksósové 15. dynastie vládli z Avaridu (Tell el-Dab'a), Kuš z Kermy ovládla Núbii a egyptské pevnosti u 2. kataraktu. Thébská 17. dynastie platila tribut. Papyrus Sallier I. vypráví o sporu Apopiho a Sekenenrea kvůli hrochům; Sekenenreova mumie nese smrtelné rány. Stély krále Kamoseho popisují tažení k Avaridu, hranici u Kúsaje i zachycený dopis vládci Kuše. Ahmose I. (vládl od ≈ 1550 př. n. l.) dobyl Avaris a vyhnal Hyksósy – popisuje to životopis Ahmose, syna Ebany, v jeho hrobce v Elkabu.</p>
  <p><b>Co je historické a co herní:</b> župy, jejich egyptská jména, bohové, suroviny, výpravy, kalendář, nilometr, příděly obilí, debeny, hodnosti a titulatura vycházejí z egyptologie. Jména vládců a doložených hodnostářů odpovídají pramenům; roky narození, schopnosti, povahy a všichni ostatní úředníci jsou herní. Letopočty se drží střední chronologie (I. Shaw, The Oxford History of Ancient Egypt), nejistota je desítky let. Výšky záplav jsou náhodné, ale klima Prvního přechodného období je sušší (pokles záplav kolem roku 2200 př. n. l.).</p></section></div>`;
}

// Akce hráče, vykreslení, ukládání a spuštění.
const ACT = {};
const SAVE_KEY = "faraon_auto", SLOT = n => "faraon_slot_" + n, THEME_KEY = "faraon_theme";
const val = id => { const el = document.getElementById(id); return el ? el.value : undefined; };

ACT.tab = k => { SEL.tab = k; window.scrollTo(0, 0); };
ACT.end = () => { if (S.events.length) return "Nejdřív rozhodni o události."; endTurn(S); };
ACT.selProv = id => { SEL.prov = id; if (SEL.tab !== "mapa") SEL.tab = "mapa"; };
ACT.zoom = k => { SEL.zoom = k; };
ACT.cmdSel = (id, v) => { SEL.cmd[id] = v; };
ACT.cmd = id => { const k = SEL.cmd[id] || val("cs_" + id); const a1 = val("p1_" + id), a2 = val("p2_" + id); if (a1 != null) SEL["p1_" + id] = a1; return doCmd(S, me(), id, k, a1, a2); };
ACT.advise = id => { const c = chr(S, id); if (!c || c.acted === S.turn) return "Úředník už jedná."; aiDomestic(S, me(), c, true); if (c.acted !== S.turn) return "Rádce nic rozumného nenašel (málo debenů nebo obilí?)."; };
ACT.adviseAll = () => { let n = 0; for (const c of freeOffs()) { aiDomestic(S, me(), c, true); if (c.acted === S.turn) n++; } toast(`Rádce zadal ${n} rozkazů.`); };
ACT.planDone = () => { SEL.planDone = !SEL.planDone; };
ACT.deleg = (pid, v, el) => { const p = S.provs[pid]; if (p && p.owner === me()) p.deleg = !!(el && el.checked); };
ACT.send = pid => { const t = val("at_" + pid), f = val("ap_" + pid), c = val("ac_" + pid); SEL["at_" + pid] = t; SEL["ap_" + pid] = f; return sendArmy(S, me(), pid, t, f, c ? [c] : []); };
ACT.disband = id => { const a = S.armies.find(x => x.id === id); if (!a) return; if (S.provs[a.loc].owner !== me()) return "Vojsko není ve vlastní župě."; disbandArmy(S, a); };
ACT.armyHome = id => { const a = S.armies.find(x => x.id === id); if (!a) return; const home = myProvs().sort((x, y) => (findPath(S, me(), a.loc, x.id) || [1, 1, 1, 1, 1, 1, 1, 1, 1]).length - (findPath(S, me(), a.loc, y.id) || [1, 1, 1, 1, 1, 1, 1, 1, 1]).length)[0]; if (!home) return "Není kam."; if (home.id === a.loc) { disbandArmy(S, a); return; } a.path = findPath(S, me(), a.loc, home.id) || []; a.goal = home.id; const p = S.provs[a.loc]; if (p.siege && p.siege.army === a.id) p.siege = null; };
ACT.promote = id => promote(S, me(), id);
ACT.gift = (id, a) => gift(S, me(), id, a);
ACT.dismiss = id => dismiss(S, me(), id);
ACT.office = (k, v) => setOffice(S, me(), k, v);
ACT.dipl = id => { SEL.dipl = id; SEL.tab = "diplo"; };
ACT.diplo = (id, act, arg) => diplo(S, me(), id, act, arg);
ACT.tax = (v) => setTax(S, me(), v);
ACT.trade = dir => { const q = Math.abs(+val("mktQ") || 0); if (!q) return "Zadej počet charů."; return trade(S, me(), dir * q); };
ACT.law = (k, v) => setLaw(S, me(), k, v);
ACT.tomb = () => startTomb(S, me());
ACT.focus = (id, v) => { const c = chr(S, id); if (c) c.focus = v || null; };
ACT.research = t => { if (!techAvail(S, me(), t)) return "Chybí předpoklady."; P(S).res.cur = t; };
ACT.king = () => { const C = P(S); if (C.t === "král" || clanProvs(S, me()).length < 6) return "Zatím nelze."; C.t = "král"; C.type = "dyn"; C.prestige += 60; C.maat = Math.max(0, C.maat - 3); const ov = C.vassalOf; if (ov) { C.vassalOf = null; addRel(S, me(), ov, -40); if (!atWar(S, me(), ov)) declareWar(S, ov, me(), "proti vzbouřenému nomarchovi, který se prohlásil králem"); } log(S, `${ruler().n} přijal královskou titulaturu a prohlásil se králem Horního a Dolního Egypta.`, "rod", [me()]); };
ACT.logF = k => { SEL.logF = k; };
ACT.event = i => { resolveEvent(S, i); };
ACT.ngScen = v => { SEL.ngScen = v; SEL.ngConfirm = false; };
ACT.ngClan = v => { SEL.ngClan = v; SEL.ngConfirm = false; };
ACT.ngDiff = v => { SEL.ngDiff = +v; };
ACT.ngFog = (v, el) => { SEL.ngFog = !!(el && el.checked); };
ACT.newgame = () => { if (!SEL.ngConfirm) { SEL.ngConfirm = true; return; } SEL.ngConfirm = false; S = newGame({ scen: SEL.ngScen, clan: SEL.ngClan, diff: SEL.ngDiff, fog: SEL.ngFog !== false, seed: val("ngSeed") }); TERR.key = null; SEL.tab = "prehled"; SEL.prov = P(S).capital; SEL.cmd = {}; toast("Nová hra začala."); };
ACT.save = n => { try { localStorage.setItem(SLOT(n), JSON.stringify(S)); toast("Uloženo do pozice " + n + "."); } catch (e) { return "Uložení se nezdařilo."; } };
ACT.load = n => { try { const t = localStorage.getItem(SLOT(n)); if (!t) return "Prázdná pozice."; S = JSON.parse(t); TERR.key = null; toast("Načteno."); } catch (e) { return "Načtení se nezdařilo."; } };
ACT.del = n => { try { localStorage.removeItem(SLOT(n)); } catch (e) {} };
ACT.exportSave = () => { const blob = new Blob([JSON.stringify(S)], { type: "application/json" }), a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `pan-obou-zemi-${S.bce}.json`; document.body.appendChild(a); a.click(); a.remove(); };
ACT.importSave = () => { const f = document.getElementById("impFile"); if (f) f.click(); };
ACT.theme = () => { const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; r.dataset.theme = dark ? "light" : "dark"; try { localStorage.setItem(THEME_KEY, r.dataset.theme); } catch (e) {} };
function slotInfo(n) { try { const t = localStorage.getItem(SLOT(n)); if (!t) return null; const x = JSON.parse(t); return `${x.clans[x.player].n} – ${monthShort(x.month)} ${x.bce} př. n. l.`; } catch (e) { return null; } }
function importFile(file) { const r = new FileReader(); r.onload = () => { try { const x = JSON.parse(r.result); if (!x.provs || !x.clans) throw 0; S = x; TERR.key = null; render(); toast("Hra nahrána."); } catch (e) { toast("Soubor není uložená hra."); } }; r.readAsText(file); }

function renderModal() {
  const m = document.getElementById("modal"); const ev = S.events[0];
  if (!ev) { m.classList.add("hidden"); m.innerHTML = ""; return; }
  const v = eventView(S, ev);
  m.innerHTML = `<div class="box" role="dialog" aria-modal="true"><div class="muted small">${esc(dateStr(S))}</div><h2>${esc(v.t)}</h2><p>${esc(v.tx)}</p>${v.ch.map((c, i) => `<button class="b ch" data-a="event" data-x="[${i}]"><b>${esc(c.t)}</b>${c.d ? `<br><span class="small muted">${esc(c.d)}</span>` : ""}</button>`).join("")}${S.events.length > 1 ? `<p class="small muted">Další události: ${S.events.length - 1}</p>` : ""}</div>`;
  m.classList.remove("hidden");
}
const TAB_FN = { prehled: tPrehled, plan: tPlan, mapa: tMapa, zupy: tZupy, urednici: tUrednici, vojsko: tVojsko, diplo: tDiplo, hosp: tHosp, chramy: tChramy, rod: tRod, vedeni: tVedeni, kronika: tKronika, hra: tHra };
function render() {
  EMB_N = 0;
  if (!TAB_FN[SEL.tab]) SEL.tab = "prehled";
  document.getElementById("top").innerHTML = renderTop();
  document.getElementById("tabs").innerHTML = renderTabs();
  let html; try { html = TAB_FN[SEL.tab](); } catch (e) { console.error(e); html = `<p class="bad">Chyba při vykreslení záložky: ${esc(e.message)}</p>`; }
  document.getElementById("main").innerHTML = html;
  renderModal();
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {}
}
function handle(el, ev) {
  const a = el.dataset.a; if (!a || !ACT[a]) return;
  let args = []; try { args = JSON.parse(el.dataset.x || "[]"); } catch (e) {}
  if (ev.type === "change") args.push(el.value, el);
  const r = ACT[a](...args);
  if (typeof r === "string" && r) toast(r);
  render();
}
function boot() {
  try { const t = localStorage.getItem(THEME_KEY); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  try { const t = localStorage.getItem(SAVE_KEY); if (t) S = JSON.parse(t); } catch (e) { S = null; }
  if (!S || !S.provs || S.v !== 1) S = newGame({ scen: "sip", clan: "thebes" });
  SEL.prov = P(S).capital; SEL.ngScen = S.scen; SEL.ngClan = S.player;
  const f = document.createElement("input"); f.type = "file"; f.id = "impFile"; f.accept = ".json,application/json"; f.style.display = "none"; f.onchange = () => f.files[0] && importFile(f.files[0]); document.body.appendChild(f);
  document.addEventListener("click", ev => { const el = ev.target.closest("[data-a]"); if (!el || el.tagName === "SELECT" || (el.tagName === "INPUT")) return; ev.preventDefault(); handle(el, ev); });
  document.addEventListener("change", ev => { const el = ev.target.closest("[data-a]"); if (!el || (el.tagName !== "SELECT" && el.tagName !== "INPUT")) return; handle(el, ev); });
  render();
}
if (typeof document !== "undefined") { if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot(); }

</script>

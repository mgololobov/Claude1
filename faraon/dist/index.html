  --sea: #24456b; --desert: #5a4528; --kemet: #3f5a26; --nile: #4f86d1; --shadow: 0 2px 8px rgba(0,0,0,.5); color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; color: var(--ink); }
body { font: 14px/1.45 "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; background-color: var(--bg);
  background-image: repeating-linear-gradient(0deg, rgba(120, 85, 40, .05) 0 2px, transparent 2px 7px), repeating-linear-gradient(90deg, rgba(120, 85, 40, .04) 0 3px, transparent 3px 11px); }
.hg { font-family: "Hieroglyfy", serif; font-weight: normal; letter-spacing: 0; line-height: 1; }
h1, h2, h3, .title { font-variant: small-caps; letter-spacing: .05em; }

/* ---------- horní lišta (HUD) ---------- */
header { position: sticky; top: 0; z-index: 6; background: var(--panel); box-shadow: var(--shadow); padding: 6px 16px 10px; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
header::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 5px; background: var(--frieze); }
header .realm { display: flex; align-items: center; gap: 10px; min-width: 0; }
header .realm .rn { font-size: 18px; font-weight: bold; color: var(--accent); font-variant: small-caps; letter-spacing: .04em; line-height: 1.1; }
header .realm .rk { font-size: 12px; color: var(--muted); }
header .realm .rk .hg { font-size: 15px; color: var(--ink); }
.hud { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.res { display: inline-flex; align-items: center; gap: 6px; background: var(--panel2); border: 1px solid var(--line); border-radius: 20px; padding: 2px 10px 2px 4px; white-space: nowrap; }
.res svg { width: 24px; height: 24px; flex: none; }
.res b { font-variant-numeric: tabular-nums; font-size: 15px; }
.res small { font-size: 11px; }
.season { display: inline-flex; align-items: center; gap: 8px; background: var(--panel2); border: 1px solid var(--line); border-radius: 20px; padding: 2px 12px 2px 4px; }
.season .wheel { width: 30px; height: 30px; }
.season .sn { font-weight: bold; line-height: 1.1; } .season .sd { font-size: 11px; color: var(--muted); line-height: 1.1; }
header .sp { flex: 1; }
button.main { background: linear-gradient(var(--accent), #8a2c15); color: #fff8e6; border: 2px solid #5c1d0d; border-radius: 22px; padding: 7px 18px 7px 14px; font: inherit; font-weight: bold; font-variant: small-caps; letter-spacing: .05em; cursor: pointer; box-shadow: 0 2px 0 #5c1d0d; display: inline-flex; align-items: center; gap: 8px; }
button.main:hover { filter: brightness(1.08); } button.main:active { transform: translateY(1px); box-shadow: none; }

/* ---------- navigace ---------- */
nav { display: flex; flex-wrap: wrap; gap: 4px; padding: 10px 16px 0; max-width: 1400px; margin: 0 auto; }
nav button { border: 1px solid var(--line); background: var(--btn); color: var(--ink); padding: 5px 11px 5px 7px; border-radius: 18px; cursor: pointer; font: inherit; display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 1px 0 var(--line); }
nav button:hover { background: var(--btnh); }
nav button.on { background: var(--accent2); color: #fff; border-color: transparent; }
nav .badge { background: var(--accent); color: #fff; border-radius: 8px; font-size: 11px; padding: 0 5px; }
nav .ico { width: 18px; height: 18px; }
main { padding: 12px 16px 28px; max-width: 1400px; margin: 0 auto; }

/* ---------- karty jako malované desky s vlysem ---------- */
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); align-items: start; }
.card { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px 14px 12px; overflow-x: auto; min-width: 0; box-shadow: var(--shadow); }
.card::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: var(--frieze); border-radius: 6px 6px 0 0; opacity: .9; }
.card h3 { margin: 2px 0 10px; font-size: 16px; color: var(--accent); display: flex; align-items: center; gap: 8px; }
.card h3 .hg { font-size: 20px; color: var(--ink); }
.card h4 { margin: 10px 0 4px; font-size: 14px; font-variant: small-caps; letter-spacing: .04em; }
.wide { grid-column: 1 / -1; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 4px 7px; text-align: left; vertical-align: top; }
th { font-variant: small-caps; letter-spacing: .04em; color: var(--muted); border-bottom: 2px solid var(--line); font-weight: bold; }
tbody tr:nth-child(even) td { background: color-mix(in srgb, var(--panel2) 70%, transparent); }
td { border-bottom: 1px solid color-mix(in srgb, var(--line) 50%, transparent); }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.muted td { opacity: .55; } tr.sel td { background: var(--head) !important; }
.good { color: var(--good); } .bad { color: var(--bad); } .warn { color: var(--warn); } .muted { color: var(--muted); } .small { font-size: 12px; }
button.b, select, input, textarea { font: inherit; font-size: 13px; }
button.b { background: var(--btn); color: var(--ink); border: 1px solid var(--line); border-radius: 14px; padding: 3px 11px; cursor: pointer; margin: 1px; }
button.b:hover:not(:disabled) { background: var(--btnh); } button.b:disabled { opacity: .45; cursor: default; }
button.b.go { background: var(--green); color: #fff; border-color: transparent; }
button.b.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }
select, input { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; max-width: 100%; }
input[type=number] { width: 90px; }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 4px 0; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; }
.kv > :nth-child(odd) { color: var(--muted); }
details summary { cursor: pointer; color: var(--accent2); }
.help p { margin: 4px 0 8px; } .help h4 { color: var(--accent); }
.tag { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 8px; background: var(--head); color: var(--muted); margin-right: 4px; }
.pill { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 9px; background: var(--head); margin: 1px 2px 1px 0; white-space: nowrap; }
.pill.good { background: color-mix(in srgb, var(--good) 18%, var(--panel)); color: var(--good); } .pill.bad { background: color-mix(in srgb, var(--bad) 15%, var(--panel)); color: var(--bad); } .pill.warn { color: var(--warn); }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 0 8px 0 3px; border-radius: 10px; font-size: 12px; background: var(--head); margin: 1px 2px; white-space: nowrap; }
.emb { vertical-align: middle; flex: none; }
a.lnk { color: var(--accent2); cursor: pointer; text-decoration: underline dotted; }

/* ---------- dlaždice, výstrahy, měřidla ---------- */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-bottom: 14px; }
.tile { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px 8px; min-width: 0; box-shadow: var(--shadow); display: grid; grid-template-columns: auto 1fr; gap: 0 10px; align-items: center; }
.tile > svg.ti { grid-row: span 2; width: 34px; height: 34px; }
.tile .tl { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.tile .tv { font-size: 22px; font-weight: bold; font-variant-numeric: tabular-nums; line-height: 1.2; }
.tile .ts { font-size: 12px; color: var(--muted); grid-column: 1 / -1; }
.tile .spark { width: 100%; height: 24px; display: block; margin-top: 4px; grid-column: 1 / -1; }
.alert { padding: 6px 10px; border-left: 4px solid var(--line); margin: 4px 0; background: var(--panel2); border-radius: 0 6px 6px 0; font-size: 13px; }
.alert.bad { border-color: var(--bad); } .alert.warn { border-color: var(--warn); } .alert.info { border-color: var(--accent2); } .alert.good { border-color: var(--good); }
.meter { display: grid; grid-template-columns: 130px 1fr auto; gap: 8px; align-items: center; font-size: 13px; margin: 4px 0; }
.meter .ml { color: var(--muted); } .meter .mv { font-variant-numeric: tabular-nums; font-size: 12px; }
.meter .mt { height: 10px; background: color-mix(in srgb, var(--line) 70%, transparent); border-radius: 5px; overflow: hidden; } .meter .mt i { display: block; height: 100%; background: var(--accent2); border-radius: 5px; }
.tbar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; min-width: 80px; background: var(--line); margin: 3px 0; } .tbar i { display: block; height: 100%; }
.tleg { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: var(--muted); margin: 2px 0 6px; } .tleg i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
.sbv { display: inline-block; min-width: 34px; text-align: right; padding: 0 4px; border-radius: 3px; background: linear-gradient(90deg, color-mix(in srgb, var(--accent2) 30%, transparent) var(--v), transparent var(--v)); }
.relbar { display: inline-block; width: 70px; height: 8px; background: var(--line); border-radius: 4px; position: relative; vertical-align: middle; margin-left: 4px; }
.relbar i { position: absolute; top: 0; bottom: 0; border-radius: 4px; } .relbar b { position: absolute; top: -2px; bottom: -2px; width: 1px; background: var(--ink); left: 50%; }

/* ---------- postavy ---------- */
.portrait { flex: none; border-radius: 50%; background: radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--panel) 60%, #fff 0%), var(--panel2)); border: 2px solid var(--gold); box-shadow: inset 0 0 0 2px var(--panel); }
.people { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 12px; }
.person { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 6px; }
.person.done { opacity: .6; }
.person .ph { display: flex; gap: 10px; align-items: center; }
.person .pn { font-weight: bold; line-height: 1.15; }
.person .pr { font-size: 12px; color: var(--muted); }
.stats4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; font-size: 11px; color: var(--muted); }
.stats4 span { display: block; } .stats4 i { display: block; height: 5px; border-radius: 3px; background: var(--line); margin-top: 1px; overflow: hidden; } .stats4 i b { display: block; height: 100%; background: var(--accent2); }
.loyal { font-size: 11px; display: flex; align-items: center; gap: 6px; } .loyal i { flex: 1; height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; } .loyal i b { display: block; height: 100%; }
.person select { width: 100%; }
.person .cmdd { font-size: 12px; color: var(--muted); min-height: 2.4em; }
.person .acts { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }

/* ---------- rody (diplomacie) ---------- */
.realms { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.realmcard { position: relative; background: var(--panel); border: 1px solid var(--line); border-top: 6px solid var(--c); border-radius: 8px; padding: 10px 12px; box-shadow: var(--shadow); cursor: pointer; }
.realmcard:hover { background: var(--panel2); } .realmcard.sel { outline: 3px solid var(--accent2); }
.realmcard .top { display: flex; gap: 10px; align-items: center; }
.realmcard .nm { font-weight: bold; } .realmcard .hs { font-size: 12px; color: var(--muted); }

/* ---------- kronika ---------- */
.log { max-height: 70vh; overflow-y: auto; }
.lg { border-bottom: 1px dotted var(--line); padding: 3px 0; font-size: 13px; }
.lg.c-valka { border-left: 3px solid var(--bad); padding-left: 6px; } .lg.c-rod { border-left: 3px solid #a85e7f; padding-left: 6px; } .lg.c-nil { border-left: 3px solid var(--nile); padding-left: 6px; } .lg.c-intriky { border-left: 3px solid var(--warn); padding-left: 6px; } .lg.c-stavby { border-left: 3px solid var(--gold); padding-left: 6px; }

/* ---------- událost jako svitek papyru ---------- */
#modal { position: fixed; inset: 0; background: rgba(20, 12, 4, .6); z-index: 20; display: flex; align-items: center; justify-content: center; padding: 16px; }
#modal.hidden { display: none; }
#modal .box { position: relative; background: var(--panel); background-image: repeating-linear-gradient(0deg, rgba(120, 85, 40, .06) 0 2px, transparent 2px 6px); max-width: 620px; width: 100%; padding: 26px 26px 18px; max-height: 90vh; overflow-y: auto; border-radius: 4px; box-shadow: 0 10px 40px rgba(0,0,0,.5); border-left: 14px solid var(--gold); border-right: 14px solid var(--gold); }
#modal .box::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 6px; background: var(--frieze); }
#modal .ehead { display: flex; gap: 14px; align-items: center; margin-bottom: 8px; }
#modal h2 { margin: 0; color: var(--accent); font-size: 22px; }
#modal .etx { font-size: 15px; line-height: 1.55; }
#modal .ch { display: block; width: 100%; text-align: left; margin: 8px 0; padding: 9px 12px; border-radius: 8px; }
#modal .ch:hover { border-color: var(--accent2); }
#toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 20px; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 30; max-width: 90vw; box-shadow: var(--shadow); }
#toast.on { opacity: .95; }

/* ---------- mapa ---------- */
.grid.map2 { grid-template-columns: minmax(0, 3fr) minmax(320px, 2fr); }
.card.sticky { position: sticky; top: 92px; align-self: start; max-height: calc(100vh - 110px); overflow-y: auto; }
.mapcard { padding: 10px; }
svg.map { width: 100%; height: auto; display: block; border-radius: 4px; max-height: 80vh; }
svg.map .sea { fill: var(--sea); stroke: none; }
svg.map .coast { fill: none; stroke: #2b1d12; stroke-width: .7; stroke-opacity: .35; }
svg.map .nile { fill: none; stroke: var(--nile); stroke-linecap: round; stroke-linejoin: round; }
svg.map .kemet { fill: none; stroke: var(--kemet); stroke-linecap: round; stroke-linejoin: round; opacity: .85; }
svg.map .edge { stroke: #2b1d12; stroke-opacity: .25; stroke-dasharray: 2 3; }
svg.map .pv { cursor: pointer; }
svg.map .pv:hover .dot, svg.map .pv:hover .std { filter: brightness(1.2); }
svg.map .selring { fill: none; stroke: #fff6d8; }
svg.map .siege { fill: none; stroke: var(--bad); stroke-dasharray: 3 2; pointer-events: none; }
svg.map .lbl { fill: #2b1d12; paint-order: stroke; stroke: #f3e6c4; stroke-linejoin: round; pointer-events: none; font-family: "Palatino Linotype", Georgia, serif; }
svg.map .lbl.cap { font-weight: bold; }
svg.map .region { fill: #5a3d1a; font-style: italic; letter-spacing: .2em; pointer-events: none; font-family: "Palatino Linotype", Georgia, serif; opacity: .55; }
svg.map .region.sea2 { fill: #e9f0f7; opacity: .7; }
svg.map .army { stroke: #2b1d12; }
svg.map .march { fill: none; stroke-linejoin: round; } svg.map .march.own { stroke: #1d4f9a; } svg.map .march.foe { stroke: var(--bad); }
.zoom { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; align-items: center; }
.provhead { display: flex; gap: 12px; align-items: center; margin-bottom: 8px; }
.provhead .pn { font-size: 20px; font-weight: bold; font-variant: small-caps; color: var(--accent); line-height: 1.1; }
.statgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 8px 0; }
.statgrid div { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; text-align: center; }
.statgrid b { display: block; font-size: 17px; font-variant-numeric: tabular-nums; } .statgrid span { font-size: 11px; color: var(--muted); }

/* ---------- grafy, rodokmen, nilometr ---------- */
svg.chart { width: 100%; height: auto; display: block; }
svg.chart .grid { stroke: var(--line); stroke-width: 1; }
svg.chart .ax { font-size: 10px; fill: var(--muted); font-family: Georgia, serif; }
.tree { display: flex; flex-direction: column; align-items: center; }
.tree .gen { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
.tree .stem { width: 2px; height: 20px; background: var(--gold); }
.fam { position: relative; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 160px; max-width: 240px; background: var(--panel); box-shadow: var(--shadow); text-align: center; }
.fam .portrait { margin: 0 auto 4px; display: block; }
.fam.empty { color: var(--muted); border-style: dashed; display: flex; align-items: center; justify-content: center; }
.fam .fn { font-weight: bold; }
.fam select { margin-top: 4px; width: 100%; }
.minis { display: flex; gap: 3px; align-items: flex-end; height: 30px; margin: 4px auto; justify-content: center; }
.minis span { width: 10px; height: 28px; background: var(--line); display: flex; align-items: flex-end; border-radius: 2px; }
.minis span i { display: block; width: 100%; background: var(--accent2); border-radius: 2px; }
.floodbars { display: flex; align-items: flex-end; gap: 2px; height: 90px; border-bottom: 1px solid var(--line); margin: 6px 0 2px; }
.floodbars span { flex: 1; min-width: 4px; background: var(--nile); border-radius: 2px 2px 0 0; position: relative; }
.floodbars span.low { background: var(--bad); } .floodbars span.high { background: var(--warn); }
.ico { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.cartouche { display: inline-flex; align-items: center; padding: 1px 12px; border: 2px solid var(--gold); border-radius: 999px; position: relative; margin-right: 6px; font-weight: bold; }
.cartouche::after { content: ""; position: absolute; right: -6px; top: 15%; bottom: 15%; width: 3px; background: var(--gold); border-radius: 2px; }
.bgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.court { display: flex; gap: 14px; align-items: center; }
.court .who { font-size: 18px; font-weight: bold; }

@media (max-width: 900px) { .grid.map2 { grid-template-columns: 1fr; } .card.sticky { position: static; max-height: none; } }
@media (max-width: 600px) {
  .grid { grid-template-columns: 1fr; } header { position: static; padding: 6px 12px 10px; } nav { padding: 8px 12px 0; } nav button { padding: 4px 9px 4px 6px; font-size: 13px; }
  .bgrid { grid-template-columns: 1fr; } .meter { grid-template-columns: 95px 1fr auto; } main { padding: 10px 12px 24px; } .res b { font-size: 14px; } .people, .realms { grid-template-columns: 1fr; }
}

/* ---------- hlavní obrazovka s mapou (styl velkých strategií) ---------- */
main.full { max-width: none; padding: 0; }
.stage { position: relative; height: calc(100vh - var(--hdr, 140px)); min-height: 560px; overflow: hidden; background: #c99a5a; }
.stage svg.map { width: 100%; height: 100%; max-height: none; border-radius: 0; cursor: grab; touch-action: none; user-select: none; }
.stage svg.map:active { cursor: grabbing; }
.ov { position: absolute; z-index: 3; background: color-mix(in srgb, var(--panel) 94%, transparent); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 4px 14px rgba(40, 20, 5, .35); padding: 10px 12px; overflow-y: auto; }
.ov::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: var(--frieze); border-radius: 8px 8px 0 0; }
.ov-left { left: 12px; top: 12px; width: 360px; max-height: calc(100% - 200px); }
.ov-left .close { position: absolute; right: 8px; top: 10px; z-index: 2; }
.ov-right { right: 12px; top: 12px; width: 260px; max-height: calc(100% - 200px); font-size: 13px; }
.ov-alerts { right: 284px; top: 12px; width: 300px; max-height: 50%; padding: 8px 10px; }
.ov-alerts summary { cursor: pointer; color: var(--accent); font-weight: bold; display: flex; align-items: center; gap: 6px; }
.ov-alerts summary b { background: var(--accent); color: #fff; border-radius: 9px; padding: 0 6px; font-size: 12px; }
.ov-bl { left: 12px; bottom: 56px; padding: 8px 10px; }
.ov-modes { right: 12px; bottom: 56px; width: 340px; padding: 8px 10px; }
.ov-modes .mm { display: flex; flex-wrap: wrap; gap: 3px; margin-bottom: 4px; }
.ov-modes .mm button.on { background: var(--accent2); color: #fff; border-color: transparent; }
.ov-quote { left: 50%; transform: translateX(-50%); bottom: 10px; width: min(760px, calc(100% - 24px)); padding: 8px 16px; text-align: center; font-size: 13px; overflow: hidden; max-height: 64px; }
.ov-quote .qt { font-style: italic; } .ov-quote .qs { color: var(--muted); font-size: 12px; }
.ol-title { font-variant: small-caps; letter-spacing: .05em; color: var(--accent); font-weight: bold; margin: 2px 0 4px; }
.ol-h { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 8px 0 2px; border-bottom: 1px solid var(--line); }
.ol-i { padding: 3px 4px; border-radius: 4px; cursor: pointer; display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.ol-i:hover { background: var(--panel2); } .ol-i.bad { color: var(--bad); } .ol-i.warn { color: var(--warn); font-weight: bold; }
.olbar { flex-basis: 100%; height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; } .olbar b { display: block; height: 100%; background: var(--accent2); }
.rb { display: flex; gap: 10px; align-items: center; cursor: pointer; }
.rbn { font-weight: bold; font-variant: small-caps; letter-spacing: .03em; }

main { animation: fadein .22s ease-out; }

#modal .box { animation: pop .25s cubic-bezier(.2, .9, .3, 1.2); }

#modal .b.ch { transition: transform .1s, box-shadow .1s; } #modal .b.ch:hover { transform: translateX(4px); box-shadow: -4px 0 0 var(--gold); }
/* mapa */
.stage { background: #b88c50; }
svg.map.art .lbl { fill: #24160a; stroke: #f6ecd0; font-weight: 600; }
svg.map.art .lbl.cap { font-variant: small-caps; letter-spacing: .04em; }

@keyframes spin { to { transform: rotate(360deg); } }

@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }

@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1.2px); } }

@keyframes dash { to { stroke-dashoffset: -12; } }

.ov { border-color: #b8975a; box-shadow: 0 6px 20px rgba(30, 14, 2, .45); backdrop-filter: blur(3px); }

<header id="top"></header>

<script>
"use strict";
// Pán Obou zemí – data: kalendář, terén, vojsko, hodnosti, rozkazy, stavby, výpravy, vědění, zákony, stavy.
// Letopočty podle běžné „střední“ chronologie (I. Shaw, The Oxford History of Ancient Egypt, 2000); nejistota je desítky let.

// Egyptský občanský rok: tři období po čtyřech měsících o 30 dnech + 5 dní navíc (epagomenální).
const SEASONS = ["achet", "peret", "šemu"];
const SEASON_D = ["záplava", "setí a růst", "sklizeň"];
const monthName = m => `${(m % 4) + 1}. měsíc období ${SEASONS[Math.floor(m / 4)]}`;
const monthShort = m => `${(m % 4) + 1}. ${SEASONS[Math.floor(m / 4)]}`;
const FLOOD_MONTH = 1;   // vrchol záplavy (2. měsíc období achet) – nilometr ukáže výšku
const HARVEST_MONTH = 8; // sklizeň a výběr daně (1. měsíc období šemu)
const OSIRIS_MONTH = 3;  // Usirovy mystéria v Abydu (herní termín; přesné datum ve Střední říši není jisté)
// Pozn.: občanský kalendář (365 dní) se vůči skutečným ročním obdobím posouval o den za čtyři roky. Hra ho pro přehlednost drží v souladu se záplavou.

const TERRAIN = {
  udoli: { n: "Nilské údolí", agri: 1.0, def: 1.0, vuz: 1.15, nile: 1 },
  delta: { n: "Delta (bažiny a pastviny)", agri: 1.05, def: 1.2, vuz: 0.7, nile: 1 },
  fajjum: { n: "Fajjúmská pánev", agri: 1.1, def: 1.05, vuz: 1.0, nile: 1 },
  nubie: { n: "Núbijské údolí", agri: 0.55, def: 1.15, vuz: 0.9, nile: 1 },
  katarakt: { n: "Katarakt (skaliska)", agri: 0.35, def: 1.5, vuz: 0.5, nile: 1 },
  oaza: { n: "Oáza", agri: 0.5, def: 1.35, vuz: 0.8, nile: 0 },
  poust: { n: "Poušť a vádí", agri: 0.08, def: 1.25, vuz: 0.9, nile: 0 },
  kenaan: { n: "Kenaanská nížina a pahorky", agri: 0.5, def: 1.2, vuz: 1.05, nile: 0 },
};

// Vojsko. Počty v mužích; síla útoku/obrany na 100 mužů. Cena v debenech na 100 mužů.
// Příděl: každý voják dostává 1,5 charu obilí měsíčně (char ≈ 77 litrů).
const TROOPS = {
  kopinici: { n: "Kopiníci", atk: 1.0, def: 1.3, cost: 150, col: "#9a7b4f" },
  lucistnici: { n: "Lučištníci", atk: 1.35, def: 0.8, cost: 250, col: "#5f7f3f" },
  medzajove: { n: "Médžajové", atk: 1.6, def: 1.1, cost: 700, upd: 0.6, col: "#7a4b8c", d: "núbijští lučištníci a zvědové z pouště, žoldnéři" },
  vozy: { n: "Válečné vozy", atk: 2.6, def: 1.4, cost: 2000, horses: 100, col: "#a3332b", d: "vyžaduje vědění Válečný vůz a koně" },
};
const TROOP_IDS = Object.keys(TROOPS);
const RATION_SOLDIER = 1.5;

// Hodnostní tituly Staré a Střední říše: seš, semer uati, hatia, heri-tep aa (nomarcha), iri-pat. Plat je měsíční příděl v charech obilí (herní odhad).
const RANKS = [
  { n: "Písař (seš)", cmd: 600, pay: 20, merit: 0 },
  { n: "Jediný přítel (krále)", cmd: 1200, pay: 40, merit: 60 },
  { n: "Hatia (představený)", cmd: 2500, pay: 80, merit: 180 },
  { n: "Velký představený nomu", cmd: 4500, pay: 150, merit: 400 },
  { n: "Iripat hatia (přední muž země)", cmd: 8000, pay: 250, merit: 800 },
];

const STATS = { ved: "Velení", uda: "Statečnost", roz: "Moudrost", spr: "Správa" };
const STAT_IDS = Object.keys(STATS);

const TRAITS = {
  stateny: { n: "Statečný", uda: 8 }, zbabely: { n: "Zbabělý", uda: -10 },
  moudry: { n: "Moudrý", roz: 8 }, prchlivy: { n: "Prchlivý", roz: -5, uda: 4 },
  lstivy: { n: "Lstivý", roz: 5, loy: -5 }, verny: { n: "Věrný", loy: 15 },
  ctizadostivy: { n: "Ctižádostivý", ved: 4, loy: -10 }, skromny: { n: "Skromný", loy: 8 },
  zbozny: { n: "Zbožný", roz: 2 }, chamtivy: { n: "Chamtivý", spr: 4, loy: -6 },
  stedry: { n: "Štědrý" }, kruty: { n: "Krutý", ved: 3 },
  hospodar: { n: "Dobrý hospodář", spr: 10 }, vojevudce: { n: "Rozený vojevůdce", ved: 10 },
  vyrecny: { n: "Výmluvný", roz: 6 }, nemocny: { n: "Neduživý" }, silny: { n: "Silák", uda: 6 },
};
const TRAIT_IDS = Object.keys(TRAITS);

// Rozkazy úředníkům (jeden za měsíc). cost = debeny, grain = obilí (příděly pro robotníky).
const CMDS = {
  zavlaha: { n: "Kanály a hráze", d: "robotníci prohloubí kanály a opraví hráze – víc orné půdy", cost: 100, grain: 3000, stat: "spr" },
  remesla: { n: "Dílny a trhy", d: "podpora řemesel (len, keramika, kov) a směny – vyšší výnos v debenech", cost: 300, stat: "spr" },
  hradby: { n: "Opravit hradby", d: "obnoví cihlové hradby pevnosti", cost: 200, grain: 1500, stat: "spr" },
  odvod: { n: "Odvod mužů", d: "povolá muže z vesnic do vojska", cost: 0, stat: "ved" },
  vycvik: { n: "Výcvik vojska", d: "zvýší výcvik posádky", cost: 50, stat: "ved" },
  rozdat: { n: "Rozdat obilí", d: "naplní obecní sýpky z pokladu – chrání před hladem, těší lid", cost: 0, stat: "spr" },
  scitani: { n: "Sčítání lidu a dobytka", d: "nový soupis polí a stád: na dva roky vyšší výnos daně, lid reptá", cost: 150, stat: "spr" },
  obeti: { n: "Obětiny v chrámu", d: "dary místnímu bohu: maat, přízeň kněží, spokojenost", cost: 400, grain: 2000, stat: "roz" },
  hledat: { n: "Hledat schopné muže", d: "hledá písaře a bojovníky, kteří by vstoupili do služby", cost: 100, stat: "roz" },
  uceni: { n: "Dům života", d: "písaři opisují a studují texty – body vědění", cost: 250, stat: "roz" },
  stavba: { n: "Řídit stavbu", d: "zahájí stavbu v nomu", cost: 0, stat: "spr" },
  vyprava: { n: "Vést výpravu", d: "výprava do lomů, dolů nebo cizích zemí (úředník odjede na několik měsíců)", cost: 0, stat: "spr" },
  zvedy: { n: "Vyzvědět nom", d: "zjistí přesný stav cizího nomu", cost: 150, stat: "roz" },
  podnecovat: { n: "Podněcovat nepokoje", d: "sníží spokojenost a posádku v cizím nomu", cost: 600, stat: "roz" },
  naklonit: { n: "Naklonit si cizího úředníka", d: "dary a sliby – sníží jeho věrnost, případně přejde k tobě", cost: 800, stat: "roz" },
  presun: { n: "Odjet do jiného nomu", d: "přesun úředníka (dorazí příští měsíc)", cost: 0, stat: null },
};

// Stavby v nomu: debeny (materiál) + obilí (příděly pro robotníky), doba v měsících.
// Během záplavy (Achet) se staví rychleji – rolníci nemohou na pole a jdou na robotu.
const BUILD = {
  pevnost: { n: "Pevnost (cihlové hradby)", cost: 3000, grain: 12000, time: 5, max: 5, d: "silnější obrana, delší obléhání" },
  chram: { n: "Chrám místního boha", cost: 5000, grain: 30000, time: 8, max: 3, d: "maat, přízeň kněží, spokojenost lidu, body vědění" },
  sypka: { n: "Státní sýpky", cost: 1500, grain: 8000, time: 3, max: 3, d: "menší ztráty obilí, větší obecní zásoby proti hladu" },
  dilny: { n: "Dílny (len, keramika, kov)", cost: 3000, grain: 10000, time: 4, max: 3, d: "+20 stropu řemesel a obchodu" },
  pristav: { n: "Přístaviště a loděnice", cost: 2500, grain: 10000, time: 4, max: 2, need: p => TERRAIN[p.ter].nile || p.coast, d: "+15 stropu obchodu, rychlejší přesun vojska po Nilu" },
  lom: { n: "Lom nebo důl", cost: 3000, grain: 15000, time: 5, max: 3, need: p => p.res.some(r => RES[r] && RES[r].mine), d: "výnos podle suroviny" },

const RES = {

function randomEvents(s) {
  const C = P(s); if (!C || !C.alive || s.events.length) return;
  if (s.month === OSIRIS_MONTH && s.provs.u8.owner === s.player) { queueEvent(s, "usir", {}); return; }
  if (s.month === 9 && s.scen === "sip" && s.provs.u4.owner === s.player) { queueEvent(s, "udoli", {}); return; }
  if (s.month === HARVEST_MONTH && (s.provs.u5.owner === s.player || s.provs.u9.owner === s.player) && chance(s, 0.6)) { queueEvent(s, "min", {}); return; }
  if (s.month === 0 && regYear(s, s.player) >= 31 && (!C.hebsed || s.turn - C.hebsed >= 36)) { queueEvent(s, "hebsed", {}); return; }
  if (!chance(s, 0.3)) return;

function monState(s, id) { const p = s.provs[MONUMENTS[id].at]; return (p.mons && p.mons[id]) || { stage: 0, left: 0, active: false, by: null }; }
function monDone(s, id) { return monState(s, id).stage >= MONUMENTS[id].stages; }
function monCost(s, cid, id) { const M = MONUMENTS[id], k = costMult(s, cid) * (1 + monState(s, id).stage * 0.15) * (hasTech(s, cid, "obelisky") ? 0.8 : 1); return { deben: Math.round(M.deben * k), grain: Math.round(M.grain * k) }; }
function monCheck(s, cid, id) {
  const M = MONUMENTS[id], st_ = monState(s, id);

  if (M.need2 === "kamen" && s.provs.u1.owner !== cid) return "Žula se láme u Elefantiny – musíš ji držet.";

}

  const e = monCheck(s, cid, id); if (e) return e;
  const c = monCost(s, cid, id), p = s.provs[MONUMENTS[id].at]; pay(s, cid, c.deben, c.grain);
  p.mons = p.mons || {}; const st_ = monState(s, id); p.mons[id] = { stage: st_.stage, left: 6, active: true, by: cid };
  if (isPlayer(s, cid)) log(s, `Zahájena další fáze velké stavby: ${MONUMENTS[id].n} (${st_.stage + 1}. z ${MONUMENTS[id].stages}).`, "stavby", [cid]);
  return null;
}
function monTick(s) {
  for (const id of MON_IDS) {
    const M = MONUMENTS[id], p = s.provs[M.at], st_ = p.mons && p.mons[id]; if (!st_ || !st_.active) continue;
    if (p.owner !== st_.by || p.siege) { st_.active = false; continue; } // stavba se zastaví, když nom padne
    st_.left -= (s.month < 4 ? 2 : 1) * (hasTech(s, st_.by, "pyrmesta") ? 1.5 : 1);
    if (st_.left > 0) continue;
    st_.active = false; st_.stage++; const C = s.clans[st_.by];
    if (st_.stage < M.stages) { C.prestige += 10; if (isPlayer(s, st_.by)) log(s, `${M.n}: dokončena ${st_.stage}. fáze z ${M.stages}.`, "stavby", [st_.by]); continue; }
    C.maat = Math.min(100, C.maat + M.maat); C.prestige += M.prestige; if (M.knezi && C.estates) C.estates.knezi = Math.min(100, C.estates.knezi + M.knezi);

    log(s, `${C.house} dokončil velkou stavbu: ${M.n}.${MON_QUOTE[id] ? " " + qText(Q(MON_QUOTE[id])) : ""}`, "stavby", [st_.by]);
  }
}
// trvalé účinky na nomy

function monResearch(s, cid) { return monDone(s, "karnak") && s.provs.u4.owner === cid ? 2 : 0; }
function monCount(s, cid) { return sum(MON_IDS.map(id => { const st_ = monState(s, id); return st_.by === cid ? st_.stage : 0; })); }

}

// ---------- Přehled ----------
function alerts() {
  const C = P(S), out = [], b = clanBudget(S, me());
  const idle = freeOffs().length; if (idle) out.push(["warn", `${idle} úředníků čeká na rozkaz (Plán měsíce).`]);
  if (!C.res.cur) out.push(["info", "Písaři nemají zadané vědění k zkoumání (Vědění)."]);
  for (const e of enemiesOf(S, me())) out.push(["bad", `Válka s rodem ${S.clans[e].house}.`]);
  for (const p of Object.values(S.provs).filter(p => p.siege && (p.owner === me() || p.siege.cl === me()))) out.push(["bad", p.owner === me() ? `Nom ${p.n} je obléhán! Hradby ${Math.round(p.dur)}.` : `Obléháš pevnost v nomu ${p.n} (hradby ${Math.round(p.dur)}).`]);
  for (const p of myProvs().filter(p => p.hunger > 0.15)) out.push(["bad", `Hlad v nomu ${p.n}.`]);
  for (const p of myProvs().filter(p => p.loy < 25)) out.push(["warn", `Lid v nomu ${p.n} je nespokojený (${Math.round(p.loy)}).`]);
  if (b.net < 0) out.push(["warn", `Pokladna ztrácí ${fmt(-b.net)} debenů měsíčně.`]);
  const months = C.grain / Math.max(1, -b.gnet); if (months < 8) out.push([months < 3 ? "bad" : "warn", `Obilí v sýpkách vystačí jen asi na ${Math.max(0, Math.floor(months))} měsíců.`]);
  if (!C.tomb.active && C.tomb.stage < TOMB_STAGES.length && regYear(S, me()) > 2) out.push(["info", `Hrobka panovníka (${C.tombN}) – hotovo ${C.tomb.stage} z ${TOMB_STAGES.length} fází (Chrámy a stavy).`]);
  for (const c of officers(S, me()).filter(c => !c.dyn && c.loy < 30)) out.push(["warn", `${c.n} je nevěrný (${Math.round(c.loy)}).`]);
  if (C.tributeTo) out.push(["info", `Platíš tribut rodu ${S.clans[C.tributeTo].house} (10 % výnosu nomů).`]);
  if (S.month === 0 && hasTech(S, me(), "nilometr") && S.flood.next) out.push(["info", `Nilometr předpovídá záplavu asi ${dec(S.flood.next - 0.8)}–${dec(S.flood.next + 0.8)} loktů.`]);
  return out;
}
// ---------- Plán měsíce ----------
function suggestCmd(c, p) {
  if (p.loy < 32 || p.hunger > 0.2) return "rozdat";
  if (isFront(S, p) && men(p.troops) < troopCap(p) * 0.7) return "odvod";
  if (p.agri < agriCap(S, p) - 1) return "zavlaha";
  if (p.com < comCap(S, p) - 1) return "remesla";
  if (men(p.troops) > 300 && p.train < 50) return "vycvik";
  if (p.dur < durMax(S, p) * 0.8) return "hradby";
  return P(S).res.cur ? "uceni" : "obeti";
}
function cmdParams(c, k, p) {
  const id = c.id;
  if (k === "odvod") { const types = TROOP_IDS.map(t => [t, TROOPS[t].n + (canRecruitType(S, me(), p, t) ? " (nelze)" : ` (${TROOPS[t].cost}/100)`)]); return sel("p1_" + id, types, SEL["p1_" + id] || "kopinici") + ` <input id="p2_${id}" type="number" min="50" step="50" placeholder="max ${maxRecruit(S, p, c)}" title="počet mužů">`; }
  if (k === "stavba") { const opts = Object.entries(BUILD).filter(([b, B]) => !B.need || B.need(p)).map(([b, B]) => { const cst = buildCost(S, me(), b, p); return [b, `${B.n} ${buildLevel(p, b)}→${buildLevel(p, b) + 1} (${fmt(cst.deben)} d., ${fmtK(cst.grain)} ch.)`]; }); return sel("p1_" + id, opts, SEL["p1_" + id]); }
  if (k === "vyprava") return sel("p1_" + id, Object.entries(EXPED).map(([e, E]) => [e, E.n + (expAvail(S, me(), e) ? " (nedostupné)" : ` – ${E.months} měs.`)]), SEL["p1_" + id]);
  if (k === "zvedy" || k === "podnecovat") { const near = Object.values(S.provs).filter(q => q.owner !== me() && q.nb.some(n => S.provs[n].owner === me())); return sel("p1_" + id, near.map(q => [q.id, `${q.n} (${S.clans[q.owner].n})`]), SEL["p1_" + id]); }
  if (k === "naklonit") { const near = new Set(Object.values(S.provs).filter(q => q.owner !== me() && q.nb.some(n => S.provs[n].owner === me())).map(q => q.id)); const xs = Object.values(S.chars).filter(x => x.st === "off" && x.cl !== me() && !x.dyn && near.has(x.loc)); return xs.length ? sel("p1_" + id, xs.map(x => [x.id, `${x.n} (${S.clans[x.cl].n}, ${RANKS[x.rank].n})`]), SEL["p1_" + id]) : '<span class="muted small">v sousedství nikdo</span>'; }
  if (k === "presun") return sel("p1_" + id, myProvs().filter(q => q.id !== p.id).map(q => [q.id, q.n]), SEL["p1_" + id]);
  if (k === "rozdat") return `<input id="p1_${id}" type="number" step="1000" placeholder="${fmt(p.pop * 600)}" title="charů obilí">`;
  return "";
}

function provPanel(p) {

    const blds = Object.entries(p.b).filter(([, v]) => v).map(([b, v]) => `${BUILD[b].n.split(" (")[0]} ${v}`);
    h += `<div class="small">Stavby: ${blds.join(", ") || "—"}${p.build ? ` · <b>staví se: ${BUILD[p.build.b].n} (${Math.ceil(p.build.left)} měs.)</b>` : ""}</div>`;

    { const d = capDist(S, me())[p.id], C0 = P(S); h += `<div class="small">${p.id === C0.capital ? "<b>Sídlo rodu</b>" : `Vzdálenost od sídla: ${d == null ? "?" : nPlural(d, "přechod", "přechody", "přechodů")} (spokojenost ${distLoy(S, p) >= 0 ? "+" : ""}${distLoy(S, p)})`}</div>`;
      if (p.id !== C0.capital) h += `<div class="row">${btn("Přenést sem sídlo (5 000 d., 20 tis. ch.)", "capital", [p.id], (C0.lawCd.cap || 0) > S.turn ? `Znovu za ${C0.lawCd.cap - S.turn} měs.` : null)}</div>`; }
    if (TERRAIN[p.ter].nile) { const tg = myProvs().filter(q => q.id !== p.id && TERRAIN[q.ter].nile).sort((a, b) => (b.hunger - a.hunger) || a.stock - b.stock);
      if (tg.length) h += `<h4>Převézt obilí lodí</h4><div class="row">${sel("gt_" + p.id, tg.map(q => [q.id, `${q.n}${q.hunger > 0.05 ? " (hlad)" : ""} – zásoby ${fmtK(q.stock)}`]), SEL["gt_" + p.id])} <input id="gq_${p.id}" type="number" step="1000" min="1000" placeholder="charů"> ${btn("Převézt", "ship", [p.id])}</div><div class="small muted">Z obecních sýpek tohoto nomu (${fmtK(p.stock)} charů); převoz stojí deben za ${hasTech(S, me(), "clun") ? 100 : 50} charů, 5 % se cestou ztratí.</div>`; }
    h += `<div class="row"><label class="small"><input type="checkbox" data-a="deleg" data-x='["${p.id}"]' ${p.deleg ? "checked" : ""}> svěřit nom rádci (úředníci jednají sami)</label></div>`;
    // vyslat vojsko
    if (men(p.troops) >= 100 && !p.siege) {
      const targets = Object.values(S.provs).filter(q => q.id !== p.id && (q.owner === me() || atWar(S, me(), q.owner) || friendly(S, me(), q.owner))).map(q => [q, findPath(S, me(), p.id, q.id)]).filter(([, path]) => path).sort((a, b) => a[1].length - b[1].length).slice(0, 30);
      const cmds = officersIn(S, p.id).filter(c => c.acted !== S.turn);
      h += `<h4>Vyslat vojsko</h4>` + (targets.length ? `<div class="row">${sel("at_" + p.id, targets.map(([q, path]) => [q.id, `${q.n} – ${q.owner === me() ? "vlastní" : S.clans[q.owner].n} (${path.length} ${path.length === 1 ? "pochod" : "pochody"})`]), SEL["at_" + p.id])}
        ${sel("ap_" + p.id, [["0.25", "čtvrtina"], ["0.5", "polovina"], ["0.75", "tři čtvrtiny"], ["1", "všichni"]], SEL["ap_" + p.id] || "0.75")}
        ${sel("ac_" + p.id, [["", "bez velitele"]].concat(cmds.map(c => [c.id, `${c.n} (velení ${st(c, "ved")})`])), SEL["ac_" + p.id] || (cmds.sort((a, b) => st(b, "ved") - st(a, "ved"))[0] || {}).id || "")}
        ${sel("at2_" + p.id, Object.entries(TACTICS).map(([k, x]) => [k, "taktika: " + x.n]), SEL["at2_" + p.id] || "sik", `title="Šik zastaví vozy, salvy rozstřílí šik, rychlý útok rozpráší lučištníky; léčka závisí na moudrosti velitele."`)}
        ${sel("as_" + p.id, Object.entries(STANCES).map(([k, x]) => [k, "postoj: " + x.n]), SEL["as_" + p.id] || "vyvazeny")}
        ${btn("Vyslat", "send", [p.id], null, "go")}</div><div class="small muted">Útočný postoj: silnější úder, ale větší ztráty a vytrvá déle. Opatrný: menší ztráty, ale ustoupí dřív.</div><p class="small muted">Cíle: vlastní a spojenecké nomy (přesun) a nomy nepřátel, se kterými válčíš. Válku vyhlásíš v Diplomacii.</p>` : '<p class="small muted">Žádný dosažitelný cíl – nejsi ve válce.</p>');
    }
  } else if (atWar(S, me(), p.owner)) h += `<p class="small">Jste ve válce. Vojsko pošli ze sousedního vlastního nomu.</p>`;
  else h += `<div class="row">${btn("Diplomacie s tímto rodem", "dipl", [p.owner])}</div>`;
  return h;
}

// ---------- Vojsko ----------
function tVojsko() {
  const ar = S.armies.filter(a => a.cl === me()).map(a => { const p = S.provs[a.loc]; return tr([esc(p.n), fmt(men(a.t)) + troopBar(a.t), a.cmds.map(id => esc((chr(S, id) || {}).n || "")).join(", ") || "—", a.path.length ? "→ " + esc(S.provs[a.goal].n) + ` (${a.path.length})` : p.siege && p.siege.army === a.id ? "obléhá" : "stojí",
    (p.owner === me() ? btn("Do posádky", "disband", [a.id]) : "") + btn("Zpět domů", "armyHome", [a.id])]); });
  const foe = S.armies.filter(a => a.cl !== me() && atWar(S, a.cl, me()) && knows(S, S.provs[a.loc])).map(a => tr([chip(a.cl), esc(S.provs[a.loc].n), estimate(S, S.provs[a.loc], men(a.t)), a.path.length ? "→ " + esc(S.provs[a.goal].n) : "stojí"]));
  const gar = myProvs().sort((a, b) => men(b.troops) - men(a.troops)).map(p => tr([provLink(p) + (isFront(S, p) ? ' <span class="pill bad">fronta</span>' : ""), tdn(fmt(men(p.troops))), `<td>${troopBar(p.troops)}</td>`, tdn(Math.round(p.train)), tdn(fmt(troopCap(p))), tdn(Math.round(provDefense(S, p)))]));
  const bt = S.battles.filter(b => b.a === me() || b.b === me()).slice(0, 8).map(b => `<details><summary>${esc(b.d)} – ${esc(S.provs[b.place].n)}: ${chipH(b.a)} proti ${chipH(b.b)} – ${(b.win === "A" ? b.a : b.b) === me() ? '<b class="good">vítězství</b>' : '<b class="bad">porážka</b>'} (${b.kind})</summary>${battleChart(b)}${b.fates && b.fates.length ? `<p class="small">${esc(b.fates.join(", "))}</p>` : ""}</details>`).join("");
  return `<div class="grid">${card("Vojska v poli", tbl(["Kde", "Muži", "Velitelé", "Pochod", ""], ar) + '<p class="small muted">Nové vojsko vyšleš z panelu nomu na Mapě. S vědomím Říční flotila (nebo z nomu s přístavištěm) pluje vojsko po Nilu dva nomy za měsíc. Vojáci jedí 1,5 charu obilí měsíčně.</p>')}
  ${card("Nepřátelská vojska", tbl(["Rod", "Kde", "Muži", "Pochod"], foe))}
  ${card("Posádky nomů", troopLegend() + tbl(["Nom", "#Muži", "Složení", "#Výcvik", "#Strop", "#Obrana"], gar), "wide")}
  ${card("Bitvy", bt || '<p class="muted small">Zatím žádné.</p>', "wide")}
  ${card("Druhy vojska", tbl(["Druh", "#Útok", "#Obrana", "#Cena/100", "Poznámka"], TROOP_IDS.map(k => tr([TROOPS[k].n, tdn(TROOPS[k].atk), tdn(TROOPS[k].def), tdn(TROOPS[k].cost), `<span class="small">${TROOPS[k].d || ""}</span>`]))) + '<p class="small muted">Kopiníci s velkými štíty z volské kůže a lučištníci tvořili jádro egyptských vojsk (dřevěné modely egyptských kopiníků a núbijských lučištníků z hrobky Mesehtiho v Asjútu, 11. dynastie). Koně a válečný vůz se do Egypta dostali v době Hyksósů; egyptské vozatajstvo je doloženo až od počátku 18. dynastie.</p>')}</div>`;
}

// ---------- Diplomacie ----------
function relStatus(cid) {
  const C = P(S), O = S.clans[cid], t = [];
  if (atWar(S, me(), cid)) t.push('<span class="pill bad">válka</span>');
  else if (truceUntil(S, me(), cid) > S.turn) t.push(`<span class="pill">příměří ${truceUntil(S, me(), cid) - S.turn} měs.</span>`);
  if (allied(S, me(), cid)) t.push('<span class="pill good">spojenec</span>');
  if (O.vassalOf === me()) t.push('<span class="pill good">tvůj poddaný</span>');
  if (C.vassalOf === cid) t.push('<span class="pill warn">tvůj pán</span>');
  if (C.tributeTo === cid) t.push('<span class="pill warn">platíš mu tribut</span>');
  if (O.tributeTo === me()) t.push('<span class="pill good">platí ti tribut</span>');
  if (S.trade[pairKey(me(), cid)]) t.push('<span class="pill">obchod</span>');
  if (married(S, me(), cid)) t.push('<span class="pill">sňatek</span>');
  if (O.vassalOf && O.vassalOf !== me()) t.push(`<span class="pill">poddaný: ${esc(S.clans[O.vassalOf].n)}</span>`);
  return t.join(" ");
}

    <div class="row">Daň ze sklizně: ${sel("taxSel", TAX_LEVELS.map((t, i) => [i, `${t} (${Math.round(TAX_RATE[i] * 100)} %)`]), C.tax, `data-a="tax" data-x='[]'`)}</div><p class="small muted">Vyšší daň plní sýpky, ale lid strádá a v hubených letech hladoví. Obilím se rozumí hlavně dvouzrnka (emmer) a ječmen. Daň se vybírá jednou ročně při sklizni v 1. měsíci období šemu.</p>`)}
  ${card("Trh – směna obilí za debeny", `<p>Cena: <b>${dec(S.market.p)} debenu za char</b> (prodej ${dec(S.market.p * 0.8)}, nákup ${dec(S.market.p * 1.25)}). Kupci tento měsíc smění ještě ${fmt(capQ - used)} charů.</p>
    <div class="row"><input id="mktQ" type="number" step="1000" min="0" placeholder="charů"> ${btn("Prodat obilí", "trade", [-1])} ${btn("Koupit obilí", "trade", [1])}</div><p class="small muted">Po slabé záplavě obilí zdraží. Objem směny závisí na řemeslech a obchodu ve tvých nomech. V Dér el-Medíně za Nové říše stál char dvouzrnky obvykle 1–2 debeny mědi, v krizi na konci 20. dynastie mnohem víc.</p>`)}
  ${card("Pravidlo o záplavách", ('<p class="small">Plinius Starší (1. stol. n. l.) zapsal pravidlo: dvanáct loktů znamená hlad, třináct nouzi, čtrnáct radost, patnáct bezpečí a šestnáct hojnost. Velmi vysoká voda strhává hráze. Egyptské letopisy zapisovaly výšky záplav už za Staré říše (Palermská deska).</p>'))}
  ${card("Obchodní cesty", tbl(["Cesta", "Stav", "Tvé nomy na cestě", "#Výnos/měs."], ROUTES.map(R => { const st_ = routeState(S, R), mine = R.provs.filter(id => S.provs[id].owner === me());

  ${card(`${hg("necer")} Státní bůh`, `<div class="people">${Object.entries(STATE_GODS).map(([k, G]) => { const cur = stateGod(S, me()) === k, own = S.provs[G.at].owner === me();
      return `<div class="person${cur ? "" : own ? "" : " done"}" style="${cur ? "outline:3px solid var(--gold)" : ""}"><div class="pn">${esc(G.n)}${cur ? " – <span class=\"good\">uctíván dvorem</span>" : ""}</div><div class="hg godhg" title="${esc(hgTitle("g_" + k))}">${HG["g_" + k] || ""}</div><div class="pr">kultovní centrum: ${esc(S.provs[G.at].n)}</div><div class="small">${esc(G.d)}</div><div class="small"><b>${esc(G.eff)}</b></div>${cur ? "" : `<div class="acts">${btn("Povýšit jeho kult", "god", [k], own ? null : "Musíš držet kultovní centrum")}</div>`}</div>`; }).join("")}</div><p class="small muted">Změna kultu stojí maat −6 a přízeň kněží −12 a lze ji opakovat nejdřív po třech letech.${(P(S).lawCd.god || 0) > S.turn ? ` Znovu za ${P(S).lawCd.god - S.turn} měs.` : ""}</p>`, "wide")}
  ${card("Zádušní nadace", `<p>Nadací: <b>${C.nadace || 0}</b> z ${NADACE_MAX}. Každá stojí 400 charů obilí měsíčně, přidává maat a po smrti panovníka zajistí nástupci maat +2 a důstojný pohřeb i bez hotové hrobky.</p><div class="row">${btn("Založit nadaci (3 000 d., 10 tis. ch.)", "nadace", [], (C.nadace || 0) >= NADACE_MAX ? "Víc nadací kněží neudrží" : null, "go")}</div><p class="small muted">Nomarcha Hapdžefai z Asjútu (12. dynastie) dal do své hrobky vytesat deset smluv s kněžími, kteří mu za pole a příděly měli navěky přinášet obětiny.</p>`)}
  ${card("Chrámy", tbl(["Nom", "Bůh", "#Úroveň"], temples) + '<p class="small muted">Chrám staví úředník rozkazem „Řídit stavbu“. Každá úroveň dává maat, spokojenost a body vědění.</p>')}</div>`;
}

// ---------- Rod ----------
function tRod() {
  const C = P(S), L = ruler(), sp = L && chr(S, L.spouse), H = heirsOf(S, me());
  const kids = L ? L.kids.map(id => chr(S, id)).filter(c => c && c.st !== "dead") : [];
  const others = Object.values(S.chars).filter(c => c.cl === me() && c.dyn && c.st !== "dead" && c !== L && c !== sp && !kids.includes(c));
  const dead = Object.values(S.chars).filter(c => c.dyn && c.st === "dead" && c.cl === me()).slice(-15).map(c => tr([esc(c.n), esc(c.died || "")]));
  const canKing = C.t !== "král" && C.cul === "eg" && clanProvs(S, me()).length >= 6;
  return `<div class="grid">${card("Rodokmen – " + esc(C.house), `<div class="tree"><div class="gen">${famCard(L, cap(C.t))}${sp ? famCard(sp, "choť") : '<div class="fam empty">bez choti</div>'}</div>
    ${kids.length ? `<div class="stem"></div><div class="gen">${kids.map(c => famCard(c)).join("")}</div>` : '<p class="muted small">Zatím bez potomků.</p>'}
    ${others.length ? `<h4>Další členové rodu</h4><div class="gen">${others.map(c => famCard(c, c.sex === "m" ? "příbuzný" : "příbuzná")).join("")}</div>` : ""}</div>
    <p class="small muted">Dědic: ${H[0] ? esc(H[0].n) : '<b class="bad">žádný</b>'} (${LAWS.nastupnictvi.opts[C.laws.nastupnictvi]}). Sloupce: velení, statečnost, moudrost, správa. Synové v 15 letech vstupují do služby. Sňatky s jinými rody dohodneš v Diplomacii. Bez dědice převezme vládu nejschopnější úředník a založí novou dynastii.</p>`, "wide")}
  ${card("Královský titul", C.t === "král" ? `<p>${esc(L ? L.n : "")} nosí titul krále Horního a Dolního Egypta.</p>` : `<p>Jsi ${esc(C.t)}. Kdo ovládne aspoň šest nomů, může přijmout královskou titulaturu a pět jmen panovníka – jako Intefové v Thébách.</p>${btn("Prohlásit se králem", "king", [], canKing ? null : "Potřebuješ aspoň 6 nomů (a egyptský rod)", "go")}<p class="small muted">Vazalské pouto k pánovi se tím zpřetrhá a hrozí válka.</p>`)}
  ${card("Odkaz rodu", legacyCard())}
  ${C.t === "král" ? card(`${hg("nswbjtj")} Horovo jméno`, `<p class="small">Horovo jméno bylo prvním z pěti jmen královské titulatury a vyhlašovalo program vlády. Montuhotep II. ho změnil dvakrát – naposledy na „Ten, který sjednotil Obě země“.</p><div class="people">${Object.entries(HORUS).map(([k, H]) => { const cur = C.horus === k, ok = (!C.horus || k === "sema") && (!H.req || H.req(S));
      return `<div class="person${cur ? "" : ok ? "" : " done"}" style="${cur ? "outline:3px solid var(--gold)" : ""}"><div class="pn">${esc(H.n)}</div><div class="pr">„${esc(H.tr)}“ · ${esc(H.who)}</div><div class="small"><b>${esc(H.eff)}</b></div>${cur ? '<div class="good small">nynější jméno</div>' : `<div class="acts">${btn("Přijmout", "horus", [k], ok ? null : C.horus ? "Jméno už bylo přijato" : "Zatím nelze")}</div>`}</div>`; }).join("")}</div>`, "wide") : ""}
  ${card("Spřízněné rody", aliveClans(S).filter(c => married(S, me(), c.id)).map(c => chip(c.id)).join(" ") || "—")}
  ${card("Zesnulí", tbl(["Jméno", "Zemřel(a)"], dead))}</div>`;
}

function legacy() {
  const C = P(S), ps = clanProvs(S, me());
  return [["Nomy egyptského jádra (i poddaných)", realmCore(S, me()) * 10], ["Ostatní nomy", ps.filter(p => !p.flags.includes("e")).length * 4], ["Chrámy (úrovně)", sum(ps.map(p => (p.b.chram || 0) * 6))], ["Pevnosti nad první úroveň", sum(ps.map(p => Math.max(0, p.castle - 1) * 2))],
    ["Hrobka panovníka", C.tomb.stage * 15], ["Maat", Math.round(C.maat)], ["Sláva", Math.round(C.prestige / 10)], ["Vědění", Object.keys(C.techs).length * 3], ["Velké stavby (fáze)", monCount(S, me()) * 10], ["Sjednocení Obou zemí", S.flags.won ? 200 : 0]];
}
function legacyCard() { const it = legacy(); return tbl(["Co zůstane", "#Body"], it.filter(x => x[1]).map(([n, v]) => tr([n, tdn(fmt(v))]))) + `<p><b>Celkem ${fmt(sum(it.map(x => x[1])))} bodů.</b></p><p class="small muted">Tak by tvou vládu hodnotili písaři budoucích letopisů. Slouží k porovnání her.</p>`; }

// ---------- Vědění ----------
function tVedeni() {
  const C = P(S), cats = [...new Set(TECH_IDS.map(t => TECHS[t].cat))];
  return `<div class="grid">${card("Dům života", `<p>Zkoumá se: <b>${C.res.cur ? TECHS[C.res.cur].n + ` (${Math.round(C.res.pts)}/${techCost(S, me(), C.res.cur)})` : "nic"}</b>. Body přinášejí rozkaz „Dům života“ a chrámy.</p><p class="small muted">Vědění, které znají sousedé nebo nepřátelé, se učí o třetinu levněji – tak se do Egypta dostal válečný vůz a kompozitní luk.</p>`)}
  ${cats.map(cat => card(cat, tbl(["Vědění", "Účinek", "#Cena", ""], TECH_IDS.filter(t => TECHS[t].cat === cat).map(t => { const T = TECHS[t]; return tr([C.techs[t] ? `<span class="good">✔ ${T.n}</span>` : C.res.cur === t ? `<b>▶ ${T.n}</b>` : T.n, `<span class="small">${T.d}${T.req ? " · vyžaduje: " + T.req.map(r => TECHS[r].n).join(", ") : ""}</span>`, tdn(techCost(S, me(), t)), C.techs[t] || C.res.cur === t ? "" : btn("Zkoumat", "research", [t], techAvail(S, me(), t) ? null : "Chybí předpoklady")]); })))).join("")}</div>`;

function annalsCard() {
  const A = (S.annals || []).slice().reverse();
  return card(`${hg("pan")} Letopis po letech`, (A.length ? `<div class="log" style="max-height:420px"><table><thead><tr><th>Rok</th><th>Panovník</th><th class="n">Nil</th><th class="n">Nomy</th><th>Události</th></tr></thead><tbody>${A.map(a => `<tr><td class="n">≈ ${a.y}</td><td>${esc(a.r)}<div class="small muted">${a.ry}. rok vlády</div></td><td class="n">${a.h ? dec(a.h) + " l." : "?"}</td><td class="n">${a.n}</td><td class="small">${a.ev.map(esc).join("<br>") || "—"}</td></tr>`).join("")}</tbody></table></div>` : '<p class="muted small">První zápis přibude na konci roku.</p>') + '<p class="small muted">Tak vedli Egypťané své letopisy: Palermská deska zapisuje ke každému roku vlády hlavní události a výšku záplavy v loktech.</p>', "wide");

function tKronika() {
  const f = SEL.logF; const l = S.log.filter(x => f === "vse" || (f === "moje" ? x.cl && x.cl.includes(me()) : f === "svet" ? !x.cl || !x.cl.includes(me()) : x.cat === f)).slice(0, 400);

}

const SCEN_CACHE = {};
function tHra() {
  const slots = [1, 2, 3, 4, 5].map(n => { const i = slotInfo(n); return tr([n, i ? esc(i) : '<span class="muted">prázdná</span>', btn("Uložit", "save", [n]) + btn("Načíst", "load", [n], i ? null : "Prázdná") + btn("Smazat", "del", [n], i ? null : "Prázdná")]); });

    <span>Rod</span>${sel("ngClan", clans.map(c => [c.id, `${c.n} – ${c.house} (${c.provs.length} ${c.provs.length === 1 ? "nom" : c.provs.length < 5 ? "nomy" : "nomů"}${histNote(c.id) ? ", " + histNote(c.id) : ""})`]), SEL.ngClan, `data-a="ngClan" data-x='[]'`)}
    <span>Obtížnost</span>${sel("ngDiff", [[0, "Snadná"], [1, "Obvyklá"], [2, "Těžká"]], SEL.ngDiff, `data-a="ngDiff" data-x='[]'`)}
    <span>Mlha</span><label><input type="checkbox" id="ngFog" ${SEL.ngFog === false ? "" : "checked"} data-a="ngFog" data-x='[]'> o vzdálených nomech víš jen odhady</label>
    <span>Semínko</span><input id="ngSeed" type="number" placeholder="náhodné"></div>
    <div class="row">${btn(SEL.ngConfirm ? "<b>Ano, začít</b>" : "Začít novou hru", "newgame", [], null, "go")}</div>
    <p class="small muted">Thébané a Hérakleopolští (2070), Hérakleopolští (2120) nebo Thébané a Hyksósové (1560) jsou velké říše. Anchtifi (2120) má dva nomy a válku se dvěma sousedy. Nomarchové Asjútu, Hermopole, Beni Hasanu nebo kníže Teti začínají s jediným nomem – to je výzva.</p>`)}
  ${card("Uložené hry", tbl(["#", "Obsah", ""], slots) + `<p class="small muted">Hra se sama ukládá po každém kroku (v tomto prohlížeči).</p><div class="row">${window.self !== window.top ? "" : btn("Stáhnout do souboru", "exportSave")} ${btn("Nahrát ze souboru", "importSave")} ${btn("Světlý / tmavý vzhled", "theme")}</div>

    <div class="row">${btn("Zkopírovat hru jako text", "copySave")} ${btn("Načíst hru z textu", "pasteSave")}</div>`)}
  <section class="card wide help"><h3>Jak hrát</h3>
  <p>Jsi hlavou vládnoucího rodu nebo rodu nomarchů v době, kdy je Egypt rozdělený. Jedno kolo je jeden měsíc egyptského občanského roku: tři období po čtyřech měsících o třiceti dnech – achet (záplava), peret (vzcházení, setí) a šemu (sklizeň, léto) – a na konci pět dní navíc. Skutečný občanský kalendář se vůči ročním obdobím posouval; hra ho drží v souladu se záplavou. <b>Cíl:</b> sjednotit Horní a Dolní Egypt – ovládnout (sám nebo skrze poddané) devět desetin nomů egyptského jádra. Prohraješ, když přijdeš o všechny nomy.</p>
  <h4>Měsíc</h4><p>V záložce <b>Plán měsíce</b> dáš každému úředníkovi jeden rozkaz: kanály a hráze, dílny a trhy, hradby, odvod, výcvik, rozdělení obilí, sčítání, obětiny, hledání schopných mužů, dům života, stavby, výpravy, zvědy, intriky nebo přesun. Nomy svěřené rádci spravuje umělá inteligence sama. Pak stiskni <b>Konec měsíce</b>.</p>
  <h4>Nil a obilí</h4><p>Ve 2. měsíci období achet ukážou značky na březích výšku záplavy v loktech (královský loket ≈ 52 cm). Ta rozhodne o sklizni v 1. měsíci období šemu, kdy písaři vyberou daň v obilí. Obilím platíš příděly vojákům a úředníkům i robotníky na stavbách. Obecní sýpky v nomech chrání lid před hladem; při nízké záplavě je doplň rozkazem „Rozdat obilí“. Debeny (měděná jednotka hodnoty) plynou z řemesel, obchodu, dolů a výprav.</p>
  <h4>Válka</h4><p>Válku vyhlásíš v Diplomacii, vojsko vyšleš z panelu nomu na Mapě. Vojsko táhne jeden nom za měsíc, s říční flotilou dvě. Bitva má až šest kol; rozhoduje počet, druh vojska, výcvik, vědění, terén, hradby a velitel. Pevnosti se obléhají – hradby z nepálených cihel padnou, nebo posádka vyhladoví. Kmeny Libyjců, Aamu, Médžajů a Núbijců podnikají nájezdy.</p>
  <h4>Bitva vedená osobně</h4><p>Při větším střetu se otevře bojiště a v každém kole zvolíš rozkaz. Salvy lučištníků rozbijí nehybný šik, šik kopiníků zastaví útok i vozy, útok a vozy smetou lučištníky, obchvat Médžajů rozvrátí šik. Ústupem bitvu prohraješ, ale zachráníš muže – nejlépe k lodím. Osobní velení vypneš v záložce Vojsko.</p>
  <h4>Klávesnice</h4><p><b>N</b> konec měsíce, <b>1–9</b> a <b>0</b> záložky, <b>+</b> a <b>−</b> přiblížení mapy, <b>Esc</b> zavře panel nomu, <b>?</b> nápověda. Tab a Enter ovládají všechna tlačítka, karty i nomy na mapě.</p>
  <h4>Úředníci a maat</h4><p>Věrnost úředníků závisí na hodnosti, úřadech, darech, maat a slávě. Nevěrný nomarcha pohraničního nomu může přeběhnout i s nomem. Maat udržuješ obětinami, chrámy, péčí o hladové a hrobkou panovníka; po třiceti letech vlády můžeš slavit svátek sed.</p></section>
  <section class="card wide help"><h3>Slovníček</h3><div class="kv small">
  <span>achet, peret, šemu</span><span>tři období egyptského roku: záplava, vzcházení a setí, sklizeň</span>
  <span>loket (meh)</span><span>královský loket ≈ 52,4 cm; v loktech se měřila výška záplavy</span>
  <span>char</span><span>dutá míra na obilí, v Nové říši ≈ 77 litrů</span>
  <span>deben</span><span>jednotka váhy (v Nové říši ≈ 91 g); ceny se vyjadřovaly v debenech mědi, mince Egypt neznal</span>
  <span>dvouzrnka a ječmen</span><span>hlavní obilniny; z dvouzrnky (emmeru) se pekl chléb, z ječmene vařilo pivo</span>
  <span>nom (egyptsky sepat, řecky nomos)</span><span>správní oblast; Horní Egypt měl 22 nomů, Dolní Egypt postupně 20</span>
  <span>nomarcha</span><span>řecký název pro správce nomu, egyptsky „velký představený nomu“ (heri-tep aa)</span>
  <span>seš, semer uati, hatia, iri-pat</span><span>písař, „jediný přítel“ krále, představený (starosta, kníže), přední muž země – hodnostní tituly</span>
  <span>tjati</span><span>vezír, nejvyšší úředník po králi</span>
  <span>maat</span><span>řád světa, pravda a spravedlnost; udržovat ji bylo hlavní povinností krále</span>
  <span>heka chasut</span><span>„vládci cizích zemí“, z toho řecké Hyksósové</span>
  <span>Aamu, Tjehenu, Médžajové</span><span>egyptská označení pro Asiaty, Libyjce a pouštní kmeny Východní pouště</span>
  <span>Kuš, Vavat</span><span>Horní Núbie s centrem v Kermě a Dolní Núbie mezi 1. a 2. kataraktem</span>
  <span>svátek sed</span><span>jubileum obnovy královské moci, zpravidla po třiceti letech vlády</span>
  <span>dům života</span><span>chrámová dílna písařů, kde se opisovaly a uchovávaly texty</span>
  <span>robota</span><span>pracovní povinnost pro stát, hlavně v době záplavy</span></div></section>
  <section class="card wide help"><h3>Historické pozadí a zdroje</h3>
  <p><b>První přechodné období (≈ 2160–2055 př. n. l.):</b> po pádu Staré říše vládli v Hérakleopoli králové 9. a 10. dynastie („dům Chetiho“), v Thébách se Intefové 11. dynastie prohlásili králi. O Thinidu a Abydos se bojovalo; Ponaučení pro Merikarea lituje zpustošení hrobů v Thinidě. Nomarchové Asjútu (Tefibi, Cheti II.) stáli při Hérakleopoli, nomarcha Anchtifi z Moally líčí velký hlad. O generaci dříve (≈ 2120 př. n. l.) se nomarcha Anchtifi z Moally zmocnil nomu Edfu a bojoval s Thébami a Koptem. Egypt nakonec sjednotil Montuhotep II. (vládl ≈ 2055–2004 př. n. l.), zřejmě až po dvaceti a více letech vlády.</p>
  <p><b>Druhé přechodné období (≈ 1650–1550 př. n. l.):</b> Hyksósové 15. dynastie („vládci cizích zemí“, heka chasut) vládli z Avaridu (Tell el-Dab'a), Kuš z Kermy ovládla Núbii a egyptské pevnosti u 2. kataraktu. Thébská 17. dynastie byla na Hyksósech zřejmě závislá. Papyrus Sallier I. (sepsaný až za 19. dynastie) vypráví o sporu Apopiho a Sekenenrea kvůli hrochům; Sekenenreova mumie nese smrtelné rány. Stély krále Kamoseho popisují tažení k Avaridu, hranici u Kúsaje i zachycený dopis vládci Kuše. Ahmose I. (vládl od ≈ 1550 př. n. l.) dobyl Avaris a vyhnal Hyksósy – popisuje to životopis Ahmose, syna Ebany, v jeho hrobce v Elkabu.</p>
  <p><b>Co je historické a co herní:</b> nomy, jejich egyptská jména, bohové, suroviny, výpravy, kalendář, nilometr, příděly obilí, debeny, hodnosti a titulatura vycházejí z egyptologie. Jména vládců a doložených hodnostářů odpovídají pramenům; roky narození, schopnosti, povahy a všichni ostatní úředníci jsou herní. Letopočty se drží střední chronologie (I. Shaw, The Oxford History of Ancient Egypt), nejistota je desítky let. Výšky záplav jsou náhodné, ale klima Prvního přechodného období je sušší (pokles záplav kolem roku 2200 př. n. l.).</p></section></div>`;
}

// Ilustrace v egyptském stylu kreslené v SVG: výjevy k událostem, bojiště, deska senetu, kolo svátků,
// pruhy příjmů a výdajů. Barvy podle egyptských pigmentů (modř, červený a žlutý okr, malachit, saze, běloba).

  hroch: "lov", hrosi: "lov", lov: "lov", senet: "senet", senet_pozvani: "senet", nakaza: "nemoc", nemoc: "nemoc", mor_skotu: "nemoc", stir: "nemoc", kouzelnik: "kouzlo", krokodyl: "krokodyl", skudci: "hlad", hostina: "dvur", znameni: "kouzlo", narozeni: "porod", vychova: "dvur", chamsin: "boure", uprchlici: "hlad", lodni: "nil", zlaty_nalez: "zlato", mlady_vojak: "bitva", paviani: "obchod" };
function vignKind(ev, v) {

  if (/chrám|kněž|bůh|bohů|svátek|obět|svatyn/.test(t)) return "chram";

// ---------- bojiště ----------

    const col_ = Math.floor(i / 6), row = i % 6, x = x0 + dir * (col_ * 17), y = 41 + row * 17, o = { s: 0.165, dir: -dir, mono: sh === "q" ? "#8a7f6c" : col };

}

// ---------- pruhy příjmů a výdajů ----------

}

// ---------- kolo svátků ----------

function rulerLine(C, L) {
  if (!L) return "—";
  const king = C.t === "král" && C.cul !== "nub";
  return king ? `${hg("nswbjtj", "nesut-biti – král Horního a Dolního Egypta")} <span class="cartouche">${esc(L.n)}</span>${hg("anch", "anch, udža, seneb – živ, zdráv, silen")}` : `${esc(cap(C.t))} ${esc(L.n)}`;
}

  return `<div class="realm">${emblem(me(), 40)}<div><div class="rn">${esc(C.n)}</div><div class="rk">${rulerLine(C, L)} · ${regYear(S, me())}. rok vlády</div></div></div>
  <div class="season" title="Egyptský občanský rok: achet – záplava, peret – setí a růst, šemu – sklizeň">${seasonWheel(S.month)}<div><div class="sn">${(S.month % 4) + 1}. měsíc období ${SEASONS[si]}</div><div class="sd">${SEASON_D[si]} · ≈ ${S.bce} př. n. l.</div></div></div>
  <div class="hud">
    ${resPill("deben", fmtK(C.deben), `<span class="${b.net < 0 ? "bad" : "good"}">${sg(b.net)}</span>`, "Debeny – měděná jednotka hodnoty; za měsíc " + sg(b.net))}
    ${resPill("grain", fmtK(C.grain), "", "Obilí ve státních sýpkách (charů, char ≈ 77 litrů)")}
    ${resPill("maat", Math.round(C.maat), "", "Maat – řád světa a oprávněnost vlády")}
    ${resPill("slava", fmt(C.prestige), "", "Sláva rodu")}
    ${resPill("vojsko", fmtK(clanMen(S, me())), "", "Muži ve zbrani")}
    ${resPill("nil", h ? dec(h) : "?", "loktů", "Výška poslední záplavy na nilometru")}
  </div>

  const t = (k, label, value, sub, vals) => `<div class="tile"><svg class="ti" viewBox="0 0 24 24">${RICON[k]}</svg><div class="tl">${label}</div><div class="tv">${value}</div><div class="ts">${sub || ""}</div>${vals ? sparkline(vals) : ""}</div>`;

    <section class="card wide"><h3>${hg("pan")} Trůnní sál</h3><div class="court">${L ? portrait(L, 96) : ""}<div>

      <div class="row" style="margin-top:6px">${sp ? `<span class="chip">${portrait(sp, 22)} ${esc(sp.n)}</span>` : ""}${heir ? `<span class="chip">${portrait(heir, 22)} dědic: ${esc(heir.n)}</span>` : '<span class="pill bad">bez dědice</span>'}${vez ? `<span class="chip">${portrait(vez, 22)} vezír ${esc(vez.n)}</span>` : ""}</div>
      <div class="small" style="margin-top:4px">Hrobka (${esc(C.tombN)}): ${C.tomb.stage} z ${TOMB_STAGES.length} fází${C.tomb.active ? " – pracuje se" : ""}</div></div></div></section>
  </div>
  <div class="tiles" style="margin-top:14px">
    ${t("deben", "Debeny", fmtK(C.deben), `<span class="${b.net < 0 ? "bad" : "good"}">${sg(b.net)} za měsíc</span>`, H.map(x => x.deben))}
    ${t("grain", "Obilí", fmtK(C.grain), `${sg(b.gnet)} měsíčně · daň ze sklizně ≈ ${fmtK(tax)}`, H.map(x => x.grain))}
    ${t("maat", "Maat", Math.round(C.maat), "řád a oprávněnost vlády", H.map(x => x.maat))}
    ${t("slava", "Sláva", fmt(C.prestige), "vítězství, stavby, výpravy", H.map(x => x.prestige))}
    ${t("nomy", "Nomy", clanProvs(S, me()).length, `jádro Egypta ${realmCore(S, me())} z ${coreProvs(S).length}`, H.map(x => x.provs))}
    ${t("vojsko", "Vojsko", fmtK(clanMen(S, me())), nPlural(S.armies.filter(a => a.cl === me()).length, "vojsko v poli", "vojska v poli", "vojsk v poli"), H.map(x => x.men))}
  </div>
  <div class="grid">

    ${card(`${ricon("vojsko", 20)} Zajatci`, `<p>Zajatců: <b>${fmt(C.zajatci || 0)}</b>. Získáš je ve vítězných bitvách.</p><div class="row">${btn("Poslat na stavby (300 na stavbu)", "capBuild", [], (C.zajatci || 0) >= 300 ? null : "Málo zajatců")} ${btn("Usadit u sídla jako rolníky", "capSettle", [], (C.zajatci || 0) >= 200 ? null : "Málo zajatců")}</div><p class="small muted">Vítězové odváděli zajatce jako pracovní sílu: Ahmose, syn Ebany, si zapsal každého, koho odvedl, a papyrus Brooklyn (13. dynastie) uvádí v jedné domácnosti desítky asijských služebníků.</p>`)}
    ${card(`${ricon("urednici", 20)} Rádci hlásí`, alertsHtml())}

function missionsHtml() {
  const C = P(S), done = C.missions || {};
  return missionList(S).map(id => { const M = MISSIONS[id], ok = done[id] != null;
    return `<div class="alert ${ok ? "good" : "info"}"><b>${ok ? "✔ " : ""}${esc(M.n)}</b> – ${esc(M.d)}<div class="small muted">odměna: ${esc(M.r)}${ok ? " · splněno" : ""}</div></div>`; }).join("");
}
// ---------- karty postav ----------
function statMini(c) { return `<div class="stats4">${STAT_IDS.map(k => `<span title="${STATS[k]} ${st(c, k)}">${STATS[k].slice(0, 3)} ${st(c, k)}<i><b style="width:${st(c, k)}%"></b></i></span>`).join("")}</div>`; }
function loyMini(c) { const v = Math.round(c.loy), col = v < 30 ? "var(--bad)" : v < 55 ? "var(--warn)" : "var(--good)"; return `<div class="loyal" title="věrnost">věrnost <i><b style="width:${v}%;background:${col}"></b></i> ${v}</div>`; }

// ---------- Plán měsíce ----------
function tPlan() {
  const cmdOpts = Object.entries(CMDS).map(([k, K]) => [k, K.n + (K.cost || K.grain ? ` (${K.cost ? K.cost + " d." : ""}${K.cost && K.grain ? ", " : ""}${K.grain ? fmtK(K.grain) + " ch." : ""})` : "")]);
  const ps = myProvs().filter(p => !p.siege).sort((a, b) => (b.id === P(S).capital) - (a.id === P(S).capital) || b.v - a.v);
  let idle = 0; const cards = [];
  for (const p of ps) for (const c of officersIn(S, p.id)) {
    const done = c.acted === S.turn; if (done && !SEL.planDone) continue; if (!done) idle++;
    const k = SEL.cmd[c.id] || suggestCmd(c, p); SEL.cmd[c.id] = k;
    cards.push(`<div class="person${done ? " done" : ""}"><div class="ph">${portrait(c, 54)}<div><div class="pn">${esc(c.n)}${c.id === P(S).leader ? " ♛" : ""}</div><div class="pr">${RANKS[c.rank].n} · ${provLink(p)}${p.deleg ? " · svěřeno rádci" : ""}</div></div></div>
      ${statMini(c)}${loyMini(c)}
      ${done ? '<div class="cmdd">Tento měsíc už jedná.</div>' : `${sel("cs_" + c.id, cmdOpts, k, `data-a="cmdSel" data-x='["${c.id}"]'`)}<div class="cmdd">${esc(CMDS[k].d)}</div><div class="acts">${cmdParams(c, k, p)} ${btn("Provést", "cmd", [c.id], null, "go")} ${btn("Ať rozhodne rádce", "advise", [c.id])}</div>`}</div>`);
  }
  const away = officers(S, me()).filter(c => c.away || c.moving || c.army).map(c => `<div class="person done"><div class="ph">${portrait(c, 40)}<div><div class="pn">${esc(c.n)}</div><div class="pr">${c.away ? `výprava: ${EXPED[c.away.exp].n}, návrat za ${c.away.until - S.turn} měs.` : c.moving ? `na cestě do nomu ${S.provs[c.moving.to].n}` : "velí vojsku v poli"}</div></div></div></div>`);
  return `<section class="card"><h3>${ricon("urednici", 20)} Plán měsíce</h3><div class="row">${idle ? `<b>${nPlural(idle, "úředník čeká", "úředníci čekají", "úředníků čeká")} na rozkaz.</b>` : "<b>Všichni úředníci mají rozkaz.</b>"} ${btn("Rádce rozhodne za všechny volné", "adviseAll", [], idle ? null : "Nikdo nečeká", "go")} ${btn(SEL.planDone ? "Skrýt ty, kdo už jednají" : "Ukázat i ty, kdo už jednají", "planDone")}</div>
    <p class="small muted">${S.month < 4 ? "Je období achet: pole jsou pod vodou a rolníci jdou na robotu – kanály a stavby postupují rychleji." : S.month < 8 ? "Je období peret: setí a růst obilí. Sklizeň přijde v 1. měsíci období šemu." : "Je období šemu: sklizeň a výběr daně v obilí."} Předvybraný rozkaz je doporučení podle stavu nomu.</p></section>
  <div class="people" style="margin-top:14px">${cards.join("") || '<p class="muted">Nikdo nečeká na rozkaz.</p>'}</div>
  ${away.length ? `<h3 class="title" style="margin:18px 0 8px;color:var(--accent)">Mimo svůj nom</h3><div class="people">${away.join("")}</div>` : ""}`;
}

// ---------- Úředníci ----------
function tUrednici() {

// ---------- ovládání mapy myší a dotykem ----------
let MAPDRAG = { on: false, moved: 0, x: 0, y: 0, until: 0 }, ZOOM_T = null;
function svgPt(svg, cx, cy) { const r = svg.getBoundingClientRect(), [vx, vy, vw, vh] = mapVB(), s = Math.max(vw / r.width, vh / r.height), ox = (r.width * s - vw) / 2, oy = (r.height * s - vh) / 2; return [vx - ox + (cx - r.left) * s, vy - oy + (cy - r.top) * s, s]; }
function applyVB() { const svg = document.getElementById("mapsvg"); if (svg) svg.setAttribute("viewBox", mapVB().map(v => v.toFixed(1)).join(" ")); }
function clampVB() { const v = mapVB(); v[2] = clamp(v[2], MW * 0.12, MW * 1.6); v[3] = v[2] * MH / MW; v[0] = clamp(v[0], -MW * 0.4, MW * 1.4 - v[2]); v[1] = clamp(v[1], -MH * 0.3, MH * 1.3 - v[3]); }

  SEL.vb = SEL.vb || [0, 0, MW, MH]; if (SEL.vb.length === 4 && Math.abs(SEL.vb[3] - SEL.vb[2] * MH / MW) > 1) { const c = SEL.vb[1] + SEL.vb[3] / 2; SEL.vb[3] = SEL.vb[2] * MH / MW; SEL.vb[1] = c - SEL.vb[3] / 2; }
  svg.addEventListener("wheel", ev => { ev.preventDefault(); const [px, py] = svgPt(svg, ev.clientX, ev.clientY), v = mapVB(), f = ev.deltaY > 0 ? 1.18 : 1 / 1.18, nw = clamp(v[2] * f, MW * 0.12, MW * 1.6), k = nw / v[2];
    v[0] = px - (px - v[0]) * k; v[1] = py - (py - v[1]) * k; v[2] = nw; v[3] = nw * MH / MW; clampVB(); applyVB(); clearTimeout(ZOOM_T); ZOOM_T = setTimeout(() => render(), 160); }, { passive: false });
  svg.addEventListener("pointerdown", ev => { MAPDRAG = { on: true, moved: 0, x: ev.clientX, y: ev.clientY, until: 0 }; });
  window.onpointermove = ev => {
    if (MAPDRAG.on) { const dx = ev.clientX - MAPDRAG.x, dy = ev.clientY - MAPDRAG.y; MAPDRAG.moved += Math.abs(dx) + Math.abs(dy); if (MAPDRAG.moved > 5) { const [, , s] = svgPt(svg, ev.clientX, ev.clientY), v = mapVB(); v[0] -= dx * s; v[1] -= dy * s; clampVB(); applyVB(); hideTip(); } MAPDRAG.x = ev.clientX; MAPDRAG.y = ev.clientY; return; }
    const g = ev.target.closest && ev.target.closest("[data-pid]"); if (g && document.getElementById("mapsvg") && document.getElementById("mapsvg").contains(g)) showTip(g.dataset.pid, ev.clientX, ev.clientY); else hideTip();
  };
  window.onpointerup = () => { if (MAPDRAG.on && MAPDRAG.moved > 5) MAPDRAG.until = Date.now() + 250; MAPDRAG.on = false; };
}
function tipHtml(pid) {
  const p = S.provs[pid], C = S.clans[p.owner], kn = knows(S, p), mode = SEL.mapMode || "polit";
  let h = `<div class="tt-h">${emblem(p.owner, 16)} <b>${esc(p.n)}</b></div><div class="small muted">${esc(p.eg)}</div><div class="small">${esc(C.n)} · ${esc(TERRAIN[p.ter].n)}</div>`;
  if (kn) {
    h += `<div class="small">obyvatel ≈ ${fmtK(p.pop * 1000)} · vojáků ${p.owner === me() ? fmt(men(p.troops)) : estimate(S, p, men(p.troops))} · spokojenost ${Math.round(p.loy)}</div>`;
    if (mode === "uroda") { const hh = S.flood.h || 15.5; h += `<div class="small">obilí pro lid ≈ ${fmtK(provFood(S, p, hh) - provTax(S, p, hh))} / potřeba ${fmtK(provNeed(p))}</div>`; }
    if (mode === "rozvoj") h += `<div class="small">pole ${p.agri}/${agriCap(S, p)} · řemesla ${p.com}/${comCap(S, p)}</div>`;

  const ar = S.armies.filter(a => a.loc === pid && (a.cl === me() || kn)); for (const a of ar) h += `<div class="small">vojsko: ${esc(S.clans[a.cl].n)}, ${fmtK(men(a.t))} mužů</div>`;

}
function showTip(pid, x, y) { const t = document.getElementById("tip"); if (!t) return; t.innerHTML = tipHtml(pid); t.style.display = "block"; const w = t.offsetWidth, h = t.offsetHeight; t.style.left = Math.min(window.innerWidth - w - 8, x + 14) + "px"; t.style.top = Math.min(window.innerHeight - h - 8, y + 14) + "px"; }

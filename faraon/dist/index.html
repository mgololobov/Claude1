:root {
  --bg: #e9dcb8; --panel: #f6eed6; --panel2: #efe3c2; --ink: #2b1d12; --muted: #6d5a42; --line: #cdb88c; --accent: #a8381e; --accent2: #1d4f9a; --gold: #b8862b;
  --green: #2e7d5b; --good: #2e7d4f; --bad: #a3271b; --warn: #a86b12; --head: #e6d6ad; --btn: #efe1bd; --btnh: #e4d1a3;
  --sea: #3b6fa8; --desert: #d9b77a; --kemet: #6f8f3e; --nile: #1d4f9a; --shadow: 0 2px 6px rgba(60, 35, 10, .18); color-scheme: light;
  --frieze: repeating-linear-gradient(90deg, #1d4f9a 0 14px, #2b1d12 14px 16px, #a8381e 16px 30px, #2b1d12 30px 32px, #2e7d5b 32px 46px, #2b1d12 46px 48px, #c9952b 48px 62px, #2b1d12 62px 64px);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #15120d; --panel: #221c14; --panel2: #2a2318; --ink: #f0e4c8; --muted: #a8977c; --line: #45392a; --accent: #e07a52; --accent2: #6b9be0; --gold: #d9a94a;
  --green: #6fc29a; --good: #7fc37f; --bad: #ef7b6c; --warn: #e3ac55; --head: #2f271c; --btn: #30281d; --btnh: #40352a;
  --sea: #24456b; --desert: #5a4528; --kemet: #3f5a26; --nile: #4f86d1; --shadow: 0 2px 8px rgba(0,0,0,.5); color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #15120d; --panel: #221c14; --panel2: #2a2318; --ink: #f0e4c8; --muted: #a8977c; --line: #45392a; --accent: #e07a52; --accent2: #6b9be0; --gold: #d9a94a;
  --green: #6fc29a; --good: #7fc37f; --bad: #ef7b6c; --warn: #e3ac55; --head: #2f271c; --btn: #30281d; --btnh: #40352a;
  --sea: #24456b; --desert: #5a4528; --kemet: #3f5a26; --nile: #4f86d1; --shadow: 0 2px 8px rgba(0,0,0,.5); color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; color: var(--ink); }
body { font: 14px/1.45 "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; background-color: var(--bg);
  background-image: repeating-linear-gradient(0deg, rgba(120, 85, 40, .05) 0 2px, transparent 2px 7px), repeating-linear-gradient(90deg, rgba(120, 85, 40, .04) 0 3px, transparent 3px 11px); }
.hg { font-family: "Hieroglyfy", serif; font-weight: normal; letter-spacing: 0; line-height: 1; }
h1, h2, h3, .title { font-variant: small-caps; letter-spacing: .05em; }

/* ---------- horní lišta (HUD) ---------- */
header { position: sticky; top: 0; z-index: 6; background: var(--panel); box-shadow: var(--shadow); padding: 6px 16px 10px; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
header::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 5px; background: var(--frieze); }
header .realm { display: flex; align-items: center; gap: 10px; min-width: 0; }
header .realm .rn { font-size: 18px; font-weight: bold; color: var(--accent); font-variant: small-caps; letter-spacing: .04em; line-height: 1.1; }
header .realm .rk { font-size: 12px; color: var(--muted); }
header .realm .rk .hg { font-size: 15px; color: var(--ink); }
.hud { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.res { display: inline-flex; align-items: center; gap: 6px; background: var(--panel2); border: 1px solid var(--line); border-radius: 20px; padding: 2px 10px 2px 4px; white-space: nowrap; }
.res svg { width: 24px; height: 24px; flex: none; }
.res b { font-variant-numeric: tabular-nums; font-size: 15px; }
.res small { font-size: 11px; }
.season { display: inline-flex; align-items: center; gap: 8px; background: var(--panel2); border: 1px solid var(--line); border-radius: 20px; padding: 2px 12px 2px 4px; }
.season .wheel { width: 30px; height: 30px; }
.season .sn { font-weight: bold; line-height: 1.1; } .season .sd { font-size: 11px; color: var(--muted); line-height: 1.1; }
header .sp { flex: 1; }
button.main { background: linear-gradient(var(--accent), #8a2c15); color: #fff8e6; border: 2px solid #5c1d0d; border-radius: 22px; padding: 7px 18px 7px 14px; font: inherit; font-weight: bold; font-variant: small-caps; letter-spacing: .05em; cursor: pointer; box-shadow: 0 2px 0 #5c1d0d; display: inline-flex; align-items: center; gap: 8px; }
button.main:hover { filter: brightness(1.08); } button.main:active { transform: translateY(1px); box-shadow: none; }

/* ---------- navigace ---------- */
nav { display: flex; flex-wrap: wrap; gap: 4px; padding: 10px 16px 0; max-width: 1400px; margin: 0 auto; }
nav button { border: 1px solid var(--line); background: var(--btn); color: var(--ink); padding: 5px 11px 5px 7px; border-radius: 18px; cursor: pointer; font: inherit; display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 1px 0 var(--line); }
nav button:hover { background: var(--btnh); }
nav button.on { background: var(--accent2); color: #fff; border-color: transparent; }
nav .badge { background: var(--accent); color: #fff; border-radius: 8px; font-size: 11px; padding: 0 5px; }
nav .ico { width: 18px; height: 18px; }
main { padding: 12px 16px 28px; max-width: 1400px; margin: 0 auto; }

/* ---------- karty jako malované desky s vlysem ---------- */
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); align-items: start; }
.card { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px 14px 12px; overflow-x: auto; min-width: 0; box-shadow: var(--shadow); }
.card::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: var(--frieze); border-radius: 6px 6px 0 0; opacity: .9; }
.card h3 { margin: 2px 0 10px; font-size: 16px; color: var(--accent); display: flex; align-items: center; gap: 8px; }
.card h3 .hg { font-size: 20px; color: var(--ink); }
.card h4 { margin: 10px 0 4px; font-size: 14px; font-variant: small-caps; letter-spacing: .04em; }
.wide { grid-column: 1 / -1; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 4px 7px; text-align: left; vertical-align: top; }
th { font-variant: small-caps; letter-spacing: .04em; color: var(--muted); border-bottom: 2px solid var(--line); font-weight: bold; }
tbody tr:nth-child(even) td { background: color-mix(in srgb, var(--panel2) 70%, transparent); }
td { border-bottom: 1px solid color-mix(in srgb, var(--line) 50%, transparent); }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.muted td { opacity: .55; } tr.sel td { background: var(--head) !important; }
.good { color: var(--good); } .bad { color: var(--bad); } .warn { color: var(--warn); } .muted { color: var(--muted); } .small { font-size: 12px; }
button.b, select, input, textarea { font: inherit; font-size: 13px; }
button.b { background: var(--btn); color: var(--ink); border: 1px solid var(--line); border-radius: 14px; padding: 3px 11px; cursor: pointer; margin: 1px; }
button.b:hover:not(:disabled) { background: var(--btnh); } button.b:disabled { opacity: .45; cursor: default; }
button.b.go { background: var(--green); color: #fff; border-color: transparent; }
button.b.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }
select, input { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; max-width: 100%; }
input[type=number] { width: 90px; }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 4px 0; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; }
.kv > :nth-child(odd) { color: var(--muted); }
details summary { cursor: pointer; color: var(--accent2); }
.help p { margin: 4px 0 8px; } .help h4 { color: var(--accent); }
.tag { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 8px; background: var(--head); color: var(--muted); margin-right: 4px; }
.pill { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 9px; background: var(--head); margin: 1px 2px 1px 0; white-space: nowrap; }
.pill.good { background: color-mix(in srgb, var(--good) 18%, var(--panel)); color: var(--good); } .pill.bad { background: color-mix(in srgb, var(--bad) 15%, var(--panel)); color: var(--bad); } .pill.warn { color: var(--warn); }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 0 8px 0 3px; border-radius: 10px; font-size: 12px; background: var(--head); margin: 1px 2px; white-space: nowrap; }
.emb { vertical-align: middle; flex: none; }
a.lnk { color: var(--accent2); cursor: pointer; text-decoration: underline dotted; }

/* ---------- dlaždice, výstrahy, měřidla ---------- */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-bottom: 14px; }
.tile { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px 8px; min-width: 0; box-shadow: var(--shadow); display: grid; grid-template-columns: auto 1fr; gap: 0 10px; align-items: center; }
.tile > svg.ti { grid-row: span 2; width: 34px; height: 34px; }
.tile .tl { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.tile .tv { font-size: 22px; font-weight: bold; font-variant-numeric: tabular-nums; line-height: 1.2; }
.tile .ts { font-size: 12px; color: var(--muted); grid-column: 1 / -1; }
.tile .spark { width: 100%; height: 24px; display: block; margin-top: 4px; grid-column: 1 / -1; }
.alert { padding: 6px 10px; border-left: 4px solid var(--line); margin: 4px 0; background: var(--panel2); border-radius: 0 6px 6px 0; font-size: 13px; }
.alert.bad { border-color: var(--bad); } .alert.warn { border-color: var(--warn); } .alert.info { border-color: var(--accent2); } .alert.good { border-color: var(--good); }
.meter { display: grid; grid-template-columns: 130px 1fr auto; gap: 8px; align-items: center; font-size: 13px; margin: 4px 0; }
.meter .ml { color: var(--muted); } .meter .mv { font-variant-numeric: tabular-nums; font-size: 12px; }
.meter .mt { height: 10px; background: color-mix(in srgb, var(--line) 70%, transparent); border-radius: 5px; overflow: hidden; } .meter .mt i { display: block; height: 100%; background: var(--accent2); border-radius: 5px; }
.tbar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; min-width: 80px; background: var(--line); margin: 3px 0; } .tbar i { display: block; height: 100%; }
.tleg { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: var(--muted); margin: 2px 0 6px; } .tleg i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
.sbv { display: inline-block; min-width: 34px; text-align: right; padding: 0 4px; border-radius: 3px; background: linear-gradient(90deg, color-mix(in srgb, var(--accent2) 30%, transparent) var(--v), transparent var(--v)); }
.relbar { display: inline-block; width: 70px; height: 8px; background: var(--line); border-radius: 4px; position: relative; vertical-align: middle; margin-left: 4px; }
.relbar i { position: absolute; top: 0; bottom: 0; border-radius: 4px; } .relbar b { position: absolute; top: -2px; bottom: -2px; width: 1px; background: var(--ink); left: 50%; }

/* ---------- postavy ---------- */

<body>
<header id="top"></header>
<nav id="tabs"></nav>
<main id="main"></main>
<div id="modal" class="hidden"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="live" class="sr-only" aria-live="polite"></div>
<script>
"use strict";
// Pán Obou zemí – data: kalendář, terén, vojsko, hodnosti, rozkazy, stavby, výpravy, vědění, zákony, stavy.
// Letopočty podle běžné „střední“ chronologie (I. Shaw, The Oxford History of Ancient Egypt, 2000); nejistota je desítky let.

// Egyptský občanský rok: tři období po čtyřech měsících o 30 dnech + 5 dní navíc (epagomenální).
const SEASONS = ["achet", "peret", "šemu"];
const SEASON_D = ["záplava", "setí a růst", "sklizeň"];
const monthName = m => `${(m % 4) + 1}. měsíc období ${SEASONS[Math.floor(m / 4)]}`;
const monthShort = m => `${(m % 4) + 1}. ${SEASONS[Math.floor(m / 4)]}`;
const FLOOD_MONTH = 1;   // vrchol záplavy (2. měsíc období achet) – nilometr ukáže výšku
const HARVEST_MONTH = 8; // sklizeň a výběr daně (1. měsíc období šemu)
const OSIRIS_MONTH = 3;  // Usirovy mystéria v Abydu (herní termín; přesné datum ve Střední říši není jisté)
// Pozn.: občanský kalendář (365 dní) se vůči skutečným ročním obdobím posouval o den za čtyři roky. Hra ho pro přehlednost drží v souladu se záplavou.

const TERRAIN = {

function rnd(s) { let t = (s.seed = (s.seed + 0x6D2B79F5) | 0); t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
const chance = (s, p) => rnd(s) < p;
const rint = (s, a, b) => a + Math.floor(rnd(s) * (b - a + 1));
const rrange = (s, a, b) => a + rnd(s) * (b - a);

  if (sex === "f") return pick(s, N.f) + ", dcera " + pick(s, N.m);
  let a = pick(s, N.m), b = pick(s, N.m); if (a === b) b = pick(s, N.m);
  if (cul === "hyk" && chance(s, 0.5)) { a = pick(s, NAMES.eg.m); }

}
function makeChar(s, o) {

function genOfficer(s, cl, cul, loc, o = {}) {

function realmProvs(s, cid) { return clanProvs(s, cid).length + sum(vassalsOf(s, cid).map(v => clanProvs(s, v.id).length)); }
function realmCore(s, cid) { const ids = [cid].concat(vassalsOf(s, cid).map(v => v.id)); return coreProvs(s).filter(p => ids.includes(p.owner)).length; }

      const def = -left, fromStock = Math.min(p.stock, def); p.stock -= fromStock; const rest = def - fromStock;
      if (rest >= 1) { let d = rest / provNeed(p); if (hasTech(s, p.owner, "nilometr")) d *= 0.67; p.hunger = clamp(p.hunger + d * 1.5, 0, 1); p.pop = r1(Math.max(0.5, p.pop * (1 - d * 0.22))); p.loy = Math.max(0, p.loy - d * 50); (hungry[p.owner] = hungry[p.owner] || []).push([p.id, Math.round(rest)]); }
    }
    p._lastH = Math.round(H); p._lastTax = Math.round(tax);
  }
  s.flags.nohunger = hungry[s.player] ? 0 : (s.flags.nohunger || 0) + 1;
  for (const [cid, list] of Object.entries(hungry)) {
    if (isPlayer(s, cid)) hungerPlayer(s, list);
    else { const C = s.clans[cid]; for (const [pid, d] of list) { if (C.grain > d * 2) { C.grain -= d; s.provs[pid].stock += d; s.provs[pid].loy += 8; } } }
    log(s, `${clanName(s, cid)}: hlad v nomech ${list.map(([id]) => s.provs[id].n).join(", ")}.`, "nil", [cid]);
  }
  // sklady se kazí, úroda se přičte
  for (const C of aliveClans(s)) { C.last.harvest = s.turn; }
  marketHarvest(s);
}

    if (ratio > (gw > 1 ? 1.12 : 1.3) && r < (gw > 1 ? 20 : 5) && chance(s, C.aggr * 0.05 * ppl * gw * (O.type === "kmen" ? 0.6 : 1))) { declareWar(s, cid, o, ratio > 2.5 ? "ze síly" : "o hranice"); break; }
  }
  // mír
  for (const e of enemies) {
    const w = s.wars.find(x => (x.a === cid && x.b === e) || (x.a === e && x.b === cid)); if (!w || s.turn - w.start < 8) continue;
    const ratio = realmPower(s, cid) / Math.max(1, realmPower(s, e));

    else if ((ratio < 0.7 || s.turn - w.start > 24) && chance(s, 0.06) && !s.armies.some(a => (a.cl === cid || a.cl === e) && s.provs[a.loc].siege)) makePeace(s, cid, e);
  }
  // poddanství slabých sousedů
  if (chance(s, 0.03)) for (const o of borderClans(s, cid)) { const O = s.clans[o]; if (isPlayer(s, o) || O.vassalOf || O.type === "kmen" || C.vassalOf) continue; if (realmPower(s, cid) > realmPower(s, o) * 3.5 && rel(s, cid, o) > -10) { C.last["d_" + o] = -1; diplo(s, cid, o, "podruci"); break; } }
  // vazal se vzbouří
  if (C.vassalOf && s.clans[C.vassalOf] && (C.kapUntil || 0) <= s.turn && chance(s, 0.02) && realmPower(s, cid) > realmPower(s, C.vassalOf) * 0.8 && rel(s, cid, C.vassalOf) < 20) declareWar(s, cid, C.vassalOf, "za nezávislost");
  // tribut
  if (C.tributeTo && (atWar(s, cid, C.tributeTo) || realmPower(s, cid) > realmPower(s, C.tributeTo) * 1.2) && chance(s, 0.05)) { C.last["d_" + C.tributeTo] = -1; diplo(s, cid, C.tributeTo, "tribut_stop"); }
  // rozpuštění vojsk bez cíle
  for (const a of s.armies.filter(x => x.cl === cid && (!x.path || !x.path.length) && s.provs[x.loc].owner !== cid && !s.provs[x.loc].siege)) { const home = clanProvs(s, cid).find(q => s.provs[a.loc].nb.includes(q.id)) || s.provs[C.capital]; if (home) a.path = findPath(s, cid, a.loc, home.id) || []; }
}

// Hráčovy svěřené nomy spravuje rádce sám
function delegated(s) { for (const p of clanProvs(s, s.player)) if (p.deleg) for (const c of officersIn(s, p.id)) if (c.acted !== s.turn && c.id !== P(s).leader) aiDomestic(s, s.player, c); }

// ---------- vítězství ----------
function checkEnd(s) {
  if (s.over && !s.over.cont) return;
  const C = P(s); if (!C || !C.alive) return;
  checkEndAI(s); if (s.over && !s.over.cont) return; checkEndKmen(s);
  const core = coreProvs(s).length, mine = realmCore(s, s.player);
  if (!s.flags.won && (C.cul === "eg" || C.cul === "hyk") && mine >= Math.ceil(core * 0.9) && clanProvs(s, s.player).some(p => p.id === "l1" || p.id === "u4" || p.id === "u20" || p.id === "lav")) {
    s.flags.won = 1; C.maat = Math.min(100, C.maat + 20); C.prestige += 300;
    const L = leaderOf(s, s.player);
    s.over = { win: true, cont: true, txt: `${L.n} sjednotil Horní a Dolní Egypt (sema-taui) a nasadil si dvojitou korunu. Ovládáš ${mine} z ${core} nomů egyptského jádra. Tak jako Montuhotep II. (vládl ≈ 2055–2004 př. n. l.) nebo Ahmose I. po dobytí Avaridu jsi zakladatelem nové éry. Můžeš vládnout dál.` };
    queueEvent(s, "vitezstvi", { win: true, txt: s.over.txt });
  }
  if (!s.flags.won && C.cul === "nub" && C.type !== "kmen" && mine >= Math.ceil(core * 0.5) && ["n_kerma", "n_buhen", "u1"].every(id => s.provs[id].owner === s.player || (s.clans[s.provs[id].owner].vassalOf === s.player))) {
    s.flags.won = 1; s.over = { win: true, cont: true, txt: `Kuš ovládá Núbii i polovinu Egypta. Tak mocná Kerma nebyla nikdy – až asi o osm set let později vládli Egyptu kušitští králové 25. dynastie.` };
    queueEvent(s, "vitezstvi", { win: true, txt: s.over.txt });
  }
}

// ---------- konec měsíce ----------
function endTurn(s) {
  if (s.over && !s.over.cont) return;
  if (s.pb) liveAuto(s);
  delegated(s);
  for (const C of aliveClans(s)) if (!isPlayer(s, C.id)) aiClan(s, C.id);
  moveArmies(s); siegeTick(s); raids(s);
  economyTick(s); monTick(s); mechTick(s); nadaceTick(s); missionTick(s); achTick(s); worldTick(s);
  if (s.month === 0) { s.flood.next = rollFlood(s); }
  if (s.month === FLOOD_MONTH) floodTick(s);
  if (s.month === HARVEST_MONTH) harvestTick(s);
  loyaltyTick(s);
  // stavy (jen hráč): pomalý návrat k rovnováze
  const C = P(s);
  if (C && C.estates) {
    for (const e of ESTATE_IDS) C.estates[e] = clamp(C.estates[e] + (50 - C.estates[e]) * 0.02, 0, 100);
    C.maat = clamp(C.maat + (C.estates.knezi - 50) / 100, 0, 100);
    if (C.estates.nomarchove < 20 && chance(s, 0.1)) { const c = pick(s, officers(s, s.player).filter(x => !x.dyn) || []); if (c) { c.loy = Math.max(0, c.loy - 15); log(s, `Nomarchové reptají; ${c.n} se veřejně staví proti dvoru.`, "intriky", [s.player]); } }
  }
  // AI pokoušení hráčových úředníků
  for (const e of aliveClans(s).filter(x => !isPlayer(s, x.id) && x.type !== "kmen" && (atWar(s, x.id, s.player) || rel(s, x.id, s.player) < -30))) {
    if (!chance(s, 0.06)) continue; const cs = officers(s, s.player).filter(c => !c.dyn && c.loy < 45 && Object.values(s.provs).some(q => q.lord === c.id && q.nb.some(n => s.provs[n].owner === e.id)));
    if (cs.length) { const c = pick(s, cs); c.loy = Math.max(0, c.loy - rint(s, 6, 14)); c.tempt = e.id; log(s, `Šeptá se, že ${c.n} přijímá dary od rodu ${e.house}.`, "intriky", [s.player]); }
  }
  scriptedEvents(s);
  // posun kalendáře
  s.turn++; s.month++;
  if (s.month >= 12) { s.month = 0; s.bce--; yearAnnal(s); log(s, `Pět dní navíc (epagomenální): slaví se narození Usira, Hora, Sutecha, Eset a Nebthet. Začíná nový rok.`, "nil"); yearLife(s); if (C) { if (hasTech(s, s.player, "hvezdy")) C.maat = Math.min(100, C.maat + 2); if (hasTech(s, s.player, "sothis")) C.maat = Math.min(100, C.maat + 1); } }
  randomEvents(s); xaiEvents(s);
  checkEnd(s);
  snapshot(s);
}

// Velké stavby panovníků: dlouhodobé projekty s trvalým účinkem na nom a jednorázovou slávou pro stavebníka.
// Každá je inspirována skutečnou stavbou; ve hře ji může postavit kdokoli, kdo nom drží (i dřív než historicky).
const MONUMENTS = {

    d: "Obelisk z asuánské žuly, jaký dal Senusret I. vztyčit v Heliopoli (stojí dodnes).", eff: "maat +5, sláva +80; potřebuješ i Elefantinu (žulové lomy)" },
};
MONUMENTS.deffufa = { n: "Západní deffufa", at: "n_kerma", stages: 4, deben: 5000, grain: 25000, maat: 8, prestige: 100,
  d: "Obří chrám z nepálených cihel v Kermě, dodnes vysoký kolem 18 metrů – srdce kultu kušitských vládců.", eff: "maat +8, sláva +100, Kerma +10 spokojenosti" };
const MON_IDS = Object.keys(MONUMENTS);
function monState(s, id) { const p = s.provs[MONUMENTS[id].at]; return (p.mons && p.mons[id]) || { stage: 0, left: 0, active: false, by: null }; }
function monDone(s, id) { return monState(s, id).stage >= MONUMENTS[id].stages; }
function monCost(s, cid, id) { const M = MONUMENTS[id], k = costMult(s, cid) * (1 + monState(s, id).stage * 0.15) * (hasTech(s, cid, "obelisky") ? 0.8 : 1); return { deben: Math.round(M.deben * k), grain: Math.round(M.grain * k) }; }
function monCheck(s, cid, id) {
  const M = MONUMENTS[id], st_ = monState(s, id);
  if (st_.stage >= M.stages) return "Stavba je dokončena.";
  if (st_.active) return "Na stavbě se pracuje.";
  for (const pid of [M.at].concat(M.need || [])) if (s.provs[pid].owner !== cid) return `Musíš držet nom ${s.provs[pid].n}.`;
  if (M.need2 === "kamen" && s.provs.u1.owner !== cid) return "Žula se láme u Elefantiny – musíš ji držet.";
  if (s.provs[M.at].siege) return "Nom je obléhán.";
  const c = monCost(s, cid, id); if (s.clans[cid].deben < c.deben || s.clans[cid].grain < c.grain) return `Potřebuješ ${fmtN(c.deben)} debenů a ${fmtN(c.grain)} charů obilí.`;
  return null;
}
function startMon(s, cid, id) {
  const e = monCheck(s, cid, id); if (e) return e;
  const c = monCost(s, cid, id), p = s.provs[MONUMENTS[id].at]; pay(s, cid, c.deben, c.grain);
  p.mons = p.mons || {}; const st_ = monState(s, id); p.mons[id] = { stage: st_.stage, left: 6, active: true, by: cid };
  if (isPlayer(s, cid)) log(s, `Zahájena další fáze velké stavby: ${MONUMENTS[id].n} (${st_.stage + 1}. z ${MONUMENTS[id].stages}).`, "stavby", [cid]);
  return null;
}
function monTick(s) {
  for (const id of MON_IDS) {
    const M = MONUMENTS[id], p = s.provs[M.at], st_ = p.mons && p.mons[id]; if (!st_ || !st_.active) continue;
    if (p.owner !== st_.by || p.siege) { st_.active = false; continue; } // stavba se zastaví, když nom padne
    st_.left -= (s.month < 4 ? 2 : 1) * (hasTech(s, st_.by, "pyrmesta") ? 1.5 : 1);
    if (st_.left > 0) continue;
    st_.active = false; st_.stage++; const C = s.clans[st_.by];
    if (st_.stage < M.stages) { C.prestige += 10; if (isPlayer(s, st_.by)) log(s, `${M.n}: dokončena ${st_.stage}. fáze z ${M.stages}.`, "stavby", [st_.by]); continue; }
    C.maat = Math.min(100, C.maat + M.maat); C.prestige += M.prestige; if (M.knezi && C.estates) C.estates.knezi = Math.min(100, C.estates.knezi + M.knezi);

}
// trvalé účinky na nomy
function monAgri(s, p) { return p.id === "fa" && monDone(s, "fajjum") ? 25 : 0; }
function monRaidWall(s, p) { return (monDone(s, "zdi") && (p.id === "l14" || p.id === "l20")) || (monDone(s, "katarakt") && (p.id === "n_buhen" || p.id === "n_semna")) ? 2 : 1; }

}

function moreEventOpts(s) {
  const C = P(s), opts = [], L = leaderOf(s, s.player);
  const nile = someOwnProv(s, p => TERRAIN[p.ter].nile && p.ter !== "katarakt"); if (nile) opts.push(["hroch", { pid: nile.id }], ["skudci", { pid: nile.id }]);
  const east = someOwnProv(s, p => p.ter === "delta" || p.nb.some(n => s.provs[n].owner === "aamu")); if (east && lw(s, s.player, "cizinci") !== 0) opts.push(["osadnici", { pid: east.id }]);
  if (C.grain > 60000) opts.push(["pozar", {}]);
  if (L && C.t === "král" && age(s, L) >= 20 && (!s.flags.spiknuti_t || s.turn - s.flags.spiknuti_t > 120)) opts.push(["spiknuti", {}]);
  if (s.provs.l1.owner === s.player && !s.flags.apis) opts.push(["apis", {}]);
  if (L && age(s, L) >= 45) opts.push(["nemoc", {}]);
  for (const x of aliveClans(s)) if (x.id !== s.player && allied(s, s.player, x.id)) { const e = enemiesOf(s, x.id).filter(y => y !== s.player); if (e.length) { opts.push(["pomoc", { cl: x.id, foe: e[0] }]); break; } }
  for (const e of enemiesOf(s, s.player)) { const fr = clanProvs(s, s.player).find(p => p.nb.some(n => s.provs[n].owner === e)); if (fr) { opts.push(["zbehove", { foe: e, pid: fr.id, n: rint(s, 15, 40) * 10 }]); break; } }
  if (s.provs.u1.owner === s.player) opts.push(["karavana", {}]);
  const hi = officers(s, s.player).filter(c => !c.dyn && c.rank >= 2); if (hi.length && C.cul === "eg") opts.push(["stela", { cid: pick(s, hi).id }]);
  const any = someOwnProv(s); if (any) opts.push(["vdova", { pid: any.id }]);
  const cattle = someOwnProv(s, p => p.res.includes("dobytek") || p.ter === "delta"); if (cattle) opts.push(["mor_skotu", { pid: cattle.id }]);
  if ((s.scen === "sip" || s.bce < 1700) && someOwnProv(s, p => p.ter === "delta") && !s.flags.remeslnici) opts.push(["remeslnici", {}]);
  const kus = ["kush", "kerma"].find(id => s.clans[id] && s.clans[id].alive && id !== s.player && !atWar(s, s.player, id)); if (kus && clanProvs(s, s.player).some(p => p.nb.some(n => s.provs[n].owner === kus)) && !s.flags.posli_kus) opts.push(["posli_kus", { cl: kus }]);
  return opts.concat(moreEventOpts2(s));
}

function shipGrain(s, cid, fromId, toId, q) {

  if (!TERRAIN[a.ter].nile || !TERRAIN[b.ter].nile) return "Obilí se vozí po Nilu – oba nomy musí ležet u řeky.";

  const cost = Math.round(q / (hasTech(s, cid, "clun") ? 100 : 50)); if (!pay(s, cid, cost)) return `Převoz stojí ${fmtN(cost)} debenů.`;
  a.stock -= q; b.stock += Math.round(q * 0.95); b.loy = Math.min(100, b.loy + (b.hunger > 0.05 ? 6 : 1));
  if (isPlayer(s, cid)) log(s, `Lodě převezly ${fmtN(q)} charů obilí z nomu ${a.n} do nomu ${b.n} (5 % se cestou ztratilo, převoz za ${fmtN(cost)} debenů).`, "hospodarstvi", [cid]);

// ---------- hlad: méně drobných hladů, víc rozhodování ----------
function hungerPlayer(s, list) {

  if (tot < 2500 && C.grain > tot * 3) {

    log(s, `Správci sýpek rozdělili ${fmtN(tot)} charů obilí do nomů ${list.map(([id]) => s.provs[id].n).join(", ")}, kde nestačila úroda.`, "nil", [s.player]); return;
  }
  queueEvent(s, "hlad", { list });
}
function surplusProvs(s, list) { const ids = list.map(x => x[0]); return clanProvs(s, s.player).filter(p => !ids.includes(p.id) && p.stock > provNeed(p) * 0.6); }
if (EVENTS.hlad) {
  const baseView = EVENTS.hlad.view;
  EVENTS.hlad.view = (s, d) => {
    const v = baseView(s, d), C = P(s), tot = sum(d.list.map(x => x[1])), src = surplusProvs(s, d.list);
    const avail = Math.round(sum(src.map(p => p.stock - provNeed(p) * 0.5))), mv = Math.min(avail, tot), fee = Math.round(mv * 0.12);
    const soldiers = sum(clanProvs(s, s.player).map(p => men(p.troops))) + sum(s.armies.filter(a => a.cl === s.player).map(a => men(a.t))), fr = Math.min(Math.round(tot * 0.5), Math.round(soldiers * 1.2));
    const extra = [];
    if (mv > 0) extra.push({ t: `Převézt obilí lodí z nomů s přebytkem (${fmtN(mv)} charů, ${fmtN(fee)} debenů za lodě)`, d: `vezme ze zásob ${src.length} nomů – jejich věrnost −3`, f: () => { if (!pay(s, s.player, fee)) return "Nedostatek debenů na lodě."; let left = mv; for (const p of src) { const x = Math.min(left, Math.round(p.stock - provNeed(p) * 0.5)); if (x <= 0) continue; p.stock -= x; p.loy = Math.max(0, p.loy - 3); left -= x; } for (const [id, x] of d.list) { const p = s.provs[id]; p.stock += Math.round(x * mv / Math.max(1, tot)); p.loy = Math.min(100, p.loy + 6); p.hunger = Math.max(0, p.hunger - 0.25); } return `Lodě převezly ${fmtN(mv)} charů obilí.`; } });
    if (fr > 500) extra.push({ t: `Snížit příděly vojákům (ušetří ${fmtN(fr)} charů)`, d: "výcvik posádek −8, velitelé věrnost −3", f: () => { for (const p of clanProvs(s, s.player)) p.train = Math.max(10, p.train - 8); for (const a of s.armies.filter(a => a.cl === s.player)) { a.train = Math.max(10, (a.train || 40) - 8); for (const id of a.cmds) { const c = chr(s, id); if (c) c.loy = Math.max(0, c.loy - 3); } } for (const [id, x] of d.list) s.provs[id].stock += Math.round(x * fr / Math.max(1, tot)); return "Vojáci dostávají menší dávky chleba."; } });
    v.ch.splice(1, 0, ...extra); return v;
  };
}

function doRaid(s, T, from, q) {
  const n = Math.round(men(from.troops) * 0.45); if (n < 150) return { err: "Na nájezd je třeba aspoň 150 bojovníků v kraji." };
  const t = {}; for (const k of TROOP_IDS) if (from.troops[k]) { t[k] = Math.round(from.troops[k] * 0.45); from.troops[k] -= t[k]; }
  const b = battle(s, { cl: T.id, t, train: from.train, cmd: 1 }, { cl: q.owner, t: q.troops, train: q.train, cmd: 1, fort: (1 + q.castle * 0.08) * monRaidWall(s, q) * [1.3, 1, 0.85][lw(s, q.owner, "cizinci")] }, q.id, { kind: "nájezd" });
  for (const k of TROOP_IDS) if (t[k]) from.troops[k] = (from.troops[k] || 0) + t[k];
  const O = s.clans[q.owner]; let loot = 0, gl = 0;
  if (b.win === "A") { loot = Math.round(Math.min(O.deben * 0.06, 2500)); gl = Math.round(Math.min(q.stock * 0.3, 15000)); O.deben -= loot; q.stock -= gl; q.loy = Math.max(0, q.loy - 6); q.pop = r1(q.pop * 0.985); T.deben += loot; T.grain += gl; T.prestige += 6;
    log(s, `Nájezd: ${T.n} (${T.house}) vyplenili nom ${q.n} – odnesli ${fmtN(loot)} debenů a ${fmtN(gl)} charů obilí.`, "valka", [T.id, q.owner]); }
  else if (isPlayer(s, T.id)) log(s, `Nájezd na nom ${q.n} byl odražen.`, "valka", [T.id]);
  addRel(s, T.id, q.owner, -6); return { b, loot, gl };
}
function playerRaid(s, fromId, toId) {
  const T = P(s), from = s.provs[fromId], q = s.provs[toId];
  if (T.type !== "kmen") return "Nájezdy podnikají jen kmeny.";
  if (!from || from.owner !== s.player || !q || !from.nb.includes(toId) || q.owner === s.player) return "Nájezd jde jen do sousedního cizího kraje.";
  if (friendly(s, s.player, q.owner)) return "Na spojence se neútočí.";
  if ((T.last.raid || -9) > s.turn - 3) return "Bojovníci odpočívají – další nájezd nejdřív za " + (T.last.raid + 3 - s.turn) + " měs.";
  const r = doRaid(s, T, from, q); if (r.err) return r.err; T.last.raid = s.turn;
  return r.b.win === "A" ? `Kořist: ${fmtN(r.loot)} debenů a ${fmtN(r.gl)} charů obilí.` : "Nájezd se nezdařil.";
}
function serveClan(s, o) {

  if (atWar(s, s.player, o)) return "S nepřítelem se o službě nejedná.";

  T.serve = o; O.medjay = O.medjay || T.cul === "nub"; addRel(s, s.player, o, 10); log(s, `Bojovníci kmene ${T.n} vstoupili do služby rodu ${O.house} jako zvědové a lučištníci.`, "diplomacie", [s.player, o]); return null;
}

}

function worldTick(s) {
  // kmeny žijí ze stád: mléko, maso a výměna dobytka za obilí

  if (s.month === 0) { ensureRods(s); rodsTick(s); }
}

function senetMove(pos, t, careful) {

}

  return `<div class="grid">${card("Vojska v poli", tbl(["Kde", "Muži", "Velitelé", "Pochod", ""], ar) + '<p class="small muted">Nové vojsko vyšleš z panelu nomu na Mapě. S vědomím Říční flotila (nebo z nomu s přístavištěm) pluje vojsko po Nilu dva nomy za měsíc. Vojáci jedí 1,5 charu obilí měsíčně.</p>')}
  ${card("Nepřátelská vojska", tbl(["Rod", "Kde", "Muži", "Pochod"], foe))}
  ${card("Posádky nomů", troopLegend() + tbl(["Nom", "#Muži", "Složení", "#Výcvik", "#Strop", "#Obrana"], gar), "wide")}
  ${card("Bitvy", bt || '<p class="muted small">Zatím žádné.</p>', "wide")}
  ${card("Druhy vojska", tbl(["Druh", "#Útok", "#Obrana", "#Cena/100", "Poznámka"], TROOP_IDS.map(k => tr([TROOPS[k].n, tdn(TROOPS[k].atk), tdn(TROOPS[k].def), tdn(TROOPS[k].cost), `<span class="small">${TROOPS[k].d || ""}</span>`]))) + '<p class="small muted">Kopiníci s velkými štíty z volské kůže a lučištníci tvořili jádro egyptských vojsk (dřevěné modely egyptských kopiníků a núbijských lučištníků z hrobky Mesehtiho v Asjútu, 11. dynastie). Koně a válečný vůz se do Egypta dostali v době Hyksósů; egyptské vozatajstvo je doloženo až od počátku 18. dynastie.</p>')}</div>`;
}

// ---------- Diplomacie ----------
function relStatus(cid) {
  const C = P(S), O = S.clans[cid], t = [];
  if (atWar(S, me(), cid)) t.push('<span class="pill bad">válka</span>');
  else if (truceUntil(S, me(), cid) > S.turn) t.push(`<span class="pill">příměří ${truceUntil(S, me(), cid) - S.turn} měs.</span>`);
  if (allied(S, me(), cid)) t.push('<span class="pill good">spojenec</span>');
  if (O.vassalOf === me()) t.push('<span class="pill good">tvůj poddaný</span>');
  if (C.vassalOf === cid) t.push('<span class="pill warn">tvůj pán</span>');
  if (C.tributeTo === cid) t.push('<span class="pill warn">platíš mu tribut</span>');
  if (O.tributeTo === me()) t.push('<span class="pill good">platí ti tribut</span>');
  if (S.trade[pairKey(me(), cid)]) t.push('<span class="pill">obchod</span>');
  if (married(S, me(), cid)) t.push('<span class="pill">sňatek</span>');
  if (O.vassalOf && O.vassalOf !== me()) t.push(`<span class="pill">poddaný: ${esc(S.clans[O.vassalOf].n)}</span>`);
  return t.join(" ");
}
// ---------- Hospodářství ----------
function tHosp() {
  const C = P(S), b = clanBudget(S, me()), INC = { cesty: "Obchodní cesty", zupy: "Nomy (řemesla, trh, lidé)", suroviny: "Doly, lomy a suroviny", obchod: "Obchodní smlouvy", tribut: "Tribut poddaných", chramy: "Zdanění chrámů" }, EX = { zvedove: "Zvědové",  dvur: "Dvůr", platy: "Platy úředníků", vojsko: "Výzbroj a údržba vojska", zoldneri: "Žold Médžajů", stavby: "Údržba chrámů a pevností", tribut: "Tribut" }, GX = { vojsko: "Příděly vojákům", urednici: "Příděly úředníkům", dvur: "Dvůr a palác", ztraty: "Ztráty v sýpkách (myši, vlhkost)" };
  const fh = S.flood.hist.slice(-30);
  const fc = S.month === 0 && hasTech(S, me(), "nilometr") ? S.flood.next : null;
  const tax = yearTaxEstimate(S, me(), fc || S.flood.h || 15.5);
  const capQ = marketCap(S, me()), used = C.last.traded === S.turn ? C.last.tradedQ || 0 : 0;
  const ex = Object.entries(EXPED).map(([k, E]) => { const e = expAvail(S, me(), k); return tr([`<b>${E.n}</b>`, E.from.map(id => S.provs[id].n).join(", "), tdn(E.months), `${fmt(E.deben[0])}–${fmt(E.deben[1])}`, tdn(Math.round(E.risk * 100) + " %"), e ? `<span class="small muted">${esc(e)}</span>` : '<span class="good small">dostupná</span>']); });
  return `<div class="grid">
  ${card("Pokladna – debeny měsíčně", flowBars(Object.entries(b.inc).map(([k, v]) => [INC[k] || k, v]), Object.entries(b.ex).map(([k, v]) => [EX[k] || k, v])) + `<p><b>Celkem ${sg(b.net)} debenů měsíčně.</b></p><p class="small muted">Deben byl jednotkou váhy, ne mincí: v Nové říši asi 91 g, ve starších dobách se jeho hodnota lišila (ve Střední říši se počítalo i v šat). Ceny se vyjadřovaly v debenech mědi, platilo se zbožím. Hra ho používá jako společnou jednotku hodnoty.</p>`)}
  ${card("Sýpky – obilí měsíčně", flowBars([], Object.entries(b.gex).map(([k, v]) => [GX[k] || k, v])) + `<p><b>Měsíčně ${sg(b.gnet)} charů</b>, ročně asi ${fmtK(-b.gnet * 12)}. Daň ze sklizně ${fc ? "podle předpovědi nilometru" : "při poslední záplavě"}: <b>≈ ${fmtK(tax)} charů</b>.</p>
    <div class="row">Daň ze sklizně: ${sel("taxSel", TAX_LEVELS.map((t, i) => [i, `${t} (${Math.round(TAX_RATE[i] * 100)} %)`]), C.tax, `data-a="tax" data-x='[]'`)}</div><p class="small muted">Vyšší daň plní sýpky, ale lid strádá a v hubených letech hladoví. Obilím se rozumí hlavně dvouzrnka (emmer) a ječmen. Daň se vybírá jednou ročně při sklizni v 1. měsíci období šemu.</p>`)}
  ${card("Trh – směna obilí za debeny", `<p>Cena: <b>${dec(S.market.p)} debenu za char</b> (prodej ${dec(S.market.p * 0.8)}, nákup ${dec(S.market.p * 1.25)}). Kupci tento měsíc smění ještě ${fmt(capQ - used)} charů.</p>
    <div class="row"><input id="mktQ" type="number" step="1000" min="0" placeholder="charů"> ${btn("Prodat obilí", "trade", [-1])} ${btn("Koupit obilí", "trade", [1])}</div><p class="small muted">Po slabé záplavě obilí zdraží. Objem směny závisí na řemeslech a obchodu ve tvých nomech. V Dér el-Medíně za Nové říše stál char dvouzrnky obvykle 1–2 debeny mědi, v krizi na konci 20. dynastie mnohem víc.</p>`)}
  ${card("Výšky záplav", fh.length ? `<div class="floodbars">${fh.map(x => `<span class="${x.h < 13.5 ? "low" : x.h >= 18 ? "high" : ""}" style="height:${clamp((x.h - 8) / 13 * 100, 4, 100)}%" title="${x.y} př. n. l.: ${dec(x.h)} loktů"></span>`).join("")}</div><div class="small muted">Posledních ${fh.length} let. Červeně hladová, oranžově ničivá záplava.</div>` : '<p class="muted small">První záplava přijde ve 2. měsíci období achet.</p>') + ('<p class="small">Plinius Starší (1. stol. n. l.) zapsal pravidlo: dvanáct loktů znamená hlad, třináct nouzi, čtrnáct radost, patnáct bezpečí a šestnáct hojnost. Velmi vysoká voda strhává hráze. Egyptské letopisy zapisovaly výšky záplav už za Staré říše (Palermská deska).</p>')}
  ${card("Obchodní cesty", tbl(["Cesta", "Stav", "Tvé nomy na cestě", "#Výnos/měs."], ROUTES.map(R => { const st_ = routeState(S, R), mine = R.provs.filter(id => S.provs[id].owner === me());
      return tr([`<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${R.col};margin-right:5px"></span><b>${esc(R.n)}</b><div class="small muted">${esc(R.d)}</div>`, st_.open ? '<span class="good">průchodná</span>' : '<span class="bad">přerušená válkou</span>', mine.map(id => esc(S.provs[id].n)).join(", ") || "—", tdn(mine.length && st_.open ? fmt(R.base * (R.id === "jih" && hasTech(S, me(), "sehel") ? 1.3 : 1) * mine.length / R.provs.length) : "0")]); })) + '<p class="small muted">Cesta vynáší podle počtu nomů, které na ní držíš, víc když jsou ostatní nomy spojenecké nebo s nimi máš obchodní smlouvu, a nejvíc když ji ovládáš celou. Válka mezi pány nomů na cestě ji přeruší. Cesty ukazuje režim mapy Obchod.</p>', "wide")}
  ${card("Výpravy", tbl(["Cíl", "Výchozí nomy", "#Měs.", "Výnos (deb.)", "#Riziko", ""], ex) + '<p class="small muted">Výpravu vede úředník rozkazem „Vést výpravu“. Nápisy výprav se dochovaly ve Vádí Hammámát, v Hatnubu i na Sinaji; výpravy do Puntu vyplouvaly ze Sauu (Marsá Gavásis).</p>', "wide")}</div>`;
}

// ---------- Chrámy a stavy ----------
function tChramy() {
  const C = P(S), tc = tombCost(S, me());
  const temples = myProvs().filter(p => p.b.chram).map(p => tr([provLink(p), esc(p.god), tdn(p.b.chram)]));
  const EST_D = { knezi: "maat a chrámová kázeň", nomarchove: "věrnost úředníků", pisari: "výnos debenů a vědění", lid: "spokojenost nomů" };
  return `<div class="grid">
  ${card("Maat a stavy", meter("Maat", C.maat, 100, "var(--gold)") + ESTATE_IDS.map(e => meter(ESTATES[e], C.estates[e], 100, C.estates[e] < 30 ? "var(--bad)" : "")).join("") + `<p class="small muted">${ESTATE_IDS.map(e => `${ESTATES[e]}: ${EST_D[e]}`).join(" · ")}. Maat je řád světa; panovník ji udržuje obětinami, chrámy, spravedlností a vítězstvími. Hlad, zpustošení hrobů a porušené smlouvy ji narušují.</p>`)}
  ${card(`Hrobka panovníka – ${esc(C.tombN)}`, `<div class="small">${TOMB_STAGES.map((t, i) => `<div>${i < C.tomb.stage ? '<span class="good">✔</span>' : i === C.tomb.stage && C.tomb.active ? "▶" : "○"} ${t}</div>`).join("")}</div>
    ${C.tomb.active ? `<p>Pracuje se, zbývá asi ${Math.max(1, Math.ceil(C.tomb.left / (S.month < 4 ? 2 : 1)))} měs.</p>` : C.tomb.stage < TOMB_STAGES.length ? `<div class="row">${btn(`Zahájit fázi „${TOMB_STAGES[C.tomb.stage]}“ (${fmt(tc.deben)} d., ${fmtK(tc.grain)} ch.)`, "tomb", [], null, "go")}</div>` : '<p class="good">Hrobka je dokončena.</p>'}
    <p class="small muted">Když panovník zemře s hrobkou hotovou aspoň do třetí fáze, nástupce získá maat; bez hrobky ji ztratí. Za záplavy (Achet) se staví dvakrát rychleji – rolníci jsou volní pro robotu.</p>`)}
  ${card("Velké stavby", tbl(["Stavba", "Kde", "Postup", "Účinek po dokončení", ""], MON_IDS.map(id => { const M = MONUMENTS[id], st_ = monState(S, id), e = monCheck(S, me(), id), c = monCost(S, me(), id);
      return tr([`<b>${M.n}</b><div class="small muted">${esc(M.d)}</div>`, esc([...new Set([M.at].concat(M.need || []))].map(x => S.provs[x].n).join(", ")), `${st_.stage}/${M.stages}${st_.active ? ` <span class="small">(pracuje se, ${Math.max(1, Math.ceil(st_.left / (S.month < 4 ? 2 : 1)))} měs.)</span>` : ""}${st_.by && st_.by !== me() ? `<div class="small muted">stavěl ${esc(S.clans[st_.by].n)}</div>` : ""}`, `<span class="small">${esc(M.eff)}</span>`,
        st_.stage >= M.stages ? '<span class="good">✔</span>' : btn(`Další fáze (${fmtK(c.deben)} d., ${fmtK(c.grain)} ch.)`, "mon", [id], e, "go")]); })) + '<p class="small muted">Každá fáze trvá šest měsíců, za záplavy polovinu. Stavba patří nomu: kdo ho dobude, převezme i rozestavěné dílo. Hotové stavby se počítají do odkazu rodu.</p>', "wide")}
  ${card(`${hg("necer")} Státní bůh`, `<div class="people">${Object.entries(STATE_GODS).map(([k, G]) => { const cur = stateGod(S, me()) === k, own = S.provs[G.at].owner === me();
      return `<div class="person${cur ? "" : own ? "" : " done"}" style="${cur ? "outline:3px solid var(--gold)" : ""}"><div class="pn">${esc(G.n)}${cur ? " – <span class=\"good\">uctíván dvorem</span>" : ""}</div><div class="pr">kultovní centrum: ${esc(S.provs[G.at].n)}</div><div class="small">${esc(G.d)}</div><div class="small"><b>${esc(G.eff)}</b></div>${cur ? "" : `<div class="acts">${btn("Povýšit jeho kult", "god", [k], own ? null : "Musíš držet kultovní centrum")}</div>`}</div>`; }).join("")}</div><p class="small muted">Změna kultu stojí maat −6 a přízeň kněží −12 a lze ji opakovat nejdřív po třech letech.${(P(S).lawCd.god || 0) > S.turn ? ` Znovu za ${P(S).lawCd.god - S.turn} měs.` : ""}</p>`, "wide")}
  ${card("Zádušní nadace", `<p>Nadací: <b>${C.nadace || 0}</b> z ${NADACE_MAX}. Každá stojí 400 charů obilí měsíčně, přidává maat a po smrti panovníka zajistí nástupci maat +2 a důstojný pohřeb i bez hotové hrobky.</p><div class="row">${btn("Založit nadaci (3 000 d., 10 tis. ch.)", "nadace", [], (C.nadace || 0) >= NADACE_MAX ? "Víc nadací kněží neudrží" : null, "go")}</div><p class="small muted">Nomarcha Hapdžefai z Asjútu (12. dynastie) dal do své hrobky vytesat deset smluv s kněžími, kteří mu za pole a příděly měli navěky přinášet obětiny.</p>`)}
  ${card("Chrámy", tbl(["Nom", "Bůh", "#Úroveň"], temples) + '<p class="small muted">Chrám staví úředník rozkazem „Řídit stavbu“. Každá úroveň dává maat, spokojenost a body vědění.</p>')}</div>`;
}

// ---------- Rod ----------
function tRod() {
  const C = P(S), L = ruler(), sp = L && chr(S, L.spouse), H = heirsOf(S, me());
  const kids = L ? L.kids.map(id => chr(S, id)).filter(c => c && c.st !== "dead") : [];
  const others = Object.values(S.chars).filter(c => c.cl === me() && c.dyn && c.st !== "dead" && c !== L && c !== sp && !kids.includes(c));
  const dead = Object.values(S.chars).filter(c => c.dyn && c.st === "dead" && c.cl === me()).slice(-15).map(c => tr([esc(c.n), esc(c.died || "")]));
  const canKing = C.t !== "král" && C.cul === "eg" && clanProvs(S, me()).length >= 6;
  return `<div class="grid">${card("Rodokmen – " + esc(C.house), `<div class="tree"><div class="gen">${famCard(L, cap(C.t))}${sp ? famCard(sp, "choť") : '<div class="fam empty">bez choti</div>'}</div>
    ${kids.length ? `<div class="stem"></div><div class="gen">${kids.map(c => famCard(c)).join("")}</div>` : '<p class="muted small">Zatím bez potomků.</p>'}
    ${others.length ? `<h4>Další členové rodu</h4><div class="gen">${others.map(c => famCard(c, c.sex === "m" ? "příbuzný" : "příbuzná")).join("")}</div>` : ""}</div>
    <p class="small muted">Dědic: ${H[0] ? esc(H[0].n) : '<b class="bad">žádný</b>'} (${LAWS.nastupnictvi.opts[C.laws.nastupnictvi]}). Sloupce: velení, statečnost, moudrost, správa. Synové v 15 letech vstupují do služby. Sňatky s jinými rody dohodneš v Diplomacii. Bez dědice převezme vládu nejschopnější úředník a založí novou dynastii.</p>`, "wide")}
  ${card("Královský titul", C.t === "král" ? `<p>${esc(L ? L.n : "")} nosí titul krále Horního a Dolního Egypta.</p>` : `<p>Jsi ${esc(C.t)}. Kdo ovládne aspoň šest nomů, může přijmout královskou titulaturu a pět jmen panovníka – jako Intefové v Thébách.</p>${btn("Prohlásit se králem", "king", [], canKing ? null : "Potřebuješ aspoň 6 nomů (a egyptský rod)", "go")}<p class="small muted">Vazalské pouto k pánovi se tím zpřetrhá a hrozí válka.</p>`)}
  ${card("Odkaz rodu", legacyCard())}
  ${C.t === "král" ? card(`${hg("nswbjtj")} Horovo jméno`, `<p class="small">Horovo jméno bylo prvním z pěti jmen královské titulatury a vyhlašovalo program vlády. Montuhotep II. ho změnil dvakrát – naposledy na „Ten, který sjednotil Obě země“.</p><div class="people">${Object.entries(HORUS).map(([k, H]) => { const cur = C.horus === k, ok = (!C.horus || k === "sema") && (!H.req || H.req(S));
      return `<div class="person${cur ? "" : ok ? "" : " done"}" style="${cur ? "outline:3px solid var(--gold)" : ""}"><div class="pn">${esc(H.n)}</div><div class="pr">„${esc(H.tr)}“ · ${esc(H.who)}</div><div class="small"><b>${esc(H.eff)}</b></div>${cur ? '<div class="good small">nynější jméno</div>' : `<div class="acts">${btn("Přijmout", "horus", [k], ok ? null : C.horus ? "Jméno už bylo přijato" : "Zatím nelze")}</div>`}</div>`; }).join("")}</div>`, "wide") : ""}
  ${card("Spřízněné rody", aliveClans(S).filter(c => married(S, me(), c.id)).map(c => chip(c.id)).join(" ") || "—")}
  ${card("Zesnulí", tbl(["Jméno", "Zemřel(a)"], dead))}</div>`;
}

function legacy() {
  const C = P(S), ps = clanProvs(S, me());
  return [["Nomy egyptského jádra (i poddaných)", realmCore(S, me()) * 10], ["Ostatní nomy", ps.filter(p => !p.flags.includes("e")).length * 4], ["Chrámy (úrovně)", sum(ps.map(p => (p.b.chram || 0) * 6))], ["Pevnosti nad první úroveň", sum(ps.map(p => Math.max(0, p.castle - 1) * 2))],
    ["Hrobka panovníka", C.tomb.stage * 15], ["Maat", Math.round(C.maat)], ["Sláva", Math.round(C.prestige / 10)], ["Vědění", Object.keys(C.techs).length * 3], ["Velké stavby (fáze)", monCount(S, me()) * 10], ["Sjednocení Obou zemí", S.flags.won ? 200 : 0]];
}
function legacyCard() { const it = legacy(); return tbl(["Co zůstane", "#Body"], it.filter(x => x[1]).map(([n, v]) => tr([n, tdn(fmt(v))]))) + `<p><b>Celkem ${fmt(sum(it.map(x => x[1])))} bodů.</b></p><p class="small muted">Tak by tvou vládu hodnotili písaři budoucích letopisů. Slouží k porovnání her.</p>`; }

// ---------- Vědění ----------
function tVedeni() {
  const C = P(S), cats = [...new Set(TECH_IDS.map(t => TECHS[t].cat))];
  return `<div class="grid">${card("Dům života", `<p>Zkoumá se: <b>${C.res.cur ? TECHS[C.res.cur].n + ` (${Math.round(C.res.pts)}/${techCost(S, me(), C.res.cur)})` : "nic"}</b>. Body přinášejí rozkaz „Dům života“ a chrámy.</p><p class="small muted">Vědění, které znají sousedé nebo nepřátelé, se učí o třetinu levněji – tak se do Egypta dostal válečný vůz a kompozitní luk.</p>`)}
  ${cats.map(cat => card(cat, tbl(["Vědění", "Účinek", "#Cena", ""], TECH_IDS.filter(t => TECHS[t].cat === cat).map(t => { const T = TECHS[t]; return tr([C.techs[t] ? `<span class="good">✔ ${T.n}</span>` : C.res.cur === t ? `<b>▶ ${T.n}</b>` : T.n, `<span class="small">${T.d}${T.req ? " · vyžaduje: " + T.req.map(r => TECHS[r].n).join(", ") : ""}</span>`, tdn(techCost(S, me(), t)), C.techs[t] || C.res.cur === t ? "" : btn("Zkoumat", "research", [t], techAvail(S, me(), t) ? null : "Chybí předpoklady")]); })))).join("")}</div>`;
}

// ---------- Kronika ----------

  <section class="card wide help"><h3>Jak hrát</h3>
  <p>Jsi hlavou vládnoucího rodu nebo rodu nomarchů v době, kdy je Egypt rozdělený. Jedno kolo je jeden měsíc egyptského občanského roku: tři období po čtyřech měsících o třiceti dnech – achet (záplava), peret (vzcházení, setí) a šemu (sklizeň, léto) – a na konci pět dní navíc. Skutečný občanský kalendář se vůči ročním obdobím posouval; hra ho drží v souladu se záplavou. <b>Cíl:</b> sjednotit Horní a Dolní Egypt – ovládnout (sám nebo skrze poddané) devět desetin nomů egyptského jádra. Prohraješ, když přijdeš o všechny nomy.</p>
  <h4>Měsíc</h4><p>V záložce <b>Plán měsíce</b> dáš každému úředníkovi jeden rozkaz: kanály a hráze, dílny a trhy, hradby, odvod, výcvik, rozdělení obilí, sčítání, obětiny, hledání schopných mužů, dům života, stavby, výpravy, zvědy, intriky nebo přesun. Nomy svěřené rádci spravuje umělá inteligence sama. Pak stiskni <b>Konec měsíce</b>.</p>
  <h4>Nil a obilí</h4><p>Ve 2. měsíci období achet ukážou značky na březích výšku záplavy v loktech (královský loket ≈ 52 cm). Ta rozhodne o sklizni v 1. měsíci období šemu, kdy písaři vyberou daň v obilí. Obilím platíš příděly vojákům a úředníkům i robotníky na stavbách. Obecní sýpky v nomech chrání lid před hladem; při nízké záplavě je doplň rozkazem „Rozdat obilí“. Debeny (měděná jednotka hodnoty) plynou z řemesel, obchodu, dolů a výprav.</p>
  <h4>Válka</h4><p>Válku vyhlásíš v Diplomacii, vojsko vyšleš z panelu nomu na Mapě. Vojsko táhne jeden nom za měsíc, s říční flotilou dvě. Bitva má až šest kol; rozhoduje počet, druh vojska, výcvik, vědění, terén, hradby a velitel. Pevnosti se obléhají – hradby z nepálených cihel padnou, nebo posádka vyhladoví. Kmeny Libyjců, Aamu, Médžajů a Núbijců podnikají nájezdy.</p>
  <h4>Bitva vedená osobně</h4><p>Při větším střetu se otevře bojiště a v každém kole zvolíš rozkaz. Salvy lučištníků rozbijí nehybný šik, šik kopiníků zastaví útok i vozy, útok a vozy smetou lučištníky, obchvat Médžajů rozvrátí šik. Ústupem bitvu prohraješ, ale zachráníš muže – nejlépe k lodím. Osobní velení vypneš v záložce Vojsko.</p>
  <h4>Klávesnice</h4><p><b>N</b> konec měsíce, <b>1–9</b> a <b>0</b> záložky, <b>+</b> a <b>−</b> přiblížení mapy, <b>Esc</b> zavře panel nomu, <b>?</b> nápověda. Tab a Enter ovládají všechna tlačítka, karty i nomy na mapě.</p>
  <h4>Úředníci a maat</h4><p>Věrnost úředníků závisí na hodnosti, úřadech, darech, maat a slávě. Nevěrný nomarcha pohraničního nomu může přeběhnout i s nomem. Maat udržuješ obětinami, chrámy, péčí o hladové a hrobkou panovníka; po třiceti letech vlády můžeš slavit svátek sed.</p></section>
  <section class="card wide help"><h3>Slovníček</h3><div class="kv small">
  <span>achet, peret, šemu</span><span>tři období egyptského roku: záplava, vzcházení a setí, sklizeň</span>

  <span>nomarcha</span><span>řecký název pro správce nomu, egyptsky „velký představený nomu“ (heri-tep aa)</span>

  <span>tjati</span><span>vezír, nejvyšší úředník po králi</span>
  <span>maat</span><span>řád světa, pravda a spravedlnost; udržovat ji bylo hlavní povinností krále</span>
  <span>heka chasut</span><span>„vládci cizích zemí“, z toho řecké Hyksósové</span>
  <span>Aamu, Tjehenu, Médžajové</span><span>egyptská označení pro Asiaty, Libyjce a pouštní kmeny Východní pouště</span>
  <span>Kuš, Vavat</span><span>Horní Núbie s centrem v Kermě a Dolní Núbie mezi 1. a 2. kataraktem</span>
  <span>svátek sed</span><span>jubileum obnovy královské moci, zpravidla po třiceti letech vlády</span>
  <span>dům života</span><span>chrámová dílna písařů, kde se opisovaly a uchovávaly texty</span>
  <span>robota</span><span>pracovní povinnost pro stát, hlavně v době záplavy</span></div></section>
  <section class="card wide help"><h3>Historické pozadí a zdroje</h3>
  <p><b>První přechodné období (≈ 2160–2055 př. n. l.):</b> po pádu Staré říše vládli v Hérakleopoli králové 9. a 10. dynastie („dům Chetiho“), v Thébách se Intefové 11. dynastie prohlásili králi. O Thinidu a Abydos se bojovalo; Ponaučení pro Merikarea lituje zpustošení hrobů v Thinidě. Nomarchové Asjútu (Tefibi, Cheti II.) stáli při Hérakleopoli, nomarcha Anchtifi z Moally líčí velký hlad. O generaci dříve (≈ 2120 př. n. l.) se nomarcha Anchtifi z Moally zmocnil nomu Edfu a bojoval s Thébami a Koptem. Egypt nakonec sjednotil Montuhotep II. (vládl ≈ 2055–2004 př. n. l.), zřejmě až po dvaceti a více letech vlády.</p>
  <p><b>Druhé přechodné období (≈ 1650–1550 př. n. l.):</b> Hyksósové 15. dynastie („vládci cizích zemí“, heka chasut) vládli z Avaridu (Tell el-Dab'a), Kuš z Kermy ovládla Núbii a egyptské pevnosti u 2. kataraktu. Thébská 17. dynastie byla na Hyksósech zřejmě závislá. Papyrus Sallier I. (sepsaný až za 19. dynastie) vypráví o sporu Apopiho a Sekenenrea kvůli hrochům; Sekenenreova mumie nese smrtelné rány. Stély krále Kamoseho popisují tažení k Avaridu, hranici u Kúsaje i zachycený dopis vládci Kuše. Ahmose I. (vládl od ≈ 1550 př. n. l.) dobyl Avaris a vyhnal Hyksósy – popisuje to životopis Ahmose, syna Ebany, v jeho hrobce v Elkabu.</p>
  <p><b>Co je historické a co herní:</b> nomy, jejich egyptská jména, bohové, suroviny, výpravy, kalendář, nilometr, příděly obilí, debeny, hodnosti a titulatura vycházejí z egyptologie. Jména vládců a doložených hodnostářů odpovídají pramenům; roky narození, schopnosti, povahy a všichni ostatní úředníci jsou herní. Letopočty se drží střední chronologie (I. Shaw, The Oxford History of Ancient Egypt), nejistota je desítky let. Výšky záplav jsou náhodné, ale klima Prvního přechodného období je sušší (pokles záplav kolem roku 2200 př. n. l.).</p></section></div>`;
}

    <div class="nchips"><span title="obyvatel">${ricon("urednici", 15)} ${fmtK(p.pop * 1000)}</span><span title="posádka">${ricon("vojsko", 15)} ${fmtK(men(p.troops))}</span><span title="obecní zásoby obilí">${ricon("grain", 15)} ${fmtK(p.stock)}</span><span title="hradby">hradby ${Math.round(p.dur)}</span></div>

}
function tZupyArt() {
  const ps = myProvs().sort((a, b) => (b.id === P(S).capital) - (a.id === P(S).capital) || b.v - a.v);
  return `<div class="grid">${card(`Tvé nomy (${ps.length})`, `<div class="nomes">${ps.map(nomeCard).join("")}</div><p class="small muted">Klepni na nom a otevře se na mapě. Pruhy: pole a obchod vůči stropu, spokojenost lidu.</p>`, "wide")}</div>`;

// Vzhled hry: portréty postav, ikony surovin, hieroglyfy.
// Portréty se drží konvencí egyptské malby: postava z profilu, oko zepředu s linkou líčidla, muži červenohnědí,
// ženy žlutookrové; Asiaté (Aamu) se „hřibovitými“ vlasy a vousy jako na malbě z Beni Hasanu, Libyjci s copánkem
// a pery, Núbijci tmaví s krátkými vlasy; děti s kadeří mládí; král v šátku nemes s kobrou a umělým vousem.

const HG = { pan: "𓎟𓇾𓇾", nswbjtj: "𓇓𓏏𓆤𓏏", anch: "𓋹𓍑𓋴", maat: "𓆄", sepat: "𓈈", necer: "𓊹", sema: "𓄥", kemet: "𓆎𓏏𓊖", achet: "𓆷", sara: "𓅭𓇳" };
const hg = (k, title) => `<span class="hg" ${title ? `title="${esc(title)}"` : ""}>${HG[k]}</span>`;

const SKIN = { m: "#9c4a24", f: "#d9a35a", nub: "#4a2c1a", aam: "#c99a63", lib: "#c58d5d" };
function hashStr(t) { let h = 2166136261; for (let i = 0; i < t.length; i++) { h ^= t.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
let PORT_N = 0;
function portraitKind(c) {
  const C = c.cl && S.clans[c.cl], h = hashStr(c.id + c.n);
  const leader = C && C.leader === c.id, king = leader && C.t === "král";
  let cul = (C && C.cul) || "eg"; if (c.origin && S.clans[c.origin]) cul = S.clans[c.origin].cul;
  if (cul === "hyk") cul = king ? "hyk-king" : NAMES.eg.m.some(n => c.n.startsWith(n + ",")) ? "eg" : "aam";
  const kid = c.st === "kid";
  const queen = c.sex === "f" && C && ((C.leader && chr(S, C.leader) && chr(S, C.leader).spouse === c.id && C.t === "král") || (leader && C.t === "král"));
  return { cul, kid, king: king && cul !== "nub", chief: leader && !king, queen, sex: c.sex || "m", h, priest: !kid && c.sex !== "f" && cul === "eg" && !leader && (c.traits || []).includes("zbozny") || (h % 5 === 0 && cul === "eg" && !leader && c.sex !== "f"), dead: c.st === "dead" };
}
function portrait(c, size = 56) {

  const k = portraitKind(c), id = "pt" + (PORT_N++);

  const skin = nub ? SKIN.nub : aam ? SKIN.aam : lib ? SKIN.lib : k.sex === "f" ? SKIN.f : SKIN.m;
  const hair = "#1b130c", gold = "#c9952b", blue = "#1d4f9a", red = "#a8381e", green = "#2e7d5b";
  let g = "";
  // ramena a široký náhrdelník (wesech)
  g += `<path d="M6 64 C8 50 19 45 30 45 L38 45 C49 45 57 51 59 64Z" fill="${skin}"/>`;
  const bands = k.king || k.queen ? [gold, blue, gold, red] : k.chief ? [gold, red, blue] : [blue, red, green];
  bands.forEach((col, i) => { g += `<path d="M${13 + i} ${55 + i * 2.2} C${21} ${48 + i * 2.2} ${45} ${48 + i * 2.2} ${53 - i} ${56 + i * 2.2}" fill="none" stroke="${col}" stroke-width="2.2"/>`; });
  // krk a hlava z profilu (obličej doprava)
  g += `<path d="M28 36 L37 36 L38 47 L27 47Z" fill="${skin}"/>`;
  g += `<path d="M30 9 C38 9 43 14 43 20 L44 24 L47.5 28.5 L44.5 29.5 L44.5 31 L45.5 33 L43.5 34.2 L43.5 36 C42.5 39.5 38.5 41.5 34.5 41.5 L30 41.5 C24 38 20 32 20 24 C20 15 24 9 30 9Z" fill="${skin}"/>`;
  // vlasy, paruky, pokrývky hlavy
  if (k.king || k.cul === "hyk-king") {
    g += `<defs><pattern id="${id}" width="3" height="3" patternUnits="userSpaceOnUse"><rect width="3" height="3" fill="${gold}"/><rect y="1.6" width="3" height="1.4" fill="${blue}"/></pattern></defs>`;
    g += `<path d="M42 18 C42 9 35 5 28 5 C19 5 14 12 14 21 C14 30 16 40 17 48 L26 48 L30 30 C31 25 33 19 42 18Z" fill="url(#${id})" stroke="#2b1d12" stroke-width=".6"/>`;
    g += `<path d="M33 27 L38 27 L39 50 L33 50Z" fill="url(#${id})" stroke="#2b1d12" stroke-width=".6"/>`;
    g += `<path d="M41 13.5 C43 11 45 11.5 44.5 14.5 L42.5 15.5Z" fill="${gold}" stroke="#2b1d12" stroke-width=".5"/>`; // kobra (ureus)

  } else if (aam) {

    g += `<path d="M44 33 C44.5 40 41 45 35 45 L32 40 L38 39 C40 38 42 36 44 33Z" fill="${hair}"/>`;

    g += `<path d="M28 8 C26 0 29 -4 31 -6 C31 0 31 4 30 8Z" fill="${blue}" transform="translate(0 6)"/><path d="M32 8 C32 1 35 -2 37 -4 C36 2 35 5 34 8Z" fill="${red}" transform="translate(0 6)"/>`;

  } else {
    const len = k.h % 3 === 0 ? 46 : 41;

  g += `<path d="M34 22.8 L41.8 22.2 M41.2 22.4 L43 23.2" stroke="#1b130c" stroke-width=".7" fill="none"/>`;

}

const RICON = {

  maat: `<path d="M13 2c4 5 4 12 1 17l-1 3h-1.6l.6-3c-3-5-3-12 1-17z" fill="#c9952b" stroke="#6d4a1f" stroke-width=".9"/><path d="M13 4v16" stroke="#6d4a1f" stroke-width=".7"/>`,

  nomy: `<rect x="3" y="3" width="18" height="18" rx="2" fill="#6f8f3e" stroke="#2b1d12" stroke-width="1.2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18" stroke="#1d4f9a" stroke-width="1.4"/>`,
  urednici: `<rect x="4" y="3" width="6" height="18" rx="1" fill="#efe6d1" stroke="#6d4a1f"/><circle cx="7" cy="7" r="1.4" fill="#2b1d12"/><circle cx="7" cy="11" r="1.4" fill="#a8381e"/><path d="M14 4l6 16" stroke="#6d4a1f" stroke-width="1.6"/>`,
};
const ricon = (k, size = 24) => `<svg viewBox="0 0 24 24" width="${size}" height="${size}" aria-hidden="true">${RICON[k] || ""}</svg>`;
function seasonWheel(m) {
  const cols = ["#1d4f9a", "#2e7d5b", "#c9952b"], c = 15, r = 13; let g = "";
  for (let i = 0; i < 3; i++) { const a0 = (i / 3) * 2 * Math.PI - Math.PI / 2, a1 = ((i + 1) / 3) * 2 * Math.PI - Math.PI / 2;
    g += `<path d="M${c} ${c} L${(c + r * Math.cos(a0)).toFixed(2)} ${(c + r * Math.sin(a0)).toFixed(2)} A${r} ${r} 0 0 1 ${(c + r * Math.cos(a1)).toFixed(2)} ${(c + r * Math.sin(a1)).toFixed(2)}Z" fill="${cols[i]}" opacity="${Math.floor(m / 4) === i ? 1 : 0.35}"/>`; }
  const a = ((m + 0.5) / 12) * 2 * Math.PI - Math.PI / 2;
  g += `<circle cx="${c}" cy="${c}" r="4" fill="var(--panel)"/><path d="M${c} ${c} L${(c + (r - 1) * Math.cos(a)).toFixed(2)} ${(c + (r - 1) * Math.sin(a)).toFixed(2)}" stroke="#2b1d12" stroke-width="2.2" stroke-linecap="round"/>`;

}
function resPill(k, val, sub, title) { return `<span class="res" title="${esc(title || "")}">${ricon(k)}<b>${val}</b>${sub ? ` <small>${sub}</small>` : ""}</span>`; }
const nPlural = (n, a, b, c) => `${n} ${n === 1 ? a : n > 1 && n < 5 ? b : c}`;

// Herní obrazovky: horní lišta, palác, plán měsíce s kartami úředníků, dvůr, rody, rodokmen a svitek událostí.

// ---------- horní lišta ----------
function rulerLine(C, L) {
  if (!L) return "—";
  const king = C.t === "král" && C.cul !== "nub";
  return king ? `${hg("nswbjtj", "nesut-biti – král Horního a Dolního Egypta")} <span class="cartouche">${esc(L.n)}</span>${hg("anch", "anch, udža, seneb – živ, zdráv, silen")}` : `${esc(cap(C.t))} ${esc(L.n)}`;

function renderTop() {
  const C = P(S), b = clanBudget(S, me()), h = S.flood.h, L = ruler(), si = Math.floor(S.month / 4);

function renderTabs() {

// ---------- Palác (přehled) ----------
function alertsHtml(n) { const al = alerts(); return al.length ? al.slice(0, n || 99).map(([c, t]) => `<div class="alert ${c}">${esc(t)}</div>`).join("") + (n && al.length > n ? `<p class="small muted">a dalších ${al.length - n}…</p>` : "") : '<p class="muted">Rádci nemají, co by hlásili. V zemi panuje maat.</p>'; }

      <div class="row" style="margin-top:6px">${sp ? `<span class="chip">${portrait(sp, 22)} ${esc(sp.n)}</span>` : ""}${heir ? `<span class="chip">${portrait(heir, 22)} dědic: ${esc(heir.n)}</span>` : '<span class="pill bad">bez dědice</span>'}${vez ? `<span class="chip">${portrait(vez, 22)} vezír ${esc(vez.n)}</span>` : ""}</div>

    if (realm && mode === "polit") { const [r, g, b] = hexRgb(S.clans[own[i]].col); D[o] = r * 0.45; D[o + 1] = g * 0.45; D[o + 2] = b * 0.45; D[o + 3] = 220; }

function mapSvg() {
  const [vx, vy, vw, vh] = mapVB(), k = vw / MW, f = Math.max(0.3, k), R = 5.2 * f, mode = SEL.mapMode || "polit";
  let g = `<defs><radialGradient id="dsr" cx="50%" cy="45%" r="75%"><stop offset="0" stop-color="#e2c48a"/><stop offset="1" stop-color="#c99a5a"/></radialGradient>
    <pattern id="dun" width="22" height="9" patternUnits="userSpaceOnUse"><path d="M0 7 Q5.5 2 11 7 T22 7" fill="none" stroke="#a87a3e" stroke-width=".6" opacity=".45"/></pattern></defs>
    <rect x="-400" y="-400" width="${MW + 800}" height="${MH + 800}" fill="url(#dsr)"/><rect x="-400" y="-400" width="${MW + 800}" height="${MH + 800}" fill="url(#dun)"/>`;
  g += `<polygon class="sea" points="${pts(MED)} ${MX(36)},${MY(32.8)} ${MX(24)},${MY(32.8)} ${MX(24)},${MY(31.9)}"/><polygon class="sea" points="${pts(RED)}"/><polyline class="coast" points="${pts(MED)}"/>`;
  const tu = territoryImage(mode); if (tu) g += `<image href="${tu}" x="0" y="0" width="${MW}" height="${MH}" preserveAspectRatio="none" pointer-events="none"/>`;
  const kemOp = mode === "teren" ? 0.95 : mode === "polit" ? 0.7 : 0.35;
  g += `<polygon fill="var(--kemet)" opacity="${kemOp}" points="${pts(DELTA_FAN)}"/>`;
  for (const L of [NILE, BAHR]) g += `<polyline class="kemet" points="${pts(L)}" stroke-width="${(L === NILE ? 8 : 5) * f}" opacity="${kemOp}"/>`;
  g += `<ellipse cx="${MX(30.8)}" cy="${MY(29.35)}" rx="13" ry="8" fill="var(--kemet)" opacity="${kemOp * 0.9}"/>`;
  for (const [la, lo, rx, ry] of [[28.35, 28.86, 9, 5], [25.55, 29.2, 12, 4], [25.44, 30.55, 5, 11]]) g += `<ellipse cx="${MX(lo)}" cy="${MY(la)}" rx="${rx}" ry="${ry}" fill="var(--kemet)" opacity="${kemOp * 0.8}"/>`;
  g += `<ellipse cx="${MX(30.62)}" cy="${MY(29.47)}" rx="10" ry="3.5" fill="var(--sea)"/>`;
  if (S.month < 4) { for (const L of [NILE, BAHR]) g += `<polyline points="${pts(L)}" fill="none" stroke="#3f7fb8" stroke-width="${(L === NILE ? 7 : 4) * f}" stroke-linecap="round" stroke-linejoin="round" opacity=".45"><title>Období achet: Nil zaplavil nivu</title></polyline>`; g += `<polygon points="${pts(DELTA_FAN)}" fill="#3f7fb8" opacity=".22"/>`; }
  g += `<path id="nilepath" d="M${NILE.slice().reverse().map(([la, lo]) => MX(lo).toFixed(1) + " " + MY(la).toFixed(1)).join(" L")}" fill="none" stroke="none"/>`;
  for (let i = 0; i < 4; i++) g += `<g class="boat"><path d="M-5 0 L5 0 L3 2 L-3 2Z" fill="#6d4a1f" transform="scale(${Math.max(0.6, f)})"/><path d="M0 0 L0 -7 L4 -1Z" fill="#f3e6c4" stroke="#6d4a1f" stroke-width=".4" transform="scale(${Math.max(0.6, f)})"/><animateMotion dur="${150 + i * 25}s" begin="-${i * 37}s" repeatCount="indefinite" ${i % 2 ? 'keyPoints="1;0" keyTimes="0;1" calcMode="linear"' : ""}><mpath href="#nilepath"/></animateMotion></g>`;
  for (const L of [NILE, NILE_W, NILE_E, NILE_M]) g += `<polyline class="nile" points="${pts(L)}" stroke-width="${L === NILE ? 2.6 * f : 1.6 * f}"/>`;
  g += `<polyline class="nile" points="${pts(BAHR)}" stroke-width="${0.9 * f}" opacity=".7"/>`;
  const reg = [["Středozemní moře", 31.75, 28.0], ["Rudé moře", 25.6, 34.9], ["Libyjská poušť", 27.0, 27.4], ["Východní poušť", 24.6, 33.8], ["SINAJ", 29.6, 33.9], ["NÚBIE", 21.0, 32.6], ["DELTA", 31.25, 31.45], ["HORNÍ EGYPT", 26.6, 33.7], ["DOLNÍ EGYPT", 30.0, 32.4]];
  for (const [t, la, lo] of reg) g += `<text class="region${/moře/.test(t) ? " sea2" : ""}" x="${MX(lo)}" y="${MY(la)}" font-size="${11 * f}" text-anchor="middle">${t}</text>`;
  const done = new Set();
  for (const p of Object.values(S.provs)) for (const n of p.nb) { const key = p.id < n ? p.id + n : n + p.id; if (done.has(key)) continue; done.add(key); const q = S.provs[n]; if (p.ter === "poust" || q.ter === "poust" || p.ter === "oaza" || q.ter === "oaza") g += `<line class="edge" x1="${MX(p.lon)}" y1="${MY(p.lat)}" x2="${MX(q.lon)}" y2="${MY(q.lat)}" stroke-width="${0.8 * f}"/>`; }
  for (const a of S.armies) { if (!a.path || !a.path.length) continue; const own = a.cl === me(); if (!own && !knows(S, S.provs[a.loc])) continue; const L = [a.loc].concat(a.path).map(id => S.provs[id]); g += `<polyline class="march ${own ? "own" : "foe"}" stroke-width="${1.8 * f}" stroke-dasharray="${own ? "" : 4 * f + " " + 2 * f}" points="${L.map(p => MX(p.lon) + "," + MY(p.lat)).join(" ")}"/>`; }
  if (mode === "obchod") for (const R of ROUTES) { const op = routeState(S, R).open; g += `<polyline points="${R.provs.map(id => MX(S.provs[id].lon) + "," + MY(S.provs[id].lat)).join(" ")}" fill="none" stroke="${R.col}" stroke-width="${4.5 * f}" stroke-linecap="round" stroke-linejoin="round" opacity=".85" ${op ? "" : `stroke-dasharray="${5 * f} ${4 * f}"`}><title>${esc(R.n)}${op ? "" : " – přerušená"}</title></polyline>`; }
  const LEFT = new Set(["u2", "u4", "u6", "u8", "u10", "u12", "u14", "u16", "u18", "u20", "u22", "l2", "l3", "l5", "l6", "lx", "fa", "o_bah", "n_sai", "n_semna", "n_wawat"]);
  for (const p of Object.values(S.provs)) {
    const x = MX(p.lon), y = MY(p.lat), C = S.clans[p.owner], mine = p.owner === me(), war = atWar(S, me(), p.owner), capf = C && C.capital === p.id;
    g += `<g class="pv${mine ? " mine" : ""}${war ? " war" : ""}" data-a="selProv" data-x='["${p.id}"]' data-pid="${p.id}"><circle cx="${x}" cy="${y}" r="${R * 2.4}" fill="transparent"/>`;
    // standarta nomu: tyč se znakem rodu
    g += `<line x1="${x}" y1="${y + R * 0.9}" x2="${x}" y2="${y - R * (capf ? 2.1 : 1.6)}" stroke="#2b1d12" stroke-width="${0.9 * f}"/>`;
    g += `<rect class="std" x="${x - R * (capf ? 0.95 : 0.75)}" y="${y - R * (capf ? 2.6 : 2.0)}" width="${R * (capf ? 1.9 : 1.5)}" height="${R * (capf ? 1.4 : 1.1)}" rx="${R * 0.25}" fill="${C.col}" stroke="${war ? "#c4361c" : mine ? "#fff6d8" : "#2b1d12"}" stroke-width="${(war || mine ? 1.4 : 0.7) * f}"/>`;
    if ((p.b.chram || 0) >= 2) g += `<path d="M${x - R * 2.3} ${y + R * 0.9} l${R * 0.25} -${R * 1.1} h${R * 0.5} l${R * 0.25} ${R * 1.1}z" fill="#efe1bd" stroke="#2b1d12" stroke-width="${0.5 * f}"><title>chrám (úroveň ${p.b.chram})</title></path>`;
    if (p.mons && MON_IDS.some(id => p.mons[id] && p.mons[id].stage >= MONUMENTS[id].stages)) g += `<path d="M${x + R * 1.0} ${y + R * 0.9} l${R * 0.7} -${R * 1.2} l${R * 0.7} ${R * 1.2}z" fill="#d9b04a" stroke="#2b1d12" stroke-width="${0.5 * f}"><title>dokončená velká stavba</title></path>`;
    if (capf) g += `<circle cx="${x}" cy="${y - R * 1.9}" r="${R * 0.35}" fill="#f2d27a"/>`;
    g += `<circle class="dot" cx="${x}" cy="${y + R * 0.9}" r="${R * 0.35}" fill="#2b1d12"/>`;
    if (p.siege) g += `<circle class="siege" cx="${x}" cy="${y}" r="${R * 2}" stroke-width="${1.6 * f}"/>`;
    if (p.hunger > 0.15 && (mine || knows(S, p))) g += `<text x="${x + R * 1.2}" y="${y - R * 1.2}" font-size="${9 * f}" fill="#c4361c" font-weight="bold">!</text>`;
    if (SEL.prov === p.id) g += `<circle class="selring" cx="${x}" cy="${y - R * 0.6}" r="${R * 2.4}" stroke-width="${2.4 * f}"/>`;
    const left = LEFT.has(p.id);
    if (k < 0.75 || capf || p.v >= 3 || p.ter === "poust" || p.ter === "oaza") g += `<text class="lbl${capf ? " cap" : ""}" x="${x + (left ? -1 : 1) * R * 1.5}" y="${y + R * 0.4}" font-size="${9 * f}" stroke-width="${2.6 * f}" text-anchor="${left ? "end" : "start"}">${esc(p.n)}</text>`;
    g += `</g>`;
  }

    g += `<g class="army" data-a="selProv" data-x='["${p.id}"]' data-pid="${p.id}"><rect x="${x - s2}" y="${y - s2 * 0.7}" width="${s2 * 2.4}" height="${s2 * 1.4}" rx="${s2 * 0.3}" fill="${S.clans[a.cl].col}" stroke-width="${0.8 * f}"/><text x="${x + s2 * 0.2}" y="${y + s2 * 0.35}" font-size="${7 * f}" fill="#fff" text-anchor="middle" font-weight="bold">${Math.round(men(a.t) / 100) / 10}k</text></g>`; }
  return `<svg class="map" id="mapsvg" viewBox="${vx.toFixed(1)} ${vy.toFixed(1)} ${vw.toFixed(1)} ${vh.toFixed(1)}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Mapa Egypta">${g}</svg>`;
}

// ---------- panely nad mapou ----------
function outliner() {
  const C = P(S), out = [];
  const wars = enemiesOf(S, me()); if (wars.length) out.push(`<div class="ol-h">Války</div>${wars.map(e => `<div class="ol-i" data-a="dipl" data-x='["${e}"]'>${emblem(e, 14)} ${esc(S.clans[e].n)}</div>`).join("")}`);
  const ar = S.armies.filter(a => a.cl === me()); if (ar.length) out.push(`<div class="ol-h">Vojska v poli</div>${ar.map(a => `<div class="ol-i" data-a="selProv" data-x='["${a.loc}"]'>${ricon("vojsko", 14)} ${fmtK(men(a.t))} · ${esc(S.provs[a.loc].n)}${a.path.length ? " → " + esc(S.provs[a.goal].n) : ""}</div>`).join("")}`);
  const sg_ = Object.values(S.provs).filter(p => p.siege && (p.owner === me() || p.siege.cl === me())); if (sg_.length) out.push(`<div class="ol-h">Obléhání</div>${sg_.map(p => `<div class="ol-i ${p.owner === me() ? "bad" : ""}" data-a="selProv" data-x='["${p.id}"]'>${esc(p.n)} · hradby ${Math.round(p.dur)} · ${p.siege.m}. měs.</div>`).join("")}`);
  const bl = myProvs().filter(p => p.build).map(p => `<div class="ol-i" data-a="selProv" data-x='["${p.id}"]'>${esc(BUILD[p.build.b].n.split(" (")[0])} · ${esc(p.n)} (${Math.ceil(p.build.left)} m.)</div>`);
  if (C.tomb.active) bl.push(`<div class="ol-i" data-a="tab" data-x='["chramy"]'>Hrobka: ${esc(TOMB_STAGES[C.tomb.stage])}</div>`);
  for (const id of MON_IDS) { const st_ = monState(S, id); if (st_.active && st_.by === me()) bl.push(`<div class="ol-i" data-a="tab" data-x='["chramy"]'>${esc(MONUMENTS[id].n)} (${st_.stage + 1}/${MONUMENTS[id].stages})</div>`); }
  if (bl.length) out.push(`<div class="ol-h">Stavby</div>${bl.join("")}`);
  const ex = officers(S, me()).filter(c => c.away); if (ex.length) out.push(`<div class="ol-h">Výpravy</div>${ex.map(c => `<div class="ol-i">${esc(EXPED[c.away.exp].n.split(" –")[0])} · ${c.away.until - S.turn} m.</div>`).join("")}`);
  out.push(`<div class="ol-h">Vědění</div><div class="ol-i" data-a="tab" data-x='["vedeni"]'>${C.res.cur ? `${esc(TECHS[C.res.cur].n)}<div class="olbar"><b style="width:${clamp(C.res.pts / techCost(S, me(), C.res.cur) * 100, 0, 100)}%"></b></div>` : '<span class="bad">nic se nezkoumá</span>'}</div>`);
  const idle = freeOffs().length; out.push(`<div class="ol-i ${idle ? "warn" : ""}" data-a="tab" data-x='["plan"]'>${ricon("urednici", 14)} ${idle ? nPlural(idle, "úředník čeká", "úředníci čekají", "úředníků čeká") + " na rozkaz" : "všichni úředníci jednají"}</div>`);
  return out.join("");
}
function rulerBox() {
  const C = P(S), L = ruler(), heir = heirsOf(S, me())[0];
  return `<div class="rb" data-a="tab" data-x='["prehled"]'>${L ? portrait(L, 64) : ""}<div><div class="rbn">${L ? esc(L.n) : "—"}</div><div class="small muted">${esc(C.t)} · ${regYear(S, me())}. rok vlády · ${L ? age(S, L) : "?"} let</div>
    <div class="rbm" title="maat">${hg("maat")}<i><b style="width:${Math.round(C.maat)}%"></b></i>${Math.round(C.maat)}</div><div class="small">${heir ? "dědic: " + esc(heir.n) : '<span class="bad">bez dědice</span>'}</div></div></div>`;
}
function quoteBar() { const all = Object.values(QUOTES).filter(q => q.od >= S.bce && (!q.tags.includes("sip") || S.scen === "sip")), q = all[(S.turn * 5 + 3) % all.length]; return `<span class="qt">„${esc(q.t)}“</span> <span class="qs">— ${esc(q.src)}</span>`; }
function alertIcons() { const al = alerts(); if (!al.length) return ""; return `<details class="ov ov-alerts"><summary>${ricon("urednici", 18)} Rádci hlásí <b>${al.length}</b></summary>${alertsHtml(10)}</details>`; }
function tutorialHtml() {
  if (S.flags.tutOff || S.turn > 30) return "";

    ["Vyber vědění, které budou písaři zkoumat", !!C.res.cur || Object.keys(C.techs).length > 12 && S.turn > 0, "vedeni"],
    ["Dej rozkazy úředníkům v Plánu měsíce (nebo nech rozhodnout rádce)", !!S.flags.tut_cmd, "plan"],
    ["Klepni na nom na mapě a prohlédni si jeho panel", !!SEL.prov, null],
    ["Ukonči měsíc tlačítkem vpravo nahoře", S.turn >= 1, null],
    ["Ve 2. měsíci období achet ukáže nilometr výšku záplavy – sleduj ji v Hospodářství", S.turn >= 2, "hosp"],
    ["Prohlédni si zákony a státního boha", S.turn >= 3 && (!!C.lawCd && Object.keys(C.lawCd).length > 0 || S.flags.tut_laws), "zakony"],
    ["V Paláci najdeš úkoly rádců a úspěchy", S.turn >= 4, "prehled"],

  const done = steps.filter(x => x[1]).length;
  return `<div class="ol-h">Průvodce (${done}/${steps.length})</div>${steps.map(([t, ok, tab]) => `<div class="ol-i ${ok ? "" : "warn"}" ${tab ? `data-a="tab" data-x='["${tab}"]'` : ""}>${ok ? "✔" : "○"} ${esc(t)}</div>`).join("")}<div class="row">${btn("Skrýt průvodce", "tutOff")}</div>`;
}
function tMapa() {
  if (!SEL.vb) setZoom(SEL.zoom || "cele");
  const p = SEL.prov && S.provs[SEL.prov];
  const mode = SEL.mapMode || "polit";
  return `<div class="stage" id="stage">${mapSvg()}
    ${p ? `<section class="ov ov-left">${btn("✕", "closeProv", [], null, "close")}${provPanel(p)}</section>` : ""}
    <section class="ov ov-right"><div class="ol-title">Přehled dění</div>${tutorialHtml()}${outliner()}</section>
    ${alertIcons()}

    <section class="ov ov-modes"><div class="mm">${Object.entries(MAP_MODES).map(([k, M]) => `<button class="b${mode === k ? " on" : ""}" data-a="mapMode" data-x='["${k}"]' title="${esc(M.d)}">${M.n}</button>`).join("")}</div>
      <div class="mm">${Object.entries(ZOOMS).map(([k, Z]) => btn(Z.n, "zoom", [k])).join("")}</div><div class="small muted">${esc(MAP_MODES[mode].d)} · kolečkem přibližuješ, tažením posouváš</div></section>

// ---------- ovládání mapy myší a dotykem ----------
let MAPDRAG = { on: false, moved: 0, x: 0, y: 0, until: 0 }, ZOOM_T = null;
function svgPt(svg, cx, cy) { const r = svg.getBoundingClientRect(), [vx, vy, vw, vh] = mapVB(), s = Math.max(vw / r.width, vh / r.height), ox = (r.width * s - vw) / 2, oy = (r.height * s - vh) / 2; return [vx - ox + (cx - r.left) * s, vy - oy + (cy - r.top) * s, s]; }
function applyVB() { const svg = document.getElementById("mapsvg"); if (svg) svg.setAttribute("viewBox", mapVB().map(v => v.toFixed(1)).join(" ")); }
function clampVB() { const v = mapVB(); v[2] = clamp(v[2], MW * 0.12, MW * 1.6); v[3] = v[2] * MH / MW; v[0] = clamp(v[0], -MW * 0.4, MW * 1.4 - v[2]); v[1] = clamp(v[1], -MH * 0.3, MH * 1.3 - v[3]); }
function initMap() {
  const svg = document.getElementById("mapsvg"); if (!svg || svg._init) return; svg._init = true;
  SEL.vb = SEL.vb || [0, 0, MW, MH]; if (SEL.vb.length === 4 && Math.abs(SEL.vb[3] - SEL.vb[2] * MH / MW) > 1) { const c = SEL.vb[1] + SEL.vb[3] / 2; SEL.vb[3] = SEL.vb[2] * MH / MW; SEL.vb[1] = c - SEL.vb[3] / 2; }
  svg.addEventListener("wheel", ev => { ev.preventDefault(); const [px, py] = svgPt(svg, ev.clientX, ev.clientY), v = mapVB(), f = ev.deltaY > 0 ? 1.18 : 1 / 1.18, nw = clamp(v[2] * f, MW * 0.12, MW * 1.6), k = nw / v[2];
    v[0] = px - (px - v[0]) * k; v[1] = py - (py - v[1]) * k; v[2] = nw; v[3] = nw * MH / MW; clampVB(); applyVB(); clearTimeout(ZOOM_T); ZOOM_T = setTimeout(() => render(), 160); }, { passive: false });
  svg.addEventListener("pointerdown", ev => { MAPDRAG = { on: true, moved: 0, x: ev.clientX, y: ev.clientY, until: 0 }; });
  window.onpointermove = ev => {
    if (MAPDRAG.on) { const dx = ev.clientX - MAPDRAG.x, dy = ev.clientY - MAPDRAG.y; MAPDRAG.moved += Math.abs(dx) + Math.abs(dy); if (MAPDRAG.moved > 5) { const [, , s] = svgPt(svg, ev.clientX, ev.clientY), v = mapVB(); v[0] -= dx * s; v[1] -= dy * s; clampVB(); applyVB(); hideTip(); } MAPDRAG.x = ev.clientX; MAPDRAG.y = ev.clientY; return; }
    const g = ev.target.closest && ev.target.closest("[data-pid]"); if (g && document.getElementById("mapsvg") && document.getElementById("mapsvg").contains(g)) showTip(g.dataset.pid, ev.clientX, ev.clientY); else hideTip();
  };
  window.onpointerup = () => { if (MAPDRAG.on && MAPDRAG.moved > 5) MAPDRAG.until = Date.now() + 250; MAPDRAG.on = false; };
}
function tipHtml(pid) {
  const p = S.provs[pid], C = S.clans[p.owner], kn = knows(S, p), mode = SEL.mapMode || "polit";
  let h = `<div class="tt-h">${emblem(p.owner, 16)} <b>${esc(p.n)}</b></div><div class="small muted">${esc(p.eg)}</div><div class="small">${esc(C.n)} · ${esc(TERRAIN[p.ter].n)}</div>`;
  if (kn) {
    h += `<div class="small">obyvatel ≈ ${fmtK(p.pop * 1000)} · vojáků ${p.owner === me() ? fmt(men(p.troops)) : estimate(S, p, men(p.troops))} · spokojenost ${Math.round(p.loy)}</div>`;
    if (mode === "uroda") { const hh = S.flood.h || 15.5; h += `<div class="small">obilí pro lid ≈ ${fmtK(provFood(S, p, hh) - provTax(S, p, hh))} / potřeba ${fmtK(provNeed(p))}</div>`; }
    if (mode === "rozvoj") h += `<div class="small">pole ${p.agri}/${agriCap(S, p)} · řemesla ${p.com}/${comCap(S, p)}</div>`;
    if (p.hunger > 0.05) h += `<div class="small bad">hlad</div>`;
  } else h += `<div class="small muted">o nomu víš jen odhady</div>`;
  if (p.siege) h += `<div class="small bad">obléhá ${esc(S.clans[p.siege.cl].n)}</div>`;
  const ar = S.armies.filter(a => a.loc === pid && (a.cl === me() || kn)); for (const a of ar) h += `<div class="small">vojsko: ${esc(S.clans[a.cl].n)}, ${fmtK(men(a.t))} mužů</div>`;
  return h;
}
function showTip(pid, x, y) { const t = document.getElementById("tip"); if (!t) return; t.innerHTML = tipHtml(pid); t.style.display = "block"; const w = t.offsetWidth, h = t.offsetHeight; t.style.left = Math.min(window.innerWidth - w - 8, x + 14) + "px"; t.style.top = Math.min(window.innerHeight - h - 8, y + 14) + "px"; }
function hideTip() { const t = document.getElementById("tip"); if (t) t.style.display = "none"; }

// ---------- plynulý běh času ----------
const AUTO = { on: false, ms: 1600, timer: null };
function autoTick() {
  if (!AUTO.on) return;
  if (S.events.length || (S.over && !S.over.cont)) { AUTO.on = false; render(); return; }
  endTurn(S); render();
  if (S.events.length) { AUTO.on = false; render(); return; }
  AUTO.timer = setTimeout(autoTick, AUTO.ms);
}

// Záložka Zákony: zákony podle oblastí, u každé možnosti účinek a dopad na stavy.

function boot() {

      <div class="small">${r.provs.length ? "Nomy: " + r.provs.map(id => provLink(S.provs[id])).join(", ") : '<span class="muted">bez nomu</span>'}${r.offs.length ? " · úřady: " + r.offs.map(k => esc((OFFICES[k] || { n: k }).n)).join(", ") : ""}</div></div>`; }).join("");

}
function goalsHtml() {

function festHtml() {
  const legend = FESTIVALS.map((f, i) => { const p = S.provs[f.pid], mine = p.owner === me(); return `<div class="festi${f.m === S.month ? " now" : ""}"><span class="fnum" style="background:${S.clans[p.owner].col}">${i + 1}</span><div><b>${esc(f.n)}</b> <span class="small muted">· ${esc(monthName(f.m))} · ${provLink(p)}${mine ? " · tvůj nom" : ""}</span><div class="small muted">${esc(f.d)}</div></div></div>`; }).join("");

var A11Y_TURN = -1;
function a11yPass() {

  }

  const live = document.getElementById("live");
  if (live && A11Y_TURN !== S.turn) { A11Y_TURN = S.turn; const L = S.log[0]; live.textContent = `${dateStr(S)}.${L ? " " + (L.txt || "") : ""}`; }

function keyNav(ev) {

  if (typing || ev.ctrlKey || ev.metaKey || ev.altKey) return;
  if (ev.key === "Escape") { if (SEL.prov && ACT.closeProv) { ACT.closeProv(); render(); } return; }
  if (S.events.length) return;
  const k = ev.key;
  if (k === "n" || k === "N") { ev.preventDefault(); const r = ACT.end(); if (typeof r === "string") toast(r); render(); return; }
  if (/^[0-9]$/.test(k)) { const i = k === "0" ? 9 : +k - 1; if (TABS[i]) { SEL.tab = TABS[i][0]; render(); const f = document.querySelector("#tabs .on, #tabs [aria-current]"); if (f) f.focus(); } return; }
  if (SEL.tab === "mapa" && (k === "+" || k === "-")) { const v = mapVB(), f = k === "+" ? 1 / 1.25 : 1.25, cx = v[0] + v[2] / 2, cy = v[1] + v[3] / 2, nw = clamp(v[2] * f, MW * 0.12, MW * 1.6); v[2] = nw; v[3] = nw * MH / MW; v[0] = cx - nw / 2; v[1] = cy - v[3] / 2; clampVB(); render(); }
  if (k === "?") toast("Klávesy: N – konec měsíce, 1–9 a 0 – záložky, + a − – přiblížení mapy, Esc – zavřít panel, Tab a Enter – ovládání bez myši.");
}
// dotyk: přiblížení dvěma prsty
function initPinch() {
  const svg = document.getElementById("mapsvg"); if (!svg || svg._pinch) return; svg._pinch = true;
  const pts = new Map(); let d0 = 0, w0 = 0;
  svg.addEventListener("pointerdown", e => { if (e.pointerType !== "touch") return; pts.set(e.pointerId, [e.clientX, e.clientY]); if (pts.size === 2) { const [a, b] = [...pts.values()]; d0 = Math.hypot(a[0] - b[0], a[1] - b[1]); w0 = mapVB()[2]; } });
  svg.addEventListener("pointermove", e => { if (!pts.has(e.pointerId)) return; pts.set(e.pointerId, [e.clientX, e.clientY]); if (pts.size === 2 && d0 > 0) { const [a, b] = [...pts.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]), v = mapVB(), cx = v[0] + v[2] / 2, cy = v[1] + v[3] / 2, nw = clamp(w0 * d0 / Math.max(20, d), MW * 0.12, MW * 1.6); v[2] = nw; v[3] = nw * MH / MW; v[0] = cx - nw / 2; v[1] = cy - v[3] / 2; clampVB(); applyVB(); if (typeof MAPDRAG === "object") { MAPDRAG.on = false; MAPDRAG.until = Date.now() + 300; } } });
  const up = e => { pts.delete(e.pointerId); if (pts.size < 2) d0 = 0; };
